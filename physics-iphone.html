(ab) في مستوي الورقة داخل مجال مغناطيسي منتظم عمودي على الورقة متجه نحو الناظر، والساق تتحرك نحو اليسار ومعها السرعة v، ويظهر المجال الكهربائي E داخل الساق بسهم نحو الطرف (b)] اذا تحركت الساق الموصلة (ab) في الشكل في مستوى الورقة افقياً نحو اليسار داخل مجال مغناطيسي منتظم مسلط عمودياً على الورقة متجهاً نحو الناظر، يتولد مجال كهربائي داخل الساق يتجه نحو الطرف (b). أما اذا تحركت هذه الساق نحو اليمين وداخل المجال المغناطيسي نفسه ينعكس اتجاه المجال الكهربائي في داخلها باتجاه الطرف (a). فما تفسير ذلك؟", "a": "عندما تكون حركة الساق نحو اليسار وعمودياً على الفيض المغناطيسي فان القوة المغناطيسية (F<sub>B</sub>) تؤثر في الشحنات الموجبة يكون اتجاهها نحو الطرف (a) (على وفق قاعدة الكف اليمنى) فتتجمع الشحنات الموجبة عند الطرف (a) للساق والسالبة في الطرف (b). لذا يكون اتجاه المجال الكهربائي E من (a) نحو (b).<br>وعند انعكاس اتجاه حركة الساق (نحو اليمين) ينعكس اتجاه (F<sub>B</sub>) لذا تتجمع الشحنات الموجبة عند الطرف (b) للساق والسالبة في الطرف (a). لذا يكون اتجاه المجال الكهربائي E من (b) نحو (a).", "kw": [["قوه مغناطيسيه", "القوه المغناطيسيه"], ["الشحنات الموجبه", "شحنات موجبه"], ["الطرف", "تتجمع", "تتجمع"], ["انعكاس", "ينعكس", "عكس"], ["اتجاه الحركه", "حركه الساق"]], "id": "c2k156"}, {"ch": 2, "k": "p", "topic": "الحث الكهرومغناطيسي ومبدأ حفظ الطاقة", "yrs": "3/2013", "q": "في الشكل: افرض أن الساق الموصلة طولها (0.2 m) ومقدار السرعة التي يتحرك بها (3 m/s) والمقاومة الكلية للدائرة (الساق والسكة) مقدارها (0.3 Ω) وكثافة الفيض المغناطيسي (0.8 T) احسب مقدار: (1) القوة الكهربائية المحتثة على طرفي الساق. (2) التيار المحتث في الحلقة. (3) القوة الساحبة للساق. (4) القدرة المتبددة في المقاومة الكلية للدائرة. [الشكل: ساق موصلة تنزلق على سكة بشكل حرف U داخل مجال مغناطيسي عمودي على الصفحة]", "a": "<b>المعطيات:</b> L = 0.2 m، v = 3 m/s، R = 0.3 Ω، B = 0.8 T.<br>\n<b>(1) القوة الدافعة الحركية:</b> <span class=\"m\">ε = B·L·v = 0.8 × 0.2 × 3</span><br><span class=\"res\">ε = 0.48 V</span><br>\n<b>(2) التيار المحتث:</b> <span class=\"m\">I = ε/R = 0.48/0.3</span><br><span class=\"res\">I = 1.6 A</span><br>\n<b>(3) القوة الساحبة (المعاكسة للحركة):</b> <span class=\"m\">F = B·I·L = 0.8 × 1.6 × 0.2</span><br><span class=\"res\">F = 0.256 N</span><br>\n<b>(4) القدرة المتبددة:</b> <span class=\"m\">P = I²R = (1.6)² × 0.3</span><br><span class=\"res\">P = 0.768 W</span><br>\nتحقق: P = ε·I = 0.48 × 1.6 = 0.768 W ✓", "parts": [{"l": "القوة الدافعة الكهربائية المحتثة", "v": [0.48], "u": "V"}, {"l": "التيار المحتث", "v": [1.6], "u": "A"}, {"l": "القوة الساحبة", "v": [0.256], "u": "N"}, {"l": "القدرة المتبددة", "v": [0.768], "u": "W"}], "id": "c2p157"}, {"ch": 2, "k": "p", "topic": "الحث الكهرومغناطيسي ومبدأ حفظ الطاقة", "yrs": "1/2016 أسئلة النازحين", "q": "افرض أن ساق موصلة طولها (1.6 m) تنزلق على سكة موصلة بشكل حرف U باتجاه عمودي على فيض مغناطيسي كثافته (0.8 T) بتأثير قوة سحب ثابتة (0.064 N) وكان مقدار المقاومة الكلية للدائرة (128 Ω). احسب: (1) القوة الدافعة الكهربائية الحركية. (2) السرعة التي تنزلق بها الساق على السكة.", "a": "<b>المعطيات:</b> L = 1.6 m، B = 0.8 T، القوة الساحبة F = 0.064 N، R = 128 Ω.<br>\n<b>أولاً: التيار من القوة الساحبة:</b> <span class=\"m\">F = B·I·L ⇒ I = F/(B·L) = 0.064/(0.8 × 1.6) = 0.064/1.28</span><br><span class=\"res\">I = 0.05 A</span><br>\n<b>(1) القوة الدافعة الحركية:</b> <span class=\"m\">ε = I·R = 0.05 × 128</span><br><span class=\"res\">ε = 6.4 V</span><br>\n<b>(2) السرعة:</b> <span class=\"m\">ε = B·L·v ⇒ v = ε/(B·L) = 6.4/(0.8 × 1.6) = 6.4/1.28</span><br><span class=\"res\">v = 5 m/s</span>", "parts": [{"l": "القوة الدافعة الكهربائية الحركية", "v": [6.4], "u": "V"}, {"l": "السرعة", "v": [5], "u": "m/s"}], "id": "c2p158"}, {"ch": 2, "k": "p", "topic": "الحث الكهرومغناطيسي ومبدأ حفظ الطاقة", "yrs": "1/2018 تطبيقي", "q": "افرض ان ساق موصلة طولها (0.1 m) وتتحرك بسرعة مقدارها (2.5 m/s) باتجاه عمودي داخل فيض مغناطيسي منتظم (0.6 T) على سكة موصلة على شكل حرف U. احسب مقدار: (1) التيار المحتث في الحلقة اذا كانت المقاومة الكلية للدائرة (الساق والسكة) (0.03 Ω). (2) القوة الساحبة. (3) القدرة المتبددة في المقاومة الكلية.", "a": "<b>المعطيات:</b> L = 0.1 m، v = 2.5 m/s، B = 0.6 T، R = 0.03 Ω.<br>\n<b>(1) التيار المحتث:</b><br>\n<span class=\"m\">ε = B·L·v = 0.6 × 0.1 × 2.5 = 0.15 V</span><br>\n<span class=\"m\">I = ε/R = 0.15/0.03</span><br><span class=\"res\">I = 5 A</span><br>\n<b>(2) القوة الساحبة:</b> <span class=\"m\">F = B·I·L = 0.6 × 5 × 0.1</span><br><span class=\"res\">F = 0.3 N</span><br>\n<b>(3) القدرة المتبددة:</b> <span class=\"m\">P = I²R = 25 × 0.03</span><br><span class=\"res\">P = 0.75 W</span>", "parts": [{"l": "التيار المحتث", "v": [5], "u": "A"}, {"l": "القوة الساحبة", "v": [0.3], "u": "N"}, {"l": "القدرة المتبددة", "v": [0.75], "u": "W"}], "id": "c2p159"}, {"ch": 2, "k": "p", "topic": "الحث الكهرومغناطيسي ومبدأ حفظ الطاقة", "yrs": "1/2015 أسئلة النازحين", "q": "في الشكل: أفرض أن الساق الموصلة طولها (2 m) ومقدار السرعة التي يتحرك بها (2 m/s) والمقاومة الكلية للدائرة (الساق والسكة) مقدارها (0.4 Ω) وكان التيار المحتث في الحلقة (7 A) احسب مقدار: (1) القوة الدافعة الكهربائية المحتثة على طرفي الساق. (2) كثافة الفيض المغناطيسي. (3) القوة الساحبة للساق. (4) القدرة المتبددة في المقاومة الكلية للدائرة.", "a": "<b>المعطيات:</b> L = 2 m، v = 2 m/s، R = 0.4 Ω، I = 7 A.<br>\n<b>(1) القوة الدافعة الكهربائية المحتثة:</b> <span class=\"m\">ε = I·R = 7 × 0.4</span><br><span class=\"res\">ε = 2.8 V</span><br>\n<b>(2) كثافة الفيض المغناطيسي:</b> <span class=\"m\">ε = B·L·v ⇒ B = ε/(L·v) = 2.8/(2 × 2) = 2.8/4</span><br><span class=\"res\">B = 0.7 T</span><br>\n<b>(3) القوة الساحبة:</b> <span class=\"m\">F = B·I·L = 0.7 × 7 × 2</span><br><span class=\"res\">F = 9.8 N</span><br>\n<b>(4) القدرة المتبددة:</b> <span class=\"m\">P = I²R = 49 × 0.4</span><br><span class=\"res\">P = 19.6 W</span>", "parts": [{"l": "القوة الدافعة الكهربائية المحتثة", "v": [2.8], "u": "V"}, {"l": "كثافة الفيض المغناطيسي", "v": [0.7], "u": "T"}, {"l": "القوة الساحبة", "v": [9.8], "u": "N"}, {"l": "القدرة المتبددة", "v": [19.6], "u": "W"}], "id": "c2p160"}, {"ch": 2, "k": "p", "topic": "الحث الكهرومغناطيسي ومبدأ حفظ الطاقة", "yrs": "1/2014", "q": "ساق موصلة طولها (2 m) تتحرك بالانطلاق 12 m/s باتجاه عمودي على مجال مغناطيسي منتظم كثافة فيضه (0.2 T) ما مقدار القوة الدافعة الكهربائية المحتثة على طرفي الساق؟", "a": "<b>المعطيات:</b> L = 2 m، v = 12 m/s، B = 0.2 T، والحركة عمودية على المجال.<br>\n<span class=\"m\">ε = B·L·v = 0.2 × 2 × 12</span><br><span class=\"res\">ε = 4.8 V</span>", "parts": [{"l": "القوة الدافعة الكهربائية المحتثة", "v": [4.8], "u": "V"}], "id": "c2p161"}, {"ch": 2, "k": "k", "topic": "الفيض المغناطيسي", "yrs": "أسئلة الفصل · 1/2019 · أسئلة خارج القطر تطبيقي", "q": "اختر الإجابة الصحيحة: عندما يدور ملف دائري حول محور شاقولي موازي لوجه الملف داخل مجال مغناطيسي كثافة فيضه B منتظمة أفقية تولد أعظم مقدار للقوة الدافعة الكهربائية محتثة ε<sub>max</sub>. وعند زيادة عدد لفات الملف الى ثلاثة أمثال ما كانت عليه وتقليل قطر الملف الى نصف ما كان عليه ومضاعفة التردد الدوراني للملف فإن المقدار الأعظم للقوة الدافعة الكهربائية المحتثة سيكون:", "opts": ["(3/2) ε<sub>max</sub>", "(1/4) ε<sub>max</sub>", "(1/2) ε<sub>max</sub>", "3 ε<sub>max</sub>"], "c": 0, "a": "ε_max = N·B·A·ω حيث A = πr². ثلاثة أمثال N ⇒ ×3، ونصف القطر إلى النصف ⇒ A تصبح ×1/4، ومضاعفة التردد ⇒ ω تصبح ×2. الناتج: 3 × 1/4 × 2 = 3/2. الجواب: (3/2) ε_max", "id": "c2k162"}, {"ch": 2, "k": "k", "topic": "الفيض المغناطيسي", "yrs": "1/2022", "q": "ما العامل الأساسي لتوليد القوة الدافعة الكهربائية المحتثة ε<sub>ind</sub> في حلقة موصلة أو ملف سلكي؟ وما طرق تحقيق ذلك؟", "a": "حصول تغير في الفيض المغناطيسي نسبة للزمن <span class=\"m\">ΔΦ<sub>B</sub>/Δt</span>.<br>طرق تحقيق ذلك: إضافة الى الحركة النسبية بين الساق المغناطيسية والحلقة الموصلة او الملف السلكي توجد طرق:<br>(a) تغير قياس الزاوية θ بين متجه المساحة (A) ومتجه كثافة الفيض المغناطيسي (B).<br>(b) تغير مساحة الحلقة المواجهة للفيض المغناطيسي ΔΦ<sub>B</sub> المنتظم.<br>(c) تحريك الحلقة الموصلة بمستوى عمودي على فيض مغناطيسي منتظم.", "kw": [["تغير الفيض", "تغير في الفيض", "الفيض المغناطيسي"], ["الزمن", "نسبه للزمن"], ["الزاويه", "زاويه"], ["مساحه الحلقه", "المساحه"], ["الحركه النسبيه", "حركه"]], "id": "c2k163"}, {"ch": 2, "k": "k", "topic": "الفيض المغناطيسي", "yrs": "3/2023 تطبيقي", "q": "ما الكميات الفيزيائية التي تقاس بالوحدات الاتية؟ weber", "a": "الفيض المغناطيسي Φ، ويُعرَّف بأنه Φ = B·A·cosθ، ووحدته Weber.", "kw": [["الفيض المغناطيسي", "فيض"]], "id": "c2k164"}, {"ch": 2, "k": "k", "topic": "قانون فارادي", "yrs": "2015 تمهيدي محافظة الانبار", "q": "أكتب كلمة (صح) أمام العبارة الصحيحة وكلمة (خطأ) أمام العبارة غير الصحيحة ثم صحح الخطأ إن وجد دون تغيير ما تحته خط: مقدار القوة الدافعة الكهربائية المحتثة في حلقة موصلة تتناسب طردياً مع المعدل الزمني للتغير في الفيض المغناطيسي الذي يخترق الحلقة.", "a": "صح. تتناسب القوة الدافعة الكهربائية المحتثة طردياً مع المعدل الزمني للتغير في الفيض المغناطيسي، حسب قانون فاراداي: ε = −N·ΔΦ/Δt.", "kw": [["صح"]], "id": "c2k165"}, {"ch": 2, "k": "k", "topic": "قانون فارادي", "yrs": "1/2016", "q": "ما الذي يتطلب توافره في دائرة مقفلة لتوليد: أ) تيار كهربائي ب) تيار محتث", "a": "أ) يتطلب توافر مصدر للقوة الدافعة الكهربائية تجهزها مثلاً بطارية أو مولد في تلك الدائرة.<br>ب) يتطلب توافر قوة دافعة كهربائية محتثة والتي تتولد بواسطة تغير في الفيض المغناطيسي الذي يخترق تلك الحلقة لوحدة الزمن.", "kw": [["مصدر", "بطاريه", "مولد"], ["قوه دافعه", "دافعه كهربائيه"], ["محتثه"], ["تغير في الفيض", "تغير الفيض", "تغير"]], "id": "c2k166"}, {"ch": 2, "k": "k", "topic": "قانون فارادي", "yrs": "3/2020", "q": "ماذا يعني وجود الاشارة السالبة في قانون فارادي في الحث الكهرومغناطيسي؟", "a": "للدلالة على قطبية القوة الدافعة الكهربائية المحتثة التي تحدد الاتجاه الذي ينساب فيه التيار المحتث في الحلقة او الملف.<br>او: اذا ذكر فقط قطبية القوة الدافعة الكهربائية المحتثة يعطى درجة كاملة.", "kw": [["قطبيه"], ["قوه دافعه", "دافعه كهربائيه", "المحتثه"], ["اتجاه التيار", "الاتجاه", "ينساب"]], "id": "c2k167"}, {"ch": 2, "k": "k", "topic": "قانون فارادي", "yrs": "2/2018 تطبيقي خارج القطر · 2023 تمهيدي تطبيقي", "q": "اذكر نص قانون فارادي. ما المقصود بـ (قانون فارادي)؟", "a": "قانون فارادي: مقدار القوة الدافعة الكهربائية المحتثة (ε<sub>ind</sub>) في حلقة موصلة يتناسب طردياً مع المعدل الزمني للتغير في الفيض المغناطيسي الذي يخترق الحلقة.<br><span class=\"m\">ε<sub>ind</sub> = −N ΔΦ<sub>B</sub>/Δt</span>", "kw": [["القوه الدافعه", "دافعه كهربائيه", "المحتثه"], ["طرديا", "يتناسب"], ["المعدل الزمني", "معدل", "الزمن"], ["التغير في الفيض", "تغير الفيض", "الفيض المغناطيسي"]], "id": "c2k168"}, {"ch": 2, "k": "p", "topic": "الفيض المغناطيسي", "yrs": "2023 تمهيدي تطبيقي", "q": "حلقة دائرية موصلة قطرها (0.6 cm) وضعت داخل مجال مغناطيسي منتظم كثافة فيضه (B = 0.2 T) ويتجه باتجاه مواز لمتجه مساحة الحلقة A. (1) احسب مقدار الفيض المغناطيسي الذي يخترق الحلقة. (2) ما مقدار الفيض المغناطيسي على فرض ان الحلقة دارت باتجاه معاكس لدوران عقارب الساعة لحين صار متجه المساحة A يصنع زاوية θ = 60° مع اتجاه كثافة الفيض المغناطيسي B؟", "a": "<b>المعطيات:</b> قطر الحلقة = 0.6 cm ⇒ r = 0.3 cm = 3×10⁻³ m، B = 0.2 T.<br>\n<b>المساحة:</b> <span class=\"m\">A = πr² = π × (3×10⁻³)² = 9π×10⁻⁶ m²</span><br>\n<b>(1) الفيض عندما يكون متجه المساحة موازياً لـ B (θ = 0°):</b><br>\n<span class=\"m\">Φ = B·A·cos0 = 0.2 × 9π×10⁻⁶ = 1.8π×10⁻⁶</span><br><span class=\"res\">Φ ≈ 5.65×10⁻⁶ Wb</span><br>\n<b>(2) بعد الدوران حتى θ = 60° بين A و B:</b><br>\n<span class=\"m\">Φ = B·A·cos60 = 0.2 × 9π×10⁻⁶ × 0.5 = 0.9π×10⁻⁶</span><br><span class=\"res\">Φ ≈ 2.83×10⁻⁶ Wb</span><br>\n<i>ملاحظة: اتجاه الدوران لا يغير مقدار الفيض، وإنما تغيّر الزاوية فقط.</i>", "parts": [{"l": "الفيض عند θ=0", "v": [0.05652, 0.05652], "u": "Wb"}, {"l": "الفيض عند θ=60°", "v": [0.02826, 0.02826], "u": "Wb"}], "id": "c2p169"}, {"ch": 2, "k": "p", "topic": "قانون فارادي", "yrs": "2014 تمهيدي · 3/2016 خارج القطر · 1/2017 أسئلة الموصل · 1/2022 تطبيقي", "q": "ملف سلكي دائري عدد لفاته (60) لفه ونصف قطره (20cm) وضع بين قطبي مغناطيس كهربائي فاذا تغيرت كثافة الفيض المغناطيسي المار خلال الملف من (0.0T) الى (0.5T) خلال زمن قدره (π s) ما مقدار القوة الدافعة الكهربائية المحتثة في الملف عندما يكون: (1) متجه مساحة اللفة الواحدة من الملف بموازاة متجه كثافة الفيض المغناطيسي. (2) متجه كثافة الفيض المغناطيسي يصنع زاوية قياسها (30°) مع مستوى اللفة.", "a": "<b>المعطيات:</b> N = 60 لفة، r = 0.2 m ⇒ A = πr² = 0.04π m²، ΔB = 0.5 − 0 = 0.5 T، Δt = π s.<br>\n<b>قانون فاراداي:</b> <span class=\"m\">ε = −N·A·cosθ·ΔB/Δt</span> (θ الزاوية بين متجه المساحة وB)<br>\n<b>(1) متجه المساحة يوازي B (θ = 0°):</b><br>\n<span class=\"m\">ε = 60 × 0.04π × 1 × 0.5/π = 60 × 0.02</span><br><span class=\"res\">ε = 1.2 V</span><br>\n<b>(2) B يصنع 30° مع مستوى اللفة ⇒ θ = 60° مع المتجه العمودي على اللفة:</b><br>\n<span class=\"m\">ε = 60 × 0.04π × cos60 × 0.5/π = 1.2 × 0.5</span><br><span class=\"res\">ε = 0.6 V</span>", "parts": [{"l": "ε عند θ=0", "v": [-1.2, 1.2], "u": "V"}, {"l": "ε عند θ=60°", "v": [-0.6, 0.6], "u": "V"}], "id": "c2p170"}, {"ch": 2, "k": "p", "topic": "قانون فارادي", "yrs": "2/2017 تطبيقي · 3/2016", "q": "ملف سلكي دائري الشكل عدد لفاته (50) لفة ونصف قطره (20cm) وضع بين قطبي مغناطيس كهربائي فاذا تغيرت كثافة الفيض المغناطيسي المارة خلال الملف من (0.0T) الى (0.6T) خلال زمن مقداره (π s) ما مقدار القوة الدافعة الكهربائية المحتثة في الملف عندما يكون: (1) متجه مساحة اللفة الواحدة من الملف بموازاة متجه كثافة الفيض المغناطيسي. (2) متجه كثافة الفيض المغناطيسي يصنع زاوية قياسها (37°) مع مستوى الملف.", "a": "<b>المعطيات:</b> N = 50، r = 0.2 m ⇒ A = 0.04π m²، ΔB = 0.6 T، Δt = π s.<br>\n<b>(1) متجه المساحة يوازي B (θ = 0°):</b><br>\n<span class=\"m\">ε = 50 × 0.04π × 0.6/π = 50 × 0.024</span><br><span class=\"res\">ε = 1.2 V</span><br>\n<b>(2) B يصنع 37° مع مستوى اللفة ⇒ θ = 53° مع المتجه العمودي (cos53° = 0.6):</b><br>\n<span class=\"m\">ε = 50 × 0.04π × 0.6 × 0.6/π = 1.2 × 0.6</span><br><span class=\"res\">ε = 0.72 V</span>", "parts": [{"l": "ε عند θ=0", "v": [-1.2, 1.2], "u": "V"}, {"l": "ε عند θ=53°", "v": [-0.75, 0.75], "u": "V"}], "id": "c2p171"}, {"ch": 2, "k": "p", "topic": "قانون فارادي", "yrs": "2/2015", "q": "حلقة موصل دائرية مساحتها (520cm²) ومقاومتها (5Ω) موضوعة في مستوى الورقة سلط عليها مجال مغناطيسي منتظم كثافة فيضه (0.15T) باتجاه عمودي على مستوى الحلقة, سحبت الحلقة من جانبيها بقوتي شد متساويتين فبلغت مساحتها (20cm²) خلال فترة زمنية (0.3 s), احسب مقدار التيار المحتث في الحلقة.", "a": "<b>المعطيات:</b> المساحة الابتدائية 520 cm² = 0.052 m²، المساحة النهائية 20 cm² = 0.002 m²، ΔA = 0.050 m²، B = 0.15 T، Δt = 0.3 s، R = 5 Ω.<br>\n<b>القوة الدافعة:</b> <span class=\"m\">ε = B·ΔA/Δt = 0.15 × 0.05/0.3 = 0.025 V</span><br>\n<b>التيار:</b> <span class=\"m\">I = ε/R = 0.025/5</span><br><span class=\"res\">I = 0.005 A = 5 mA</span>", "parts": [{"l": "التيار المحتث", "v": [0.005, 5], "u": "A"}], "id": "c2p172"}, {"ch": 2, "k": "p", "topic": "قانون فارادي", "yrs": "2/2019", "q": "حلقة موصلة دائرية مساحتها (528 cm²) ومقاومتها (8Ω) موضوعة في مستوى الورقة سلط عليها مجال مغناطيسي منتظم كثافة فيضه (0.16 T) باتجاه عمودي على مستوى الحلقة سحبت الحلقة من جانبيها بقوتي شد متساويتين فبلغت مساحتها (28 cm²) خلال فترة زمنية (0.2 s) احسب مقدار التيار المحتث في الحلقة.", "a": "<b>المعطيات:</b> المساحة الابتدائية 528 cm² والنهائية 28 cm² ⇒ ΔA = 500 cm² = 0.05 m²، B = 0.16 T، Δt = 0.2 s، R = 8 Ω.<br>\n<span class=\"m\">ε = B·ΔA/Δt = 0.16 × 0.05/0.2 = 0.04 V</span><br>\n<span class=\"m\">I = ε/R = 0.04/8</span><br><span class=\"res\">I = 0.005 A = 5 mA</span>", "parts": [{"l": "التيار المحتث", "v": [0.005, 5], "u": "A"}], "id": "c2p173"}, {"ch": 2, "k": "p", "topic": "قانون فارادي", "yrs": "2/2014", "q": "ملف يتألف من (50) لفه متماثلة ومساحة اللفة الواحدة (20cm²) فاذا تغيرت كثافة الفيض المغناطيسي الذي يخترق الملف (0.0T الى 0.8) خلال زمن (0.4s) ما معدل القوة الدافعة الكهربائية المحتثة في الملف؟", "a": "<b>المعطيات:</b> N = 50، A = 20 cm² = 2×10⁻³ m²، ΔB = 0.8 T، Δt = 0.4 s.<br>\n<b>قانون فاراداي (المتجه يوازي B):</b> <span class=\"m\">ε = N·A·ΔB/Δt = 50 × 2×10⁻³ × 0.8/0.4</span><br><span class=\"res\">ε = 0.2 V</span>", "parts": [{"l": "ε المحتثة", "v": [-0.2, 0.2], "u": "V"}], "id": "c2p174"}, {"ch": 2, "k": "p", "topic": "قانون فارادي", "yrs": "2018 تمهيدي", "q": "في الشكل ادناه يوضح ملفا يتألف من (200) لفة متماثلة ومساحة اللفة الواحدة (4×10⁻⁴ m²) فاذا تغيرت كثافة الفيض المغناطيسي الذي يخترق اللفة من (0.0T) الى (0.5T) خلال زمن مقداره (0.02S) احسب: (1) مقدار القوة الدافعة الكهربائية المحتثة (ε_ind) في الملف. (2) مقدار التيار المنساب في الدائرة اذا كان الملف مربوط بين طرفي كلفانومتر والمقاومة الكلية في الدائرة (80Ω). [الشكل: ملف بين قطبي مغناطيس مربوط بجهاز قياس]", "a": "<b>المعطيات:</b> N = 200، A = 4×10⁻⁴ m²، ΔB = 0.5 T، Δt = 0.02 s، R = 80 Ω.<br>\n<b>(1) القوة الدافعة المحثة:</b> <span class=\"m\">ε = N·A·ΔB/Δt = 200 × 4×10⁻⁴ × 0.5/0.02</span><br><span class=\"res\">ε = 2 V</span><br>\n<b>(2) التيار المنساب:</b> <span class=\"m\">I = ε/R = 2/80</span><br><span class=\"res\">I = 0.025 A = 25 mA</span>", "parts": [{"l": "ε المحتثة", "v": [-2, 2], "u": "V"}, {"l": "التيار", "v": [0.025, 25], "u": "A"}], "id": "c2p175"}, {"ch": 2, "k": "p", "topic": "قانون فارادي", "yrs": "2/2023 احيائي", "q": "حلقة موصلة دائرية مساحتها (640 cm²) ومقاومتها (5Ω) موضوعة في مستوى الورقة الافقي سلط عليها مجال مغناطيسي منتظم كثافة فيضه (0.2 T) باتجاه عمودي على مستوى الحلقة وسحبت الحلقة من جانبيها بقوتي شد متساويتين فبلغت مساحتها (40 cm²) خلال فترة زمنية (0.4 s) احسب مقدار التيار المحتث في الحلقة.", "a": "<b>المعطيات:</b> المساحة الابتدائية 640 cm² والنهائية 40 cm² ⇒ ΔA = 600 cm² = 0.06 m²، B = 0.2 T، Δt = 0.4 s، R = 5 Ω.<br>\n<span class=\"m\">ε = B·ΔA/Δt = 0.2 × 0.06/0.4 = 0.03 V</span><br>\n<span class=\"m\">I = ε/R = 0.03/5</span><br><span class=\"res\">I = 0.006 A = 6 mA</span>", "parts": [{"l": "التيار المحتث", "v": [0.006, 6], "u": "A"}], "id": "c2p176"}, {"ch": 2, "k": "p", "topic": "قانون فارادي", "yrs": "2/2018 تطبيقي", "q": "ملف سلكي دائري الشكل عدد لفاته (30) لفة ونصف قطره (20cm) وضع بين قطبي مغناطيس كهربائي فاذا تغيرت كثافة الفيض المغناطيسي المارة خلال الملف من (0.0T) الى (0.8T) خلال زمن مقداره (2πs) ما مقدار القوة الدافعة الكهربائية المحتثة في الملف عندما يكون: (1) متجه مساحة اللفة الواحدة من الملف بموازاة متجه كثافة الفيض المغناطيسي. (2) متجه كثافة الفيض المغناطيسي يصنع زاوية قياسها (53°) مع مستوى الملف.", "a": "<b>المعطيات:</b> N = 30، r = 0.2 m ⇒ A = 0.04π m²، ΔB = 0.8 T، Δt = 2π s.<br>\n<b>(1) متجه المساحة يوازي B (θ = 0°):</b><br>\n<span class=\"m\">ε = 30 × 0.04π × 0.8/(2π) = 30 × 0.016</span><br><span class=\"res\">ε = 0.48 V</span><br>\n<b>(2) B يصنع 53° مع مستوى اللفة ⇒ θ = 37° مع المتجه العمودي (cos37° = 0.8):</b><br>\n<span class=\"m\">ε = 0.48 × 0.8</span><br><span class=\"res\">ε = 0.384 V</span>", "parts": [{"l": "ε عند θ=0", "v": [-0.48, 0.48], "u": "V"}, {"l": "ε عند θ=37°", "v": [-0.384, 0.384], "u": "V"}], "id": "c2p177"}, {"ch": 2, "k": "p", "topic": "قانون فارادي", "yrs": "2019 تمهيدي تطبيقي", "q": "ملف سلكي مستطيل الشكل عدد لفاته (100) لفة وأبعاده (2cm,5 cm) يدور بسرعة زاوية منتظمة مقدارها (30π rad/s) داخل مجال مغناطيسي منتظم كثافة فيضه (0.8 wb/m²) احسب: (1) المقدار الاعظم للقوة الدافعة الكهربائية المحتثة في الملف. (2) القوة الدافعة الكهربائية الانية المحتثة في الملف بعد مرور (1/90 s) من الوضع الذي كان مقدارها يساوي صفراً.", "a": "<b>المعطيات:</b> N = 100، الأبعاد 2 cm × 5 cm ⇒ A = 0.02 × 0.05 = 1×10⁻³ m²، ω = 30π rad/s، B = 0.8 T.<br>\n<b>(1) القوة الدافعة القصوى:</b> <span class=\"m\">ε_max = N·B·A·ω = 100 × 0.8 × 1×10⁻³ × 30π = 2.4π</span><br><span class=\"res\">ε_max ≈ 7.54 V</span><br>\n<b>(2) القوة الدافعة الآنية بعد t = 1/90 s من وضع الصفر:</b><br>\n<span class=\"m\">ε = ε_max·sin(ωt)</span>، ωt = 30π × (1/90) = π/3 ⇒ sin(π/3) = √3/2<br>\n<span class=\"m\">ε = 2.4π × √3/2 = 1.2√3·π</span><br><span class=\"res\">ε ≈ 6.53 V</span>", "parts": [{"l": "ε العظمى", "v": [7.536, 7.54, 2.4], "u": "V"}, {"l": "ε اللحظية", "v": [6.41, 6.4056, 2.04], "u": "V"}], "id": "c2p178"}, {"ch": 2, "k": "p", "topic": "قانون فارادي", "yrs": "1/2019", "q": "ملف سلكي دائري الشكل عدد لفاته (60) لفة ونصف قطره (20 cm) وضع بين قطبي مغناطيس كهربائي فاذا تغيرت كثافة الفيض المغناطيسي المارة خلال الملف من (0.0T) الى (0.8T) خلال زمن قدره (2 s) ما مقدار القوة الدافعة الكهربائية المحتثة في الملف عندما يكون: (1) متجه مساحة اللفة الواحدة من الملف بموازاة متجه كثافة الفيض المغناطيسي. (2) متجه كثافة الفيض المغناطيسي يصنع زاوية قياسها (30°) مع مستوى الملف.", "a": "<b>المعطيات:</b> N = 60، r = 0.2 m ⇒ A = 0.04π m²، ΔB = 0.8 T، Δt = 2 s.<br>\n<b>(1) متجه المساحة يوازي B (θ = 0°):</b><br>\n<span class=\"m\">ε = 60 × 0.04π × 0.8/2 = 0.96π</span><br><span class=\"res\">ε ≈ 3.02 V</span><br>\n<b>(2) B يصنع 30° مع مستوى اللفة ⇒ cos60° = 0.5:</b><br>\n<span class=\"m\">ε = 0.96π × 0.5 = 0.48π</span><br><span class=\"res\">ε ≈ 1.51 V</span>", "parts": [{"l": "ε عند θ=0", "v": [-3.0144, -3.016, -3.0159263999999997], "u": "V"}, {"l": "ε عند θ=60°", "v": [-1.5072, -1.508, -1.5079631999999998], "u": "V"}], "id": "c2p179"}, {"ch": 2, "k": "p", "topic": "قانون فارادي", "yrs": "1/2023 احيائي", "q": "ملف يتألف من (50) لفة متماثلة ومساحة اللفة الواحدة (20 cm²) مربوط بين طرفي كلفانومتر، وكانت المقاومة الكلية في الدائرة (50Ω)، وضع بين قطبي مغناطيس كهربائي كثافة فيضه منتظمة بحيث مستوى الملف يصنع زاوية قياسها (30°) مع اتجاه كثافة الفيض المغناطيسي، فإذا تغيرت كثافة الفيض المغناطيسي الذي يخترق الملف من (0.8T) الى (0.08T) خلال زمن (3.6) ملي ثانية، فما مقدار التيار المنساب في الدائرة؟", "a": "<b>المعطيات:</b> N = 50، A = 20 cm² = 2×10⁻³ m²، المقاومة الكلية 50 Ω، الزاوية بين مستوى اللفة وB = 30° ⇒ الزاوية بين العمودي والمجال θ = 60°.<br>\n<b>التغير في B:</b> ΔB = 0.08 − 0.8 = −0.72 T (مقدار 0.72 T)، Δt = 3.6×10⁻³ s<br>\n<span class=\"m\">ε = N·A·cosθ·ΔB/Δt = 50 × 2×10⁻³ × 0.5 × 0.72/(3.6×10⁻³)</span><br>\n<span class=\"m\">= 0.036/0.0036 = 10 V</span><br>\n<b>التيار:</b> <span class=\"m\">I = ε/R = 10/50</span><br><span class=\"res\">I = 0.2 A</span>", "parts": [{"l": "التيار", "v": [0.2, 200], "u": "A"}], "id": "c2p180"}, {"ch": 2, "k": "p", "topic": "قانون فارادي", "yrs": "2/2021 احيائي", "q": "ملف يتألف من (50) لفة متماثلة، ومساحة اللفة الواحدة (20 cm²) فإذا تغيرت كثافة الفيض المغناطيسي الذي يخترق اللفة من (0.0T) الى (0.8T)، خلال زمن (0.4 sec)، ما مقدار القوة الدافعة الكهربائية المحتثة في الملف عندما يكون: (1) متجه مساحة اللفة الواحدة من الملف بموازاة متجه كثافة الفيض المغناطيسي. (2) متجه كثافة الفيض المغناطيسي يصنع زاوية قياسها (30°) مع مستوى الملف.", "a": "<b>المعطيات:</b> N = 50، A = 20 cm² = 2×10⁻³ m²، ΔB = 0.8 T، Δt = 0.4 s.<br>\n<b>(1) متجه المساحة يوازي B (θ = 0°):</b><br>\n<span class=\"m\">ε = 50 × 2×10⁻³ × 0.8/0.4 = 0.2 V</span><br><span class=\"res\">ε = 0.2 V</span><br>\n<b>(2) B يصنع 30° مع مستوى اللفة (cos60° = 0.5):</b><br>\n<span class=\"m\">ε = 0.2 × 0.5 = 0.1 V</span><br><span class=\"res\">ε = 0.1 V</span>", "parts": [{"l": "ε عند θ=0", "v": [-0.2, 0.2], "u": "V"}, {"l": "ε عند θ=60°", "v": [-0.1, 0.1], "u": "V"}], "id": "c2p181"}, {"ch": 2, "k": "p", "topic": "قانون فارادي", "yrs": "2025 تمهيدي", "q": "ملف سلكي دائري الشكل عدد لفاته (40) لفة ونصف قطره (30cm) وضع بين قطبي مغناطيس كهربائي فاذا تغيرت كثافة الفيض المغناطيسي المارة خلال الملف من (0.0T) الى (0.5T) خلال زمن قدره (4s) ما مقدار القوة الدافعة الكهربائية المحتثة في الملف عندما يكون متجه مساحة اللفة الواحدة من الملف بموازاة متجه كثافة الفيض المغناطيسي.", "a": "<b>المعطيات:</b> N = 40، r = 0.3 m ⇒ A = 0.09π m²، ΔB = 0.5 T، Δt = 4 s، المساحة موازية لـ B.<br>\n<span class=\"m\">ε = N·A·ΔB/Δt = 40 × 0.09π × 0.5/4 = 0.45π</span><br><span class=\"res\">ε ≈ 1.41 V</span>", "parts": [{"l": "ε المحتثة", "v": [-1.4137155, -1.4137, -1.413, -0.45], "u": "V"}], "id": "c2p182"}, {"ch": 2, "k": "p", "topic": "قانون فارادي", "yrs": "3/2024", "q": "حلقة موصلة دائرية مساحتها (525 cm²) ومقاومتها (10Ω) موضوعة في مستوى الورقة ، سلط عليها مجال مغناطيسي منتظم كثافة فيضه (0.15 T) باتجاه عمودي على مستوى الحلقة ، سحبت الحلقة من جانبيها بقوتي شد متساويتين فبلغت مساحتها (25 cm²) خلال فترة زمنية (0.2 s) احسب مقدار التيار المحتث في الحلقة.", "a": "<b>المعطيات:</b> المساحة الابتدائية 525 cm² والنهائية 25 cm² ⇒ ΔA = 500 cm² = 0.05 m²، B = 0.15 T، Δt = 0.2 s، R = 10 Ω.<br>\n<span class=\"m\">ε = B·ΔA/Δt = 0.15 × 0.05/0.2 = 0.0375 V</span><br>\n<span class=\"m\">I = ε/R = 0.0375/10</span><br><span class=\"res\">I = 0.00375 A = 3.75 mA</span>", "parts": [{"l": "التيار المحتث", "v": [0.00375, 3.75], "u": "A"}], "id": "c2p183"}, {"ch": 2, "k": "p", "topic": "قانون فارادي", "yrs": "3/2024 محاولات", "q": "ملف يتألف من (40) لفة متماثلة ومساحة اللفة الواحدة (20 cm²) فإذا تغيرت كثافة الفيض المغناطيسي الذي يخترق اللفة من (0.0T) الى (0.8T) خلال زمن (0.5 s) احسب: 1) معدل القوة الدافعة الكهربائية المحتثة (ε_ind) في الملف. 2) فما مقدار التيار المنساب في الدائرة اذا كان الملف مربوط بين طرفي كلفانومتر ، والمقاومة الكلية في الدائرة (50Ω)؟", "a": "<b>المعطيات:</b> N = 40، A = 20 cm² = 2×10⁻³ m²، ΔB = 0.8 T، Δt = 0.5 s، R = 50 Ω (المتجه يوازي B).<br>\n<b>(1) معدل القوة الدافعة المحثة:</b> <span class=\"m\">ε = N·A·ΔB/Δt = 40 × 2×10⁻³ × 0.8/0.5 = 0.128 V</span><br><span class=\"res\">ε = 0.128 V</span><br>\n<b>(2) التيار:</b> <span class=\"m\">I = ε/R = 0.128/50</span><br><span class=\"res\">I = 2.56×10⁻³ A = 2.56 mA</span>", "parts": [{"l": "ε المحتثة", "v": [-0.128, 0.128, -128], "u": "V"}, {"l": "التيار", "v": [0.00256, 2.56], "u": "A"}], "id": "c2p184"}, {"ch": 2, "k": "k", "topic": "قانون لنز", "yrs": "1/2013 خارج القطر · 2/2020 · 2022 · 2/2022 · 2/2017 احيائي الموصل · 1/2017 خارج القطر · 2/2024 محاولات", "q": "ما المقصود بـ: قانون لنز؟ اذكر نص قانون لنز؟ ما المقصود بقانون لنز ؟ وما الفائدة العملية من تطبيقه ؟", "a": "التيار المحتث في دائرة كهربائية مقفلة يمتلك اتجاهاً بحيث ان مجاله المغناطيسي المحتث يكون معاكساً بتأثيره للتغير في الفيض المغناطيسي الذي ولد هذا التيار.<br><b>فائدته:</b> 1) لتحديد اتجاه التيار المحتث في دائرة كهربائية مقفلة. 2) يعد قانون لنز تطبيقاً لقانون حفظ الطاقة.", "kw": [["معاكس", "يعاكس", "عكس"], ["المجال المغناطيسي المحتث", "مجاله", "المجال"], ["التغير في الفيض", "تغير الفيض", "الفيض"], ["تيار محتث", "التيار المحتث", "اتجاه"]], "id": "c2k185"}, {"ch": 2, "k": "k", "topic": "قانون لنز", "yrs": "2015 · 1/2016 خارج القطر · 1/2017 الموصل · 2020 · 2022 · 3/2023 تكميلي", "q": "لماذا (علل): يعد قانون لنز تطبيقاً من تطبيقات حفظ الطاقة ؟", "a": "لأنه في كلا الحالتين (اقتراب المغناطيس أو ابتعاد المغناطيس نسبة إلى الحلقة) يتطلب انجاز شغل ميكانيكي ويتحول الشغل المنجز إلى نوع آخر من الطاقة في الحمل (عندما تكون الحلقة مربوطة بحمل). ويعد ذلك تطبيقاً لقانون حفظ الطاقة.", "kw": [["شغل ميكانيكي", "شغل"], ["يتحول", "تحول", "نوع اخر من الطاقه"], ["الحمل", "حمل"], ["حفظ الطاقه"]], "id": "c2k186"}, {"ch": 2, "k": "k", "topic": "قانون لنز", "yrs": "2013 · 2014 · 2015 · 2017 · 1/2018 · 2/2018 · 3/2018 · 2020 · 2021 · وغيرها", "q": "ما الفائدة العملية من تطبيق قانون لنز.", "a": "1) تحديد اتجاه التيار المحتث في دائرة كهربائية مقفلة.<br>2) يعد تطبيقاً لقانون حفظ الطاقة.", "kw": [["تحديد اتجاه", "اتجاه التيار", "اتجاه"], ["دائره مقفله", "مقفله"], ["حفظ الطاقه"]], "id": "c2k187"}, {"ch": 2, "k": "k", "topic": "قانون لنز", "yrs": "2/2016 · 2018 · 1/2017 خارج القطر احيائي", "q": "ما الفائدة العملية من تطبيق قانون لنز ؟ وكيف يعد القانون تطبيقاً لقانون حفظ الطاقة؟", "a": "1) تحديد اتجاه التيار المحتث في دائرة كهربائية مقفلة.<br>2) يعد تطبيقاً لقانون حفظ الطاقة، لأنه في كلا الحالتين (اقتراب المغناطيس أو ابتعاد المغناطيس نسبة إلى الحلقة) يتطلب انجاز شغل ميكانيكي ويتحول الشغل المنجز إلى نوع آخر من الطاقة في الحمل (عندما تكون الحلقة مربوطة بحمل). ويعد ذلك تطبيقاً لقانون حفظ الطاقة.", "kw": [["تحديد اتجاه", "اتجاه التيار"], ["شغل ميكانيكي", "شغل"], ["يتحول", "تحول", "نوع اخر"], ["حفظ الطاقه"]], "id": "c2k188"}, {"ch": 2, "k": "k", "topic": "قانون لنز", "yrs": "2018 أسئلة الفصل · 1/2018", "q": "اختر الاجابة الصحيحة: عند سقوط الساق المغناطيسية خلال حلقة من الألمنيوم غير مقفلة موضوعة أفقياً تحت الساق لاحظ الشكل: [الشكل: ساق مغناطيسية (S فوق N) فوق حلقة موضوعة أفقياً]", "a": "الجواب (c): لا تتأثر الساق بأي قوة، لأن الحلقة غير مقفلة فلا ينساب فيها تيار محتث، فلا يتولد مجال يعاكس الحركة.", "opts": ["تتأثر الساق بقوة تنافر في أثناء اقترابها من الحلقة ، ثم تتأثر بقوة تجاذب في أثناء ابتعادها عن الحلقة.", "تتأثر الساق بقوة تجاذب في أثناء اقترابها من الحلقة ، ثم تتأثر بقوة تنافر في أثناء ابتعادها عن الحلقة.", "لا تتأثر الساق بأية قوة في أثناء اقترابها من الحلقة ، أو في أثناء ابتعادها عن الحلقة.", "تتأثر الساق بقوة تنافر في أثناء اقترابها من الحلقة وكذلك تتأثر بقوة تنافر أثناء ابتعادها عن الحلقة."], "c": 2, "kw": [["لا تتاثر"]], "id": "c2k189"}, {"ch": 2, "k": "k", "topic": "قانون لنز", "yrs": "2/2021", "q": "ما تأثير المجال المغناطيسي الذي يولده التيار المحتث (المجال المغناطيسي المحتث) في العامل الأساسي الذي ولد هذا التيار؟", "a": "التيار المحتث في دائرة كهربائية مقفلة يمتلك اتجاهاً بحيث ان مجاله المغناطيسي المحتث يكون معاكساً بتأثيره للتغير في الفيض المغناطيسي الذي ولد هذا التيار.", "kw": [["معاكس", "يعاكس", "عكس"], ["التغير في الفيض", "تغير الفيض", "الفيض"], ["المجال المغناطيسي المحتث", "مجاله"]], "id": "c2k190"}, {"ch": 2, "k": "k", "topic": "قانون لنز", "yrs": "2/2023 احيائي", "q": "كيف يمكن التمييز بين كثافة الفيض المغناطيسي الخارجي (B) وبين كثافة الفيض المغناطيسي المحتث (B_ind) ؟", "a": "كثافة الفيض المغناطيسي الخارجي (B) تتسبب تغير فيضه مع توليد تيار محتث في دائرة كهربائية مقفلة وذلك على وفق قانون فاردادي في الحث الكهرومغناطيسي ، وكثافة الفيض المغناطيسي المحتث (B_ind) الذي ولده التيار المحتث والذي يعاكس بتأثيره التغير بالفيض المغناطيسي الخارجي (العامل المسبب لتوليد التيار المحتث على وفق قانون لنز).<br><b>ملاحظة:</b> اذا ذكر الطالب (باستخدام قانون لنز) فقط دون ذكر التوضيح اعلاه يعطى الطالب درجتان فقط.", "kw": [["الخارجي"], ["يتسبب", "يولد", "تغير فيضه", "تغير الفيض"], ["المحتث"], ["يعاكس", "معاكس", "عكس"]], "id": "c2k191"}, {"ch": 2, "k": "k", "topic": "قانون لنز", "yrs": "1/2023 احيائي", "q": "ضع كلمة (صح) أمام العبارة الصحيحة وكلمة (خطأ) أمام العبارة غير الصحيحة من العبارات الآتية مع تصحيح الخطأ ان وجد دون ان تغير ما تحته خط: افرض أن ساقاً مغناطيسية سقطت سقوطاً حراً نحو الأسفل بوضع شاقولي وتحتها حلقة واسعة من النحاس مقفلة ومثبتة أفقياً (كما في الشكل) ، فأن اتجاه التيار المحتث في الحلقة يكون مع اتجاه حركة عقارب الساعة حسب قاعدة الكف اليمنى للملف. [الشكل: ساق مغناطيسية (S فوق N) تتحرك لأسفل باتجاه حلقة نحاسية أفقية]", "a": "خطأ. الصحيح: يكون اتجاه التيار المحتث في الحلقة عكس اتجاه عقارب الساعة للناظر من الأعلى، حسب قاعدة لنز، لأن الحلقة تولد قطباً يعاكس اقتراب القطب المغناطيسي منها.", "kw": [["خطا"], ["عكس", "معاكس"]], "id": "c2k192"}, {"ch": 2, "k": "k", "topic": "قانون لنز", "yrs": "1/2019 احيائي خارج القطر", "q": "ضع كلمة (صح) أمام العبارة الصحيحة وكلمة (خطأ) أمام العبارة غير الصحيحة من العبارات الآتية مع تصحيح الخطأ ان وجد دون ان تغير ما تحته خط: في الشكل المجاور حلقة من مادة النحاس وضعت في مستوى الورقة وموصولة مع المقاومة R سلط مجال مغناطيسي باتجاه عمودي على مستوى الورقة خارجاً من الورقة فإن تيار محتث ينساب في المقاومة R اتجاهه من اليمين الى اليسار عند تزايد الفيض المغناطيسي الذي يخترق الحلقة. [الشكل: حلقة موصلة مع مقاومة R في أسفلها داخل مجال مغناطيسي خارج من الورقة B (نقاط)]", "a": "خطأ عند تناقص الفيض المغناطيسي.", "kw": [["خطا"], ["تناقص", "نقصان"]], "id": "c2k193"}, {"ch": 2, "k": "k", "topic": "التيارات الدوامة", "yrs": "2/2018 تطبيقي · 2/2025", "q": "ما المقصود بالتيارات الدوامة وما سبب نشوءها ؟ (او) ما المقصود بالتيارات الدوامة؟", "a": "تيارات محتثة تتخذ مسارات دائرية مقفلة ومتمركزة تقع في مستوى كل صفيحة وبمستويات عمودية على الفيض المغناطيسي المسبب لها.<br>سبب نشوءها: نتيجة للحركة النسبية بين الصفيحة والفيض المغناطيسي تتولد تيارات دوامة في سطح الصفيحة على وفق قانون فارادي في الحث الكهرومغناطيسي.", "kw": [["تيارات محتثه", "محتثه"], ["مسارات دائريه", "دائريه", "مقفله"], ["عموديه", "عمودي"], ["الحركه النسبيه", "حركه نسبيه", "تغير الفيض"]], "id": "c2k194"}, {"ch": 2, "k": "k", "topic": "التيارات الدوامة", "yrs": "2/2014 · 1/2023 · 1/2023 تطبيقي", "q": "في معظم الملفات يصنع القلب بشكل سيقان متوازية من الحديد الطاوع معزولة عن بعضها البعض عزلاً كهربائياً ومكبوسة كبساً شديداً ، بدلاً من قلب الحديد المصنوع كقطعة واحدة ما الفائدة العملية من ذلك ؟", "a": "لتقليل تأثير التيارات الدوامة فتقل القدرة الضائعة الناتجة عنها وبذلك تقل الطاقة الحرارية الناتجة عنها. وهذا مما يزيد من كفاءة المحولة مثلاً ولا تسرع في تلفها.", "kw": [["تقليل", "تقل", "يقلل"], ["التيارات الدواميه", "الدواميه"], ["القدره الضائعه", "الطاقه الحراريه", "ضائعه"], ["كفاءه", "كفاءة"]], "id": "c2k195"}, {"ch": 2, "k": "k", "topic": "التيارات الدوامة", "yrs": "1/2016 · 1/2024 · 1/2024 · 1/2024 محاولات", "q": "ماذا يحصل ؟ ولماذا ؟ لو سحبت صفيحة من النحاس افقياً بين قطبي مغناطيس كهربائي كثافة فيضه منتظمة؟", "a": "تتولد تيارات دوامة في سطح الصفيحة ، وفق قانون فارادي نتيجة تغير الفيض المغناطيسي لوحدة الزمن (ΔΦ<sub>B</sub>/Δt).", "kw": [["تيارات دواميه", "تتولد تيارات"], ["سطح الصفيحه", "الصفيحه"], ["قانون فارادي"], ["تغير الفيض", "الفيض المغناطيسي"]], "id": "c2k196"}, {"ch": 2, "k": "k", "topic": "التيارات الدوامة", "yrs": "3/2016", "q": "هل يمكن تقليل خسائر الطاقة التي تسببها التيارات الدوامة المتولدة في قلب الحديد للملفات او المحولات؟ وضح ذلك.", "a": "نعم ، وذلك بأن يصنع القلب بشكل صفائح من الحديد المطاوع ترتب بموازاة الفيض المغناطيسي المتغير الذي يخترقها وتكون هذه الصفائح معزولة عن بعضها ومكبوسة كبساً شديداً فتزداد بذلك المقاومة الكهربائية وتقل التيارات الدوامة تبعاً لذلك.", "kw": [["نعم"], ["صفائح", "شرائح"], ["معزوله", "عزل"], ["المقاومه", "تزداد"], ["تقل التيارات", "تقل"]], "id": "c2k197"}, {"ch": 2, "k": "k", "topic": "التيارات الدوامة", "yrs": "2/2014 تمهيدي · 3/2024", "q": "اذكر مجالين من المجالات التي تستثمر فيها التيارات الدوامة؟ (او) اذكر التطبيقات العملية التي تستثمر فيها التيارات الدوامة؟", "a": "1) مكابح بعض القطارات ذات الوسادة الهوائية.<br>2) في كاشفات المعادن المستعملة حديثاً في نقاط التفتيش الامنية وخاصة المطارات.", "kw": [["مكابح", "القطارات", "وساده هوائيه"], ["كاشفات المعادن", "كاشف المعادن", "المطارات", "التفتيش"]], "id": "c2k198"}, {"ch": 2, "k": "k", "topic": "التيارات الدوامة", "yrs": "1/2015 أسئلة النازحين · 1/2017 تطبيقي", "q": "كيف يمكن تقليل مقدار الطاقة المتبددة التي تسببها التيارات الدوامة في قلب الحديد للملفات؟ كيف يمكن تقليل مقدار الطاقة المتبددة التي تسببها التيارات الدوامة في قلب الحديد للملفات والمحولة؟", "a": "أن يصنع القلب من الحديد بشكل صفائح متوازية معزول بعضها عن بعض عزلاً كهربائياً ومكبوسة كبساً شديداً ترتب بموازاة الفيض المغناطيسي المتغير الذي يخترقها ، بدلاً من قلب من الحديد مصنوع كقطعة واحدة.", "kw": [["صفائح", "شرائح"], ["معزوله", "عزلا"], ["مكبوسه", "كبسا"], ["بموازاه الفيض", "موازيه", "بموازاه"]], "id": "c2k199"}, {"ch": 2, "k": "k", "topic": "التيارات الدوامة", "yrs": "2/2016 · 2/2020 تطبيقي", "q": "كيف تعمل التيارات الدوامة على كبح اهتزاز الصفيحة المعدنية المهتزة عمودياً على مجال مغناطيسي منتظم ؟", "a": "بسبب تولد التيارات المحتثة الدوامة في الصفيحة والتي تعمل على توليد مجال مغناطيسي محتث (B_ind) معاكس لاتجاه المجال المغناطيسي المؤثر (B) ونتيجة لذلك تتولد قوة تنافر مغناطيسية معرقلة لاتجاه حركة الصفيحة داخل المجال المغناطيسي فتعمل على كبح اهتزازها (وفق قانون لنز).", "kw": [["تيارات دواميه", "تيارات محتثه"], ["مجال مغناطيسي محتث", "مجال محتث"], ["معاكس", "يعاكس"], ["قوه تنافر", "قوه"], ["كبح", "تعرقل", "عرقله"]], "id": "c2k200"}, {"ch": 2, "k": "k", "topic": "التيارات الدوامة", "yrs": "1/2018 تطبيقي", "q": "اذكر بعض المجالات التي تستثمر فيها التيارات الدوامة موضحاً واحدة منها ؟", "a": "1) تستثمر في مكابح القطارات الحديثة ذات الوسادة الهوائية: اذ توضع ملفات سلكية (كل منها يعمل كمغناطيس كهربائي) مقابل قضبان السكة ففي الحركة الاعتيادية لا ينساب تيار كهربائي في تلك الملفات ولا يقاف القطار عن الحركة تغلق الدائرة الكهربائية لتلك الملفات فينساب تيار كهربائي في الملفات وهذا يولد التيار مجالاً مغناطيسياً قوياً يمر خلال قضبان الحديد للسكة ونتيجة للحركة النسبية بين المجال المغناطيسي والقضبان تتولد تيارات دوامة فيها وعلى وفق قانون لنز تولد هذه التيارات مجالاً مغناطيسياً يعرقل تلك الحركة وهو السبب الذي ولدها فيتوقف القطار عن الحركة.<br>2) تستثمر التيارات الدوامة في كاشفات المعادن المستعملة حديثاً في نقاط التفتيش الامنية وخاصة في المطارات: يعتمد عمل كاشفات المعادن على ظاهرة الحث الكهرومغناطيسي الذي تسمى غالباً الحث النبضي يحتوي جهاز كاشف المعادن على ملكين احدهما يستعمل كمرسل والاخر كمستقبل ويسلط فرق جهد متناوب على طرفي ملف الارسال فينساب في الملف تيار متناوب الذي بدوره يولد مجالاً مغناطيسياً فعند مرورأي جسم معدني بين المستقبل والمرسل سوف تتولد تيارات دوامة في ذلك الجسم المعدني فتعمل التيارات الدوامة على عرقلة التغير الحاصل في الفيض المغناطيسي المتولد في جهاز الاستقبال وهذا يتسبب في تقليل التيار الابتدائي المقاس في المستقبل في حالة وجود هواء بين الملفين وبهذا التأثير يمكن الكشف عن وجود القطع المعدنية في الحقائب اليدوية او ملابس رات دوامة في الصفيحة الغير المقطعة تكون كبيرة المقدار في اثناء دخولها المجال المغناطيسي بين القطبين فتكون باتجاه معين، نتيجة حصول تزايد في الفيض المغناطيسي الذي يخترقها لوحدة الزمن <span class=\"m\">(ΔΦ<sub>B</sub>/Δt)</span> (على وفق قانون فاراداي)، وتكون باتجاه معاكس في اثناء خروجها من المجال، نتيجة حصول تناقص في الفيض المغناطيسي <span class=\"m\">(ΔΦ<sub>B</sub>/Δt)</span> فتتولد في الحالتين قوة مغناطيسية <span class=\"m\">F<sub>B</sub></span> تعرقل حركة الصفيحة (على وفق قانون لنز) وبالنتيجة تتلاشى سعة اهتزاز الصفيحة وتتوقف عن الاهتزاز. حيث ان التيارات الدوامة المتولدة في الصفيحة المقطعة بشكل شرائح تكون صغيرة المقدار جدا فيكون تأثيرها في اهتزاز الصفيحة ضعيفا جدا.", "kw": [["صفيحه", "صفيحتين", "بندول"], ["مقطعه", "شرائح", "اسنان", "المشط"], ["كامله", "تتوقف"], ["دواميه", "دوامه", "تيارات"], ["لنز", "تعرقل", "تعاكس"], ["فاراداي", "الفيض"]], "id": "c2k203"}, {"ch": 2, "k": "k", "topic": "مولد التيار المتناوب", "yrs": "1/2016", "q": "اختر الاجابة الصحيحة: عندما تدور حلقة موصلة حول محور شاقولي موازٍ لوجهها ومار من مركزها والمحور عمودي على فيض مغناطيسي افقي منتظم فان القوة الدافعة الكهربائية المحتثة تكون دالة جيبية تتغير مع الزمن وتنعكس مرتين خلال كل (ربع دورة، نصف دورة، دورة واحدة، دورتين).", "opts": ["ربع دورة", "نصف دورة", "دورة واحدة", "دورتين"], "c": 2, "a": "الجواب: دورة واحدة، لأن القوة الدافعة الجيبية تنعكس إشارتها مرتين خلال كل دورة كاملة.", "id": "c2k204"}, {"ch": 2, "k": "k", "topic": "مولد التيار المتناوب", "yrs": "3/2014", "q": "مم يتألف مولد التيار المتناوب ذي الاطوار الثلاثة؟ وما الفائدة العملية منه؟ موضحا ذلك بالرسم. [الشكل: ثلاثة ملفات متساوية الزاوية 120° بين كل ملفين مع سلك متعادل]", "a": "1) يتألف من ثلاث ملفات حول النواة تربط ربطا نجميا.<br>2) تفصل بين الملفات زوايا متساوية قياس كل منها 120°.<br>3) تربط احدى اطراف الملفات الثلاثة مع سلك يسمى بالسلك المتعادل او (الخط الصفري).<br>4) ينقل التيار الخارج من هذا المولد بثلاثة خطوط.<br><b>الفائدة العلمية:</b> يجهز تيار متناوب ذا مقدار اكبر من التيار الذي يجهزه مولد التيار المتناوب احادي الطور.", "kw": [["  هوائية قطرة (8 cm) عدد لفاته (500) لفة يدور داخل مجال مغناطيسي منتظم كثافة فيضه (3/π² T) فاذا كان اعظم مقدار للفولطية المحتثة على طرفي الملف (24V) والمقدار الاعظم للتيار المنساب في الحمل المربوط مع الملف (2A) ما مقدار: 1) السرعة الزاوية التي تدور بها نواة المولد. 2) القدرة العظمى المجهزة للحمل المربوط مع المولد. 3) القوة الدافعة الكهربائية الانية المحتثة في الملف بعد مرور (1/60 s) من الوضع الذي كان مقدارها صفرا.", "a": "<b>المعطيات:</b> القطر 8 cm ⇒ r = 0.04 m ⇒ A = πr² = 1.6π×10⁻³ m²، N = 500، B = 3/π² T، ε_max = 24 V، I_max = 2 A.<br>\n<b>(1) السرعة الزاوية:</b><br>\n<span class=\"m\">N·B·A = 500 × (3/π²) × 1.6π×10⁻³ = 2.4/π</span><br>\n<span class=\"m\">ω = 24/(2.4/π) = 10π</span><br><span class=\"res\">ω = 10π ≈ 31.4 rad/s</span><br>\n<b>(2) القدرة العظمى:</b> <span class=\"m\">P_max = ε_max × I_max = 24 × 2</span><br><span class=\"res\">P_max = 48 W</span><br>\n<b>(3) القوة الدافعة الآنية بعد t = 1/60 s من وضع الصفر:</b><br>\n<span class=\"m\">ωt = 10π/60 = π/6 ⇒ sin(π/6) = 0.5</span><br>\n<span class=\"m\">ε = 24 × 0.5 = 12 V</span><br><span class=\"res\">ε = 12 V</span>", "parts": [{"l": "السرعة الزاوية", "v": [31.4159, 10], "u": "rad/s"}, {"l": "القدرة العظمى", "v": [48], "u": "W"}, {"l": "ε الانية", "v": [12], "u": "V"}], "id": "c2p217"}, {"ch": 2, "k": "p", "topic": "مولد التيار المتناوب", "yrs": "3/2019 تطبيقي", "q": "ملف لمولد دراجة هوائية مساحة اللفة الواحدة منه (4π×10⁻⁴ m²) عدد لفاته (50) لفة يدور داخل مجال مغناطيسي منتظم كثافة فيضه (1/π T) وكان اعظم مقدار للفولطية المحتثة على طرفي الملف (16V) والقدرة العظمى المجهزة للحمل المربوط مع المولد (12W) ما مقدار: 1) السرعة الزاوية التي تدور بها نواة المولد. 2) المقدار الاعظم للتيار المنساب في الحمل.", "a": "<b>المعطيات:</b> A = 4π×10⁻⁴ m²، N = 50، B = 1/π T، ε_max = 16 V، P_max = 12 W.<br>\n<b>(1) السرعة الزاوية:</b><br>\n<span class=\"m\">N·B·A = 50 × (1/π) × 4π×10⁻⁴ = 0.02</span><br>\n<span class=\"m\">ω = 16/0.02 = 800</span><br><span class=\"res\">ω = 800 rad/s</span><br>\n<b>(2) أعظم تيار:</b> <span clas kw": [["تتولد", "محتثه", "نواه", "طرفي"], ["دوران", "مجال مغناطيسي"], ["تغير", "الفيض", "فاراداي"], ["معاكسه", "المسبب", "لنز"]], "id": "c2k226"}, {"ch": 2, "k": "k", "topic": "المحركات الكهربائية للتيار المستمر", "yrs": "2022 تمهيدي تطبيقي · 2024 تمهيدي", "q": "علام يعتمد مقدار القوة الدافعة الكهربائية المحتثة المضادة (ε<sub>back</sub>) في المحرك الكهربائي للتيار المستمر. ما العوامل التي تحدد مقدار القوة الدافعة الكهربائية المضادة (ε<sub>back</sub>) في المحرك؟", "a": "1) سرعة دوران النواة (أي المعدل الزمني لتغير الفيض المغناطيسي للفة واحدة)<br>2) عدد لفات الملف<br>3) مساحة اللفة<br>4) كثافة الفيض المغناطيسي.<br><b>ملاحظة:</b> اذا ذكر الطالب العلاقة التالية فقط يعطى درجتين: <span class=\"m\">ε<sub>back</sub> = −N Δφ<sub>B</sub>/Δt</span>", "kw": [["سرعه", "دوران", "النواه"], ["عدد", "لفات"], ["مساحه", "اللفه"], ["كثافه", "الفيض"]], "id": "c2k227"}, {"ch": 2, "k": "k", "topic": "الحث الذاتي", "yrs": "1/2017 أسئلة الموصل تطبيقي · 2/2018 أحيائي خارج القطر", "q": "ما المقصود بظاهرة الحث الذاتي؟", "a": "هي عملية تولد قوة دافعة كهربائية محتثة في ملف نتيجة تغير التيار المنساب لوحدة الزمن في الملف نفسه.", "kw": [["تولد", "محتثه", "قوه دافعه"], ["ملف", "الملف نفسه"], ["تغير", "التيار", "الزمن"]], "id": "c2k228"}, {"ch": 2, "k": "k", "topic": "الحث الذاتي", "yrs": "1/2018", "q": "ما المقصود بـ (معامل الحث الذاتي) وعلام يتوقف مقداره؟", "a": "معامل الحث الذاتي: هو النسبة بين القوة الدافعة الكهربائية المحتثة الى المعدل الزمني لتغير التيار في الملف نفسه. <span class=\"m\">L = ε<sub>ind</sub>/(−ΔI/Δt)</span><br>يتوقف على:<br>1) عدد لفات الملف.<br>2) حجم الملف.<br>3) الشكل الهندسي للملف.<br>4) النفوذية المغناطيسية للوسط في جوف الملف.", "kw": [["النسبه", "القوه الدافعه", "المحتثه"], ["المعدل", "التغير", "التيار"], ["عدد", "لفات"], ["حجم", "الشكل", "الهندسي"], ["النفوذيه", "الوسط"]], "id": "c2k229"}, {"ch": 2, "k": "k", "topic": "الحث الذاتي", "yrs": "2/2022 · 2/2023 أحيائي", "q": "ما المقصود بـ (معامل الحث الذاتي لملف)؟", "a": "هو النسبة بين القوة الدافعة الكهربائية المحتثة الى المعدل الزمني لتغير التيار في الملف نفسه. <span class=\"m\">L = ε<sub>ind</sub>/(−ΔI/Δt)</span>", "kw": [["النسبه", "القوه الدافعه", "المحتثه"], ["المعدل", "الزمني", "التغير"], ["التيار", "الملف نفسه"]], "id": "c2k230"}, {"ch": 2, "k": "k", "topic": "الحث الذاتي", "yrs": "3/2013 · 3/2017 أحيائي تطبيقي · 2/2017 تطبيقي موصل · 3/2024", "q": "علام يعتمد مقدار معامل الحث الذاتي لملف؟", "a": "1) عدد لفات الملف.<br>2) حجم الملف.<br>3) الشكل الهندسي للملف.<br>4) النفوذية المغناطيسية للوسط في جوف الملف.", "kw": [["عدد", "لفات"], ["حجم"], ["الشكل", "الهندسي"], ["النفوذيه", "الوسط", "جوف"]], "id": "c2k231"}, {"ch": 2, "k": "k", "topic": "الحث الذاتي", "yrs": "3/2023 تطبيقي", "q": "ما الكميات الفيزيائية التي تقاس بالوحدات الاتية؟ Henry", "a": "معامل الحث الذاتي L، ووحدته الهنري (H)، ويُحسب من L = NΦ/I.", "kw": [["معامل"], ["الحث الذاتي", "الحث", "الذاتي"]], "id": "c2k232"}, {"ch": 2, "k": "k", "topic": "الحث الذاتي", "yrs": "2/2014 · 2/2015 · 3/2015 · 1/2016 · 3/2016 · 2/2018 · 3/2019 · 2020 · 3/2020 · 2/2021 · 2/2024 وغيرها", "q": "اختر الاجابة الصحيحة: معامل الحث الذاتي لملف لا يعتمد على (عدد لفات الملف، الشكل الهندسي للملف، المعدل الزمني للتغير في التيار المنساب في الملف، النفوذية المغناطيسية للوسط في جوف الملف).", "opts": ["عدد لفات الملف", "الشكل الهندسي للملف", "المعدل الزمني للتغير في التيار المنساب في الملف", "النفوذية المغناطيسية للوسط في جوف الملف"], "c": 2, "a": "معامل الحث الذاتي يعتمد على عدد اللفات والشكل الهندسي للملف والنفوذية المغناطيسية للوسط، ولا يعتمد على المعدل الزمني للتغير في التيار. الجواب: المعدل الزمني للتغير في التيار", "id": "c2k233"}, {"ch": 2, "k": "k", "topic": "الحث الذاتي", "yrs": "1/2021 تطبيقي", "q": "اختر الاجابة الصحيحة من بين الاقواس: في الشكل ملف محلزن مجوف مربوط على التوالي مع مصباح كهربائي ومقاومة وبطارية ومفتاح، وعندما كان المفتاح في الدائرة مغلقا كانت شدة توهج المصباح ثابتة. اذا ادخلت ساقا من الحديد المطاوع في جوف الملف فان توهج المصباح في اثناء دخول الساق: (يزداد، يقل، يبقى ثابتا، يزداد ثم يقل). [الشكل: دائرة فيها ملف محلزن وساق من الحديد قرب الملف ومصباح L ومقاومة R وبطارية ومفتاح]", "opts": ["يزداد", "يقل", "يبقى ثابتا", "يزداد ثم يقل"], "c": 1, "a": "عند إدخال ساق حديد مطاوع في جوف الملف تزداد النفوذية فيزداد معامل الحث الذاتي L، فتزداد الممانعة الحثية أثناء الدخول فيقل التيار، فيقل توهج المصباح. الجواب: يقل", "id": "c2k234"}, {"ch": 2, "k": "k", "topic": "الحث الذاتي", "yrs": "2/2015", "q": "اكتب العلاقة الرياضية التي تعطى فيها الفولطية في دائرة تيار مستمر تحوي ملفا وبطارية ومفتاحا في الحالات الاتية: (1) عند انسياب تيار متزايد المقدار في الملف. (2) عند انسياب تيار متناقص المقدار في الملف.", "a": "1) تزايد: <span class=\"m\">V<sub>net</sub> = V<sub>app</sub> − ε<sub>ind</sub></span> (or) <span class=\"m\">I<sub>ind</sub>·R = V<sub>app</sub> − ε<sub>ind</sub></span><br>2) تناقص: <span class=\"m\">V<sub>app</sub> + ε<sub>ind</sub> = I<sub>ind</sub>·R</span> (or) <span class=\"m\">V<sub>app</sub> + ε<sub>ind</sub> = V<sub>net</sub></span>", "kw": [["Vnet", "Vapp", "ε"], ["تزايد", "−", "V app - ε"], ["تناقص", "+"]], "id": "c2k235"}, {"ch": 2, "k": "k", "topic": "الحث الذاتي", "yrs": "2020 تمهيدي", "q": "ماذا يحصل لمعامل الحث الذاتي عند ازدياد المعدل الزمني للتغير في التيار المنساب في الملف؟ مع ذكر السبب.", "a": "لا يتأثر لانه يعتمد على حجم الملف، عدد لفات الملف، الشكل الهندسي للملف، النفوذية المغناطيسية للوسط في جوف الملف.", "kw": [["لا يتاثر", "يبقى ثابت", "لا يتغير"], ["يعتمد", "حجم", "عدد", "لفات"], ["الشكل", "الهندسي"], ["النفوذيه", "الوسط"]], "id": "c2k236"}, {"ch": 2, "k": "k", "topic": "الحث الذاتي", "yrs": "2020 أسئلة الفصل · 3/2020 تطبيقي · 2/2023 تطبيقي", "q": "اختر الاجابة الصحيحة: تتحقق ظاهرة الحث الذاتي في ملف معين عندما: (تسحب ساق مغناطيسية بعيدا عن وجه الملف، ينساب في هذا الملف تيار كهربائي متغير المقدار لوحدة الزمن، يوضع ملف بجوار ملف آخر ينساب فيه تيار كهربائي متغير المقدار لوحدة الزمن).", "opts": ["تسحب ساق مغناطيسية بعيدا عن وجه الملف", "ينساب في هذا الملف تيار كهربائي متغير المقدار لوحدة الزمن", "يوضع ملف بجوار ملف آخر ينساب فيه تيار كهربائي متغير المقدار لوحدة الزمن"], "c": 1, "a": "يحدث الحث الذاتي عندما ينساب في الملف نفسه تيار متغير المقدار لوحدة الزمن. الجواب: ينساب في هذا الملف تيار كهربائي متغير المقدار لوحدة الزمن", "id": "c2k237"}, {"ch": 2, "k": "p", "topic": "الحث الذاتي", "yrs": "2/2013 · 3/2023 تطبيقي", "q": "ملف مقاومته (12Ω) وكانت الفولطية الموضوعة في دائرته (240 V) وكان مقدار الطاقة المغناطيسية المختزنة في الملف عند ثبوت التيار (360 J)، احسب: 1) معامل الحث الذاتي للملف. 2) القوة الدافعة الكهربائية المحتثة على طرفي الملف لحظة غلق الدائرة. 3) المعدل الزمني لتغير التيار لحظة ازدياد التيار الى (80%) من مقداره الثابت.", "a": "<b>المعطيات:</b> R = 12 Ω، V = 240 V، الطاقة المختزنة عند ثبوت التيار PE = 360 J.<br>\n<b>التيار الثابت:</b> <span class=\"m\">I_const = V/R = 240/12 = 20 A</span><br>\n<b>(1) معامل الحث الذاتي:</b> <span class=\"m\">PE = ½·L·I² ⇒ L = 2PE/I² = 720/400</span><br><span class=\"res\">L = 1.8 H</span><br>\n<b>(2) القوة الدافعة المحثة لحظة غلق الدائرة:</b> لحظة الغلق يكون I = 0، فلا تنعكس القوة إلا بمقدار الجهد المسلط:<br>\n<span class=\"m\">ε = V = 240 V</span> (بمقدار مساوٍ للجهد المسلط)<br><span class=\"res\">ε = 240 V</span><br>\n<b>(3) المعدل الزمني للتغير عند I = 80% من I_const = 16 A:</b><br>\n<span class=\"m\">V = I·R + L·ΔI/Δt ⇒ ΔI/Δt = (V − IR)/L = (240 − 16 × 12)/1.8 = 48/1.8</span><br><span class=\"res\">ΔI/Δt ≈ 26.7 A/s</span>", "parts": [{"l": "معامل الحث الذاتي", "v": [1.8], "u": "H"}, {"l": "ق.د.ك المحتثة لحظة الغلق", "v": [240], "u": "V"}, {"l": "المعدل الزمني لتغير التيار", "v": [26.66, 26.7], "u": "A/s"}], "id": "c2p238"}, {"ch": 2, "k": "p", "topic": "الحث الذاتي", "yrs": "3/2018", "q": "ملف معامل حثه الذاتي (5 mH) وعدد لفاته (1000) لفة وعندما انساب فيه تيار مستمر كان مقدار الطاقة المخزونة في المجال المغناطيسي للملف (0.04 J) جد مقدار: 1) التيار المنساب في الملف. 2) الفيض المغناطيسي الذي يخترق اللفة الواحدة. 3) معدل القوة الدافعة الكهربائية المحتثة في الملف اذا انعكس اتجاه التيار خلال (0.5 s).", "a": "<b>المعطيات:</b> L = 5 mH = 5×10⁻³ H، N = 1000، PE = 0.04 J.<br>\n<b>(1) التيار:</b> <span class=\"m\">PE = ½LI² ⇒ I² = 2PE/L = 0.08/(5×10⁻³) = 16</span><br><span class=\"res\">I = 4 A</span><br>\n<b>(2) الفيض في اللفة الواحدة:</b> <span class=\"m\">N·Φ = L·I ⇒ Φ = L·I/N = 5×10⁻³ × 4/1000</span><br><span class=\"res\">Φ = 2×10⁻⁵ Wb</span><br>\n<b>(3) عند انعكاس التيار خلال 0.5 s:</b> ΔI = I₂ − I₁ = (−4) − 4 = −8 A<br>\n<span class=\"m\">|ε| = L·|ΔI|/Δt = 5×10⁻³ × 8/0.5</span><br><span class=\"res\">|ε| = 0.08 V</span>", "parts": [{"l": "التيار", "v": [4], "u": "A"}, {"l": "الفيض للفة الواحدة", "v": [2e-05], "u": "Wb"}, {"l": "معدل ق.د.ك المحتثة", "v": [0.08], "u": "V"}], "id": "c2p239"}, {"ch": 2, "k": "p", "topic": "الحث الذاتي", "yrs": "2/2014", "q": "ملف معامل حثه الذاتي (2.5 mH) وعدد لفاته (600) لفة ينساب فيه تيار مستمر (5A) احسب: اولا: مقدار الفيض الذي يخترق اللفة الواحدة. ثانيا: الطاقة المختزنة في المجال المغناطيسي للملف. ثالثا: معدل القوة الدافعة الكهربائية المحتثة في الملف اذا انعكس اتجاه التيار خلال (0.2 s).", "a": "<b>المعطيات:</b> L = 2.5 mH = 2.5×10⁻³ H، N = 600، I = 5 A.<br>\n<b>(1) الفيض في اللفة الواحدة:</b> <span class=\"m\">Φ = L·I/N = 2.5×10⁻³ × 5/600 = 0.0125/600</span><br><span class=\"res\">Φ ≈ 2.08×10⁻⁵ Wb</span><br>\n<b>(2) الطاقة المختزنة:</b> <span class=\"m\">PE = ½·L·I² = ½ × 2.5×10⁻³ × 25</span><br><span class=\"res\">PE = 0.03125 J ≈ 0.031 J</span><br>\n<b>(3) عند انعكاس التيار خلال 0.2 s:</b> ΔI = −5 − 5 = −10 A<br>\n<span class=\"m\">|ε| = 2.5×10⁻³ × 10/0.2</span><br><span class=\"res\">|ε| = 0.125 V</span>", "parts": [{"l": "الفيض للفة الواحدة", "v": [2.08e-05, 2.08e-05], "u": "Wb"}, {"l": "الطاقة المختزنة", "v": [0.03125], "u": "J"}, {"l": "معدل ق.د.ك المحتثة", "v": [0.125], "u": "V"}], "id": "c2p240"}, {"ch": 2, "k": "p", "topic": "الحث الذاتي", "yrs": "1/2014 أسئلة النازحين · 2018 تمهيدي تطبيقي · 2/2017 تطبيقي موصل", "q": "ملف معامل حثه الذاتي (1.8 H) وعدد لفاته (600) لفة ينساب فيه تيار مستمر (20A) احسب: اولا: مقدار الفيض الذي يخترق اللفة الواحدة. ثانيا: الطاقة المختزنة في المجال المغناطيسي للملف. ثالثا: معدل القوة الدافعة الكهربائية المحتثة في الملف اذا انعكس اتجاه التيار خلال (0.1 s).", "a": "<b>المعطيات:</b> L = 1.8 H، N = 600، I = 20 A.<br>\n<b>(1) الفيض في اللفة الواحدة:</b> <span class=\"m\">Φ = L·I/N = 1.8 × 20/600 = 36/600</span><br><span class=\"res\">Φ = 0.06 Wb</span><br>\n<b>(2) الطاقة المختزنة:</b> <span class=\"m\">PE = ½ × 1.8 × 400</span><br><span class=\"res\">PE = 360 J</span><br>\n<b>(3) عند انعكاس التيار خلال 0.1 s:</b> ΔI = −20 − 20 = −40 A<br>\n<span class=\"m\">|ε| = 1.8 × 40/0.1</span><br><span class=\"res\">|ε| = 720 V</span>", "parts": [{"l": "الفيض للفة الواحدة", "v": [0.06], "u": "Wb"}, {"l": "الطاقة المختزنة", "v": [360], "u": "J"}, {"l": "معدل ق.د.ك المحتثة", "v": [720], "u": "V"}], "id": "c2p241"}, {"ch": 2, "k": "p", "topic": "الحث الذاتي", "yrs": "2/2014 أسئلة النازحين · 3/2019 أحيائي", "q": "اذا كانت الطاقة المختزنة في ملف تساوي (0.02 J) عندما كان التيار المنساب فيه (4A) جد مقدار: 1) معامل الحث الذاتي للمحث. 2) معدل القوة الدافعة الكهربائية المحتثة اذا انعكس التيار خلال (0.25 s).", "a": "<b>المعطيات:</b> PE = 0.02 J، I = 4 A.<br>\n<b>(1) معامل الحث الذاتي:</b> <span class=\"m\">L = 2PE/I² = 0.04/16</span><br><span class=\"res\">L = 2.5×10⁻³ H = 2.5 mH</span><br>\n<b>(2) عند انعكاس التيار خلال 0.25 s:</b> ΔI = −8 A<br>\n<span class=\"m\">|ε| = 2.5×10⁻³ × 8/0.25</span><br><span class=\"res\">|ε| = 0.08 V</span>", "parts": [{"l": "معامل الحث الذاتي", "v": [0.0025, 0.0025], "u": "H"}, {"l": "معدل ق.د.ك المحتثة", "v": [0.08], "u": "V"}], "id": "c2p242"}, {"ch": 2, "k": "p", "topic": "الحث الذاتي", "yrs": "2016 تمهيدي", "q": "ملف معامل حثه (0.1 H) وعدد لفاته (400) لفة ينساب فيه تيار مستمر (2A) احسب مقدار: 1) الفيض المغناطيسي الذي يخترق اللفة الواحدة. 2) الطاقة المختزنة في المجال المغناطيسي للملف. 3) معدل القوة الدافعة الكهربائية المحتثة في الملف اذا انعكس اتجاه التيار خلال (0.2 s).", "a": "<b>المعطيات:</b> L = 0.1 H، N = 400، I = 2 A.<br>\n<b>(1) الفيض في اللفة الواحدة:</b> <span class=\"m\">Φ = L·I/N = 0.2/400</span><br><span class=\"res\">Φ = 5×10⁻⁴ Wb</sp an class=\"m\">|ε| = 0.4 × 12/0.2</span><br><span class=\"res\">|ε| = 24 V</span>", "parts": [{"l": "الفيض للفة الواحدة", "v": [0.006], "u": "Wb"}, {"l": "الطاقة المختزنة", "v": [7.2], "u": "J"}, {"l": "معدل ق.د.ك المحتثة", "v": [24], "u": "V"}], "id": "c2p259"}, {"ch": 2, "k": "p", "topic": "الحث الذاتي", "yrs": "3/2023 أحيائي", "q": "ملف معامل حثه (0.2H) ومقاومة الدائرة (10Ω) طبقت عليه فولطية مستمرة مقدارها (60 V) احسب مقدار المعدل الزمني لتغير التيار في الحالات التالية: 1) لحظة غلق الدائرة. 2) عندما يبلغ التيار مقداره الثابت. 3) لحظة ازدياد التيار الى (80%) من مقداره الثابت.", "a": "<b>المعطيات:</b> L = 0.2 H، R = 10 Ω، V = 60 V، I_const = V/R = 6 A.<br>\n<b>(1) لحظة الغلق:</b> <span class=\"m\">ΔI/Δt = V/L = 60/0.2</span><br><span class=\"res\">ΔI/Δt = 300 A/s</span><br>\n<b>(2) عند بلوغ التيار مقداره الثابت:</b> <span class=\"m\">ΔI/Δt = 0</span><br><span class=\"res\">ΔI/Δt = 0</span><br>\n<b>(3) عند I = 80% من 6 A = 4.8 A:</b> <span class=\"m\">ΔI/Δt = (60 − 4.8 × 10)/0.2 = 12/0.2</span><br><span class=\"res\">ΔI/Δt = 60 A/s</span>", "parts": [{"l": "المعدل لحظة الغلق", "v": [300], "u": "A/s"}, {"l": "المعدل عند بلوغ التيار الثابت", "v": [0], "u": "A/s"}, {"l": "المعدل عند 80% من التيار الثابت", "v": [60], "u": "A/s"}], "id": "c2p260"}, {"ch": 2, "k": "p", "topic": "الحث الذاتي", "yrs": "2024 تمهيدي", "q": "ملف معامل حثه الذاتي (2.5 mH) وعدد لفاته (500) لفة ينساب فيه تيار مستمر (4A) احسب: اولا: مقدار الفيض المغناطيسي الذي يخترق اللفة الواحدة. ثانيا: الطاقة المختزنة في المجال المغناطيسي للملف. ثالثا: معدل القوة الدافعة الكهربائية المحتثة في الملف اذا انعكس اتجاه التيار خلال (0.25s).", "a": "<b>المعطيات:</b> L = 2.5×10⁻³ H، N = 500، I = 4 A.<br>\n<b>(1) الفيض في اللفة الواحدة:</b> <span class=\"m\">Φ = L·I/N = 2.5×10⁻³ × 4/500</span><br><span class=\"res\">Φ = 2×10⁻⁵ Wb</span><br>\n<b>(2) الطاقة المختزنة:</b> <span class=\"m\">PE = ½ × 2.5×10⁻³ × 16 = 0.02 J</span><br><span class=\"res\">PE = 0.02 J</span><br>\n<b>(3) عند انعكاس التيار خلال 0.25 s:</b> ΔI = −8 A<br>\n<span class=\"m\">|ε| = 2.5×10⁻³ × 8/0.25</span><br><span class=\"res\">|ε| = 0.08 V</span>", "parts": [{"l": "الفيض للفة الواحدة", "v": [2e-05], "u": "Wb"}, {"l": "الطاقة المختزنة", "v": [0.02], "u": "J"}, {"l": "معدل ق.د.ك المحتثة", "v": [0.08], "u": "V"}], "id": "c2p261"}, {"ch": 2, "k": "p", "topic": "الحث الذاتي", "yrs": "1/2024 · 1/2024 محاولات", "q": "ملفان متجاوران بينهما ترابط مغناطيسي تام، كان معامل الحث الذاتي للملف الابتدائي (0.4H) ومقاومته (10Ω) ومعامل الحث الذاتي للملف الثانوي (0.1H) والفولطية الموضوعة في دائرة الملف الابتدائي (20V) احسب مقدار: 1) المعدل الزمني لتغير التيار في دائرة الملف الابتدائي لحظة ازدياد التيار فيها الى (80%) من مقداره الثابت. 2) القوة الدافعة الكهربائية المحتثة على طرفي الملف الثانوي في دائرة الملف في تلك اللحظة. 3) المعدل الزمني لتغير التيار في الملف الابتدائي لحظة غلق الدائرة.", "a": "<b>المعطيات:</b> ترابط تام: M = √(L₁L₂) = √(0.4 × 0.1) = √0.04 = 0.2 H، L₁ = 0.4 H، R = 10 Ω، V = 20 V.<br>\n<b>التيار الثابت:</b> I_const = V/R = 2 A<br>\n<b>(1) عند I = 80% من 2 A = 1.6 A:</b> <span class=\"m\">ΔI/Δt = (V − IR)/L₁ = (20 − 16)/0.4 = 10</span><br><span class=\"res\">ΔI/Δt = 10 A/s</span><br>\n<b>(2) القوة الدافعة في الثانوي في تلك اللحظة:</b> <span class=\"m\">ε₂ = M·ΔI/Δt = 0.2 × 10</span><br><span class=\"res\">ε₂ = 2 V</span><br>\n<b>(3) عند لحظة الغلق:</b> <span class=\"m\">ΔI/Δt = V/L₁ = 20/0.4</span><br><span class=\"res\">ΔI/Δt = 50 A/s</span>", "parts": [{"l": "المعدل عند 80% من التيار الثابت", "v": [10], "u": "A/s"}, {"l": "ق.د.ك المحتثة في الثانوي", "v": [2, -2], "u": "V"}, {"l": "المعدل لحظة غلق الدائرة", "v": [50], "u": "A/s"}], "id": "c2p262"}, {"ch": 2, "k": "p", "topic": "الحث الذاتي", "yrs": "1/2025", "q": "ملف معامل حثه الذاتي (2.5 mH) وعدد لفاته (500) لفة ومقاومته (30 Ω) سلطت على طرفيه فولطية مستمرة مقدارها (120 V) احسب: 1) مقدار الفيض المغناطيسي الذي يخترق اللفة الواحدة. 2) الطاقة المختزنة في المجال المغناطيسي للملف. 3) معدل القوة الدافعة الكهربائية المحتثة في الملف اذا انعكس اتجاه التيار خلال (0.1 s).", "a": "<b>المعطيات:</b> L = 2.5×10⁻³ H، N = 500، R = 30 Ω، V = 120 V.<br>\n<b>التيار الثابت:</b> <span class=\"m\">I = V/R = 120/30 = 4 A</span> (نفترض أن الحساب عند الاستقرار)<br>\n<b>(1) الفيض في اللفة الواحدة:</b> <span class=\"m\">Φ = L·I/N = 2.5×10⁻³ × 4/500</span><br><span class=\"res\">Φ = 2×10⁻⁵ Wb</span><br>\n<b>(2) الطاقة المختزنة:</b> <span class=\"m\">PE = ½ × 2.5×10⁻³ × 16</span><br><span class=\"res\">PE = 0.02 J</span><br>\n<b>(3) عند انعكاس التيار خلال 0.1 s:</b> ΔI = −8 A<br>\n<span class=\"m\">|ε| = 2.5×10⁻³ × 8/0.1</span><br><span class=\"res\">|ε| = 0.2 V</span>", "parts": [{"l": "الفيض للفة الواحدة", "v": [2e-05], "u": "Wb"}, {"l": "الطاقة المختزنة", "v": [0.02], "u": "J"}, {"l": "معدل ق.د.ك المحتثة", "v": [0.2], "u": "V"}], "id": "c2p263"}, {"ch": 2, "k": "k", "topic": "الطاقة المختزنة في المحث", "yrs": "1/2016 · 1/2017 أسئلة خارج القطر · 2/2017 · 2/2017 أحيائي · 1/2017 تطبيقي · 2018 تمهيدي · 1/2020 تمهيدي · 1/2020 تطبيقي · 1/2021 · 1/2024 محاولات · 2015 تمهيدي", "q": "اشرح نشاطا يوضح تولد القوة الدافعة الكهربائية المحتثة الذاتية على طرفي الملف؟ (أو) اشرح تجربة توضح ظاهرة الحث الذاتي لمحث. [الشكل: دائرة فيها بطارية ومفتاح وملف على التوالي، ومصباح نيون مربوط على التوازي مع الملف]", "a": "<b>ادوات النشاط:</b> بطارية ذات فولطية (9V) ، مفتاح ، ملف سلكي في جوفه قلب من الحديد المطاوع ، مصباح نيون يحتاج (80 V) ليتوهج.<br><b>خطوات النشاط:</b><br>1) نربط الملف والمفتاح والبطارية على التوالي مع بعض.<br>2) نربط مصباح النيون على التوازي مع الملف كما في الشكل.<br>3) نغلق دائرة الملف والبطارية بوساطة المفتاح ، نلاحظ عدم توهج المصباح.<br>4) نفتح دائرة الملف والبطارية بوساطة المفتاح ، نلاحظ توهج مصباح النيون بضوء ساطع لبرهة قصيرة من الزمن ، على الرغم من فصل البطارية عن الدائرة.<br><b>الاستنتاج:</b><br>1) عدم توهج مصباح النيون لحظة اغلاق المفتاح كان بسبب الفولطية الموضوعة على طرفيه لم تكن كافية لتوهجه ، وذلك لان نمو التيار من الصفر الى مقداره الثابت يكون بطيئا نتيجة لتولد قوة دافعة كهربائية محتثة في الملف تعرقل المسبب لها على وفق قانون لنز.<br>2) توهج مصباح النيون لحظة فتح المفتاح كان بسبب تولد فولطية كبيرة على طرفيه تكفي لتوهجه ، وتفسير ذلك هو نتيجة التلاشي السريع للتيار خلال الملف تتولد على طرفي الملف قوة دافعة كهربائية محتثة ذاتية كبيرة المقدار ، فيعمل الملف في هذه الحالة كمصدر طاقة يجهز المصباح بفولطية تكفي لتوهجه.", "kw": [["ملف", "محث"], ["نيون"], ["غلق", "اغلاق"], ["فتح"], ["توهج"], ["محتثه", "قوه دافعه", "ق.د.ك"]], "id": "c2k264"}, {"ch": 2, "k": "k", "topic": "الطاقة المختزنة في المحث", "yrs": "2013 أسئلة الفصل · 1/2018 أسئلة خارج القطر · 1/2019 · 2/2020 تطبيقي · 2/2022 · 2/2014 أسئلة النازحين · 2017 تمهيدي تطبيقي · 3/2018", "q": "يتوهج مصباح النيون المربوط على التوازي مع الملف بضوء ساطع لبرهة قصيرة من الزمن عندما فتح المفتاح على الرغم من فصل البطارية عن الدائرة ، ولا يتوهج عند اغلاق المفتاح. (علل ذلك)", "a": "توهج مصباح النيون لحظة فتح المفتاح كان بسبب تولد فولطية كبيرة المقدار على طرفيه تكفي لتوهجه وذلك بسبب تولد قوة دافعة كهربائية ذاتية كبيرة المقدار على طرفي الملف نتيجة التلاشي السريع للتيار فيعمل الملف في هذه الحالة كمصدر طاقة يجهز المصباح بفولطية تكفي لتوهجه.<br>عدم توهج مصباح النيون لحظة اغلاق المفتاح كان بسبب الفولطية الموضوعة على طرفيه لم تكن كافية لتوهجه ، وذلك لان نمو التيار من الصفر الى مقداره الثابت يكون بطيئا نتيجة تولد قوة دافعة كهربائية محتثة في الملف تعرقل المسبب لها على وفق قانون لنز.", "kw": [["التلاشي", "تلاشي", "زوال", "انقطاع"], ["قوه دافعه", "محتثه", "ق.د.ك"], ["كبيره"], ["مصدر", "يجهز"], ["اغلاق", "غلق"], ["لنز", "تعرقل", "يعرقل", "بطيء", "بطيئا"]], "id": "c2k265"}, {"ch": 2, "k": "k", "topic": "الحث المتبادل", "yrs": "3/2015 · 3/2019 · 1/2019 تطبيقي · 1/2022 · 1/2025 · 2015 تمهيدي · 3/2024 محاولات · 2/2014", "q": "علل: اذا تغير تيار كهربائي منساب في احد ملفين متجاورين يتولد تيارا محتثا في الملف الاخر؟ (أو) ماذا يحصل اذا تغير تيار كهربائي منساب في احد ملفين متجاورين؟ ولماذا؟", "a": "على وفق ظاهرة الحث المتبادل بين ملفين ، فاذا تغير التيار في الملف الابتدائي لوحدة الزمن يتغير تبعا لذلك الفيض Φ<sub>B2</sub> الذي يخترق الملف الثانوي لوحدة الزمن وعلى وفق قانون فاراداي في الحث الكهرومغناطيسي تتولد قوة دافعة كهربائية محتثة (ε<sub>ind2</sub>) في الملف الثاني ذو عدد لفات N₂.<br><span class=\"m\">ε<sub>ind2</sub> = −N₂ ΔΦ<sub>B2</sub>/Δt</span> ، <span class=\"m\">ε<sub>ind2</sub> = −M ΔI₁/Δt</span><br>M : معامل الحث المتبادل بين الملفين المتجاورين.", "kw": [["الحث المتبادل", "متبادل"], ["تغير التيار", "تغير", "تيار"], ["الفيض"], ["فاراداي"], ["قوه دافعه", "محتثه", "ق.د.ك"]], "id": "c2k266"}, {"ch": 2, "k": "k", "topic": "الحث المتبادل", "yrs": "2/2015 · 2/2019 تطبيقي · 2025 تمهيدي", "q": "علام يعتمد معامل الحث المتبادل بين ملفين يتوافر بينهما ترابط مغناطيسي تام؟ (أو) علام يعتمد معامل الحث المتبادل بين ملفين ملفوفين حول قلب من الحديد المطاوع مغلق؟ (أو) علام يعتمد معامل الحث المتبادل بين ملفين متجاورين بينهما اقتران مغناطيسي تام؟", "a": "يعتمد على ثوابت الملفين (L₁ , L₂) أي (حجم كل ملف والشكل الهندسي لكل ملف وعدد لفات كل ملف والنفوذية المغناطيسية في جوف كل ملف). حسب العلاقة: <span class=\"m\">M = √(L₁L₂)</span> [اذا ذكر الطالب العلاقة الرياضية فقط يعطى درجة كاملة].", "kw": [["ثوابت", "L1", "L2", "الملفين"], ["حجم", "شكل", "هندسي"], ["عدد", "لفات"], ["نفوذيه", "النفوذيه"], ["جذر", "M"]], "id": "c2k267"}, {"ch": 2, "k": "k", "topic": "الحث المتبادل", "yrs": "2/2020 · 2/2022 تمهيدي · 3/2024 محاولات · 3/2020", "q": "علام يعتمد معامل الحث المتبادل (M)؟ (أو) علام يعتمد معامل الحث المتبادل بين ملفين متجاورين؟ (أو) علام يعتمد معامل الحث المتبادل بين ملفين متجاورين اذا كان الملفان في الهواء؟", "a": "a) اذا كان الملفان في الهواء يعتمد معامل الحث المتبادل على:<br>1) ثوابت الملفين (L₁ , L₂) أي (حجم كل ملف والشكل الهندسي لكل ملف وعدد لفات كل ملف والنفوذية المغناطيسية في جوف كل ملف).<br>2) وضعية كل ملف.<br>3) الفاصلة بين الملفين.<br>b) اذا كان الملفان فيهما قلب من الحديد المغلق: فان معامل الحث المتبادل (M) يعتمد على ثوابت الملفين (L₁ , L₂) نتيجة لحصول الاقتران المغناطيسي التام بين الملفين.", "kw": [["ثوابت", "L1", "L2"], ["حجم", "شكل", "هندسي", "عدد"], ["وضعيه", "وضع", "اتجاه"], ["فاصله", "المسافه", "البعد", "الفاصله"], ["حديد", "قلب", "اقتران", "ترابط"]], "id": "c2k268"}, {"ch": 2, "k": "k", "topic": "الحث المتبادل", "yrs": "3/2019 · 2021 تمهيدي تطبيقي · 1/2023 أحيائي · 3/2023 أحيائي · 2/2016 أسئلة خارج القطر · 1/2025", "q": "وضح كيف تستثمر ظاهرة الحث المتبادل في جهاز التحفيز المغناطيسي خلال الدماغ؟ (أو) اين تستثمر ظاهرة الحث المتبادل؟ وضح ذلك. (أو) في أي جهاز تستثمر ظاهرة الحث المتبادل؟ وضح ذلك.", "a": "تستثمر ظاهرة الحث المتبادل في استعمال جهاز التحفيز المغناطيسي خلال الدماغ (TMS) وذلك بتسلط تيار متغير مع الزمن على الملف الابتدائي الذي يمسك على منطقة دماغ المريض فالمجال المغناطيسي المتغير والمتولد بوساطة هذا الملف يخترق دماغ المريض مولدا فيه قوة دافعة كهربائية محتثة وهذه بدورها تولد تيارا محتثا يشوش الدوائر الكهربائية في الدماغ وبهذه الطريقة تعالج بعض اعراض الامراض النفسية مثل الكآبة.", "kw": [["TMS", "التحفيز", "تحفيز"], ["الدماغ", "دماغ"], ["تيار متغير", "متغير", "ملف ابتدائي", "الابتدائي"], ["مجال مغناطيسي", "فيض"], ["محتثه", "قوه دافعه", "تيار محتث"], ["الكابه", "الكآبه", "الامراض النفسيه", "تشوش", "يشوش"]], "id": "c2k269"}, {"ch": 2, "k": "p", "topic": "الحث الذاتي", "yrs": "1/2015 خارج القطر", "q": "ملفان متجاوران بينهما ترابط مغناطيسي تام كان معامل الحث الذاتي للملف الابتدائي (0.1H) ومقاومته (20Ω) ومعامل الحث الذاتي للملف الثانوي (0.9H) طبقت على الملف الابتدائي فولطية مستمرة عند اغلاق دائرة الملف الابتدائي ووصول التيار الى (40%) من مقداره الثابت كانت الفولطية المحتثة في الملف الابتدائي (18V) احسب مقدار: 1) معامل الحث المتبادل بين الملفين. 2) الفولطية الموضوعة في دائرة الملف الابتدائي. 3) المعدل الزمني لتغير التيار في دائرة الملف الابتدائي. 4) القوة الدافعة الكهربائية المحتثة في دائرة الملف الثانوي.", "a": "<b>المعطيات:</b> L₁ = 0.1 H، R = 20 Ω، L₂ = 0.9 H، ترابط تام، عند بلوغ التيار 40% من I_const تكون القوة الدافعة الذاتية في الابتدائي 18 V.<br>\n<b>(1) معامل الحث المتبادل:</b> <span class=\"m\">M = √(L₁·L₂) = √(0.1 × 0.9) = √0.09</span><br><span class=\"res\">M = 0.3 H</span><br>\n<b>(2) الفولطية الموضوعة:</b> <span class=\"m\">V = I·R + L₁·ΔI/Δt = 0.4V + 18</span> ⇒ 0.6V = 18 ⇒ <br><span class=\"res\">V = 30 V</span><br>\n<b>(3) المعدل الزمني لتغير التيار:</b> <span class=\"m\">ΔI/Δt = 18/L₁ = 18/0.1</span><br><span class=\"res\">ΔI/Δt = 180 A/s</span><br>\n<b>(4) القوة الدافعة في الثانوي:</b> <span class=\"m\">ε₂ = M·ΔI/Δt = 0.3 × 180</span><br><span class=\"res\">ε₂ = 54 V</span>", "parts": [{"l": "معامل الحث المتبادل", "v": [0.3], "u": "H"}, {"l": "الفولطية الموضوعة", "v": [30], "u": "V"}, {"l": "المعدل الزمني لتغير التيار", "v": [180], "u": "A/s"}, {"l": "ق.د.ك المحتثة في الثانوي", "v": [54, -54], "u": "V"}], "id": "c2p270"}, {"ch": 2, "k": "p", "topic": "الحث المتبادل", "yrs": "1/2021 احيائي", "q": "ملفان متجاوران ملفوفان حول حلقة مقفلة من الحديد المطاوع، ربط بين طرفي الملف الابتدائي بطارية فرق الجهد بين طرفيها (80V) ومفتاح على التوالي ومقاومته (16 Ω)، فإذا كان معامل الحث الذاتي للملف الابتدائي (0.4H)، احسب مقدار: (1) المعدل الزمني لتغير التيار في دائرة الملف الابتدائي لحظة اغلاق الدائرة. (2) معامل الحث المتبادل بين الملفين اذا تولدت قوة دافعة كهربائية محتثة بين طرفي الملف الثانوي مقدارها (40V) لحظة ازدياد التيار في دائرة الملف الابتدائي الى (60%) من مقداره الثابت. (3) معامل الحث الذاتي للملف الثانوي.", "a": "<b>المعطيات:</b> V = 80 V، R = 16 Ω، L₁ = 0.4 H، عند I = 60% من I_const تكون ε₂ = 40 V.<br>\n<b>التيار الثابت:</b> I_const = V/R = 80/16 = 5 A<br>\n<b>(1) لحظة اغلاق الدائرة:</b> <span class=\"m\">ΔI/Δt = V/L₁ = 80/0.4</span><br><span class=\"res\">ΔI/Δt = 200 A/s</span><br>\n<b>(2) معامل الحث المتبادل:</b> عند I = 0.6 × 5 = 3 A: <span class=\"m\">ΔI/Δt = (80 − 3 × 16)/0.4 = 32/0.4 = 80 A/s</span><br>\n<span class=\"m\">ε₂ = M·ΔI/Δt ⇒ 40 = M × 80 ⇒ M = 0.5 H</span><br><span class=\"res\">M = 0.5 H</span><br>\n<b>(3) معامل الحث الذاتي للثانوي (ترابط تام):</b> <span class=\"m\">M = √(L₁L₂) ⇒ L₂ = M²/L₁ = 0.25/0.4</span><br><span class=\"res\">L₂ = 0.625 H</span>", "parts": [{"l": "المعدل الزمني لتغير التيار لحظة اغلاق الدائرة", "v": [200], "u": "A/s"}, {"l": "معامل الحث المتبادل بين الملفين", "v": [0.5], "u": "H"}, {"l": "معامل الحث الذاتي للملف الثانوي", "v": [0.625], "u": اخ الحثي.<br><b>بطاقة الائتمان:</b> عند تحريك بطاقة الائتمان (بطاقة خزن المعلومات) المغنطة امام ملف سلكي يستحث تيار كهربائي ثم يضخم هذا التيار ويحول إلى نبضات للفولطية تحتوي على المعلومات.", "kw": [["بطاقه الائتمان", "الائتمان"], ["القيثار", "القيثاره"], ["الطباخ الحثي", "الطباخ"], ["تحريك", "تحرك", "مرور"], ["ملف", "سلكي"], ["يستحث", "تيار", "يتولد"], ["نبضات", "فولطيه", "معلومات"]], "id": "c2k274"}, {"ch": 2, "k": "k", "topic": "بطاقة الائتمان", "yrs": "اسئلة الفصل · 1/2017 احيائي · 3/2017 اسئلة الموصل · 1/2018 خارج القطر تطبيقي · 2019 تمهيدي تطبيقي · 2/2024 · 2/2019 · 1/2020 · 2025 تمهيدي", "q": "وضح كيف يتم التعرف على المعلومات المخزونة في بطاقة الائتمان؟ (او) كيف تعمل بطاقة الائتمان وفقاً لظاهرة الحث الكهرومغناطيسي في إظهار المعلومات؟ (او) وضح كيف تستثمر ظاهرة الحث الكهرومغناطيسي في بطاقة الائتمان؟", "a": "عند تحريك بطاقة الائتمان (بطاقة خزن المعلومات) المغنطة امام ملف سلكي يستحث تيار كهربائي ثم يضخم هذا التيار ويحول إلى نبضات للفولطية تحتوي على المعلومات.", "kw": [["تحريك", "تحرك", "مرور", "مسح"], ["البطاقه", "بطاقه", "المغنطه"], ["ملف", "سلكي"], ["يستحث", "تيار", "يتولد"], ["يضخم", "نبضات", "فولطيه", "معلومات"]], "id": "c2k275"}, {"ch": 2, "k": "k", "topic": "الطباخ الحثي", "yrs": "1/2014 · 3/2017 تطبيقي موصل · 2/2018 تطبيقي خارج القطر · 2020 تمهيدي · 2022 تمهيدي تطبيقي · 2/2024 · 2/2024 محاولات تطبيقي", "q": "يغلي الماء داخل الاناء المعدني الموضوع على سطح علوي للطباخ حثي ولا يغلي الماء الذي في داخل اناء زجاجي موضوع مجاور له وعلى السطح العلوي للطباخ الحثي نفسه؟", "a": "يوضع تحت السطح العلوي للطباخ ملف سلكي ينساب فيه تيار متناوب ويحث هذا التيار مجالاً مغناطيسياً متناوباً ينتشر نحو الخارج وبمرور التيار المتناوب خلال قاعدة الاناء المصنوع من المعدن تتولد تيارات دوامة في قاعدة الاناء فيغلي الماء الموضوع فيه. اما اذا كان الوعاء المصنوع من الزجاج فلا تتولد فيه تيارات دوامة (لان الزجاج مادة عازلة فلا تتولد حرارة فيه ولا يسخن الماء الموضوع فيه).<br><b>ملاحظة:</b> اذا اعطى الطالب الإجابة مختصرة موضح الفكرة يعطى درجة كاملة بحسب ما ورد في الأجوبة النموذجية لمركز الفحص.", "kw": [["ملف سلكي", "ملف"], ["تيار متناوب", "متناوب"], ["مجال مغناطيسي", "مجالا مغناطيسيا", "مغناطيسي"], ["تيارات دوامه", "دوامه"], ["قاعده الاناء", "الاناء المعدني", "المعدن"], ["الزجاج", "عازله", "عازل"]], "id": "c2k276"}, {"ch": 2, "k": "k", "topic": "الطباخ الحثي", "yrs": "2016 تمهيدي · 3/2017 تطبيقي", "q": "علل: لا نشعر بسخونة السطح العلوي للطباخ الحثي عند لمسه باليد؟", "a": "لعدم تولد تيارات دوامة على السطح العلوي من الطباخ الحثي.", "kw": [["عدم", "لا تتولد", "لا يتولد"], ["تيارات دوامه", "دوامه"], ["السطح العلوي", "السطح"]], "id": "c2k277"}, {"ch": 2, "k": "k", "topic": "الطباخ الحثي", "yrs": "1/2023 تطبيقي", "q": "وضح كيف تستثمر ظاهرة الحث الكهرومغناطيسي في الطباخ الحثي؟", "a": "تستثمر ظاهرة الحث الكهرومغناطيسي اذ يوضع تحت السطح العلوي ملف سلكي ينساب فيه تيار متناوب ويحث هذا التيار مجالا مغناطيسيا متناوبا ينتشر نحو الخارج وبمرور المجال المغناطيسي خلال قاعدة الاناء اذا كان مصنوعا من المعدن تتولد تيارات دوامة في قاعدة الاناء المعدني. وبذلك تسخن قاعدة الاناء فيغلي الماء الذي يحتويه. اما اذا كان الوعاء من الزجاج فلاتتولد فيه تيارات دوامة في قاعدته (لان الزجاج مادة عازلة ولا يسخن الماء الذي يحتويه).", "kw": [["ملف سلكي", "ملف"], ["تيار متناوب", "متناوب"], ["مجال مغناطيسي", "مجالا مغناطيسيا", "مغناطيسي"], ["تيارات دوامه", "دوامه"], ["قاعده الاناء", "الاناء المعدني", "المعدن"], ["الزجاج", "عازله", "عازل"]], "id": "c2k278"}, {"id": "c2d01", "ch": 2, "k": "k", "topic": "اشتقاق", "yrs": "اشتقاق مقرر", "q": "اشتق علاقة القوة الدافعة الكهربائية الحركية المحتثة على طرفي ساق موصلة طولها L تتحرك بسرعة v عمودياً على فيض مغناطيسي منتظم B.", "a": "عندما تتحرك الساق بسرعة v تتأثر الإلكترونات الحرة فيها بقوة مغناطيسية F = q·v·B تدفعها باتجاه طرف الساق. تتراكم الشحنات السالبة في أحد الطرفين والموجبة في الآخر، فينشأ مجال كهربائي E وفرق جهد بين الطرفين. يتوقف التراكم عندما تتساوى القوة الكهربائية مع المغناطيسية: q·E = q·v·B ⇒ E = v·B. وبما أن فرق الجهد بين طرفي الساق ΔV = E·L، فإن ε = B·L·v.", "kw": [["قوة مغناطيسية", "F = qvB", "F = q·v·B", "qvB", "q·v·B"], ["تساوي القوتين", "qE = qvB", "q·E = q·v·B", "E = vB", "E = v·B"], ["فرق الجهد", "ΔV = E·L", "ΔV = EL", "E·L", "EL"], ["القوة الدافعة", "ε = BLv", "ε = B·L·v", "BLv", "B·L·v"]]}, {"id": "c2d02", "ch": 2, "k": "k", "topic": "اشتقاق", "yrs": "اشتقاق مقرر", "q": "اشتق علاقة الطاقة المختزنة في المحث PE = ½·L·I².", "a": "عندما يتغير التيار في الملف تتولد فيه قوة دافعة ذاتية ε = −L·ΔI/Δt. لكي يبقى التيار متزايداً نبذل شغلاً ضد هذه القوة، وقدرة اللحظة هي P = |ε|·I = L·I·(dI/dt). الشغل الكلي المبذول لرفع التيار من صفر إلى I هو: W = ∫₀ᴵ L·I·dI = ½·L·I². وهذه الطاقة هي المختزنة في المجال المغناطيسي للملف: PE = ½·L·I².", "kw": [["ذاتية", "ΔI/Δt", "ΔI"], ["قدرة", "P = ", "P ="], ["∫"], ["L·I²", "LI²", "L I²", "L·I^2"]]}, {"id": "c2d03", "ch": 2, "k": "k", "topic": "اشتقاق", "yrs": "اشتقاق مقرر", "q": "اشتق علاقة معامل الحث المتبادل بين ملفين متجاورين بترابط مغناطيسي تام M = √(L₁·L₂).", "a": "لتكن I₁ تيار الملف الأول، ولكل ملف فيض: N₁Φ₁ = L₁I₁ و N₂Φ₂ = L₂I₂. عند الترابط التام يخرج كل الفيض المار في الملف الأول ويمر في الثاني، فيكون الفيض المشترك: Φ₁₂ = Φ₂₁ = Φ. ومن تعريف الحث المتبادل N₂Φ = M·I₁ وبالتعويض: M·I₁ = N₂Φ، و L₁I₁ = N₁Φ. بضرب الطرفين: M²·I₁·I₂... وبالحل تكون: M² = L₁·L₂، أي M = √(L₁·L₂).", "kw": [["تعريف الفيض", "L₁I₁ = N₁Φ", "N₁Φ", "L₁·I₁"], ["الحث المتبادل", "N₂Φ = M·I₁", "M·I₁", "MI1"], ["الترابط التام", "Φ₁₂ = Φ₂₁", "ترابط تام", "تام"], ["النتيجة", "M² = L₁L₂", "M = √(L₁L₂)", "√(L1L2)", "L1·L2", "L₁L₂"]]}, {"id": "c2d04", "ch": 2, "k": "k", "topic": "اشتقاق", "yrs": "اشتقاق مقرر", "q": "اشتق علاقة القوة الدافعة الكهربائية المحتثة المتولدة في مولد التيار المتناوب ε = N·B·A·ω·sin(ωt).", "a": "تدور اللفة بسرعة زاوية ω، فإن الزاوية بين متجه المساحة A والمجال B عند الزمن t هي θ = ωt. الفيض الذي يخترق اللفة: Φ = B·A·cos(ωt). حسب قانون فاراداي للملف ذي N لفة: ε = −N·dΦ/dt = −N·B·A·d(cos ωt)/dt = N·B·A·ω·sin(ωt). ومنها القيمة العظمى: ε_max = N·B·A·ω.", "kw": [["الفيض", "Φ = BAcos(ωt)", "BA cos", "BAcos", "cos(ωt)"], ["فاراداي", "ε = −NdΦ/dt", "−N dΦ/dt", "N dΦ/dt", "NdΦ/dt"], ["المشتقة", "d(cos ωt)/dt", "−ω sin", "ω sin"], ["النتيجة", "ε = NBAω sin ωt", "NBAω sin", "NBAωsin", "sin(ωt)"]]}, {"id": "c2d05", "ch": 2, "k": "k", "topic": "اشتقاق", "yrs": "اشتقاق مقرر", "q": "اشتق علاقة القوة المغناطيسية الساحبة للساق الموصلة ومقدار القدرة المتبددة فيها عندما تتحرك بسرعة ثابتة.", "a": "عندما يمر التيار المحتث I = ε/R في الساق يتأثر بقوة مغناطيسية F = B·I·L تعاكس الحركة (قاعدة لنز). ولكي تبقى السرعة ثابتة يجب أن تساوي القوة الخارجية هذه القوة الساحبة: F = B·(BLv/R)·L = B²L²v/R. القدرة المبذولة لتحريك الساق تساوي القدرة المتبددة كحرارة: P = F·v = I²·R = (BLv)²/R.", "kw": [["التيار", "I = ε/R", "I = BLv/R", "BLv/R"], ["القوة الساحبة", "F = BIL", "F = B²L²v/R", "B²L²v/R", "B2L2v/R"], ["القدرة", "P = Fv", "P = I²R", "I²R", "I2R"], ["النتيجة", "(BLv)²/R", "B²L²v²", "P = (BLv)²/R"]]}, {"id": "c2d06", "ch": 2, "k": "k", "topic": "اشتقاق", "yrs": "اشتقاق مقرر", "q": "اشتق علاقة التيار المنساب في دائرة RL أثناء الغلق I = (V/R)(1 − e^(−Rt/L)) من قانون كيرشوف للفولتية.", "a": "تطبيق قانون كيرشوف على الدائرة: V = I·R + L·dI/dt. نعيد ترتيب المعادلة: dI/dt = (V − I·R)/L. نفصل المتغيرات ونكامل من t = 0 (حيث I = 0) إلى t: ln((V − IR)/V) = −Rt/L. بأخذ الأُس: V − IR = V·e^(−Rt/L)، ومنها I = (V/R)(1 − e^(−Rt/L)). وعند t → ∞ يصل التيار إلى تيار الاستقرار V/R.", "kw": [["قانون كيرشوف", "V = IR + LdI/dt", "IR + L", "LdI/dt", "L dI/dt"], ["الفصل", "dI/(V−IR)", "(V − IR)", "V−IR"], ["الحل", "I = (V/R)(1 − e^(−Rt/L))", "1 − e^(−Rt/L)", "e^(−Rt/L)"], ["تيار الاستقرار", "V/R", "V/R"]]}, {"id": "c2d07", "ch": 2, "k": "k", "topic": "اشتقاق", "yrs": "اشتقاق مقرر", "q": "اشتق علاقة القوة الدافعة الكهربائية المحتثة في ملف ذي N لفة عند تغير الفيض المغناطيسي الذي يخترقه ε = −N·ΔΦ/Δt، وبيّن إشارة السالب.", "a": "بحسب قانون فاراداي تتناسب القوة الدافعة المحتثة طردياً مع المعدل الزمني لتغير الفيض الذي يخترق كل لفة، وبما أن الملف يتكون من N لفة متماثلة متصلة على التوالي تكون ε = −N·ΔΦ/Δt. والإشارة السالبة تمثل قانون لنز: القوة الدافعة المحتثة تولد تياراً يعاكس التغير الذي أحدثه في الفيض.", "kw": [["فاراداي", "ε = −NΔΦ/Δt", "NΔΦ/Δt", "NdΦ/dt", "N ΔΦ/Δt"], ["المعدل الزمني", "ΔΦ/Δt", "المعدل الزمني"], ["لنز", "لنز", "يعاكس"]]}, {"id": "c2d08", "ch": 2, "k": "k", "topic": "اشتقاق", "yrs": "اشتقاق مقرر", "q": "اشتق علاقة القدرة الكهربائية المزوّدة للحمل في مولد ε_max و I_max.", "a": "القدرة اللحظية للحمل P = ε·I، والقدرة العظمى تحدث عند أعظم قيمة للقوة الدافعة والتيار: P_max = ε_max·I_max، وهي القدرة المجهزة كما تستعمل في حل مسائل المولد.", "kw": [["القدرة اللحظية", "P = εI", "εI", "ε·I"], ["القدرة العظمى", "P_max = ε_max·I_max", "ε_max·I_max", "ε_max I_max", "εmax·Imax"]]}, {"k": "k", "ch": 2, "topic": "التيارات الدوامية", "yrs": "وزاري", "q": "وضح بنشاط كيفية تقليل التيارات الدوامية في الموصلات؟ وماذا تستنتج من هذا النشاط؟", "a": "أدوات النشاط: بندولان متماثلان، كل منهما يتألف من صفيحة موصلة مصنوعة بشكل ضيفة التمغنط (ليست فيرومغناطيسية من الألمنيوم مثلاً)، مثبتة بطرف ساق خفيفة، إحدى الصفيحتين مقطعة بشكل شرائح معزولة عن بعضها مثل أسنان المشط، والأخرى كاملة (غير مقطعة)، وحامل، ومغناطيس دائمي قوي (كثافة فيض عالية). خطوات النشاط: 1) نزيح الصفيحتين بازاحة متساوية إلى أحد جانبي موقع استقرارهما. 2) نترك كل منهما ليتذبذب بين قطبي المغناطيس بحرية. 3) نلاحظ أن البندول الذي يتألف من الصفيحة الكاملة (غير المقطعة) تتوقف عن الحركة في أثناء مروره خلال الفجوة بين القطبين المغناطيسيين، في حين الصفيحة المقطعة تمر بين القطبين وتستمر بالاهتزاز على جانبي منطقة المجال المغناطيسي ذهاباً وإياباً ولكن بتباطؤ قليل. الاستنتاج: تتولد تيارات دوامة في الصفيحة الكاملة كبيرة المقدار أثناء دخولها في المجال، فتكون محصلة تيار معين، وبالنتيجة تتلاشى سعة اهتزاز الصفيحة وتتوقف عن الاهتزاز. أما التيارات الدوامية المتولدة في الصفيحة المقطعة فتكون صغيرة المقدار فيكون تأثيرها في اهتزاز الصفيحة ضعيفاً جداً.", "kw": [["بندول", "بندولان"], ["مقطع", "مقطعة", "الشرائح"], ["الكاملة", "كاملة", "غير مقطعة"], ["تتوقف", "تتلاشى"], ["صغير", "صغيرة", "ضعيف", "ضعيفاً"]], "id": "c2a001"}, {"k": "k", "ch": 2, "topic": "التيارات الدوامية", "yrs": "وزاري", "q": "ما مصادر التيارات الدوامية؟ وما الخسائر التي تسببها؟ وكيف يمكن تقليلها؟", "a": "مصادرها: التيارات الدوامية تتولد في الأجهزة الكهربائية والمحولات وقلب الحديد. تسبب فقدان الطاقة على شكل حرارة (وفق قانون جول)، فتسخن قلب الأجهزة. يمكن تقليل خسائرها بتقطيع القلب الحديدي إلى صفائح معزولة عن بعضها، لأن ذلك يحدد مسار التيار الدوامي ويقلل مقداره.", "kw": [["حرارة"], ["جول"], ["صفائح", "تقطيع", "مقطع", "معزولة"], ["المحولات", "الأجهزة"]], "id": "c2a002"}, {"k": "k", "ch": 2, "topic": "التيارات الدوامية", "yrs": "وزاري", "q": "ما الذي تستنتجه من وضع الصفيحة المقطعة بدلاً من الكاملة في المجال المغناطيسي؟", "a": "تكون التيارات الدوامية فيها صغيرة المقدار، لذلك تقل الحرارة المتولدة وتقل قوة الإعاقة، فتستمر الصفيحة بالاهتزاز لمدة أطول.", "kw": [["صغيرة", "صغير"], ["الحرارة"], ["الإعاقة", "الاعاقة"], ["تستمر", "تستمر بالاهتزاز"]], "id": "c2a003"}, {"k": "k", "ch": 2, "topic": "المولدات الكهربائية", "yrs": "وزاري", "q": "اختر الإجابة الصحيحة: عند دوران حلقة موصلة حول محور شاقولي موازٍ لوجهها ومحور عمودي على فيض مغناطيسي أفقي منتظم، فإن القوة الدافعة الكهربائية المحتثة تكون دالة جيبية تتغير مع الزمن وتنعكس مرتين خلال كل:", "opts": ["ربع دورة", "نصف دورة", "دورة واحدة", "دورتين"], "c": 2, "a": "القوة الدافعة الجيبية تنعكس مرتين خلال الدورة الواحدة، لذلك الجواب: دورة واحدة.", "id": "c2a004"}, {"k": "k", "ch": 2, "topic": "المولدات الكهربائية", "yrs": "وزاري", "q": "مم يتألف مولد التيار المتناوب ذو الأطوار الثلاثة؟ وما الفائدة العملية منه؟ وضح ذلك بالرسم.", "a": "1) يتألف من ثلاث ملفات حول النواة تربط ربطاً نجمياً. 2) تفصل بين الملفات زوايا متساوية، قياس كل منها 120°. 3) تربط أحد أطراف الملفات الثلاثة مع سلك يسمى بالسلك المتعادل (الخط الصفري). 4) ينقل التيار الخارج من هذا المولد بثلاثة خطوط. الفائدة العملية: يجهز تياراً متناوباً ذا مقدار أكبر من التيار الذي يجهزه مولد التيار المتناوب أحادي الطور.", "kw": [["ثلاث", "ثلاثة"], ["120"], ["المتعادل", "الصفري"], ["أكبر", "اكبر"], ["أحادي"]], "id": "c2a005"}, {"k": "k", "ch": 2, "topic": "المولدات الكهربائية", "yrs": "وزاري", "q": "علام يعتمد المقدار الأعظم للقوة الدافعة الكهربائية المحتثة (ε_max)؟", "opts": ["عدد لفات الملف", "كثافة الفيض المغناطيسي", "مساحة المقطع العرضي", "التردد الزاوي", "كل ما سبق"], "c": 4, "a": "ε_max = N·B·A·ω، لذلك يعتمد على عدد اللفات وكثافة الفيض ومساحة المقطع والتردد الزاوي معاً.", "id": "c2a006"}, {"k": "k", "topic": "التيار المتناوب", "yrs": "وزاري", "q": "علل يفضل استعمال التيار المتناوب في الدوائر الكهربائية؟", "a": "لسهولة نقله إلى مسافات بعيدة بأقل خسائر بالطاقة، ولإمكانية تطبيق قانون فاراداي في الحث الكهرومغناطيسي، ولهذا تُستعمل المحولة الكهربائية في رفع أو خفض الفولتية المتناوبة.", "kw": [["نقله", "لسهولة نقله", "بأقل خسائر", "خسائر"], ["فاراداي", "الحث"], ["المحولة", "محولة", "رفع", "خفض"]], "ch": 3, "id": "c3k001"}, {"k": "k", "topic": "التيار المتناوب", "yrs": "وزاري", "q": "ما الغرض من إرسال القدرة الكهربائية بفولطية عالية وتيار واطئ باستعمال المحولات الرافعة؟", "a": "لغرض تقليل خسائر القدرة الضائعة في الأسلاك الناقلة والتي تظهر بشكل حرارة (I²R).", "kw": [["تقليل", "تقليل خسائر"], ["الأسلاك", "الاسلاك", "الأسلاك الناقلة"], ["I²R", "I2R", "حرارة"]], "ch": 3, "id": "c3k002"}, {"k": "k", "topic": "التيار المتناوب", "yrs": "وزاري", "q": "منحنى القدرة الآنية في دائرة التيار المتناوب التي تحتوي مقاومة صرف يكون موجباً دائماً، لماذا؟", "a": "لأن الفولطية والتيار يكونان موجبين في النصف الأول من الدورة فيكون حاصل ضربهما موجباً، وسالبين في النصف الثاني فيكون حاصل ضربهما موجباً أيضاً، لأنهما يتغيران بالطور نفسه.", "kw": [["موجب", "موجبين", "موجبة"], ["حاصل ضربهما", "حاصل ضرب"], ["سالبين", "النصف الثاني"]], "ch": 3, "id": "c3k003"}, {"k": "k", "topic": "التيار المتناوب", "yrs": "وزاري", "q": "ما الذي تعنيه القدرة الموجبة دائماً في دائرة التيار المتناوب التي تحتوي مقاومة صرف؟", "opts": ["أن القدرة تُستهلك كلها بشكل حرارة في المقاومة", "أن القدرة تُخزن في المقاومة", "أن القدرة تتحول إلى حث ذاتي", "أن القدرة تساوي صفراً"], "c": 0, "a": "تعني أن القدرة تُستهلك كلها بشكل حرارة في المقاومة.", "ch": 3, "id": "c3k004"}, {"k": "k", "topic": "التيار المتناوب", "yrs": "وزاري", "q": "ما مميزات منحنى القدرة في دائرة التيار المتناوب عندما تحتوي م
