 رادة الحث X_L", "رادة الحث X_L تساوي رادة السعة X_C", "رادة السعة X_C أصغر من المقاومة"], "c": 1, "a": "في الربط المتوازي: I_L = V/X_L و I_C = V/X_C. الدائرة حثية عندما يكون تيار المحث أكبر من تيار المتسعة (I_L > I_C)، وهذا يتحقق عندما تكون X_C > X_L.", "ch": 3, "id": "c3k078"}, {"k": "k", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "هل يمكن أن يكون التيار خلال المقاومة والتيار خلال المتسعة بالطور نفسه (Φ = 0) في دائرة R-L-C متوازية الربط؟ ولماذا؟", "a": "كلا، لا يمكن، لأن متجه طور التيار في المتسعة يتقدم متجه الفولطية في الدائرة بزاوية (Φ = π/2) أو 90°، بينما تيار المقاومة بطور الفولطية نفسه.", "kw": [["كلا", "لا يمكن", "لا"], ["π/2", "90"], ["المتسعة", "متسعة"], ["يتقدم", "متقدم"]], "ch": 3, "id": "c3k079"}, {"k": "p", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوازية الربط تحتوي مقاومة صرف ومتسعة ذات سعة صرف (500/π μF) ومحثاً صرفاً ومصدراً للفولطية المتناوبة (100V) بتردد (50Hz)، كانت القدرة الحقيقية المستهلكة فيها (400W) وللدائرة خواص سعوية وعامل القدرة (0.8). احسب: ① تيار فرع المقاومة وتيار فرع المتسعة. ② التيار الكلي. ③ تيار فرع المحث. ④ زاوية فرق الطور بين التيار الكلي والفولطية مع رسم مخطط المتجهات.", "a": "<b>الحل التفصيلي:</b><br><b>1) فرع المقاومة:</b> P = I_R·V ⇒ 400 = I_R × 100 ⇒ I_R = 4 A<br>X_C = 1/(2πfC) = 1/(2π × 50 × (500/π) × 10⁻⁶) = 1/0.05 = 20 Ω<br>I_C = V/X_C = 100/20 = 5 A<br><span class=\"res\">I_R = 4 A</span> <span class=\"res\">I_C = 5 A</span><br><b>2) التيار الكلي:</b> pf = I_R/I_T ⇒ 0.8 = 4/I_T ⇒ I_T = 5 A<br><span class=\"res\">I_T = 5 A</span><br><b>3) تيار المحث:</b> I_T² = I_R² + (I_C − I_L)² ⇒ 25 = 16 + (5 − I_L)² ⇒ (5 − I_L)² = 9 ⇒ I_L = 2 A<br><span class=\"res\">I_L = 2 A</span><br><b>4) زاوية الطور:</b> tanΦ = (I_C − I_L)/I_R = 3/4 ⇒ Φ = 37°. المخطط: ضلع أفقي I_R = 4، ضلع عمودي (I_C − I_L) = 3، والوتر I_T = 5. الدائرة سعوية لأن I_C > I_L.<br><span class=\"res\">Φ = 37°)</span>", "ch": 3, "id": "c3p049"}, {"k": "p", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "مقاومة (60Ω) ربطت على التوازي مع متسعة ذات سعة خالصة، وربطت المجموعة بين قطبي مصدر للفولطية المتناوبة بتردد (100Hz)، فأصبحت الممانعة الكلية للدائرة (48Ω)، وكانت القدرة الحقيقية المستهلكة فيها (960W). احسب: ① فولطية المصدر. ② تيار المقاومة وتيار المتسعة والتيار الكلي. ③ سعة المتسعة. ④ عامل القدرة والقدرة الظاهرية. ⑤ ارسم مخطط المتجهات.", "a": "<b>الحل التفصيلي:</b><br><b>1) فولطية المصدر:</b> P = I_R²·R ⇒ 960 = I_R² × 60 ⇒ I_R = 4 A ⇒ V = I_R·R = 4 × 60 = 240 V<br><span class=\"res\">V = 240 V</span><br><b>2) التيارات:</b> I_T = V/Z = 240/48 = 5 A<br>I_C² = I_T² − I_R² = 25 − 16 = 9 ⇒ I_C = 3 A<br><span class=\"res\">I_R = 4 A</span> <span class=\"res\">I_T = 5 A</span> <span class=\"res\">I_C = 3 A</span><br><b>3) سعة المتسعة:</b> X_C = V/I_C = 240/3 = 80 Ω ⇒ C = 1/(2πf·X_C) = 1/(2π × 100 × 80) ≈ 19.9 × 10⁻⁶ F<br><span class=\"res\">C ≈ 19.9 μF</span><br><b>4) عامل القدرة والقدرة الظاهرية:</b> pf = I_R/I_T = 4/5 = 0.8، و P_app = P_real/pf = 960/0.8 = 1200 VA<br><span class=\"res\">pf = 0.8</span> <span class=\"res\">P_app = 1200 VA</span><br><b>5) المخطط:</b> ضلع أفقي I_R = 4، ضلع عمودي I_C = 3، والوتر I_T = 5. خواص الدائرة سعوية.", "ch": 3, "id": "c3p050"}, {"k": "p", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوازية الربط تحتوي مقاومة صرف ومحث صرف معامل حثه (1/(2π)) H ومتسعة ذات سعة صرف رادتها (20Ω)، ربطت المجموعة بين قطبي مصدر للفولطية المتناوبة بتردد (50Hz) وكانت القدرة الحقيقية فيها (400W) والفولطية (100V). احسب: ① التيار في فرع المقاومة وفي فرع المتسعة وفي فرع المحث. ② التيار الكلي. ③ زاوية الطور وعامل القدرة. ④ الممانعة الكلية.", "a": "<b>الحل التفصيلي:</b><br><b>1) فرع المقاومة:</b> I_R = P/V = 400/100 = 4 A<br><b>فرع المتسعة:</b> I_C = V/X_C = 100/20 = 5 A<br><b>فرع المحث:</b> X_L = 2πfL = 2π × 50 × 1/(2π) = 50 Ω ⇒ I_L = 100/50 = 2 A<br><span class=\"res\">I_R = 4 A</span> <span class=\"res\">I_C = 5 A</span> <span class=\"res\">I_L = 2 A</span><br><b>2) التيار الكلي:</b> I_T = √(I_R² + (I_C − I_L)²) = √(16 + 9) = 5 A<br><span class=\"res\">I_T = 5 A</span><br><b>3) الزاوية وعامل القدرة:</b> tanΦ = (I_C − I_L)/I_R = 3/4 ⇒ Φ = 37°، و pf = cos Φ = I_R/I_T = 0.8<br><span class=\"res\">pf = 0.8</span><br><b>4) الممانعة الكلية:</b> Z = V/I_T = 100/5 = 20 Ω<br><span class=\"res\">Z = 20 Ω)</span>", "ch": 3, "id": "c3p051"}, {"k": "p", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوازية الربط تحتوي مقاومة صرف (R = 120Ω) ومحثاً صرفاً رادته (40Ω) ومتسعة ذات سعة صرف رادتها (32Ω)، القدرة الحقيقية المستهلكة فيها (1920W). احسب: ① فولطية المصدر. ② تيار المحث وتيار المتسعة. ③ الممانعة الكلية. ④ التيار الكلي وتيار المقاومة. ⑤ ارسم مخطط المتجهات.", "a": "<b>الحل التفصيلي:</b><br><b>1) فولطية المصدر:</b> P = V²/R ⇒ V² = P·R = 1920 × 120 = 230400 ⇒ V = 480 V<br><span class=\"res\">V = 480 V</span><br><b>2) تيار المحث والمتسعة:</b> I_L = V/X_L = 480/40 = 12 A، I_C = V/X_C = 480/32 = 15 A<br><span class=\"res\">I_L = 12 A</span> <span class=\"res\">I_C = 15 A</span><br><b>3) تيار المقاومة والتيار الكلي:</b> I_R = V/R = 480/120 = 4 A<br>I_T² = I_R² + (I_C − I_L)² = 16 + 9 = 25 ⇒ I_T = 5 A<br><span class=\"res\">I_R = 4 A</span> <span class=\"res\">I_T = 5 A</span><br><b>4) الممانعة الكلية:</b> Z = V/I_T = 480/5 = 96 Ω<br><span class=\"res\">Z = 96 Ω</span><br><b>5) المخطط:</b> ضلع أفقي I_R = 4، ضلع عمودي (I_C − I_L) = 3 باتجاه المتسعة، والوتر I_T = 5. الدائرة سعوية لأن I_C > I_L.", "ch": 3, "id": "c3p052"}, {"k": "p", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوازية الربط تحتوي مقاومة صرف (40Ω) ومتسعة ذات سعة صرف رادتها (20Ω) ومحثاً صرفاً رادته (12Ω)، ربطت المجموعة على التوازي بين قطبي مصدر للفولطية المتناوبة (120V). احسب: ① التيار المنساب في كل فرع. ② التيار الرئيس. ③ خصائص الدائرة. ④ القدرة الحقيقية والقدرة الظاهرية.", "a": "<b>الحل التفصيلي:</b><br><b>1) التيارات في الفروع:</b> I_R = V/R = 120/40 = 3 A<br>I_C = V/X_C = 120/20 = 6 A<br>I_L = V/X_L = 120/12 = 10 A<br><span class=\"res\">I_R = 3 A</span> <span class=\"res\">I_C = 6 A</span> <span class=\"res\">I_L = 10 A</span><br><b>2) التيار الرئيس:</b> I_T² = I_R² + (I_C − I_L)² = 9 + 16 = 25 ⇒ I_T = 5 A<br><span class=\"res\">I_T = 5 A</span><br><b>3) الخصائص:</b> I_L > I_C ⇒ الدائرة حثية (خواص حثية).<br><b>4) القدرتان:</b> P_real = I_R·V = 3 × 120 = 360 W<br>P_app = I_T·V = 5 × 120 = 600 VA<br><span class=\"res\">P_real = 360 W</span> <span class=\"res\">P_app = 600 VA</span>", "ch": 3, "id": "c3p053"}, {"k": "p", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوازية الربط تحتوي مقاومة صرف ومتسعة ذات سعة (7/22 mF) ومحثاً صرفاً، ومصدراً (60V) بتردد (50Hz)، كانت القدرة الحقيقية (180W) وعامل القدرة (0.6) وللدائرة خواص سعوية. احسب: ① التيار في فرع المقاومة والتيار الكلي وتيار المتسعة. ② زاوية فرق الطور بين التيار الكلي والفولطية مع رسم مخطط المتجهات.", "a": "<b>الحل التفصيلي:</b><br><b>1) فرع المقاومة:</b> P = I_R·V ⇒ 180 = I_R × 60 ⇒ I_R = 3 A<br>X_C = 1/(2πfC) = 1/(2π × 50 × (7/22) × 10⁻³) = 10 Ω ⇒ I_C = 60/10 = 6 A<br>pf = I_R/I_T ⇒ 0.6 = 3/I_T ⇒ I_T = 5 A<br><span class=\"res\">I_R = 3 A</span> <span class=\"res\">I_C = 6 A</span> <span class=\"res\">I_T = 5 A</span><br><b>2) الزاوية:</b> I_T² = I_R² + (I_C − I_L)² ⇒ 25 = 9 + (6 − I_L)² ⇒ I_L = 2 A، و tanΦ = (I_C − I_L)/I_R = 4/3 ⇒ Φ = 53°<br><span class=\"res\">Φ = 53°)</span>", "ch": 3, "id": "c3p054"}, {"k": "p", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "مقاومة (40Ω) ربطت على التوازي مع متسعة ذات سعة خالصة، وربطت هذه المجموعة عبر قطبي مصدر للفولطية المتناوبة بتردد (100Hz)، فأصبحت الممانعة الكلية للدائرة (32Ω) والتيار المار في المقاومة (4A). جد: ① فولطية المصدر. ② التيار الرئيس في الدائرة. ③ تيار المتسعة. ④ ارسم مخطط المتجهات الطورية للتيارات.", "a": "<b>الحل التفصيلي:</b><br><b>1) الفولطية:</b> V = I_R·R = 4 × 40 = 160 V<br><span class=\"res\">V = 160 V</span><br><b>2) التيار الرئيس:</b> I_T = V/Z = 160/32 = 5 A<br><span class=\"res\">I_T = 5 A</span><br><b>3) تيار المتسعة:</b> I_T² = I_R² + I_C² ⇒ 25 = 16 + I_C² ⇒ I_C = 3 A<br><span class=\"res\">I_C = 3 A</span><br><b>4) المخطط:</b> ضلع أفقي I_R = 4 وضلع عمودي I_C = 3 والوتر I_T = 5 (زاوية Φ ≈ 37°).", "ch": 3, "id": "c3p055"}, {"k": "p", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوازية الربط تحتوي مقاومة صرف ومتسعة ذات سعة صرف ومحثاً صرفاً، ربطت المجموعة بين قطبي مصدر للفولطية المتناوبة (240V)، وكان مقدار التيار المنساب في كل من فرع المتسعة (8A) وفرع المقاومة (3A) وفرع المحث (12A). جد: ① التيار الرئيس في الدائرة. ② الممانعة الكلية. ③ زاوية فرق الطور بين التيار الرئيس والفولطية. ④ خصائص الدائرة.", "a": "<b>الحل التفصيلي:</b><br><b>1) التيار الرئيس:</b> I_T² = I_R² + (I_C − I_L)² = 9 + (8 − 12)² = 9 + 16 = 25 ⇒ I_T = 5 A<br><span class=\"res\">I_T = 5 A</span><br><b>2) الممانعة الكلية:</b> Z = V/I_T = 240/5 = 48 Ω<br><span class=\"res\">Z = 48 Ω</span><br><b>3) زاوية الطور:</b> tanθ = (I_C − I_L)/I_R = (8 − 12)/3 = −4/3 ⇒ θ = −53°<br><b>4) الخصائص:</b> I_L > I_C ⇒ الدائرة حثية.", "ch": 3, "id": "c3p056"}, {"k": "p", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوازية الربط تحتوي مقاومة صرف مقدارها (50Ω) ومحثاً صرفاً معامل حثه الذاتي (1/(5π)) H ومتسعة ذات سعة صرف، ومصدراً للفولطية المتناوبة بتردد (100Hz). كانت القدرة الحقيقية المستهلكة في الدائرة (3200W) وعامل القدرة (0.8) وللدائرة خواص سعوية. احسب: ① فولطية المصدر. ② التيار الرئيس وتيار فرع المحث وتيار فرع المتسعة. ③ زاوية فرق الطور بين التيار الرئيس والفولطية مع رسم مخطط المتجهات.", "a": "<b>الحل التفصيلي:</b><br><b>1) الفولطية:</b> P = I_R²·R ⇒ 3200 = I_R² × 50 ⇒ I_R = 8 A ⇒ V = P/I_R = 3200/8 = 400 V<br><span class=\"res\">V = 400 V</span><br><b>2) التيارات:</b> P = I_T·V·pf ⇒ 3200 = I_T × 400 × 0.8 ⇒ I_T = 10 A<br>X_L = 2πfL = 2π × 100 × 1/(5π) = 40 Ω ⇒ I_L = 400/40 = 10 A<br>I_T² = I_R² + (I_C − I_L)² ⇒ 100 = 64 + (I_C − 10)² ⇒ I_C − 10 = 6 ⇒ I_C = 16 A<br><span class=\"res\">I_T = 10 A</span> <span class=\"res\">I_L = 10 A</span> <span class=\"res\">I_C = 16 A</span><br><b>3) الزاوية:</b> tanθ = (I_C − I_L)/I_R = 6/8 = 3/4 ⇒ θ = 37° (والدائرة سعوية لأن I_C > I_L).<br><span class=\"res\">θ = 37°)</span>", "ch": 3, "id": "c3p057"}, {"k": "p", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوازية الربط تحتوي مقاومة صرف (40Ω) ومتسعة ذات سعة صرف (رادتها 10Ω) ومحثاً صرفاً (رادته 15Ω)، ربطت المجموعة بين قطبي مصدر للفولطية المتناوبة (120V). احسب: ① التيار المنساب في كل فرع من فروع الدائرة. ② التيار الرئيس. ③ الممانعة الكلية.", "a": "<b>الحل التفصيلي:</b><br><b>1) تيارات الفروع:</b> V_T = V_R = V_L = V_C = 120 V<br>I_R = V/R = 120/40 = 3 A<br>I_C = V/X_C = 120/10 = 12 A<br>I_L = V/X_L = 120/15 = 8 A<br><span class=\"res\">I_R = 3 A</span> <span class=\"res\">I_C = 12 A</span> <span class=\"res\">I_L = 8 A</span><br><b>2) التيار الرئيس:</b> I_T = √(I_R² + (I_C − I_L)²) = √(9 + 16) = 5 A<br><span class=\"res\">I_T = 5 A</span><br><b>3) الممانعة الكلية:</b> Z = V/I_T = 120/5 = 24 Ω<br><span class=\"res\">Z = 24 Ω</span>", "ch": 3, "id": "c3p058"}, {"k": "p", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوازية الربط تحتوي مقاومة صرف (R) ومتسعة ذات سعة صرف (X_C = 60Ω) ومحثاً صرفاً، ومصدراً للفولطية المتناوبة بتردد (50Hz). كانت القدرة الظاهرية المجهزة للدائرة (2400VA) والتيار الكلي (10A) وعامل القدرة (0.6). احسب: ① فولطية المصدر. ② التيار في فرع المقاومة. ③ التيار في فرع المتسعة. ④ التيار في فرع المحث وخواص الدائرة.", "a": "<b>الحل التفصيلي:</b><br><b>1) الفولطية:</b> P_app = I_T·V_T ⇒ V_T = 2400/10 = 240 V<br><span class=\"res\">V = 240 V</span><br><b>2) تيار المقاومة:</b> pf = I_R/I_T ⇒ I_R = 0.6 × 10 = 6 A<br><span class=\"res\">I_R = 6 A</span><br><b>3) تيار المتسعة:</b> I_C = V/X_C = 240/60 = 4 A<br><span class=\"res\">I_C = 4 A</span><br><b>4) تيار المحث:</b> I_T² = I_R² + (I_C − I_L)² ⇒ 100 = 36 + (4 − I_L)² ⇒ (4 − I_L)² = 64 ⇒ I_L = 12 A (لأن I_L > I_C)<br><span class=\"res\">I_L = 12 A</span><br><b>الخصائص:</b> I_L > I_C ⇒ الدائرة حثية. وتيار الدائرة الكلي Z = V/I_T = 24 Ω.", "ch": 3, "id": "c3p059"}, {"k": "p", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "مقاومة (30Ω) ربطت على التوازي مع متسعة ذات سعة صرف (250/π μF)، وربطت هذه المجموعة عبر قطبي مصدر للفولطية المتناوبة فأصبح تيار فرع المتسعة (3A) والتيار الكلي (5A). احسب: ① فولطية المصدر وتردده. ② زاوية فرق الطور بين الفولطية الكلية والتيار الكلي مع رسم المخطط. ③ ممانعة الدائرة وعامل القدرة.", "a": "<b>الحل التفصيلي:</b><br><b>1) تيار المقاومة:</b> I_T² = I_R² + I_C² ⇒ 25 = I_R² + 9 ⇒ I_R = 4 A<br>V = V_R = I_R·R = 4 × 30 = 120 V<br>X_C = V/I_C = 120/3 = 40 Ω<br>f = 1/(2π · C · X_C) = 1/(2π × (250/π) × 10⁻⁶ × 40) = 50 Hz<br><span class=\"res\">V = 120 V</span> <span class=\"res\">f = 50 Hz</span><br><b>2) الزاوية:</b> tanθ = I_C/I_R = 3/4 ⇒ θ = 37°<br><b>3) الممانعة وعامل القدرة:</b> Z = V/I_T = 120/5 = 24 Ω، و pf = I_R/I_T = 4/5 = 0.8<br><span class=\"res\">Z = 24 Ω</span> <span class=\"res\">pf = 0.8</span>", "ch": 3, "id": "c3p060"}, {"k": "p", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوازية الربط تحتوي مقاومة صرف ومتسعة ذات سعة صرف ومحثاً صرفاً جميعها مربوطة على التوازي، وضعت عليها فولطية متناوبة (100V) بتردد (50Hz)، فأصبح التيار الكلي (5A) وتيار فرع المحث (2A) وعامل القدرة (0.8) وللدائرة خواص سعوية. احسب: ① مقاومة الدائرة. ② القدرة المستهلكة. ③ سعة المتسعة. ④ معامل الحث الذاتي للمحث.", "a": "<b>الحل التفصيلي:</b><br><b>1) المقاومة:</b> pf = I_R/I_T ⇒ 0.8 = I_R/5 ⇒ I_R = 4 A ⇒ R = V/I_R = 100/4 = 25 Ω<br><span class=\"res\">R = 25 Ω</span><br><b>2) القدرة المستهلكة:</b> P = I_R²·R = 16 × 25 = 400 W<br><span class=\"res\">P = 400 W</span><br><b>3) السعة:</b> I_T² = I_R² + (I_C − I_L)² ⇒ 25 = 16 + (I_C − 2)² ⇒ I_C − 2 = 3 ⇒ I_C = 5 A (خواص سعوية)<br>X_C = V/I_C = 100/5 = 20 Ω ⇒ C = 1/(2πf·X_C) = 1/(2π × 50 × 20) = 0.5 × 10⁻³/π F ≈ 159 μF<br><span class=\"res\">C ≈ 159 μF</span><br><b>4) الحث:</b> X_L = V/I_L = 100/2 = 50 Ω ⇒ L = X_L/(2πf) = 50/(100π) = 1/(2π) H = 0.5/π H ≈ 0.159 H<br><span class=\"res\">L ≈ 0.159 H</span>", "ch": 3, "id": "c3p061"}, {"k": "p", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوازية الربط تحتوي مقاومة صرف ومتسعة ذات سعة صرف ومحث صرف، ربطت المجموعة بين قطبي مصدر للفولطية المتناوبة (240V)، وكان التيار الرئيس في الدائرة (5A) والتيار المار في المحث (12A)، وللدائرة خصائص حثية وعامل القدرة (0.6). جد: ① التيار المار في فرع المتسعة وفي فرع المقاومة. ② الممانعة الكلية. ③ زاوية فرق الطور بين التيار الرئيس والفولطية. ④ القدرة الحقيقية والقدرة الظاهرية.", "a": "<b>الحل التفصيلي:</b><br><b>1) تيار المقاومة:</b> pf = I_R/I_T ⇒ 0.6 = I_R/5 ⇒ I_R = 3 A<br>I_T² = I_R² + (I_C − I_L)² ⇒ 25 = 9 + (I_C − 12)² ⇒ (I_C − 12)² = 16 ⇒ I_C − 12 = −4 ⇒ I_C = 8 A (لأن الخصائص حثية)<br><span class=\"res\">I_R = 3 A</span> <span class=\"res\">I_C = 8 A</span><br><b>2) الممانعة:</b> Z = V/I_T = 240/5 = 48 Ω<br><span class=\"res\">Z = 48 Ω</span><br><b>3) الزاوية:</b> tanθ = (I_C − I_L)/I_R = (8 − 12)/3 = −4/3 ⇒ θ = −53° (الدائرة حثية)<br><b>4) القدرتان:</b> P_real = I_R²·R = 9 × 80 = 720 W (حيث R = V/I_R = 80 Ω)، و P_app = I_T·V = 5 × 240 = 1200 VA<br><span class=\"res\">P_real = 720 W</span> <span class=\"res\">P_app = 1200 VA</span>", "ch": 3, "id": "c3p062"}, {"k": "p", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوازية الربط تحتوي مقاومة صرف ومتسعة ذات سعة صرف مقدارها (20μF) ومحثاً صرفاً، ومصدراً للفولطية المتناوبة فرق الجهد بين طرفيه (100V) بتردد (100/π Hz)، كانت القدرة الحقيقية في الدائرة (80W) وعامل القدرة (0.8) وللدائرة خواص حثية. احسب: ① التيار المار في فرع المقاومة وفي فرع المتسعة. ② التيار الكلي. ③ زاوية فرق الطور بين التيار الكلي والفولطية الكلية مع رسم مخطط المتجهات.", "a": "<b>الحل التفصيلي:</b><br><b>1) تيار المقاومة والمتسعة:</b> P = I_R·V ⇒ 80 = I_R × 100 ⇒ I_R = 0.8 A<br>X_C = 1/(2πfC) = 1/(2π × (100/π) × 20 × 10⁻⁶) = 1/(4 × 10⁻³) = 250 Ω ⇒ I_C = 100/250 = 0.4 A<br><span class=\"res\">I_R = 0.8 A</span> <span class=\"res\">I_C = 0.4 A</span><br><b>2) التيار الكلي:</b> P = I_T·V·pf ⇒ 80 = I_T × 100 × 0.8 ⇒ I_T = 1 A<br><span class=\"res\">I_T = 1 A</span><br><b>3) الزاوية:</b> pf = cos Φ = 0.8 ⇒ Φ = −37° (خواص حثية)، وتتحقق بالمخطط: I_L = 1 A لأن I_T² = I_R² + (I_C − I_L)² ⇒ 1 = 0.64 + (0.4 − I_L)² ⇒ I_L = 1 A، و tanΦ = (I_C − I_L)/I_R = −0.6/0.8 = −3/4<br><span class=\"res\">Φ = −37°)</span>", "ch": 3, "id": "c3p063"}, {"k": "p", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوازية الربط تحتوي مقاومة صرف ومحث صرف ومتسعة ذات سعة صرف ومصدر للفولطية المتناوبة فرق الجهد بين طرفيه (90V)، ومماعنة الدائرة (18Ω) والرادة الحثية (10Ω) والتيار المار عبر المقاومة (4A)، وكانت للدائرة خصائص حثية. ما مقدار الرادة السعوية؟", "a": "<b>الحل التفصيلي:</b><br><b>1) تيار المحث:</b> I_L = V/X_L = 90/10 = 9 A<br><span class=\"res\">I_L = 9 A</span><br><b>2) التيار الكلي:</b> I_T = V/Z = 90/18 = 5 A<br><span class=\"res\">I_T = 5 A</span><br><b>3) تيار المتسعة:</b> I_T² = I_R² + (I_C − I_L)² ⇒ 25 = 16 + (I_C − 9)² ⇒ (I_C − 9)² = 9 ⇒ I_C − 9 = −3 (خواص حثية) ⇒ I_C = 6 A<br><span class=\"res\">I_C = 6 A</span><br><b>4) الرادة السعوية:</b> X_C = V/I_C = 90/6 = 15 Ω<br><span class=\"res\">X_C = 15 Ω</span>", "ch": 3, "id": "c3p064"}, {"k": "p", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوازية الربط تحتوي (مقاومة صرف R) ومتسعة ذات سعة صرف C ومحث صرف L، ربطت المجموعة بين قطبي مصدر للفولطية المتناوبة فرق الجهد (480V)، وكان مقدار المقاومة (160Ω) ورادة المحث (60Ω) ورادة السعة (40Ω). احسب: ① التيار المناسب في كل فرع. ② التيار الرئيس. ③ الممانعة الكلية. ④ عامل القدرة. ⑤ القدرة الحقيقية والقدرة الظاهرية.", "a": "<b>الحل التفصيلي:</b><br><b>1) تيارات الفروع:</b> I_R = V/R = 480/160 = 3 A، I_C = V/X_C = 480/40 = 12 A، I_L = V/X_L = 480/60 = 8 A<br><span class=\"res\">I_R = 3 A</span> <span class=\"res\">I_C = 12 A</span> <span class=\"res\">I_L = 8 A</span><br><b>2) التيار الرئيس:</b> I_T² = 9 + (12 − 8)² = 25 ⇒ I_T = 5 A<br><span class=\"res\">I_T = 5 A</span><br><b>3) الممانعة:</b> Z = V/I_T = 480/5 = 96 Ω<br><span class=\"res\">Z = 96 Ω</span><br><b>4) عامل القدرة:</b> pf = I_R/I_T = 3/5 = 0.6<br><span class=\"res\">pf = 0.6</span><br><b>5) القدرتان:</b> P_real = I_R·V = 3 × 480 = 1440 W، و P_app = I_T·V = 5 × 480 = 2400 VA<br><span class=\"res\">P_real = 1440 W</span> <span class=\"res\">P_app = 2400 VA</span>", "ch": 3, "id": "c3p065"}, {"k": "k", "topic": "المقدمة والطيف", "yrs": "وزاري", "q": "عرّف الطيف الكهرومغناطيسي.", "a": "الطيف الكهرومغناطيسي هو مدى واسع من الأطوال الموجية (الترددات) يتضمنها الضوء المرئي، وتختلف أجزاؤه عن بعضها في طريقة توليدها ومصادرها وتقنية الكشف عنها وقابليتها على اختراق الأوساط.", "kw": [["مدى", "مدى واسع"], ["الأطوال الموجية", "الترددات", "التردد"], ["الضوء المرئي", "المرئي"], ["مصادر", "مصادرها"], ["اختراق", "الاختراق"]], "ch": 4, "id": "c4k001"}, {"k": "k", "topic": "نظرية ماكسويل", "yrs": "وزاري", "q": "ما الحقائق التي تمكن من خلالها العالم ماكسويل من ربط القوانين الخاصة بالمجالات الكهربائية والمجالات المغناطيسية؟", "a": "1) الشحنة الكهربائية النقطية الساكنة تولد حولها مجالاً كهربائياً تتبع خطوطه من وإلى موقع تلك الشحنة. 2) لا يتوافر قطب مغناطيسي منفرد، لذلك تكون خطوط المجال المغناطيسي مغلقة. 3) المجال الكهربائي المتغير مع الزمن يولد حوله مجالاً مغناطيسياً متغيراً مع الزمن وعمودياً عليه ومتنقلاً معه في الطور. 4) المجال المغناطيسي المتغير مع الزمن يولد حوله مجالاً كهربائياً متغيراً وعمودياً عليه ومتنقلاً معه في الطور.", "kw": [["ساكنة", "نقطية"], ["مجالاً كهربائياً", "المجال الكهربائي"], ["قطب مغناطيسي منفرد", "قطب"], ["مغلقة", "مغلق"], ["متغير", "متغيراً"], ["عمودياً", "عمودي"], ["الطور"]], "ch": 4, "id": "c4k002"}, {"k": "k", "topic": "نظرية ماكسويل", "yrs": "وزاري", "q": "ماذا يقصد بتيار الإزاحة؟ ولماذا يختلف عن تيار التوصيل؟", "a": "تيار الإزاحة هو المعدل الزمني للتغير في المجال الكهربائي (∂E/∂t)، ويرافق الموجة الكهرومغناطيسية المنتشرة في الفضاء. يختلف عن تيار التوصيل لأن تيار التوصيل ينتقل خلال الموصل فقط، أما تيار الإزاحة فينتشر في الفضاء.", "kw": [["الإزاحة", "إزاحة"], ["المعدل الزمني", "الزمني"], ["المجال الكهربائي", "المجال"], ["الفضاء"], ["التوصيل"], ["الموصل"]], "ch": 4, "id": "c4k003"}, {"k": "k", "topic": "نظرية ماكسويل", "yrs": "وزاري", "q": "تيار الإزاحة يتناسب مع:", "opts": ["المعدل الزمني للتغير في المجال المغناطيسي", "المعدل الزمني للتغير في المجال الكهربائي", "المعدل الزمني للتغير في تيار التوصيل", "المعدل الزمني للتغير في تيار الاستقطاب"], "c": 1, "a": "تيار الإزاحة يتناسب مع المعدل الزمني للتغير في المجال الكهربائي.", "ch": 4, "id": "c4k004"}, {"k": "k", "topic": "نظرية ماكسويل", "yrs": "وزاري", "q": "اذكر (بنقطتين) خصائص الموجات الكهرومغناطيسية.", "a": "1) تنتشر بخطوط مستقيمة، وتنعكس وتنكسر وتتداخل وتتعيد عن مسارها. 2) تتألف من مجالين كهربائي ومغناطيسي متلازمين ومتغيرين مع الزمن، ومستويين متعامدين مع بعضهما وعموديين على خط انتشار الموجة، ويتذبذبان بنفس الطور. 3) هي موجات مستعرضة لأن المجالين يتذبذبان عمودياً على خط انتشار الموجة. 4) تنتشر في الفراغ بسرعة الضوء، وعند انتقالها في وسط مادي تقل سرعتها تبعاً لخصائص ذلك الوسط. 5) تتوزع طاقتها بالتساوي بين المجالين الكهربائي والمغناطيسي عند انتشارها في الفراغ.", "kw": [["مستقيم", "مستقيمة"], ["مجالين", "المجالين"], ["متعامد", "متعامدين"], ["مستعرضة", "مستعرض"], ["الفراغ", "بسرعة الضوء"], ["بالتساوي", "متساو", "متساوي"]], "ch": 4, "id": "c4k005"}, {"k": "k", "topic": "نظرية ماكسويل", "yrs": "وزاري", "q": "ماذا يتبدد عندما تنتشر الأشعة الكهرومغناطيسية في الفضاء أو الأوساط المختلفة؟", "a": "يتبدد المجال الكهربائي المتغير مع الزمن بطوره، والمجال المغناطيسي المتغير معه، وكلاهما متعامد مع الآخر وعمودي على خط انتشار الموجة.", "kw": [["الكهربائي", "كهربائي"], ["المغناطيسي", "مغناطيسي"], ["متعامد", "متعامدان", "متعامدين"], ["عمودي", "عموديان"]], "ch": 4, "id": "c4k006"}, {"k": "k", "topic": "نظرية ماكسويل", "yrs": "وزاري", "q": "ضع كلمة (صح) أمام العبارة الصحيحة وكلمة (خطأ) أمام العبارة غير الصحيحة مع تصحيح الخطأ دون أن تغير ما تحته خط: يمكن أن تجعل الشحنة الكهربائية في موصل عندما يؤثر فيها مجال كهربائي ثابت أن تنتقل خلاله تياراً كهربائياً.", "a": "خطأ، والتصحيح: يمكن أن تجعل الشحنة الكهربائية في موصل عندما يؤثر فيها مجال كهربائي متغير.", "kw": [["خطأ"], ["متغير", "متغيراً"]], "ch": 4, "id": "c4k007"}, {"k": "k", "topic": "الإرسال والاستقبال", "yrs": "وزاري", "q": "علام تعتمد عملية الإرسال والتسلم للموجات الكهرومغناطيسية؟", "a": "1) دائرة مهتزة (دائرة الاهتزاز ال function session(list,title,back){let Q=shuf(list.slice()),right=0,tot=list.length,solved=new Set(),tries=0;
 const bar=()=>Math.round(solved.size/tot*100);
 function next(){if(!Q.length)return end();render(Q[0])}
 function end(){show(`${frame('sm')}<div class="card" style="text-align:center"><div style="font-size:54px">🏆</div><h2>خلصت: ${title}</h2><p>أجبت ${solved.size} من ${tot} بشكل صحيح، وعدد المحاولات ${tries}.<br>${Object.keys(mis).length?'الأسئلة اللي غلطت بيها محفوظة في «أخطائي».':'ما بقي عندك أي خطأ!'}</p><button class="btn" id="bk">رجوع</button></div>`);$('#bk').onclick=back}
 function render(q){let mode='t',pick=-1,img=null,rec=null;
  const inp=q.opts?`<div id="op">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="m">${o}</span></button>`).join('')}</div>`:
   `<div class="tabs"><button data-m="t" class="on">✍️ كتابة</button><button data-m="v">🎤 صوت</button><button data-m="i">📷 صورة</button></div><div id="pn"></div>`;
  show(`${frame('sm')}<div class="top"><button class="bk" id="ab">✕</button><div class="pr"><div style="width:${bar()}%"></div></div><span class="cnt">${solved.size}/${tot}</span></div>
  <div class="card q"><span class="chip">${q.topic}</span> <span class="yr">${q.yrs||''}</span><div class="qt">${fmt(q.q)}</div>${q.parts?`<div style="color:var(--mut);font-size:14px">المطلوب: ${q.parts.map(p=>p.l).join(' · ')}</div>`:''}${inp}</div><div id="fb"></div><button class="btn" id="ck">تحقق ✔</button>`);
  $('#ab').onclick=back;
  const panel=()=>{const p=$('#pn');if(!p)return;const old=$('#ta')?$('#ta').value:'';
   if(mode==='t'||mode==='v')p.innerHTML=`${mode==='v'?`<button class="btn mic" id="mc" style="margin:0 0 8px">🎤 اضغط وتكلم</button>`:''}<textarea id="ta" placeholder="${q.k==='p'?'اكتب الحل والنتائج النهائية (مثال: Q = 120 μC)':'اكتب إجابتك بكلماتك'}">${old}</textarea>`;
   else p.innerHTML=`<label class="btn g" style="display:block;text-align:center;margin:0">📷 التقط صورة لحلّك أو اختر من المعرض<input id="fi" type="file" accept="image/*" capture="environment" hidden></label>${img?`<img class="pv" src="${img}" alt="">`:''}`;
   if(mode==='v')$('#mc').onclick=mic;if(mode==='i')$('#fi').onchange=e=>{const f=e.target.files[0];if(f){img=URL.createObjectURL(f);panel()}}};
  function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('المتصفح لا يدعم التسجيل الصوتي، اكتب الإجابة');if(rec){rec.stop();return}
   rec=new SR();rec.lang='ar-IQ';rec.interimResults=false;rec.onresult=e=>{$('#ta').value=($('#ta').value+' '+[...e.results].map(r=>r[0].transcript).join(' ')).trim()};rec.onend=()=>{rec=null;const m=$('#mc');if(m)m.textContent='🎤 اضغط وتكلم'};rec.onerror=()=>toast('تعذر التسجيل، تأكد من إذن المايك');
   try{rec.start();$('#mc').textContent='⏹ يسجّل... اضغط للإيقاف'}catch(e){rec=null}}
  if(q.opts)app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{pick=+b.dataset.i;app.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b))});
  else{panel();app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(rec)try{rec.stop()}catch(e){}mode=b.dataset.m;app.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));panel()})}
  $('#ck').onclick=()=>{if(rec)try{rec.stop()}catch(e){}
   const txt=$('#ta')?$('#ta').value.trim():'';
   if(q.opts&&pick<0)return toast('اختر إجابة');
   if(!q.opts&&mode==='i'){if(!img)return toast('التقط صورة أولاً');
     $('#fb').innerHTML=`<div class="fbk mid">📷 قارن صورتك بالحل النموذجي ثم حدّد نتيجتك:</div><div class="sol"><b class="h">الحل النموذجي</b><br>${q.a}</div><div class="row"><button class="btn ok" id="sr">✔ حلّي صح</button><button class="btn no" id="sw">✖ حلّي غلط</button></div>`;$('#ck').style.display='none';$('#sr').onclick=()=>done_(q,1);$('#sw').onclick=()=>done_(q,0);return}
   if(!q.opts&&!txt)return toast('اكتب أو سجّل إجابتك أولاً');

   const m=g.r>=1?['ok','✅ صح، أحسنت']:g.r>0?['mid','⚠️ ناقصة — حاول تكمل الجواب']:['bad','❌ غلط — راح تنعاد عليك'];
   $('#fb').innerHTML=`<div class="fbk ${m[0]}">${m[1]}${g.miss.length?`<div style="font-weight:400;font-size:15px">لم أجد: ${g.miss.join('، ')}</div>`:''}</div><div class="sol"><b class="h">${q.k==='p'?'الحل النموذجي':'الجواب النموذجي'}</b><br>${q.a}</div><button class="btn" id="nx">التالي ◀</button>`;
   $('#nx').onclick=()=>done_(q,g.r,true)};
  function done_(q,r,fromBtn){tries++;if(r>=1){Q.shift();solved.add(q.id);done[q.id]=1;delete mis[q.id]}else{mis[q.id]=(mis[q.id]||0)+1;delete done[q.id];Q.shift();Q.splice(Math.min(2,Q.length),0,q)}saveS();
   if(fromBtn||!$('#sr'))return next();toast(r>=1?'✅ تمام':'❌ راح تنعاد عليك');next()}
  window.scrollTo(0,0)}
 next()}

function toTex(h){
 let s=h.replace(/<br\s*\/?>/g,' ');
 s=s.replace(/<span class="fr"><span>([\s\S]*?)<\/span><span>([\s\S]*?)<\/span><\/span>/g,(a,n,d)=>'\\frac{'+n+'}{'+d+'}');
 s=s.replace(/<sub>([\s\S]*?)<\/sub>/g,(a,x)=>'_{'+x+'}').replace(/<sup>([\s\S]*?)<\/sup>/g,(a,x)=>'^{'+x+'}');
 const SB={'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9','ₜ':'t'};
 const SP={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-','⁺':'+'};
 s=s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+/g,m=>'^{'+[...m].map(c=>SP[c]).join('')+'}');
 s=s.replace(/[₀₁₂₃₄₅₆₇₈₉ₜ]+/g,m=>'_{'+[...m].map(c=>SB[c]).join('')+'}');
 s=s.replace(/\^\(([^()]*)\)/g,'^{$1}');
 const G={'Δ':'\\Delta ','ε':'\\varepsilon ','π':'\\pi ','μ':'\\mu ','Ω':'\\Omega ','θ':'\\theta ','Φ':'\\Phi ','σ':'\\sigma ','τ':'\\tau ','λ':'\\lambda ','ω':'\\omega ','×':'\\times ','·':'\\cdot ','−':'-','⇒':'\\Rightarrow ','→':'\\to ','½':'\\frac{1}{2}','∫':'\\int ','≈':'\\approx ','α':'\\alpha ','β':'\\beta ','γ':'\\gamma ','%':'\\% ','√':'\\surd '};
 s=s.replace(/[ΔεπμΩθΦστλω×·−⇒→½∫≈αβγ%√]/g,c=>G[c]||c);
 s=s.replace(/[؀-ۿ][؀-ۿ\s]*/g,m=>'\\text{'+m.trim()+'}');
 return s;
}

function buildIdx(){if(IDX)return IDX;const N=QS.length;const docs=QS.map(q=>({q,set:new Set(toksOf(q.q+' '+q.topic+' '+(q.kw||[]).map(g=>g.join(' ')).join(' ')+' '+q.a)),qset:new Set(toksOf(q.q+' '+q.topic))}));const df={};docs.forEach(d=>d.set.forEach(w=>df[w]=(df[w]||0)+1));IDX={docs,df,N};return IDX}

function modelVals(q){
 if(q._mv)return q._mv;
 const t=String(q.a||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ');
 const seen=new Set(),out=[];
 const re=/(\d+(?:\.\d+)?)\s*(μC|µC|μF|µF|μJ|µJ|rad\/s|Wb|weber|volt|joule|amper|Hz|T|W|C|F|V|J|Ω|A)(?![A-Za-zء-ي])/g;let m;
 while((m=re.exec(t))){
   const v=+m[1],u=m[2];const key=v+u;if(seen.has(key))continue;seen.add(key);
   const micro=/^[μµ]/.test(u);
   const base=micro?[v,v*1e-6]:[v];out.push({l:v+' '+u,v:base.concat(base.map(x=>-x)),u});
 }

}
function grade(q,txt,pick){
 if(q.opts)return{r:pick===q.c?1:0,miss:[]};

   const ns=nums(txt),miss=[];let ok=0;
   parts.forEach(p=>{if(p.v.some(v=>ns.some(n=>close(n,v))))ok++;else miss.push(p.l)});
   const f=ok/parts.length;return{r:f===1?1:f>=.5?.5:0,miss}
 }

}
