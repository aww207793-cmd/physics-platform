عتان من ذوات الصفيحتين المتوازيتين سعتهما (C₁ = 3μF , C₂ = 6μF) مربوطتان مع بعضهما على التوالي شحنت المجموعة بشحنة كلية مقدارها (72μC) احسب مقدار: (1) فرق الجهد الكلي بين طرفي المجموعة. (2) فرق الجهد بين صفيحتي كل متسعة. (3) الطاقة المختزنة في المجال الكهربائي بين صفيحتي كل متسعة.", "a": "<b>المعطيات:</b> C₁ = 3 μF، C₂ = 6 μF على التوالي، Q = 72 μC.<br>\n<b>(1) فرق الجهد الكلي:</b><br>\n<span class=\"m\">C<sub>eq</sub> = 3×6/9 = 2 μF</span><br>\n<span class=\"m\">V<sub>T</sub> = Q/C<sub>eq</sub> = 72/2 = 36 V</span><br>\n<span class=\"res\">V<sub>T</sub> = 36 V</span><br>\n<b>(2) فرق الجهد لكل متسعة:</b><br>\n<span class=\"m\">V₁ = 72/3 = 24 V</span> ، <span class=\"m\">V₂ = 72/6 = 12 V</span><br>\n<span class=\"res\">V₁ = 24 V ، V₂ = 12 V</span> (مجموعهما 36 V ✓)<br>\n<b>(3) الطاقة في كل متسعة:</b><br>\n<span class=\"m\">PE₁ = ½ × 72×10⁻⁶ × 24 = 8.64×10⁻⁴ J</span><br>\n<span class=\"m\">PE₂ = ½ × 72×10⁻⁶ × 12 = 4.32×10⁻⁴ J</span><br>\n<span class=\"res\">PE₁ = 8.64×10⁻⁴ J ، PE₂ = 4.32×10⁻⁴ J</span>", "parts": [{"l": "فرق الجهد الكلي", "v": [36], "u": "V"}, {"l": "ΔV₁", "v": [24], "u": "V"}, {"l": "ΔV₂", "v": [12], "u": "V"}, {"l": "PE₁", "v": [0.000864, 864], "u": "J (أو μJ)"}, {"l": "PE₂", "v": [0.000432, 432], "u": "J (أو μJ)"}], "id": "c1p88"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوالي", "yrs": "1/2016", "q": "متسعتان من ذوات الصفيحتين المتوازيتين (C₁ = 120μF , C₂ = 30μF) مربوطتان مع بعضهما على التوالي و مجموعتهما ربطت بين قطبي بطارية فرق الجهد بين قطبيها (20V) فاذا فصلت المجموعة عن البطارية وادخل لوح عازل من مادة عازلة ثابت عزلها (2) بين صفيحتي المتسعة الثانية، احسب مقدار فرق الجهد والطاقة في المجال الكهربائي بين صفيحتي كل متسعة بعد ادخال العازل.", "a": "<b>المعطيات:</b> C₁ = 120 μF، C₂ = 30 μF على التوالي، ΔV = 20 V (متصلة)، ثم تفصل ويدخل عازل K = 2 في الثانية.<br>\n<b>قبل الفصل:</b> C<sub>eq</sub> = 120×30/150 = 24 μF، Q = 24 × 20 = 480 μC<br>\n<b>بعد العازل:</b> C₂k = 60 μF، C<sub>eq</sub> = 120×60/180 = 40 μF، والشحنة ثابتة Q = 480 μC<br>\n<span class=\"m\">ΔV<sub>T</sub> = 480/40 = 12 V</span><br>\n<span class=\"m\">V₁ = 480/120 = 4 V</span> ، <span class=\"m\">V₂ = 480/60 = 8 V</span><br>\n<span class=\"m\">PE₁ = ½ × 480×10⁻⁶ × 4 = 960 μJ</span><br>\n<span class=\"m\">PE₂ = ½ × 480×10⁻⁶ × 8 = 1920 μJ</span><br>\n<span class=\"res\">V₁ = 4 V ، V₂ = 8 V ، PE₁ = 960 μJ ، PE₂ = 1920 μJ</span>", "parts": [{"l": "ΔV₁", "v": [4], "u": "V"}, {"l": "ΔV للمتسعة الثانية", "v": [8], "u": "V"}, {"l": "PE₁", "v": [0.00096, 960], "u": "J (أو μJ)"}, {"l": "PE للمتسعة الثانية", "v": [0.00192, 1920], "u": "J (أو μJ)"}], "id": "c1p89"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوالي", "yrs": "3/2024", "q": "ثلاث متسعات من ذوات الصفيحتين المتوازيتين سعتها حسب الترتيب (6μF , 9μF , 18μF) مربوطة مع بعضها على التوالي شحنت المجموعة بشحنة كلية (600μC) احسب مقدار: (1) السعة المكافئة للمجموعة. (2) الشحنة المختزنة في أي من صفيحتي كل متسعة. (3) فرق الجهد الكلي بين طرفي المجموعة. (4) فرق الجهد بين صفيحتي كل متسعة.", "a": "<b>المعطيات:</b> C₁ = 6 μF، C₂ = 9 μF، C₃ = 18 μF على التوالي، Q = 600 μC.<br>\n<b>(1) السعة المكافئة:</b><br>\n<span class=\"m\">1/C<sub>eq</sub> = 1/6 + 1/9 + 1/18 = (3 + 2 + 1)/18 = 6/18 = 1/3</span><br>\n<span class=\"res\">C<sub>eq</sub> = 3 μF</span><br>\n<b>(2) الشحنة في كل متسعة:</b> متساوية في التوالي<br>\n<span class=\"res\">Q = 600 μC لكل متسعة</span><br>\n<b>(3) فرق الجهد الكلي:</b><br>\n<span class=\"m\">V<sub>T</sub> = Q/C<sub>eq</sub> = 600/3 = 200 V</span><br>\n<span class=\"res\">V<sub>T</sub> = 200 V</span><br>\n<b>(4) فرق الجهد لكل متسعة:</b><br>\n<span class=\"m\">V₁ = 600/6 = 100 V</span> ، <span class=\"m\">V₂ = 600/9 ≈ 66.67 V</span> ، <span class=\"m\">V₃ = 600/18 ≈ 33.33 V</span><br>\n<span class=\"res\">V₁ = 100 V ، V₂ ≈ 66.7 V ، V₃ ≈ 33.3 V</span> (مجموعهما 200 V ✓)", "parts": [{"l": "السعة المكافئة", "v": [3, 3e-06], "u": "μF"}, {"l": "الشحنة في كل متسعة", "v": [600, 0.0006], "u": "μC"}, {"l": "فرق الجهد الكلي", "v": [200], "u": "V"}, {"l": "ΔV₁", "v": [100], "u": "V"}, {"l": "ΔV₂", "v": [66.66, 66.67, 66.667], "u": "V"}, {"l": "ΔV₃", "v": [33.33, 33.34, 33.333], "u": "V"}], "id": "c1p90"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوالي", "yrs": "2017 تمهيدي", "q": "متسعتان (C₁ = 6μF , C₂ = 3μF) من ذوات الصفائح المتوازية مربوطتان مع بعضهما على التوالي وربطت مجموعتهما مع نضيدة فرق الجهد بين قطبيها (12 V): (1) احسب مقدار فرق الجهد بين صفيحتي كل متسعة. (2) ادخل لوح عازل كهربائي ثابت عزله (2) بين صفيحتي المتسعة الثانية C₂ (مع بقاء البطارية مربوطة بين طرفي المجموعة) فما مقدار فرق الجهد بين صفيحتي كل متسعة بعد ادخال العازل.", "a": "<b>المعطيات:</b> C₁ = 6 μF، C₂ = 3 μF على التوالي، V = 12 V.<br>\n<b>(1) فرق الجهد لكل متسعة:</b><br>\n<span class=\"m\">C<sub>eq</sub> = 6×3/9 = 2 μF</span> ، <span class=\"m\">Q = 2 × 12 = 24 μC</span><br>\n<span class=\"m\">V₁ = 24/6 = 4 V</span> ، <span class=\"m\">V₂ = 24/3 = 8 V</span><br>\n<span class=\"res\">V₁ = 4 V ، V₂ = 8 V</span><br>\n<b>(2) بعد إدخال عازل K = 2 في C₂ والبطارية متصلة:</b><br>\nC₂k = 6 μF، <span class=\"m\">C<sub>eq</sub> = 6×6/12 = 3 μF</span>، Q = 3 × 12 = 36 μC<br>\n<span class=\"m\">V₁ = 36/6 = 6 V</span> ، <span class=\"m\">V₂ = 36/6 = 6 V</span><br>\n<span class=\"res\">بعد العازل: V₁ = 6 V ، V₂ = 6 V</span>", "parts": [{"l": "ΔV₁ قبل العازل", "v": [4], "u": "V"}, {"l": "ΔV₂ قبل العازل", "v": [8], "u": "V"}, {"l": "ΔV₁ بعد العازل", "v": [6], "u": "V"}, {"l": "ΔV₂ بعد العازل", "v": [6], "u": "V"}], "id": "c1p91"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوالي", "yrs": "2022 تمهيدي احيائي", "q": "متسعتان (C₁ = 9μF , C₂ = 18μF) من ذوات الصفائح المتوازية مربوطتان مع بعضهما على التوالي، وربط مجموعتهما بين قطبي بطارية فرق الجهد الكهربائي بين قطبيها (12V)، ادخل بين صفيحتي كل منهما لوح من مادة عازلة ثابت عزلها (2) يملأ الحيز بينهما (وما زالت المجموعة متصلة بالبطارية)، فما مقدار فرق الجهد بين صفيحتي كل متسعة بعد ادخال العازل؟", "a": "<b>المعطيات:</b> C₁ = 9 μF، C₂ = 18 μF على التوالي، V = 12 V (متصلة)، وبعد إدخال عازل K = 2 في كل منهما.<br>\n<b>قبل العازل:</b> C<sub>eq</sub> = 9×18/27 = 6 μF، Q = 72 μC، V₁ = 8 V، V₂ = 4 V<br>\n<b>بعد العازل:</b> C₁k = 18 μF، C₂k = 36 μF، C<sub>eq</sub> = 18×36/54 = 12 μF، Q = 144 μC<br>\n<span class=\"m\">V₁ = 144/18 = 8 V</span> ، <span class=\"m\">V₂ = 144/36 = 4 V</span><br>\n<span class=\"res\">بعد العازل: V₁ = 8 V ، V₂ = 4 V (لم يتغير)</span>", "parts": [{"l": "ΔV₁ بعد العازل", "v": [8], "u": "V"}, {"l": "ΔV₂ بعد العازل", "v": [4], "u": "V"}], "id": "c1p92"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوالي", "yrs": "3/2017 اسئلة الموصل", "q": "متسعتان (C₁ = 12μF , C₂ = 6μF) من ذوات الصفيحتين المتوازيتين مربوطتان مع بعضهما على التوالي وربطت مجموعتهما مع نضيدة فرق الجهد بين قطبيها (24 V) ادخل بين صفيحتي كل منهما لوح من مادة عازلة ثابت عزله (2) يملأ الحيز بينهما (ومازالت المجموعة متصلة بالبطارية)، فما مقدار فرق الجهد بين صفيحتي كل متسعة قبل وبعد ادخال العازل؟", "a": "<b>المعطيات:</b> C₁ = 12 μF، C₂ = 6 μF على التوالي، ΔV = 24 V (متصلة بالبطارية)، وبعد إدخال عازل K = 2 في كل متسعة.<br>\n<b>قبل العازل:</b> C<sub>eq</sub> = 12×6/(12+6) = 4 μF، Q = 4 × 24 = 96 μC<br>\n<span class=\"m\">V₁ = 96/12 = 8 V</span> ، <span class=\"m\">V₂ = 96/6 = 16 V</span><br>\n<b>بعد العازل:</b> C₁k = 24 μF، C₂k = 12 μF<br>\nC<sub>eq</sub> = 24×12/(24+12) = 8 μF، Q = 8 × 24 = 192 μC<br>\n<span class=\"m\">V₁ = 192/24 = 8 V</span> ، <span class=\"m\">V₂ = 192/12 = 16 V</span><br>\n<span class=\"res\">فرق الجهد بين صفيحتي كل متسعة بعد العازل: 8 V للأولى و 16 V للثانية (لم يتغير)</span><br>\nملاحظة: لأن العازل وُضع في المتسعتين بالنسبة نفسها (K = 2)، تبقى نسبة توزيع الجهد كما هي.", "parts": [{"l": "ΔV₁ قبل العازل", "v": [8], "u": "V"}, {"l": "ΔV₂ قبل العازل", "v": [16], "u": "V"}, {"l": "ΔV₁ بعد العازل", "v": [8], "u": "V"}, {"l": "ΔV₂ بعد العازل", "v": [16], "u": "V"}], "id": "c1p93"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوالي", "yrs": "1/2017 خارج القطر", "q": "ثلاث متسعات من ذوات الصفيحتين المتوازيتين سعتها حسب الترتيب (C₁ = 6μF , C₂ = 9μF , C₃ = 18μF) مربوطة مع بعضها على التوالي ربطت المجموعة مع قطبي بطارية فرق الجهد الكهربائي بين قطبيها (100 V) ما مقدار فرق الجهد بين صفيحتي كل متسعة والطاقة المختزنة في المجال الكهربائي بين صفيحتي كل متسعة؟", "a": "<b>المعطيات:</b> C₁ = 6 μF، C₂ = 9 μF، C₃ = 18 μF على التوالي، V = 100 V.<br>\n<b>السعة المكافئة والشحنة:</b><br>\n<span class=\"m\">1/C<sub>eq</sub> = 1/6 + 1/9 + 1/18 = 6/18</span> ⇒ <span class=\"m\">C<sub>eq</sub> = 3 μF</span><br>\n<span class=\"m\">Q = 3 × 100 = 300 μC</span> (نفسها لكل متسعة)<br>\n<b>فرق الجهد لكل متسعة:</b><br>\n<span class=\"m\">V₁ = 300/6 = 50 V</span> ، <span class=\"m\">V₂ = 300/9 ≈ 33.33 V</span> ، <span class=\"m\">V₃ = 300/18 ≈ 16.67 V</span><br>\n<b>الطاقة لكل متسعة:</b><br>\n<span class=\"m\">PE₁ = ½ × 300×10⁻⁶ × 50 = 7.5 mJ</span><br>\n<span class=\"m\">PE₂ = ½ × 300×10⁻⁶ × 33.33 = 5 mJ</span><br>\n<span class=\"m\">PE₃ = ½ × 300×10⁻⁶ × 16.67 = 2.5 mJ</span><br>\n<span class=\"res\">V₁ = 50 V ، V₂ ≈ 33.3 V ، V₃ ≈ 16.7 V ، PE₁ = 7.5 mJ ، PE₂ = 5 mJ ، PE₃ = 2.5 mJ</span>", "parts": [{"l": "ΔV₁", "v": [50], "u": "V"}, {"l": "ΔV₂", "v": [33.33, 33.3, 33.333], "u": "V"}, {"l": "ΔV₃", "v": [16.67, 16.7, 16.667], "u": "V"}, {"l": "PE₁", "v": [0.0075, 7500], "u": "J (أو μJ)"}, {"l": "PE₂", "v": [0.005, 5000], "u": "J (أو μJ)"}, {"l": "PE₃", "v": [0.0025, 2500], "u": "J (أو μJ)"}], "id": "c1p94"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوالي", "yrs": "1/2018", "q": "متسعتان (C₁ = 9μF , C₂ = 18μF) من ذوات الصفيحتين المتوازيتين مربوطتان مع بعضهما على التوالي وربطت مجموعتهما بين قطبي بطارية فرق الجهد الكهربائي بين قطبيها (24 V). اذا ادخل لوح من مادة عازلة ثابت عزلها (K) بين صفيحتي المتسعة الاولى ومازالت المجموعة متصلة بالبطارية فكانت الشحنة الكلية للمجموعة (288μC) ما مقدار: (1) ثابت العزل (K) (2) فرق الجهد بين صفيحتي كل متسعة قبل وبعد ادخال المادة العازلة؟", "a": "<b>المعطيات:</b> C₁ = 9 μF، C₂ = 18 μF على التوالي، V = 24 V (متصلة)، وبعد العازل K في الأولى الشحنة الكلية 288 μC.<br>\n<b>(1) ثابت العزل K:</b><br>\nC<sub>eq,k</sub> = Q/V = 288/24 = 12 μF<br>\n<span class=\"m\">(9K × 18)/(9K + 18) = 12</span> ⇒ 162K = 108K + 216 ⇒ 54K = 216<br>\n<span class=\"res\">K = 4</span><br>\n<b>(2) فرق الجهد قبل وبعد العازل:</b><br>\nقبل: C<sub>eq</sub> = 6 μF، Q = 144 μC، <span class=\"m\">V₁ = 144/9 = 16 V</span> ، <span class=\"m\">V₂ = 144/18 = 8 V</span><br>\nبعد: C₁k = 36 μF، Q = 288 μC، <span class=\"m\">V₁ = 288/36 = 8 V</span> ، <span class=\"m\">V₂ = 288/18 = 16 V</span><br>\n<span class=\"res\">قبل: V₁ = 16 V ، V₂ = 8 V<br>بعد: V₁ = 8 V ، V₂ = 16 V</span>", "parts": [{"l": "ثابت العزل", "v": [4], "u": ""}, {"l": "ΔV₁ قبل", "v": [16], "u": "V"}, {"l": "ΔV₂ قبل", "v": [8], "u": "V"}, {"l": "ΔV₁ بعد", "v": [8], "u": "V"}, {"l": "ΔV₂ بعد", "v": [16], "u": "V"}], "id": "c1p95"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوالي", "yrs": "2019 تمهيدي تطبيقي", "q": "ثلاث متسعات من ذوات الصفيحتين المتوازيتين سعاتها حسب الترتيب (4μF , 6μF , 12μF) مربوطة مع بعضها على التوالي، شحنت المجموعة بشحنة كلية (240μC)، احسب مقدار: (1) السعة الكلية للمجموعة. (2) الشحنة المختزنة في اي من صفيحتي كل متسعة. (3) فرق الجهد الكلي بين طرفي المجموعة.", "a": "<b>المعطيات:</b> C₁ = 4 μF، C₂ = 6 μF، C₃ = 12 μF على التوالي، Q = 240 μC.<br>\n<b>(1) السعة الكلية:</b><br>\n<span class=\"m\">1/C<sub>eq</sub> = 1/4 + 1/6 + 1/12 = (3 + 2 + 1)/12 = 6/12</span><br>\n<span class=\"res\">C<sub>eq</sub> = 2 μF</span><br>\n<b>(2) الشحنة في كل متسعة:</b> متساوية في التوالي<br>\n<span class=\"res\">Q = 240 μC</span><br>\n<b>(3) فرق الجهد الكلي:</b><br>\n<span class=\"m\">V<sub>T</sub> = 240/2 = 120 V</span><br>\n<span class=\"res\">V<sub>T</sub> = 120 V</span>", "parts": [{"l": "السعة الكلية", "v": [2, 2e-06], "u": "μF"}, {"l": "الشحنة في كل متسعة", "v": [240, 0.00024], "u": "μC"}, {"l": "فرق الجهد الكلي", "v": [120], "u": "V"}], "id": "c1p96"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوالي", "yrs": "3/2019 تطبيقي", "q": "متسعتان (C₁ = 9μF , C₂ = 18μF) من ذوات الصفائح المتوازية وربطتا مع بعضهما على التوالي وربطت مجموعتهما مع نضيدة فرق الجهد بين قطبيها (12V) احسب مقدار: (1) السعة المكافئة. (2) فرق الجهد بين صفيحتي كل متسعة.", "a": "<b>المعطيات:</b> C₁ = 9 μF، C₂ = 18 μF على التوالي، V = 12 V.<br>\n<b>(1) السعة المكافئة:</b><br>\n<span class=\"m\">C<sub>eq</sub> = 9×18/(9+18) = 6 μF</span><br>\n<span class=\"res\">C<sub>eq</sub> = 6 μF</span><br>\n<b>(2) فرق الجهد لكل متسعة:</b><br>\nQ = 6 × 12 = 72 μC<br>\n<span class=\"m\">V₁ = 72/9 = 8 V</span> ، <span class=\"m\">V₂ = 72/18 = 4 V</span><br>\n<span class=\"res\">V₁ = 8 V ، V₂ = 4 V</span>", "parts": [{"l": "السعة المكافئة", "v": [6, 6e-06], "u": "μF"}, {"l": "ΔV₁", "v": [8], "u": "V"}, {"l": "ΔV₂", "v": [4], "u": "V"}], "id": "c1p97"}, {"ch": 1, "k": "k", "topic": "شحن وتفريغ المتسعة", "yrs": "2/2013 أسئلة الفصل", "q": "ارسم مخططاً لدائرة كهربائية (مع التأشير على الأجزاء) توضح فيها: عملية شحن وتفريغ المتسعة.", "a": "[الشكل (a) عملية شحن المتسعة: دائرة فيها بطارية ومقاومة R ومصباح L₁ ومصباح L₂ وكلفانوميتر G ومتسعة C ومفتاح K على الموضع 1]<br>[الشكل (b) عملية تفريغ المتسعة من شحنتها: المتسعة C والمصباح L₂ والكلفانوميتر G ومفتاح K على الموضع 2 بدون البطارية]", "kw": [["بطاريه", "مصدر"], ["مقاومه"], ["متسعه"], ["مفتاح"], ["مصباح", "كلفانوميتر", "كلفانو"]], "id": "c1k98"}, {"ch": 1, "k": "k", "topic": "شحن وتفريغ المتسعة", "yrs": "2014 تمهيدي · 3/2015 · 2/2017 · 1/2016 أسئلة الناظرين · 2/2019", "q": "ارسم مخططاً لدائرة كهربائية (مع التأشير على الأجزاء) توضح فيها عملية تفريغ المتسعة من شحنتها.", "a": "[الشكل (b) عملية تفريغ المتسعة من شحنتها: المتسعة C مربوطة مع المصباح L₂ والكلفانوميتر G عبر المفتاح K على الموضع 2، وتُفصل البطارية والمقاومة]", "kw": [["متسعه"], ["مصباح", "كلفانوميتر", "كلفانو"], ["مفتاح"], ["تفريغ", "موضع 2", "الموضع 2"]], "id": "c1k99"}, {"ch": 1, "k": "k", "topic": "شحن وتفريغ المتسعة", "yrs": "1/2014 أسئلة الناظرين · 3/2018 · 2/2020 تطبيقي · 2/2021", "q": "ارسم مخططاً لدائرة كهربائية (مع التأشير على الأجزاء) توضح فيها عملية شحن المتسعة؟", "a": "ارسم (a) عملية شحن المتسعة.<br>[الشكل (a): دائرة فيها بطارية ومقاومة R ومصباح L₁ ومصباح L₂ وكلفانوميتر G ومتسعة C ومفتاح K على الموضع 1]", "kw": [["بطاريه", "مصدر"], ["مقاومه"], ["متسعه"], ["مفتاح"], ["مصباح", "كلفانوميتر", "كلفانو"]], "id": "c1k100"}, {"ch": 1, "k": "k", "topic": "دائرة التيار المستمر والمتسعة", "yrs": "3/2020", "q": "ما الفرق الأساسي بين دائرة تيار مستمر تحتوي على مقاومة فقط ودائرة تيار مستمر تحتوي على مقاومة ومتسعة (RC-circuit)؟", "a": "<b>دائرة التيار المستمر تحتوي مقاومة فقط:</b> التيار فيها ثابت المقدار ولا يتغير مع الزمن. [رسم: دائرة فيها مقاومة R وبطارية، ومنحني I مع t خط أفقي ثابت]<br><b>دائرة التيار المستمر تحتوي مقاومة ومتسعة:</b> التيار فيها يتغير مع الزمن. [رسم: دائرة فيها R ومتسعة وبطارية، ومنحني I مع t يتناقص مع الزمن]", "kw": [["مقاومه فقط", "مقاومه"], ["ثابت", "لا يتغير"], ["متسعه"], ["يتغير", "يتناقص", "يقل", "ينعدم"], ["الزمن"]], "id": "c1k101"}, {"ch": 1, "k": "p", "topic": "ربط المتسعة مع المصباح والمقاومة", "yrs": "1/2013 · 1/2017 أسئلة الموصل · 1/2023 تطبيقي", "q": "من المعلومات الموضحة في الدائرة الكهربائية المجاورة احسب: [الشكل: دائرة فيها بطارية V=20V ومتسعة C=80μF ومقاومة R=25Ω ومفتاح كهربائي على التوالي] (1) المقدار الأعظم لتيار الشحن لحظة إغلاق المفتاح. (2) مقدار فرق الجهد بين صفيحتي المتسعة بعد فترة من إغلاق المفتاح (بعد اكتمال عملية الشحن). (3) الشحنة المختزنة في أي من صفيحتي المتسعة. (4) الطاقة المختزنة في المجال الكهربائي بين صفيحتي المتسعة.", "a": "<b>المعطيات:</b> V = 20 V، C = 80 μF، R = 25 Ω، مفتاح على التوالي.<br>\n<b>(1) أكبر تيار شحن لحظة إغلاق المفتاح:</b> لحظة الإغلاق تكون المتسعة فارغة فيكون فرق جهدها صفراً، فيمر التيار الأعظم:<br>\n<span class=\"m\">I<sub>max</sub> = V/R = 20/25</span><br>\n<span class=\"res\">I<sub>max</sub> = 0.8 A</span><br>\n<b>(2) فرق الجهد بين صفيحتي المتسعة بعد اكتمال الشحن:</b> يتوقف التيار فيصبح فرق جهد المتسعة مساوياً لفرق جهد البطارية:<br>\n<span class=\"res\">ΔV = 20 V</span><br>\n<b>(3) الشحنة:</b><br>\n<span class=\"m\">Q = C·ΔV = 80×10⁻⁶ × 20</span><br>\n<span class=\"res\">Q = 1.6×10⁻³ C = 1.6 mC</span><br>\n<b>(4) الطاقة:</b><br>\n<span class=\"m\">PE = ½ C ΔV² = ½ × 80×10⁻⁶ × 400</span><br>\n<span class=\"res\">PE = 0.016 J = 16 mJ</span>", "parts": [{"l": "المقدار الأعظم لتيار الشحن", "v": [0.8], "u": "A"}, {"l": "فرق الجهد بين صفيحتي المتسعة بعد اكتمال الشحن", "v": [20], "u": "V"}, {"l": "الشحنة المختزنة", "v": [1600, 0.0016], "u": "μC"}, {"l": "الطاقة المختزنة", "v": [0.016, 16000, 0.016], "u": "J"}], "id": "c1p102"}, {"ch": 1, "k": "p", "topic": "ربط المتسعة مع المصباح والمقاومة", "yrs": "3/2013", "q": "دائرة كهربائية متوالية الربط تحتوي مصباحاً كهربائياً مقاومته (r=5Ω) ومقاومة مقدارها (R=10Ω) وبطارية مقدار فرق الجهد بين قطبيها (ΔV=12V) ربطت في الدائرة متسعة ذات الصفيحتين المتوازيتين سعتها (3μC) ما مقدار الشحنة المختزنة في أي من صفيحتي المتسعة والطاقة الكهربائية المختزنة في مجالها الكهربائي لو ربطت المتسعة على التوازي مع المصباح؟", "a": "<b>المعطيات:</b> r = 5 Ω (مصباح)، R = 10 Ω، V = 12 V، C = 3 μF، والمتسعة موصولة على التوازي مع المصباح.<br>\n<b>التيار في الدائرة (بعد استقرار الشحن):</b> المتسعة لا تمرر تيار مستمر، لذلك التيار يمر في R والمصباح فقط:<br>\n<span class=\"m\">I = V/(R + r) = 12/15 = 0.8 A</span><br>\n<b>فرق الجهد على المصباح (وهو فرق جهد المتسعة لأنها على التوازي معه):</b><br>\n<span class=\"m\">ΔV = I·r = 0.8 × 5 = 4 V</span><br>\n<b>الشحنة والطاقة:</b><br>\n<span class=\"m\">Q = C·ΔV = 3×10⁻⁶ × 4 = 12 μC</span><br>\n<span class=\"m\">PE = ½ C ΔV² = ½ × 3×10⁻⁶ × 16 = 24 μJ</span><br>\n<span class=\"res\">Q = 12 μC ، PE = 24 μJ</span>", "parts": [{"l": "الشحنة المختزنة في أي من صفيحتي المتسعة", "v": [1.2e-05, 12], "u": "C"}, {"l": "الطاقة المختزنة في المجال الكهربائي", "v": [2.4e-05, 24], "u": "J"}], "id": "c1p103"}, {"ch": 1, "k": "p", "topic": "ربط المتسعة مع المصباح والمقاومة", "yrs": "1/2017", "q": "دائرة كهربائية متوالية الربط تحتوي مصباحاً كهربائياً مقاومته (r=20Ω) ومقاومة مقدارها (R=40Ω) وبطارية مقدار فرق الجهد بين قطبيها (12V) ربطت في الدائرة متسعة ذات الصفيحتين المتوازيتين على التوالي مع المصباح فكان مقدار الشحنة المختزنة في أي من صفيحتي المتسعة (20 μC) جد مقدار: (1) سعة المتسعة. (2) الطاقة الكهربائية المختزنة في مجالها الكهربائي.", "a": "<b>المعطيات:</b> r = 20 Ω، R = 40 Ω، V = 12 V، والمتسعة على التوالي مع المصباح، والشحنة المختزنة Q = 20 μC.<br>\n<b>(1) سعة المتسعة:</b><br>\nبعد اكتمال الشحن لا يمر تيار في الدائرة، فيكون فرق جهد المتسعة مساوياً لفرق جهد البطارية: ΔV = 12 V<br>\n<span class=\"m\">C = Q/ΔV = 20×10⁻⁶ / 12</span><br>\n<span class=\"res\">C ≈ 1.67 μF</span><br>\n<b>(2) الطاقة:</b><br>\n<span class=\"m\">PE = ½ Q ΔV = ½ × 20×10⁻⁶ × 12</span><br>\n<span class=\"res\">PE = 1.2×10⁻⁴ J = 120 μJ</span>", "parts": [{"l": "سعة المتسعة", "v": [1.66, 1.67, 1.6667, 1.66e-06, 1.67e-06], "u": "μF"}, {"l": "الطاقة الكهربائية المختزنة", "v": [0.00012, 120], "u": "J"}], "id": "c1p104"}, {"ch": 1, "k": "p", "topic": "ربط المتسعة مع المصباح والمقاومة", "yrs": "2015 تمهيدي", "q": "دائرة كهربائية متوالية الربط تحتوي مصباحاً كهربائياً مقاومته (r = 5Ω) ومقاومة مقدارها (R = 10Ω) وبطارية مقدار فرق الجهد بين قطبيها (ΔV = 4V) ربطت في الدائرة متسعة ذات الصفيحتين المتوازيتين سعتها (3μC) ما مقدار الشحنة المختزنة في أي من صفيحتي المتسعة والطاقة الكهربائية المختزنة في مجالها الكهربائي لو ربطت المتسعة: (1) على التوازي مع المصباح؟ (2) على التوالي مع المصباح والمقاومة والبطارية في الدائرة نفسها (بعد فصل المتسعة عن الدائرة الأولى وافراغها من جميع شحنتها)؟", "a": "<b>المعطيات:</b> r = 5 Ω، R = 10 Ω، V = 4 V، C = 3 μF.<br>\n<b>(1) المتسعة على التوازي مع المصباح:</b><br>\n<span class=\"m\">I = V/(R + r) = 4/15 A</span><br>\n<span class=\"m\">ΔV = I·r = (4/15) × 5 = 4/3 V</span><br>\n<span class=\"m\">Q = C·ΔV = 3×10⁻⁶ × 4/3 = 4 μC</span><br>\n<span class=\"m\">PE = ½ C ΔV² = ½ × 3×10⁻⁶ × (4/3)² ≈ 2.67 μJ</span><br>\n<span class=\"res\">Q = 4 μC ، PE ≈ 2.67 μJ</span><br>\n<b>(2) المتسعة على التوالي في الدائرة نفسها (بعد التفريغ):</b> بعد اكتمال الشحن لا يمر تيار، فيكون ΔV = V = 4 V:<br>\n<span class=\"m\">Q = 3×10⁻⁶ × 4 = 12 μC</span> ، <span class=\"m\">PE = ½ × 3×10⁻⁶ × 16 = 24 μJ</span><br>\n<span class=\"res\">Q = 12 μC ، PE = 24 μJ</span>", "parts": [{"l": "(1) الشحنة المختزنة (توازي)", "v": [3.99e-06, 3.99], "u": "C"}, {"l": "(1) الطاقة المختزنة (توازي)", "v": [2.65335e-06, 2.65e-06, 2.65], "u": "J"}, {"l": "(2) الشحنة المختزنة (توالي)", "v": [1.2e-05, 12], "u": "C"}, {"l": "(2) الطاقة المختزنة (توالي)", "v": [2.4e-05, 24], "u": "J"}], "id": "c1p105"}, {"ch": 1, "k": "p", "topic": "ربط المتسعة مع المصباح والمقاومة", "yrs": "3/2016", "q": "دائرة كهربائية متوالية الربط تحتوي مصباحاً كهربائياً مقاومته (r=6Ω) ومقاومة مقدارها (R=14Ω) وبطارية مقدار فرق الجهد بين قطبيها (ΔV=4V) ربطت في الدائرة متسعة ذات الصفيحتين المتوازيتين سعتها (2μC) ما مقدار الشحنة المختزنة في أي من صفيحتي المتسعة والطاقة الكهربائية المختزنة في مجالها الكهربائي لو ربطت المتسعة: (1) على التوازي مع المصباح؟ (2) على التوالي مع المصباح والمقاومة والبطارية في الدائرة نفسها (بعد فصل المتسعة عن الدائرة الأولى وافراغها من جميع شحنتها)؟", "a": "<b>المعطيات:</b> r = 6 Ω، R = 14 Ω، V = 4 V، C = 2 μF.<br>\n<b>(1) المتسعة على التوازي مع المصباح:</b><br>\n<span class=\"m\">I = 4/(6 + 14) = 0.2 A</span><br>\n<span class=\"m\">ΔV = I·r = 0.2 × 6 = 1.2 V</span><br>\n<span class=\"m\">Q = 2×10⁻⁶ × 1.2 = 2.4 μC</span><br>\n<span class=\"m\">PE = ½ × 2×10⁻⁶ × (1.2)² = 1.44 μJ</span><br>\n<span class=\"res\">Q = 2.4 μC ، PE = 1.44 μJ</span><br>\n<b>(2) المتسعة على التوالي في الدائرة نفسها (بعد التفريغ):</b> بعد اكتمال الشحن ΔV = V = 4 V:<br>\n<span class=\"m\">Q = 2×10⁻⁶ × 4 = 8 μC</span> ، <span class=\"m\">PE = ½ × 2×10⁻⁶ × 16 = 16 μJ</span><br>\n<span class=\"res\">Q = 8 μC ، PE = 16 μJ</span>", "parts": [{"l": "(1) الشحنة المختزنة (توازي)", "v": [2.4, 2.4e-06], "u": "μC"}, {"l": "(1) الطاقة المختزنة (توازي)", "v": [1.44e-06, 1.44], "u": "J"}, {"l": "(2) الشحنة المختزنة (توالي)", "v": [8, 8e-06], "u": "μC"}, {"l": "(2) الطاقة المختزنة (توالي)", "v": [1.6e-05, 16], "u": "J"}], "id": "c1p106"}, {"ch": 1, "k": "k", "topic": "المتسعة الموضوعة في منظومة المصباح الوميضي في آلة التصوير (الكاميرا)", "yrs": "2/2015 أسئلة خارج القطر · 1/2019 أسئلة خارج القطر تطبيقي · 1/2017 أسئلة خارج القطر · 1/2017 أسئلة الموصل تطبيقي · 2018 تمهيدي تطبيقي · 1/ م حركة عضلات القلب", "yrs": "أسئلة الفصل · 3/2017 أسئلة الموصل · 2/2024", "q": "ما مصدر الطاقة الكهربائية المجهزة للجهاز الطبي (The Defibrillator) المستعمل لتوليد الصدمة الكهربائية لغرض تحفيز وإعادة انتظام عمل قلب المريض؟", "a": "الطاقة المختزنة في المجال الكهربائي بين صفيحتي المتسعة الموضوعة في الجهاز.", "kw": [["طاقه مختزنه", "مختزنه", "الطاقه"], ["المجال الكهربائي", "مجال"], ["صفيحتي", "بين صفيحتي"], ["المتسعه"]], "id": "c1k111"}, {"ch": 1, "k": "k", "topic": "المتسعة الموضوعة في لوحة مفاتيح الحاسوب", "yrs": "أسئلة الفصل · 1/2015 · 1/2021 أسئلة الناظرين · 2/2025 تمهيدي", "q": "ما العامل الذي يتغير في المتسعة الموضوعة في لوحة المفاتيح في جهاز الحاسوب اثناء استعمالها؟ وضح ذلك. (أو) ما الفائدة العملية للمتسعة المستعملة في لوحة مفاتيح الحاسوب؟ (2/2019 تطبيقي)", "a": "يتغير البعد بين الصفيحتين (عند الضغط على المفتاح)، فتزداد بذلك سعة المتسعة ويتغير مقدار سعة المتسعة الموضوعة تحت ذلك المفتاح وعندها يحصل التعرف على الحرف المطلوب بتعيين الحرف في اللوحة.", "kw": [["البعد", "المسافه"], ["الصفيحتين", "صفيحتي"], ["تزداد", "تتغير", "يقل"], ["السعه"], ["التعرف", "الحرف", "تعيين"]], "id": "c1k112"}, {"ch": 1, "k": "k", "topic": "المتسعة الموضوعة في لوحة المفاتيح الحاسوب", "yrs": "1/2017 تطبيقي", "q": "ماذا يحصل عند الضغط على أحد المفاتيح الحاسوب؟", "a": "عند الضغط على المفتاح يقل البعد بين صفيحتي المتسعة فتزداد سعتها وهذا يجعل الدوائر الخارجية تتعرف على المفتاح الذي تم الضغط عليه.", "kw": [["يقل البعد", "البعد", "المسافه"], ["صفيحتي", "الصفيحتين"], ["تزداد", "سعتها", "السعه"], ["الدوائر الخارجيه", "الدوائر", "تتعرف"]], "id": "c1k113"}, {"ch": 1, "k": "k", "topic": "المتسعة الموضوعة في لوحة المفاتيح الحاسوب", "yrs": "1/2022 · 1/2023 تطبيقي", "q": "كيف يمكن للدوائر الإلكترونية الخارجية التعرف على المفتاح الذي تم الضغط عليه في لوحة مفاتيح الحاسوب؟ (أو) وضح كيف تعمل المتسعة المستعملة في لوحة مفاتيح الحاسوب؟", "a": "توضع متسعة تحت كل حرف من الحروف في لوح المفاتيح اذا يثبت كل مفتاح بصفيحة متحركة تمثل احدى صفيحتين والصفيحة الأخرى ثابتة في قاعدة المفتاح وعند الضغط يقل البعد الفاصل بين صفيحتي المتسعة فتزداد سعتها.", "kw": [["متسعه تحت", "تحت كل حرف", "تحت كل مفتاح"], ["صفيحه متحركه", "متحركه"], ["ثابته", "قاعده"], ["يقل البعد", "البعد"], ["تزداد", "سعتها"]], "id": "c1k114"}, {"ch": 1, "k": "k", "topic": "بعض التطبيقات العملية للمتسعة", "yrs": "أسئلة الفصل · 2/2014 · 2018 تمهيدي · 2/2020 · 2/2022 · 1/2022 تطبيقي · 3/2018", "q": "أذكر ثلاثة تطبيقات عملية للمتسعة، ووضح الفائدة العملية من استعمال تلك المتسعة في كل تطبيق. (أو) أذكر اثنين من التطبيقات العملية للمتسعة ذاكراً الفائدة العملية من استعمال تلك المتسعة في كل تطبيق تذكره.", "a": "<b>1)</b> المتسعة الموضوعة في منظومة المصباح الوميضي في آلة التصوير.<br>فائدتها: تجهيز المصباح بطاقة تكفي لتوهجه بصورة مفاجئة بضوء ساطع اثناء تفريغ المتسعة من شحنتها.<br><b>2)</b> المتسعة الموضوعة في اللاقطة الصوتية.<br>فائدتها: تحول الذبذبات الميكانيكية الى ذبذبات كهربائية وبا لتردد نفسه.<br><b>3)</b> المتسعة الموضوعة في جهاز تحفيز وتنظيم حركة عضلات القلب.<br>فائدتها: تفرغ طاقتها الكبيرة والمختزنة فيها في جسم المريض بفترة زمنية قصيرة جداً بواسطة صدمة كهربائية فتحفز القلب وتعيد انتظام عمله.", "kw": [["المصباح الوميضي", "الكاميرا", "الكامره", "اله التصوير"], ["اللاقطه الصوتيه", "اللاقطه", "المايكروفون"], ["تحفيز", "القلب", "عضلات القلب"], ["طاقه", "توهج", "ذبذبات", "صدمه"]], "id": "c1k115"}, {"ch": 1, "k": "k", "topic": "بعض التطبيقات العملية للمتسعة", "yrs": "1/2014", "q": "ما الفائدة العلمية من وجود المتسعة في اللاقطة الصوتية وفي منظومة المصباح الوميضي.", "a": "في اللاقطة الصوتية: فائدتها تحويل الذبذبات الميكانيكية الى ذبذبات كهربائية وبا لتردد نفسه.<br>في المصباح الوميضي: فائدتها تجهيز المصباح بطاقة تكفي لتوهجه بصورة مفاجئة بضوء ساطع اثناء تفريغ المتسعة من شحنتها.", "kw": [["اللاقطه", "الصوتيه"], ["تحويل", "ذبذبات ميكانيكيه"], ["ذبذبات كهربائيه", "كهربائيه"], ["المصباح الوميضي", "الوميضي"], ["طاقه", "توهج", "ساطع", "مفاجئه"]], "id": "c1k116"}, {"ch": 1, "k": "p", "topic": "المسائل الحسابية - ربط مختلط", "yrs": "3/2024 · 1/2024", "q": "المتسعة (C₁) موصولة على التوالي مع المتسعة (C₂ = 20 μF) والبعد بين صفيحتي المتسعة الثانية (0.6 mm) والمجموعة المتوالية ربطت على التوازي مع متسعة (C₃ = 6 μF)، شحن الجميع إلى مصدر فولطية فأصبح مقدار المجال الكهربائي بين صفيحتي المتسعة الثانية (5×10³ V/m) ومقدار الطاقة المختزنة في المجال الكهربائي للمتسعة الأولى (360×10⁻⁶ J). احسب: (1) سعة المتسعة المجهولة C₁. (2) شحنة وفرق جهد كل متسعة. (3) فرق جهد المصدر.", "parts": [{"l": "سعة المتسعة C₁", "v": [5, 5e-06], "u": "μF"}, {"l": "شحنة المتسعة الثانية", "v": [60, 6e-05], "u": "μC"}, {"l": "فرق جهد المتسعة الأولى", "v": [12], "u": "V"}, {"l": "شحنة المتسعة الثالثة", "v": [90, 9e-05], "u": "μC"}, {"l": "فرق جهد المصدر", "v": [15], "u": "V"}], "a": "<b>المعطيات:</b> C₂ = 20 μF، بعد الفجوة d₂ = 0.6 mm = 6×10⁻⁴ m، E₂ = 5×10³ V/m، PE₁ = 360×10⁻⁶ J، C₃ = 6 μF. المجموعة (C₁ مع C₂ على التوالي) موصولة على التوازي مع C₃.<br>\n<b>(2) فرق الجهد والشحنة للمتسعة C₂ (أولاً لأنها المعطى):</b><br>\n<span class=\"m\">ΔV₂ = E₂·d₂ = 5×10³ × 6×10⁻⁴ = 3 V</span><br>\n<span class=\"m\">Q₂ = C₂·ΔV₂ = 20×10⁻⁶ × 3 = 60 μC</span><br>\n<b>(1) سعة C₁ من طاقتها:</b> المتسعتان على التوالي فشحنتهما متساوية: Q₁ = Q₂ = 60 μC<br>\n<span class=\"m\">PE₁ = Q²/(2C₁) ⇒ C₁ = Q²/(2·PE₁) = (60×10⁻⁶)² / (2 × 360×10⁻⁶)</span><br>\n<span class=\"m\">= 3.6×10⁻⁹ / 7.2×10⁻⁴ = 5×10⁻⁶ F</span><br>\n<span class=\"res\">C₁ = 5 μF</span><br>\n<b>فرق الجهد على C₁:</b> <span class=\"m\">ΔV₁ = Q/C₁ = 60/5 = 12 V</span><br>\n<b>(3) فرق جهد المصدر:</b> المجموعة المتوالية على التوازي مع C₃ فيكون فرق جهد المصدر مساوياً لمجموع ΔV₁ و ΔV₂:<br>\n<span class=\"m\">V = 12 + 3 = 15 V</span><br>\n<b>شحنة C₃:</b> <span class=\"m\">Q₃ = 6 × 15 = 90 μC</span><br>\n<span class=\"res\">C₁ = 5 μF ، Q₁ = Q₂ = 60 μC ، ΔV₁ = 12 V ، ΔV₂ = 3 V ، Q₃ = 90 μC ، ΔV₃ = 15 V ، فرق جهد المصدر = 15 V</span>", "id": "c1p117"}, {"ch": 1, "k": "p", "topic": "المسائل الحسابية - ربط مختلط", "yrs": "1/2025 · 2/2025", "q": "متسعتان (C₁ = 6 μF , C₂ = 3 μF) ربطتا على التوالي بين قطبي بطارية فرق الجهد بينهما (90 V) كما في الشكل (a)، فإذا فصلتا عن بعضهما وعن البطارية دون ضياع في الطاقة ثم أعيد ربطهما مع بعض كما في الشكل (b)، ما مقدار الشحنة المختزنة في أي من صفيحتي كل متسعة في الشكلين (a) و(b)؟", "parts": [{"l": "شحنة كل متسعة في الشكل (a)", "v": [180, 0.00018], "u": "μC"}, {"l": "شحنة المتسعة الأولى في الشكل (b)", "v": [240, 0.00024], "u": "μC"}, {"l": "شحنة المتسعة الثانية في الشكل (b)", "v": [120, 0.00012], "u": "μC"}], "a": "<b>المعطيات:</b> C₁ = 6 μF، C₂ = 3 μF، موصولتان على التوالي بين قطبي بطارية 90 V (الشكل a).<br>\n<b>الشكل (a) – التوالي:</b><br>\n<span class=\"m\">C<sub>eq</sub> = 6×3/9 = 2 μF</span> ، <span class=\"m\">Q = 2 × 90 = 180 μC</span> لكل متسعة<br>\n<span class=\"res\">الشكل (a): Q₁ = 180 μC ، Q₂ = 180 μC</span><br>\n<b>الشكل (b) – إعادة الربط بالتوازي (بافتراض أن الصفائح الموجبة توصل معاً والسالبة معاً):</b><br>\nالشحنة الكلية على الصفيحتين الموصولتين معاً = 180 + 180 = 360 μC (الشحنة الكلية محفوظة)<br>\nC<sub>eq</sub> = 6 + 3 = 9 μF، فرق الجهد المشترك: <span class=\"m\">V = 360/9 = 40 V</span><br>\n<span class=\"m\">Q₁ = 6 × 40 = 240 μC</span> ، <span class=\"m\">Q₂ = 3 × 40 = 120 μC</span><br>\n<span class=\"res\">الشكل (b): Q₁ = 240 μC ، Q₂ = 120 μC</span><br>\n<i>ملاحظة: إذا كان ترتيب الأقطاب في الشكل (b) مختلفاً، تتغير الأرقام؛ أرسل لي صورة الشكل لأتأكد.</i>", "id": "c1p118"}, {"ch": 1, "k": "p", "topic": "المسائل الحسابية - ربط مختلط", "yrs": "2/2025 · 1/2025", "q": "في الشكل المجاور (الدائرة فيها ست متسعات بقيم مبينة): (1) احسب مقدار السعة المكافئة للمجموعة. (2) سلط فرق جهد كهربائي مستمر بين النقطتين (a) و(b) فأصبح مقدار الشحنة الكلية المختزنة في المجموعة (400 μC)، فما مقدار الشحنة المختزنة في كل متسعة؟ (3) احسب الطاقة المختزنة في المجال الكهربائي بين صفيحتي المتسعة (C₃).", "parts": [{"l": "السعة المكافئة", "v": [20, 2e-05], "u": "μF"}, {"l": "شحنة المتسعة C₁,₂", "v": [40, 4e-05], "u": "μC"}, {"l": "شحنة المتسعة C₃", "v": [240, 0.00024], "u": "μC"}, {"l": "شحنة المتسعتين C₄,₅", "v": [120, 0.00012], "u": "μC"}, {"l": "طاقة المتسعة C₃", "v": [2400, 0.0024], "u": "μJ"}], "a": "هذا السؤال يعتمد على قيم الشكل الأصلي، وسيُضاف حله الكامل عند توفر تلك القيم.", "id": "c1p119"}, {"ch": 1, "k": "p", "topic": "المسائل الحسابية - ربط مختلط", "yrs": "2/2014 أسئلة النازحين · 3/2016", "q": "متسعتان (C₁ = 26 μF , C₂ = 18 μF) مربوطتان على التوازي ربطت المجموعة إلى مصدر فرق الجهد بين قطبيه (50 V)، ثم أدخل لوح من مادة عازلة ثابت عزلها k بين صفيحتي المتسعة الأولى وما زالت المجموعة مربوطة بالبطارية، فإذا كانت الشحنة الكلية (3500 μC) احسب: (a) ثابت العزل k. (b) الشحنة المختزنة في أي من صفيحتي كل متسعة بعد إدخال العازل.", "parts": [{"l": "ثابت العزل k", "v": [2], "u": ""}, {"l": "شحنة المتسعة الأولى بعد العازل", "v": [2600, 0.0026], "u": "μC"}, {"l": "شحنة المتسعة الثانية بعد العازل", "v": [900, 0.0009], "u": "μC"}], "a": "<b>المعطيات:</b> C₁ = 26 μF، C₂ = 18 μF على التوازي، ΔV = 50 V (المجموعة متصلة بالمصدر)، الشحنة الكلية بعد العازل 3500 μC.<br>\n<b>(a) ثابت العزل:</b><br>\nΔV ثابت لأن المجموعة متصلة بالمصدر. السعة الكلية بعد العازل:<br>\n<span class=\"m\">C<sub>T</sub> = Q<sub>T</sub>/ΔV = 3500 / 50 = 70 μF</span><br>\n<span class=\"m\">C<sub>T</sub> = K·C₁ + C₂ ⇒ 70 = 26K + 18</span><br>\n<span class=\"m\">26K = 52</span><br>\n<span class=\"res\">K = 2</span><br>\n<b>(b) الشحنة على كل متسعة:</b><br>\n<span class=\"m\">Q₁ = K·C₁·ΔV = 2 × 26 × 50</span><br>\n<span class=\"res\">Q₁ = 2600 μC</span><br>\n<span class=\"m\">Q₂ = C₂·ΔV = 18 × 50</span><br>\n<span class=\"res\">Q₂ = 900 μC</span><br>\nتحقق: Q₁ + Q₂ = 3500 μC ✓", "id": "c1p120"}, {"ch": 1, "k": "k", "topic": "بعض أنواع المتسعات", "yrs": "2017 تمهيدي · 2019 · 2020 · 1/2022", "q": "ما ميزة المتسعة ذات الورق المشمع؟", "a": "(1) صغر حجمها. (2) كبر مساحة صفائحها.", "kw": [["صغر", "صغير"], ["مساحه", "مساحة"]], "id": "c1k121"}, {"ch": 1, "k": "k", "topic": "المتسعة متغيرة السعة ذات الصفائح الدوارة", "yrs": "2017 · 2022 تمهيدي · 3/2023 تكميلي", "q": "مم تتألف المتسعة متغيرة السعة ذات الصفائح الدوارة؟", "a": "تتألف من مجموعتين من الصفائح بشكل أنصاف أقراص، إحدى المجموعتين ثابتة والأخرى يمكنها الدوران حول محور ثابت، وتربط المجموعتان بين قطبي بطارية عند شحنها.", "kw": [["مجموعتين"], ["صفائح"], ["دوران", "يدور", "تدور"], ["ثابت"]], "id": "c1k122"}, {"ch": 1, "k": "k", "topic": "المتسعة متغيرة السعة ذات الصفائح الدوارة", "yrs": "3/2020 تطبيقي", "q": "أين تستعمل المتسعة متغيرة السعة ذات الصفائح الدوارة؟", "a": "تستعمل في دائرة التنظيم في اللاسلكي والمذياع سابقاً.", "kw": [["تنظيم"], ["لاسلكي", "راديو", "مذياع"]], "id": "c1k123"}, {"ch": 1, "k": "k", "topic": "المتسعة متغيرة السعة ذات الصفائح الدوارة", "yrs": "2021 تمهيدي · 2024 تمهيدي", "q": "هل المتسعات المؤلفة من صفائح دوارة مربوطة على التوازي أم على التوالي؟ وضح ذلك.", "a": "تكون مربوطة على التوازي، إذ تتألف من مجموعتين من الصفائح تشكل كل مجموعة متسعة ومجموعة الصفائح المتحركة يمكنها الدوران حول محور، فهي تكافئ مجموعة من المتسعات المتوازية الربط، فتتغير سعتها أثناء الدوران نتيجة تغير المساحة السطحية المتقابلة للصفائح، ويفصل بين كل صفيحتين الهواء كعازل كهربائي.", "kw": [["توازي"], ["مساحه", "سطحيه"], ["هواء", "عازل"]], "id": "c1k124"}, {"ch": 1, "k": "k", "topic": "المتسعة الالكتروليتية", "yrs": "1/2016 · 2/2020 · 2/2024 محاولات", "q": "مم تتألف المتسعة الالكتروليتية؟ وبماذا تمتاز؟", "a": "تتألف من صفيحتين، إحداهما من الألمنيوم والأخرى عجينة الكتروليتية، وتتولد المادة العازلة نتيجة التفاعل الكيميائي بين الألمنيوم والالكتروليت، وتلف الصفائح بشكل اسطواني. وتمتاز بأنها: (1) تتحمل فرق جهد كهربائي عالٍ. (2) توضع علامة على طرفيها للدلالة على قطبيتها لتربط بقطبية صحيحة في الدائرة.", "kw": [["الومنيوم", "المنيوم", "الألمنيوم"], ["الكتروليت", "عجينه"], ["جهد", "عالي", "عالى"], ["قطبيه", "قطب"]], "id": "c1k125"}, {"ch": 1, "k": "k", "topic": "دائرة تيار مستمر تتألف من مقاومة ومتسعة", "yrs": "2/2023 تطبيقي", "q": "ما المقصود بدائرة RC؟", "a": "دائرة تيار مستمر تحتوي على مقاومة ومتسعة ويكون تيارها متغيراً مع مرور الزمن، ومثالها دائرة شحن وتفريغ المتسعة.", "kw": [["مستمر"], ["مقاومه"], ["متسعه"], ["متغير", "يتغير"]], "id": "c1k126"}, {"ch": 1, "k": "k", "topic": "دائرة تيار مستمر تتألف من مقاومة ومتسعة", "yrs": "1/2014 · 3/2016 · 1/2019 · 1/2023 · 2/2013", "q": "اذكر نشاطاً يوضح كيفية شحن المتسعة مع رسم الدائرة الكهربائية اللازمة لإجراء هذا النشاط، ورسم المخطط البياني الذي يبين العلاقة بين تيار الشحن والزمن المستغرق.", "a": "<b>أدوات النشاط:</b> متسعة ذات الصفيحتين المتوازيتين (الهواء عازل بينهما)، بطارية فولطيتها مناسبة، كلفانومتر (G) صفره في وسط التدريجة، مفتاح مزدوج (K)، مقاومة ثابتة (R)، مصباحان (L₁ و L₂)، أسلاك توصيل.<br><b>الرسم التخطيطي للدائرة:</b><svg viewBox=\"0 0 300 180\" style=\"max-width:340px;width:100%;display:block;margin:8px 0\" role=\"img\" aria-label=\"رسم الدائرة\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"40\" y=\"30\" width=\"220\" height=\"120\" rx=\"4\"/></g><g font-family=\"Almarai,Arial\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\"><rect x=\"16\" y=\"66\" width=\"48\" height=\"36\" fill=\"#0c1233\" stroke=\"currentColor\"/><text x=\"40\" y=\"88\">بطارية</text><rect x=\"112\" y=\"16\" width=\"76\" height=\"24\" fill=\"#0c1233\" stroke=\"currentColor\"/><text x=\"150\" y=\"33\">K (الموقع 1)</text><rect x=\"258\" y=\"66\" width=\"30\" height=\"36\" fill=\"#0c1233\" stroke=\"currentColor\"/><text x=\"273\" y=\"88\">C</text><rect x=\"132\" y=\"132\" width=\"48\" height=\"24\" fill=\"#0c1233\" stroke=\"currentColor\"/><text x=\"156\" y=\"149\">R</text><circle cx=\"90\" cy=\"30\" r=\"0\"/><circle cx=\"210\" cy=\"30\" r=\"0\"/><text x=\"150\" y=\"150\" font-size=\"12\">مع الكلفانومتر G والمصباحين L₁ و L₂</text></g></svg><b>خطوات النشاط:</b><br>1) نربط الدائرة الكهربائية كما في الشكل والمفتاح (K) في الموقع (1)، فتنساب شحنة من البطارية إلى المتسعة.<br>2) نلاحظ انحراف مؤشر الكلفانومتر (G) إلى أحد جانبي صفر التدريجة، ثم عوده تدريجياً نحو الصفر.<br>3) نلاحظ توهج المصباح (L₁) بضوء ساطع لبرهة من الزمن ثم ينطفئ، لأن المتسعة أصبحت مشحونة بكامل شحنتها.<br><b>المخطط البياني:</b><svg viewBox=\"0 0 270 175\" style=\"max-width:300px;width:100%;display:block;margin:8px 0\" role=\"img\" aria-label=\"المخطط البياني\"><path d=\"M40 20V155H255\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><polyline points=\"40.0,40.0 43.4,48.8 46.8,56.9 50.2,64.3 53.6,71.2 57.0,77.5 60.4,83.3 63.8,88.6 67.2,93.5 70.6,98.0 74.0,102.2 77.4,106.0 80.8,109.5 84.2,112.8 87.6,115.7 91.0,118.5 94.4,121.0 97.8,123.3 101.2,125.5 104.6,127.4 108.0,129.2 111.4,130.9 114.8,132.4 118.2,133.8 121.6,135.1 125.0,136.3 128.4,137.4 131.8,138.4 135.2,139.3 138.6,140.2 142.0,141.0 145.4,141.7 148.8,142.4 152.2,143.0 155.6,143.5 159.0,144.0 162.4,144.5 165.8,145.0 169.2,145.4 172.6,145.7 176.0,146.1 179.4,146.4 182.8,146.7 186.2,146.9 189.6,147.2 193.0,147.4 196.4,147.6 199.8,147.8 203.2,148.0 206.6,148.1 210.0,148.3 213.4,148.4 216.8,148.6 220.2,148.7 223.6,148.8 227.0,148.9 230.4,149.0 233.8,149.0 237.2,149.1 240.6,149.2 244.0,149.3 247.4,149.3\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2.6\"/><text x=\"8\" y=\"28\" font-size=\"12\" fill=\"currentColor\">I (تيار الشحن)</text><text x=\"8\" y=\"44\" font-size=\"11\" fill=\"currentColor\">I₀</text><text x=\"246\" y=\"170\" font-size=\"12\" fill=\"currentColor\">t</text></svg><b>الاستنتاج:</b> يمر في الدائرة تيار لحظي يسمى تيار الشحن، يبدأ بقيمة كبيرة لحظة إغلاق الدائرة <span class=\"m\">I₀ = ΔV/R</span> ثم يتناقص بسرعة إلى الصفر بعد اكتمال شحن المتسعة، ويكون فرق جهد المتسعة في تلك اللحظة مساوياً لفرق جهد البطارية.", "kw": [["شحن"], ["تيار"], ["كبير", "عالي"], ["يتناقص", "ينخفض", "تناقص"], ["الصفر"]], "id": "c1k127"}, {"ch": 1, "k": "k", "topic": "دائرة تيار مستمر تتألف من مقاومة ومتسعة", "yrs": "2/2021 تمهيدي · 2/2024 تمهيدي · 1/2023 · 2/2024 محاولات", "q": "وضح بنشاط كيفية تفريغ المتسعة؟ وارسم المخطط البياني الذي يبين العلاقة بين تيار التفريغ والزمن.", "a": "<b>أدوات النشاط:</b> بطارية، كلفانومتر (G) صفره في وسط التدريجة، متسعة (C) مشحونة، مفتاح مزدوج (K)، مقاومة (R)، مصباحان (L₁ و L₂)، أسلاك توصيل.<br><b>الرسم التخطيطي للدائرة:</b><svg viewBox=\"0 0 300 180\" style=\"max-width:340px;width:100%;display:block;margin:8px 0\" role=\"img\" aria-label=\"رسم الدائرة\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"40\" y=\"30\" width=\"220\" height=\"120\" rx=\"4\"/></g><g font-family=\"Almarai,Arial\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\"><rect x=\"16\" y=\"66\" width=\"48\" height=\"36\" fill=\"#0c1233\" stroke=\"currentColor\"/><text x=\"40\" y=\"88\">بطارية</text><rect x=\"112\" y=\"16\" width=\"76\" height=\"24\" fill=\"#0c1233\" stroke=\"currentColor\"/><text x=\"150\" y=\"33\">K (الموقع 2)</text><rect x=\"258\" y=\"66\" width=\"30\" height=\"36\" fill=\"#0c1233\" stroke=\"currentColor\"/><text x=\"273\" y=\"88\">C</text><rect x=\"132\" y=\"132\" width=\"48\" height=\"24\" fill=\"#0c1233\" stroke=\"currentColor\"/><text x=\"156\" y=\"149\">R</text><circle cx=\"90\" cy=\"30\" r=\"0\"/><circle cx=\"210\" cy=\"30\" r=\"0\"/><text x=\"150\" y=\"150\" font-size=\"12\">مع الكلفانومتر G والمصباحين L₁ و L₂</text></g></svg><b>خطوات النشاط:</b><br>1) نربط الدائرة كما في الشكل والمفتاح (K) في الموقع (2)، فتتعادل شحنة صفيحتي المتسعة عبر الدائرة.<br>2) نلاحظ انحراف مؤشر الكلفانومتر إلى الجانب الآخر من صفر التدريجة، ثم عوده بسرعة نحو الصفر.<br>3) نلاحظ توهج المصباح (L₂) في الوقت نفسه بضوء ساطع ثم انطفاؤه.<br><b>المخطط البياني:</b><svg viewBox=\"0 0 270 175\" style=\"max-width:300px;width:100%;display:block;margin:8px 0\" role=\"img\" aria-label=\"المخطط البياني\"><path d=\"M40 20V155H255\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><polyline points=\"40.0,40.0 43.4,48.8 46.8,56.9 50.2,64.3 53.6,71.2 57.0,77.5 60.4,83.3 63.8,88.6 67.2,93.5 70.6,98.0 74.0,102.2 77.4,106.0 80.8,109.5 84.2,112.8 87.6,115.7 91.0,118.5 94.4,121.0 97.8,123.3 101.2,125.5 104.6,127.4 108.0,129.2 111.4,130.9 114.8,132.4 118.2,133.8 121.6,135.1 125.0,136.3 128.4,137.4 131.8,138.4 135.2,139.3 138.6,140.2 142.0,141.0 145.4,141.7 148.8,142.4 152.2,143.0 155.6,143.5 159.0,144.0 162.4,144.5 165.8,145.0 169.2,145.4 172.6,145.7 176.0,146.1 179.4,146.4 182.8,146.7 186.2,146.9 189.6,147.2 193.0,147.4 196.4,147.6 199.8,147.8 203.2,148.0 206.6,148.1 210.0,148.3 213.4,148.4 216.8,148.6 220.2,148.7 223.6,148.8 227.0,148.9 230.4,149.0 233.8,149.0 237.2,149.1 240.6,149.2 244.0,149.3 247.4,149.3\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2.6\"/><text x=\"8\" y=\"28\" font-size=\"12\" fill=\"currentColor\">I (تيار التفريغ)</text><text x=\"8\" y=\"44\" font-size=\"11\" fill=\"currentColor\">I₀</text><text x=\"246\" y=\"170\" font-size=\"12\" fill=\"currentColor\">t</text></svg><b>الاستنتاج:</b> يسمى التيار اللحظي تيار التفريغ، ويتلاشى بسرعة عندما لا يتوفر فرق جهد بين صفيحتي المتسعة أي <span class=\"m\">ΔV<sub>AB</sub> = 0 V</span>، وتكون ملاحظة المخطط ضرورية لأن الطالب لا يُحاسب بدونه.", "kw": [["تفريغ"], ["تيار"], ["يتلاشى", "يتلاشي", "ينعدم", "صفر"], ["مصباح", "توهج"]], "id": "c1k128"}, {"ch": 1, "k": "k", "topic": "دائرة تيار مستمر تتألف من مقاومة ومتسعة", "yrs": "2/2024 · 1/2015", "q": "علل: المتسعة الموضوعة في دائرة التيار المستمر تعد مفتاحاً مفتوحاً.", "a": "لأن المتسعة عندما تشحن بكامل شحنتها يكون جهد كل صفيحة منها مساوياً لجهد القطب المتصل بها من البطارية، وهذا يجعل فرق الجهد بين طرفي المقاومة صفراً، فيكون التيار في الدائرة صفراً (I = 0)، لذا تعتبر المتسعة مفتاحاً مفتوحاً.", "kw": [["شحن"], ["جهد"], ["صفر"], ["مفتاح مفتوح", "مفتوح"]], "id": "c1k129"}, {"ch": 1, "k": "k", "topic": "دائرة تيار مستمر تتألف من مقاومة ومتسعة", "yrs": "2013 تمهيدي", "q": "ارسم مخططاً بيانياً تبين فيه العلاقة بين تيار التفريغ للمتسعة والزمن المستغرق للتفريغ؟", "a": "منحنى يبدأ من I = ΔV/R عند الزمن صفر ويتناقص بشكل سريع حتى يصل إلى الصفر.", "kw": [["منحنى", "بياني", "رسم"], ["يتناقص", "ينخفض", "تناقص"], ["صفر"]], "id": "c1k130"}, {"ch": 1, "k": "k", "topic": "المتسعة ذات الصفيحتين المتوازيتين", "yrs": "اشتقاق مقرر", "q": "اشتق علاقة سعة المتسعة ذات الصفيحتين المتوازيتين C = ε₀A/d.", "a": "<b>1)</b> المجال بين الصفيحتين (حسب قانون غاوس): <span class=\"m\">E = σ/ε₀ = Q/(Aε₀)</span><br><b>2)</b> فرق الجهد: <span class=\"m\">ΔV = E·d = Qd/(Aε₀)</span><br><b>3)</b> السعة: <span class=\"m\">C = Q/ΔV = Q / (Qd/(Aε₀)) = ε₀A/d</span>", "kw": [["مجال", "E"], ["sigma", "σ", "Q/A", "Q/(A"], ["ΔV", "فرق الجهد", "E·d", "Ed"], ["ε₀A/d", "A/d", "ε0A"]], "id": "c1k131"}, {"ch": 1, "k": "k", "topic": "الطاقة المختزنة في المتسعة", "yrs": "اشتقاق مقرر", "q": "اشتق علاقة الطاقة المختزنة في المتسعة PE = ½CΔV².", "a": "dW = (q/C)·dq، لأن الشغل المبذول لنقل شحنة dq عبر فرق الجهد v = q/C. PE = ∫₀^Q (q/C) dq = Q²/2C. وبما أن Q = CΔV فإن PE = ½CΔV² = ½QΔV.", "kw": [["q/C"], ["Q²/2C", "Q2/2C", "Q²/2KC", "Q²/2", "Q2/2"], ["½CΔV²", "CΔV²", "ΔV²", "1/2CΔV²", "0.5CΔV²"]], "id": "c1k132"}, {"ch": 1, "k": "k", "topic": "ثابت العزل", "yrs": "اشتقاق مقرر", "q": "اشتق العلاقة بين ثابت العزل وفرق الجهد: K = ΔV / ΔV<sub>k</sub> = E / E<sub>k</sub>.", "a": "داخل العازل يتولد مجال مستحث E_d يعاكس E، فيصبح E_k = E − E_d = E/K. وبما أن ΔV = E·d و ΔV_k = E_k·d = ΔV/K، إذن K = ΔV/ΔV_k = E/E_k.", "kw": [["E − E", "E-Ed", "E−Ed", "E_d", "Ed"], ["E/K", "E / K", "E/k"], ["ΔV/K", "ΔV / K", "ΔV/k"], ["ΔV / ΔV", "ΔV/ΔV", "K = ΔV", "K=ΔV"]], "id": "c1k133"}, {"ch": 1, "k": "k", "topic": "المتسعة بوجود العازل", "yrs": "اشتقاق مقرر", "q": "اشتق علاقة سعة المتسعة بوجود العازل C<sub>k</sub> = K·C.", "a": "عند ثبوت الشحنة Q: C_k = Q/ΔV_k. وبما أن ΔV_k = ΔV/K فإن C_k = Q·K/ΔV = K·C.", "kw": [["Q/ΔV", "Q / ΔV", "Q/ΔVk", "Q / ΔVk"], ["ΔV/K", "ΔV / K", "ΔVk = ΔV"], ["K·C", "KC", "K C"]], "id": "c1k134"}, {"ch": 1, "k": "k", "topic": "الطاقة مع العازل", "yrs": "اشتقاق مقرر", "q": "اشتق علاقة الطاقة المختزنة في المتسعة بعد إدخال العازل عند ثبوت الشحنة: PE<sub>k</sub> = PE / K.", "a": "PE_k = Q²/2C_k = Q²/2KC = (1/K)·(Q²/2C) = PE/K.", "kw": [["Q²/2C", "Q^2/2C", "Q2/2C", "Q²/2KC", "Q2/2KC"], ["PE/K", "PE / K", "PE/k"]], "id": "c1k135"}, {"ch": 1, "k": "k", "topic": "الطاقة مع العازل", "yrs": "اشتقاق مقرر", "q": "اشتق علاقة الطاقة المختزنة في المتسعة بعد إدخال العازل عند ثبوت فرق الجهد: PE<sub>k</sub> = K·PE.", "a": "<span class=\"m\">PE<sub>k</sub> = ½C<sub>k</sub>ΔV² = ½KCΔV² = K·PE</span>", "kw": [["½KCΔV²", "KCΔV", "KC"], ["K·PE", "KPE", "K PE", "PE·K"]], "id": "c1k136"}, {"ch": 1, "k": "k", "topic": "ربط المتسعات على التوالي", "yrs": "اشتقاق مقرر", "q": "اشتق علاقة السعة المكافئة للمتسعات المربوطة على التوالي.", "a": "الشحنة على كل متسعة Q نفسها. فرق الجهد الكلي ΔV_T = ΔV₁ + ΔV₂ + …، وبما أن ΔV = Q/C فإن Q/C_eq = Q/C₁ + Q/C₂ + … ⇒ 1/C_eq = 1/C₁ + 1/C₂ + …", "kw": [["ΔV₁+ΔV₂", "ΔV₁ + ΔV₂", "ΔV1+ΔV2", "ΔV_T", "ΔVT", "فرق الجهد الكلي"], ["1/C", "1/c", "Q/C"], ["Q نفسها", "نفس الشحنة", "الشحنة نفسها", "الشحنة"]], "id": "c1k137"}, {"ch": 1, "k": "k", "topic": "ربط المتسعات على التوازي", "yrs": "اشتقاق مقرر", "q": "اشتق علاقة السعة المكافئة للمتسعات المربوطة على التوازي.", "a": "المتسعات متوازية: فرق الجهد على كل منها ΔV نفسه، والشحنة الكلية: <span class=\"m\">Q<sub>T</sub> = Q₁ + Q₂ + …</span><br><span class=\"m\">C<sub>eq</sub>ΔV = C₁ΔV + C₂ΔV + …</span><br><span class=\"m\">C<sub>eq</sub> = C₁ + C₂ + …</span>", "kw": [["Q₁+Q₂", "Q1+Q2", "Q_T", "QT", "Q T", "Q₁ + Q₂", "Q1 + Q2"], ["Ceq", "C_eq", "C eq", "C1+C2", "C₁+C₂", "C₁ + C₂", "C1 + C2"], ["ΔV نفسه", "نفس فرق الجهد", "فرق الجهد نفسه", "فرق الجهد"]], "id": "c1k138"}, {"ch": 1, "k": "k", "topic": "العازل الكهربائي", "yrs": "1/2023 تطبيقي · 3/2013 · 3/2015 · 3/2023 · 2/2025", "q": "اذكر نشاط يبين تأثير إدخال العازل الكهربائي بين صفيحتي متسعة مشحونة ومفصولة عن البطارية في فرق الجهد وفي سعة المتسعة (تجربة فاراداي).", "a": "<b>أدوات النشاط:</b> متسعة ذات الصفيحتين المتوازيتين (الهواء عازل بينهما) مشحونة ومفصولة عن البطارية، فولتميتر، أسلاك توصيل، لوح من مادة عازلة ثابت عزلها K.<br><b>الرسم التخطيطي:</b><svg viewBox=\"0 0 300 190\" style=\"max-width:340px;width:100%;display:block;margin:8px 0\" role=\"img\" aria-label=\"رسم المتسعة مع العازل\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"92\" y=\"34\" width=\"10\" height=\"110\" fill=\"currentColor\"/><rect x=\"190\" y=\"34\" width=\"10\" height=\"110\" fill=\"currentColor\"/><rect x=\"120\" y=\"50\" width=\"48\" height=\"78\" stroke-dasharray=\"5 4\" fill=\"#fbbf2433\"/><path d=\"M102 90H190\" stroke-dasharray=\"2 0\" stroke=\"none\"/><path d=\"M97 34V12H250V150H200\" /><circle cx=\"250\" cy=\"90\" r=\"18\"/></g><g font-family=\"Almarai,Arial\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"97\" y=\"165\">صفيحة +Q</text><text x=\"195\" y=\"165\">صفيحة −Q</text><text x=\"144\" y=\"46\">عازل K</text><text x=\"250\" y=\"95\" font-size=\"12\">V</text><text x=\"250\" y=\"130\" font-size=\"12\">فولتميتر</text></g></svg><b>خطوات النشاط:</b><br>1) نربط أحد قطبي البطارية بإحدى الصفيحتين، ثم نربط الصفيحة الأخرى بالقطب الآخر، ونفصل البطارية عن المتسعة فتبقى الشحنة مختزنة (+Q و −Q).<br>2) نربط الفولتميتر بين صفيحتي المتسعة فيقرأ فرق الجهد <span class=\"m\">ΔV</span>.<br>3) ندخل اللوح العازل بين الصفيحتين فنلاحظ نقصان قراءة الفولتميتر.<br><b>الاستنتاج:</b> إدخال العازل يقلل فرق الجهد بين الصفيحتين بنسبة ثابت العزل، أي <span class=\"m\">ΔV<sub>k</sub> = ΔV / K</span>، ولأن الشحنة ثابتة فإن سعة المتسعة تزداد: <span class=\"m\">C<sub>k</sub> = K·C</span>.", "kw": [["ازاح", "فيلاحظ", "لاحظ", "نقصان", "يقل", "تقل"], ["فرق الجهد", "ΔV", "الفولتميتر"], ["K", "ثابت العزل"], ["C<sub>k</sub>", "KC", "K·C", "تزداد"]], "id": "c1k139"}, {"ch": 2, "k": "k", "topic": "تأثير المجالين الكهربائي والمغناطيسي في الجسيمات المشحونة المتحركة خلالهما", "yrs": "1/2013 · 2/2017 أحيائي", "q": "ماذا يحصل اذا تحرك جسيم مشحون بشحنة موجبة (q) باتجاه عمودي على خطوط مجال مغناطيسي منتظم كثافة فيضه (B)؟", "a": "سيتأثر الجسيم بقوة مغناطيسية بمستوي عمودي على الفيض المغناطيسي وينحرف الجسيم عن مساره الأصلي ويتخذ مساراً دائرياً، وفق العلاقة التالية:<br><span class=\"m\">F<sub>B</sub> = q (V × B)</span>", "kw": [["قوه مغناطيسيه", "قوه"], ["عمودي", "عموديه"], ["ينحرف", "انحراف"], ["دائري", "دائره", "دائريا"]], "id": "c2k140"}, {"ch": 2, "k": "k", "topic": "تأثير المجالين الكهربائي والمغناطيسي في الجسيمات المشحونة المتحركة خلالهما", "yrs": "2023 تمهيدي أحيائي", "q": "ما شكل المسار الذي يتخذه جسيم مشحون بشحنة موجبة عندما يتحرك باتجاه عمودي على فيض مغناطيسي (B) منتظم؟", "a": "مسار دائري. لأن القوة المغناطيسية F = qvB تكون عمودية على السرعة دائماً، فتغير اتجاه السرعة فقط ولا تغير مقدارها، فيتخذ الجسيم مساراً دائرياً.", "kw": [["دائري", "دائره", "دائريا"]], "id": "c2k141"}, {"ch": 2, "k": "k", "topic": "تأثير المجالين الكهربائي والمغناطيسي في الجسيمات المشحونة المتحركة خلالهما", "yrs": "3/2018 · 2/2024 محاولات · 3/2014 · 2021 تمهيدي · 3/2023 أحيائي · 3/2018 تطبيقي", "q": "ماذا يحصل اذا تحرك (أو قُذف) جسيم مشحون بشحنة موجبة (q) باتجاه عمودي على خطوط مجال كهربائي منتظم (E)؟ (أو: ماذا يحصل لجسيم مشحون بشحنة موجبة (q) عندما يتحرك بسرعة مقدارها (V) باتجاه عمودي على خطوط مجال كهربائي منتظم؟ أو: وضح كيف سيتأثر جسيم مشحون بشحنة موجبة عندما يتحرك الجسيم بإتجاه عمودي على خطوط مجال كهربائي منتظم.)", "a": "سيتأثر الجسيم بقوة كهربائية (F<sub>E</sub>) بمستوٍ موازٍ لخطوط المجال الكهربائي، وتعطى بالعلاقة:<br><span class=\"m\">F<sub>E</sub> = q E</span>", "kw": [["قوه كهربائيه", "قوه"], ["مواز", "موازيه", "بمستوي مواز"], ["خطوط المجال", "المجال الكهربائي"]], "id": "c2k142"}, {"ch": 2, "k": "k", "topic": "تأثير المجالين الكهربائي والمغناطيسي في الجسيمات المشحونة المتحركة خلالهما", "yrs": "3/2016 أسئلة خارج القطر · 1/2014 · 2/2017 أسئلة الأنبار · 2018 أسئلة الموصل · 2018 تمهيدي تطبيقي · 2/2021 تكميلي تطبيقي · 1/2020 تطبيقي", "q": "هل يمكن، مع التوضيح، معرفة فيما اذا كان مجالاً مغناطيسياً ام مجالاً كهربائياً موجود في حيز معين؟ (وضح كيف يمكنك عملياً معرفة فيما اذا كان مجالاً مغناطيسياً أم مجالاً كهربائياً موجود في حيز معين؟)", "a": "نعم يمكن ذلك: يتم ذلك بقذف جسيم مشحون داخل المجال، فإذا انحرف الجسيم بموازاة المجال فإن المجال الموجود في الحيز هو مجال كهربائي. أما إذا انحرف الجسيم المشحون باتجاه عمودي على المجال فإن المجال الموجود هو مجال مغناطيسي، اما اذا لم ينحرف الجسيم المشحون فإن المجال الموجود هو مجال مغناطيسي.", "kw": [["يقذف", "قذف", "نقذف", "اطلاق"], ["جسيم مشحون", "شحنه"], ["مواز", "بموازاه", "موازاه"], ["كهربائي"], ["عمودي"], ["مغناطيسي"]], "id": "c2k143"}, {"ch": 2, "k": "k", "topic": "تأثير المجالين الكهربائي والمغناطيسي في الجسيمات المشحونة المتحركة خلالهما", "yrs": "2/2019 أحيائي", "q": "وضح كيف يتأثر جسيم مشحون بشحنة موجبة (+q) عندما يقذف الجسيم باتجاه عمودي على خطوط مجال مغناطيسي منتظم كثافة فيضه (B) بسرعة (V)؟", "a": "عند قذف جسيم مشحون باتجاه عمودي على خطوط مجال مغناطيسي سوف يتأثر بقوة مغناطيسية (F<sub>B</sub>) بمستوى عمودي على ذلك الفيض وسينحرف الجسيم عن مساره الاصلي ويتخذ مساراً دائرياً لكون القوة المغناطيسية تؤثر باتجاه عمودي على متجه السرعة V.", "kw": [["قوه مغناطيسيه", "قوه"], ["عمودي"], ["ينحرف", "انحراف"], ["دائري", "دائره", "دائريا"]], "id": "c2k144"}, {"ch": 2, "k": "k", "topic": "تأثير المجالين الكهربائي والمغناطيسي في الجسيمات المشحونة المتحركة خلالهما", "yrs": "3/2016 · 3/2023 تطبيقي · 1/2024 محاولات", "q": "ما الكميات الفيزيائية التي تقاس بالوحدات الاتية؟ Weber / m² ، W/m² ، Tesla", "a": "كثافة الفيض المغناطيسي B. وحدتها Weber/m² وتسمى التسلا (T).", "kw": [["كثافه الفيض", "كثافه"], ["مغناطيسي", "الفيض"]], "id": "c2k145"}, {"ch": 2, "k": "k", "topic": "تأثير المجالين الكهربائي والمغناطيسي في الجسيمات المشحونة المتحركة خلالهما", "yrs": "2015 تمهيدي محافظة الانبار", "q": "اختر الإجابة الصحيحة من بين الاقواس: Weber / m² هي الوحدة الاساسية لقياس (الفيض المغناطيسي ، معامل الحث الذاتي ، كثافة الفيض المغناطيسي).", "opts": ["الفيض المغناطيسي", "معامل الحث الذاتي", "كثافة الفيض المغناطيسي"], "c": 2, "a": "وحدة Weber/m² هي وحدة كثافة الفيض المغناطيسي B (وتسمى التسلا). الجواب: كثافة الفيض المغناطيسي", "id": "c2k146"}, {"ch": 2, "k": "k", "topic": "تأثير المجالين الكهربائي والمغناطيسي في الجسيمات المشحونة المتحركة خلالهما", "yrs": "2015 تمهيدي", "q": "اختر الإجابة الصحيحة من بين الاقواس: وحدة قياس كثافة الفيض المغناطيسي هي: (weber . S , Weber / s , weber)", "opts": ["weber . S", "Weber / s", "weber", "ولا واحدة"], "c": 3, "a": "وحدة كثافة الفيض المغناطيسي Weber/m² (التسلا)، وهي غير موجودة بين الخيارات الثلاثة، لذلك الجواب: ولا واحدة", "id": "c2k147"}, {"ch": 2, "k": "k", "topic": "تأثير المجالين الكهربائي والمغناطيسي في الجسيمات المشحونة المتحركة خلالهما", "yrs": "1/2020 · 2/2024", "q": "اختر الإجابة الصحيحة من بين الاقواس: وحدة قياس كثافة ال
