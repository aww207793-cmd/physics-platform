قاومة صرف؟", "a": "1) منحنى موجب دائماً وشكله جيبي بضعف التردد. 2) تتغير القدرة بين المقدار الأعظم والصفر. 3) القدرة تُستهلك بشكل حرارة في المقاومة. 4) القدرة المتوسطة تساوي نصف القدرة العظمى.", "kw": [["موجب", "موجبة", "دائماً"], ["الأعظم", "أعظم", "المقدار الاعظم"], ["حرارة"], ["نصف"]], "ch": 3, "id": "c3k005"}, {"k": "k", "topic": "التيار المتناوب", "yrs": "وزاري", "q": "اختر الإجابة الصحيحة: في دائرة تيار متناوب تحتوي مقاومة صرف، ما قيمة متوسط التيار (على دورة كاملة)؟", "opts": ["صفر", "نصف المقدار الأعظم للتيار", "المقدار الأعظم للتيار", "المقدار المؤثر للتيار"], "c": 0, "a": "متوسط التيار على دورة كاملة يساوي صفراً لأن التيار يتناوب بين موجب وسالب بالتساوي، أما متوسط القدرة فيساوي نصف القدرة العظمى.", "ch": 3, "id": "c3k006"}, {"k": "k", "topic": "المقدار المؤثر", "yrs": "وزاري", "q": "ما المقصود بالمقدار المؤثر للتيار المتناوب؟", "a": "هو مقدار التيار المستمر المساوي الذي لو انساب في مقاومة معينة فإنه يولد التأثير الحراري نفسه الذي يولده التيار المتناوب المنساب خلال المقاومة نفسها وللفترة الزمنية نفسها.", "kw": [["التيار المستمر", "مستمر"], ["التأثير الحراري", "حراري", "حرارية"], ["المقاومة نفسها", "المقاومة"], ["الفترة الزمنية", "الزمنية"]], "ch": 3, "id": "c3k007"}, {"k": "k", "topic": "المقدار المؤثر", "yrs": "وزاري", "q": "هل يمكن استعمال أجهزة قياس التيار المستمر في دوائر التيار المتناوب؟ ولماذا؟", "a": "لا يمكن ذلك، لأن معظم أجهزة قياس التيار المستمر تقيس المقدار المتوسط للتيار المتناوب، لذا فإن مؤشرها يقف عند تدريجة الصفر عند وضعها في التيار المتناوب.", "kw": [["لا", "لا يمكن"], ["المتوسط", "المقدار المتوسط"], ["الصفر", "تدريجة"]], "ch": 3, "id": "c3k008"}, {"k": "k", "topic": "المقدار المؤثر", "yrs": "وزاري", "q": "علل: القدرة المتبددة بواسطة التيار المتناوب لها مقدار أعظم لا تساوي القدرة التي ينتجها تيار مستمر يمتلك نفس المقدار؟", "a": "لأن التيار المتناوب دوري يتغير مع الزمن بين قيمة عظمى موجبة وقيمة عظمى سالبة (−Im، +Im)، ومقداره عند أي لحظة لا يساوي دائماً مقداره الأعظم، وإنما يساويه فقط عند لحظة معينة، في حين أن التيار المستمر مقداره ثابت.", "kw": [["دوري", "يتغير"], ["سالبة", "سالب", "موجبة"], ["لحظة معينة", "لحظة"], ["ثابت", "المستمر"]], "ch": 3, "id": "c3k009"}, {"k": "k", "topic": "المقدار المؤثر", "yrs": "وزاري", "q": "ما العلاقة بين المقدار الأعظم والمقدار المؤثر للتيار المتناوب؟", "a": "Ieff = 0.707 Im، أو Ieff = Im/√2.", "kw": [["0.707", "0.707 Im", "Im/√2", "Im/2"], ["Ieff", "المؤثر"]], "ch": 3, "id": "c3k010"}, {"k": "k", "topic": "المقدار المؤثر", "yrs": "وزاري", "q": "ماذا تعني العبارة: أن المقدار المؤثر للتيار في الدائرة المتناوبة يساوي 1 ampere؟", "a": "تعني أن المقدار المؤثر للتيار (Ieff) يساوي 1 أمبير، ولا تعني أن المقدار الأعظم للتيار (Im) يساوي 1 أمبير.", "kw": [["المؤثر", "Ieff"], ["الأعظم", "Im"], ["لا تعني", "ولا تعني"]], "ch": 3, "id": "c3k011"}, {"k": "k", "topic": "المقدار المؤثر", "yrs": "وزاري", "q": "ضع كلمة (صح) أو (خطأ) أمام العبارة: Veff = 1.5 Vmax ... (ويقصد العلاقة الصحيحة للفولطية المؤثرة بالمقدار الأعظم).", "a": "خطأ. الصحيح: Veff = Vm/√2 أو Veff = 0.707 Vm.", "kw": [["خطأ"], ["0.707", "Vm/√2", "√2"]], "ch": 3, "id": "c3k012"}, {"k": "p", "topic": "المقدار المؤثر", "yrs": "وزاري", "q": "مصدر للفولطية المتناوبة ربط بين طرفيه مقاومة مقدارها 100 Ω، ويعطى فرق الجهد بين طرفي المصدر بالعلاقة: VR = 424.2 sin(200πt). 1) اكتب العلاقة التي يعطى بها التيار في الدائرة. 2) احسب المقدار المؤثر للفولطية والمقدار المؤثر للتيار. 3) احسب تردد الدائرة والتردد الزاوي للمصدر.", "a": "<b>1) العلاقة:</b> Im = Vm/R = 424.2/100 = 4.242 A، لذلك <span class=\"m\">I = 4.242 sin(200πt)</span><br><span class=\"res\">I = 4.242 sin(200πt) A</span><br><b>2) المقدار المؤثر:</b> Veff = 0.707 × 424.2 ≈ 299.9 V ≈ 300 V، و Ieff = 0.707 × 4.242 ≈ 2.999 A ≈ 3 A<br><span class=\"res\">Veff ≈ 300 V ، Ieff ≈ 3 A</span><br><b>3) التردد:</b> ω = 200π = 2πf ⇒ f = 100 Hz، والتردد الزاوي للمصدر ω = 200π rad/s<br><span class=\"res\">f = 100 Hz ، ω = 200π rad/s</span>", "ch": 3, "id": "c3p001"}, {"k": "p", "topic": "المقدار المؤثر", "yrs": "وزاري", "q": "مصدر للفولطية المتناوبة ربط بين طرفيه مقاومة مقدارها 250 Ω، ويعطى فرق الجهد بين طرفي المصدر بالعلاقة: VR = 500 sin(200πt). 1) اكتب العلاقة التي يعطى بها التيار. 2) احسب المقدار المؤثر للفولطية والمقدار المؤثر للتيار. 3) احسب تردد الدائرة والتردد الزاوي للمصدر.", "a": "<b>1) العلاقة:</b> Im = 500/250 = 2 A، لذلك <span class=\"m\">I = 2 sin(200πt)</span><br><span class=\"res\">I = 2 sin(200πt) A</span><br><b>2) المقدار المؤثر:</b> Veff = 0.707 × 500 ≈ 353.5 V ، Ieff = 0.707 × 2 ≈ 1.414 A<br><span class=\"res\">Veff ≈ 353.5 V ، Ieff ≈ 1.414 A</span><br><b>3) التردد:</b> 200π = 2πf ⇒ f = 100 Hz<br><span class=\"res\">f = 100 Hz</span>", "ch": 3, "id": "c3p002"}, {"k": "p", "topic": "القدرة", "yrs": "وزاري", "q": "مصدر للفولطية المتناوبة ربط بين طرفيه مقاومة مقدارها 200 Ω، وتعطى الفولطية في الدائرة بالعلاقة: VR = 565.6 sin(200t). احسب: 1) المقدار المؤثر للفولطية. 2) المقدار المؤثر للتيار. 3) مقدار القدرة المتوسطة.", "a": "<b>1) المقدار المؤثر للفولطية:</b> Veff = Vm/√2 = 565.6/1.414 = 400 V<br><span class=\"res\">Veff = 400 V</span><br><b>2) المقدار المؤثر للتيار:</b> Im = 565.6/200 = 2.828 A، ثم Ieff = Im/√2 = 2.828/1.414 = 2 A<br><span class=\"res\">Ieff = 2 A</span><br><b>3) القدرة المتوسطة:</b> Pavg = Ieff² × R = 2² × 200 = 800 W<br><span class=\"res\">Pavg = 800 W</span>", "ch": 3, "id": "c3p003"}, {"k": "p", "topic": "المقدار المؤثر", "yrs": "وزاري", "q": "مصدر للفولطية المتناوبة ربط بين طرفيه مقاومة مقدارها 100 Ω، وتعطى الفولطية بين طرفيه بالعلاقة: VR = 282.8 sin(200πt). احسب: 1) العلاقة التي يعطى بها التيار. 2) المقدار المؤثر للفولطية والتيار. 3) تردد المصدر الزاوي والتردد.", "a": "<b>1) العلاقة:</b> Vmax = 282.8 V، و Imax = 282.8/100 = 2.828 A، لذلك <span class=\"m\">I = 2.828 sin(200πt)</span><br><span class=\"res\">I = 2.828 sin(200πt) A</span><br><b>2) المقدار المؤثر:</b> Veff = 282.8/1.414 = 200 V ، Ieff = 2.828/1.414 = 2 A<br><span class=\"res\">Veff = 200 V ، Ieff = 2 A</span><br><b>3) التردد:</b> ω = 200π rad/s ⇒ f = 100 Hz<br><span class=\"res\">f = 100 Hz</span>", "ch": 3, "id": "c3p004"}, {"k": "k", "topic": "المفاعلة الحثية", "yrs": "وزاري", "q": "اثبت أن زيادة الحث (XL) تقاس بالأوم.", "a": "XL = 2πfL، وبما أن الهنري = (volt·sec)/(Amp·sec) = volt/Amp = ohm (Ω) فإن وحدة XL هي الأوم.", "kw": [["2πfL", "2πfL", "XL"], ["volt", "فولت"], ["ohm", "أوم", "Ω"]], "ch": 3, "id": "c3k013"}, {"k": "k", "topic": "المفاعلة الحثية", "yrs": "وزاري", "q": "اشرح نشاطاً يوضح تأثير تغير تردد التيار (f) في مقدار زيادة الحث (XL) مع رسم الدائرة الكهربائية وتوضيح المخطط البياني.", "a": "الأدوات: مولد تيار متناوب يمكن تغيير تردده، أميتر، فولتميتر، ملف مهمل المقاومة (محث)، مفتاح كهربائي. الخطوات: 1) نربط الدائرة كما في الشكل (الملف والأميتر والمولد على التوالي، والفولتميتر على طرفي الملف). 2) نغلق الدائرة وننبه المولد ونزيد التردد تدريجياً مع المحافظة على مقدار الفولطية ثابتاً، ونلاحظ نقصان قراءة الأميتر. الاستنتاج: تتناسب زيادة الحث XL تناسباً طردياً مع تردد التيار f عند ثبوت معامل الحث الذاتي L، ويكون المخطط البياني خطاً مستقيماً يمر بنقطة الأصل.", "kw": [["مولد", "مولد تيار"], ["الأميتر", "أميتر"], ["طردياً", "طردي"], ["مستقيم", "خط"]], "ch": 3, "id": "c3k014"}, {"k": "k", "topic": "المفاعلة الحثية", "yrs": "وزاري", "q": "بين بواسطة رسم مخطط بياني ما تأثير تردد الفولطية المصدر على زيادة الحث؟", "a": "XL ∝ f عند ثبوت L، والمخطط البياني خط مستقيم يمر بنقطة الأصل وميله يساوي 2πL.", "kw": [["طردي", "تناسب", "∝"], ["مستقيم", "خط"], ["نقطة الأصل", "الأصل"]], "ch": 3, "id": "c3k015"}, {"k": "k", "topic": "المفاعلة الحثية", "yrs": "وزاري", "q": "ربط مصباح كهربائي على التوالي مع ملف محث صرف ومصدر تيار متناوب عالي التردد وآخر واطئ التردد، عند أي من الترددين يكون المصباح أكثر توهجاً؟ وضح ذلك.", "a": "عند الترددات الواطئة، لأن XL = ωL يقل بانخفاض التردد، فيزداد التيار IL = VL/XL، فيكون المصباح أكثر توهجاً.", "kw": [["واطئ", "الواطئة", "الواطئ"], ["XL", "ωL", "ω"], ["يزداد التيار", "التيار"]], "ch": 3, "id": "c3k016"}, {"k": "k", "topic": "المفاعلة الحثية", "yrs": "وزاري", "q": "اشرح نشاطاً يوضح تأثير تغير معامل الحث الذاتي للمحث في مقدار رادة الحث الذاتي.", "a": "الأدوات: مصدر فولطية متناوبة ثابت التردد، قلب من الحديد المطاوع، أميتر، فولتميتر، ملف مهمل المقاومة (محث)، مفتاح كهربائي. الخطوات: 1) نربط الدائرة (الملف والأميتر والمصدر على التوالي، والفولتميتر على طرفي الملف). 2) نغلق الدائرة ونلاحظ قراءة الأميتر. 3) ندخل قلب الحديد المطاوع تدريجياً في جوف الملف مع المحافظة على فولطية الملف ثابتة. 4) نلاحظ نقصان قراءة الأميتر، لأن إدخال الحديد يزيد معامل الحث الذاتي فتزداد رادة الحث. الاستنتاج: تتناسب رادة الحث XL تناسباً طردياً مع معامل الحث الذاتي L عند ثبوت التردد f.", "kw": [["حديد", "الحديد المطاوع", "قلب"], ["معامل الحث", "L"], ["طردياً", "طردي"], ["نقصان", "يقل", "ينقص"]], "ch": 3, "id": "c3k017"}, {"k": "k", "topic": "المفاعلة الحثية", "yrs": "وزاري", "q": "علل: زيادة مقدار رادة الحث بزيادة تردد التيار على وفق قانون لنز؟ وما التفسير الفيزيائي لذلك؟", "a": "عند زيادة تردد التيار يزداد المعدل الزمني للتغير في التيار ΔI/Δt، فتزداد القوة الدافعة الكهربائية المحتثة الذاتية (ε ∝ ΔI/Δt)، وعلى وفق قانون لنز تعاكس هذه القوة المسبب لها، أي التغير في التيار، فتمثل المعاكسة التي يبديها المحث للتغير في التيار، وهذا هو سبب زيادة رادة الحث.", "kw": [["المعدل الزمني", "ΔI/Δt", "المعدل"], ["لنز", "قانون لنز"], ["تعاكس", "معاكسة"]], "ch": 3, "id": "c3k018"}, {"k": "k", "topic": "المفاعلة الحثية", "yrs": "وزاري", "q": "ما عمل الملف في دوائر التيار المتناوب عندما يكون التردد عالياً جداً؟ ولماذا؟", "a": "يعمل الملف عمل مفتاح مفتوح (دائرة مفتوحة)، لأن رادة الحث تزداد إلى مقدار كبير جداً عند الترددات العالية جداً، فتؤدي إلى قطع تيار الدائرة.", "kw": [["مفتاح مفتوح", "دائرة مفتوحة", "مفتوح"], ["رادة الحث", "الرادة"], ["قطع", "يقطع"]], "ch": 3, "id": "c3k019"}, {"k": "k", "topic": "المفاعلة الحثية", "yrs": "وزاري", "q": "كيف تفسر نقصان توهج مصباح كهربائي مربوط مع محث صرف على التوالي عند ازدياد تردد فولطية المصدر (بثبوت مقدار فولطية المصدر)؟", "a": "لأنه عند ازدياد تردد فولطية المصدر تزداد رادة الحث XL، لأنها تتناسب طردياً مع التردد XL = 2πfL، وبذلك يقل التيار المنساب IL = VL/XL فيقل توهج المصباح.", "kw": [["تزداد", "تزداد رادة", "زيادة"], ["طردياً", "تتناسب طردياً"], ["يقل التيار", "التيار"], ["توهج", "التوهج"]], "ch": 3, "id": "c3k020"}, {"k": "k", "topic": "المفاعلة الحثية", "yrs": "وزاري", "q": "ما العلاقة بين الرادة الحثية وكل من تردد الفولطية المتناوبة ومعامل الحث الذاتي للملف؟", "a": "1) تتناسب الرادة الحثية طردياً مع تردد الفولطية (f) بثبوت معامل الحث الذاتي (L). 2) تتناسب الرادة الحثية طردياً مع معامل الحث الذاتي (L) بثبوت تردد الفولطية (f). وحسب العلاقة XL = 2πfL.", "kw": [["طردياً", "طردي", "تناسب"], ["2πfL", "XL"], ["تردد", "التردد"], ["معامل الحث", "L"]], "ch": 3, "id": "c3k021"}, {"k": "k", "topic": "القدرة في المحث", "yrs": "وزاري", "q": "ما مقدار القدرة المتوسطة في دائرة تيار متناوب تحتوي محثاً صرفاً عند دورة كاملة أو عدد صحيح من الدورات؟ وضح ذلك.", "a": "تساوي صفراً. السبب: عندما يتغير التيار في المحث من الصفر إلى المقدار الأعظم خلال ربع الدورة، تنتقل الطاقة من المصدر وتُختزن في المجال المغناطيسي للمحث (الجزء الموجب)، ثم تُعاد كل الطاقة إلى المصدر عندما يتغير التيار من مقداره الأعظم إلى الصفر في الربع الذي يليه (الجزء السالب). أي أن المحث لا يستهلك قدرة، ولا يعد مقاومة أومية، ولا يخضع لقانون جول.", "kw": [["صفر", "تساوي صفراً"], ["تُختزن", "المختزنة", "تخزن"], ["المصدر", "إلى المصدر"], ["لا يستهلك", "لا يبدد", "لا تستهلك"]], "ch": 3, "id": "c3k022"}, {"k": "k", "topic": "القدرة في المحث", "yrs": "وزاري", "q": "اختر الإجابة الصحيحة: دائرة تيار متناوب تحتوي محثاً صرفاً، القدرة المتوسطة لدورة كاملة أو عدد صحيح من الدورات تساوي:", "opts": ["صفراً، ومتوسط التيار يساوي صفراً", "نصف القدرة العظمى", "القدرة العظمى", "صفراً، ومتوسط التيار يساوي التيار العظمى"], "c": 0, "a": "القدرة المتوسطة تساوي صفراً، ومتوسط التيار على دورة كاملة يساوي صفراً أيضاً.", "ch": 3, "id": "c3k023"}, {"k": "k", "topic": "القدرة في المحث", "yrs": "وزاري", "q": "ما الذي تمثله الأجزاء الموجبة والأجزاء السالبة في منحنى القدرة الآنية في دائرة تيار متناوب تحتوي محثاً صرفاً؟", "a": "الأجزاء الموجبة: تمثل القدرة المختزنة في المجال المغناطيسي للمحث عندما تنتقل الطاقة من المصدر إلى المحث. والأجزاء السالبة: تمثل الطاقة المعادة من المحث إلى المصدر عندما ينهار المجال المغناطيسي.", "kw": [["موجبة", "الموجبة", "الأجزاء الموجبة"], ["المجال المغناطيسي", "مغناطيسي"], ["السالبة", "الأجزاء السالبة"], ["المصدر", "إلى المصدر"]], "ch": 3, "id": "c3k024"}, {"k": "k", "topic": "القدرة في المحث", "yrs": "وزاري", "q": "لماذا لا تعد رادة الحث مقاومة أومية ولا تخضع لقانون جول الحراري؟", "a": "لأنها لا تستهلك قدرة، أي أن القدرة المتوسطة لها تساوي صفراً.", "kw": [["لا تستهلك", "لا تستهلك قدرة"], ["القدرة المتوسطة", "متوسطة"], ["صفر"]], "ch": 3, "id": "c3k025"}, {"k": "k", "topic": "القدرة في المقاومة والمحث", "yrs": "وزاري", "q": "ما الفرق بين خواص منحنى القدرة في دائرة تيار متناوب تحتوي مقاومة صرف، وفي دائرة تحتوي محثاً صرفاً؟", "a": "المقاومة: منحنى بشكل جيب تمام موجب دائماً يتغير بين المقدار الأعظم والصفر، والقدرة المتوسطة تساوي نصف القدرة العظمى Pav = ½ Im Vm. المحث: منحنى تردده ضعف تردد التيار أو الفولطية، ويتكون من أجزاء موجبة وسالبة متساوية، والقدرة المتوسطة لدورة كاملة أو عدد صحيح من الدورات تساوي صفراً.", "kw": [["جيب تمام", "جيب"], ["نصف", "½"], ["ضعف", "ضعف تردد"], ["صفر"], ["موجبة", "موجب"]], "ch": 3, "id": "c3k026"}, {"k": "k", "topic": "القدرة في المحث", "yrs": "وزاري", "q": "ما مميزات منحنى القدرة في دائرة تيار متناوب تحتوي محثاً صرفاً فقط؟", "a": "1) منحنى جيبي أجزاؤه الموجبة والسالبة متساوية. 2) تردده ضعف تردد التيار أو الفولطية. 3) القدرة المتوسطة لدورة كاملة أو عدد صحيح من الدورات تساوي صفراً.", "kw": [["جيبي", "جيب"], ["ضعف", "ضعف التردد"], ["صفر"]], "ch": 3, "id": "c3k027"}, {"k": "k", "topic": "القدرة في المحث", "yrs": "وزاري", "q": "علل: يفضل استعمال المحث في التحكم بتيار مصابيح الفلورسنت ولا تستعمل مقاومة مصباح؟", "a": "لأن المحث عند مرور التيار المتناوب فيه لا يبدد قدرة (Pdissipated = 0)، بينما المقاومة تستهلك القدرة على شكل حرارة Pdissipated = I²R، فيضيع جزء من الطاقة.", "kw": [["لا يبدد", "لا يستهلك"], ["حرارة", "حراري"], ["I²R", "I2R"]], "ch": 3, "id": "c3k028"}, {"k": "p", "topic": "المفاعلة الحثية", "yrs": "وزاري", "q": "ملف مهمل المقاومة (محث صرف) معامل حثه الذاتي (50/π) mH، ربط بين قطبي مصدر للفولطية المتناوبة فرق الجهد بين طرفيه 20 V. احسب رادة الحث والتيار في الدائرة عندما يكون تردد الدائرة: 1) 10 Hz 2) 1 MHz.", "a": "<b>1) f = 10 Hz:</b> XL = 2πfL = 2π × 10 × (50/π) × 10⁻³ = 1 Ω<br><span class=\"res\">XL = 1 Ω</span> ، IL = VL/XL = 20/1 = 20 A<br><span class=\"res\">IL = 20 A</span><br><b>2) f = 1 MHz:</b> XL = 2π × 10⁶ × (50/π) × 10⁻³ = 10⁵ Ω<br><span class=\"res\">XL = 10⁵ Ω</span><br>IL = 20/10⁵ = 2×10⁻⁴ A<br><span class=\"res\">IL = 2×10⁻⁴ A = 0.2 mA</span>", "ch": 3, "id": "c3p005"}, {"k": "p", "topic": "المفاعلة الحثية", "yrs": "وزاري", "q": "ملف مهمل المقاومة (محث صرف) معامل حثه الذاتي (25/π) mH، ربط بين قطبي مصدر للفولطية المتناوبة فرق الجهد بين طرفيه 30 V. احسب رادة الحث والتيار في الدائرة عندما يكون تردد المصدر: 1) 10 Hz 2) 1 MHz.", "a": "<b>1) f = 10 Hz:</b> XL = 2π × 10 × (25/π) × 10⁻³ = 0.5 Ω<br><span class=\"res\">XL = 0.5 Ω</span> ، IL = 30/0.5 = 60 A<br><span class=\"res\">IL = 60 A</span><br><b>2) f = 1 MHz:</b> XL = 2π × 10⁶ × (25/π) × 10⁻³ = 5×10⁴ Ω<br><span class=\"res\">XL = 5×10⁴ Ω</span><br>IL = 30/(5×10⁴) = 6×10⁻⁴ A<br><span class=\"res\">IL = 6×10⁻⁴ A = 0.6 mA</span>", "ch": 3, "id": "c3p006"}, {"k": "k", "topic": "المفاعلة السعوية", "yrs": "وزاري", "q": "اثبت أن رادة السعة تقاس بالأوم.", "a": "Xc = 1/(2πfC)، وبما أن وحدة الهيرتز·الفاراد: 1/Hz·F = 1/(1/sec · coulomb/volt) = (sec·volt)/(A·sec) ... وبالاختصار تصبح وحدة Xc هي volt/A = Ω.", "kw": [["1/(2πfC)", "1/2πfC", "Xc"], ["farad", "الفاراد", "F"], ["volt", "فولت", "v"], ["Ω", "أوم", "ohm"]], "ch": 3, "id": "c3k029"}, {"k": "k", "topic": "المفاعلة السعوية", "yrs": "وزاري", "q": "اشرح نشاطاً يوضح تأثير تغير تردد فولطية المصدر في مقدار رادة السعة (Xc) مع رسم الدائرة والمخطط البياني.", "a": "الأدوات: أميتر، فولتميتر، متسعة ذات صفيحتين متوازيتين، مذبذب كهربائي (مولد تيار متناوب)، أسلاك توصيل، مفتاح كهربائي. الخطوات: 1) نربط دائرة كهربائية تتألف من المتسعة والأميتر والمذبذب على التوالي، والفولتميتر على طرفي المتسعة. 2) نغلق الدائرة ونبدأ بزيادة تردد المذبذب تدريجياً مع المحافظة على مقدار فرق الجهد بين صفيحتي المتسعة ثابتاً بمراقبة الفولتميتر. 3) نلاحظ زيادة قراءة الأميتر مع زيادة تردد المصدر. الاستنتاج: تتناسب رادة السعة Xc تناسباً عكسياً مع تردد فولطية المصدر f عند ثبوت سعة المتسعة C، والمخطط البياني منحنى يقترب من المحور الأفقي كلما زاد التردد.", "kw": [["عكسياً", "عكسي"], ["تردد", "التردد"], ["منحنى", "المنحنى"], ["ثبوت", "ثابت"]], "ch": 3, "id": "c3k030"}, {"k": "k", "topic": "المفاعلة السعوية", "yrs": "وزاري", "q": "اشرح نشاطاً يوضح تأثير تغير سعة المتسعة في مقدار رادة السعة (Xc)، وماذا يستنتج من النشاط مع رسم العلاقة البيانية بين السعة ورادة السعة؟", "a": "الأدوات: مصدر لفولطية متناوبة ثابتة التردد، أميتر، فولتميتر، متسعة ذات صفيحتين متوازيتين متغيرة السعة، مفتاح كهربائي، أسلاك توصيل. الخطوات: 1) نربط الدائرة (المتسعة والأميتر والمصدر على التوالي والفولتميتر على طرفي المصدر). 2) نغلق الدائرة ونزيد سعة المتسعة تدريجياً بإدخال لوح من مادة عازلة بين صفيحتيها. 3) نلاحظ زيادة قراءة الأميتر مع زيادة السعة. الاستنتاج: تتناسب رادة السعة Xc تناسباً عكسياً مع سعة المتسعة C عند ثبوت تردد الفولطية f، والعلاقة البيانية بينهما منحنى قطع زائد، ويمكن تمثيل العلاقة العكسية بخط مستقيم عند رسم Xc مع 1/C.", "kw": [["عكسياً", "عكسي"], ["السعة", "سعة"], ["منحنى", "قطع زائد"], ["عازل", "عازلة"]], "ch": 3, "id": "c3k031"}, {"k": "k", "topic": "المفاعلة السعوية", "yrs": "وزاري", "q": "اختر الإجابة الصحيحة: دائرة تيار متناوب تحتوي مذبذباً يولد فرق جهد ثابت المقدار، ربطت بين طرفيه متسعة ذات سعة صرف ثابتة المقدار، عند زيادة تردد فولطية المذبذب:", "opts": ["يزداد مقدار التيار المنساب في الدائرة", "يقل مقدار التيار المنساب في الدائرة", "يبقى التيار ثابتاً", "يصبح التيار صفراً"], "c": 0, "a": "يزداد مقدار التيار المنساب في الدائرة، لأن Xc = 1/(2πfC) تقل بزيادة التردد f فيزداد التيار.", "ch": 3, "id": "c3k032"}, {"k": "k", "topic": "المفاعلة السعوية", "yrs": "وزاري", "q": "ما تأثير تردد فولطية المصدر في رادة السعة؟ وضح ذلك برسم المخطط البياني.", "a": "رادة السعة Xc تتناسب عكسياً مع تردد فولطية المصدر f بثبوت السعة C، أي Xc = 1/(2πfC)، والمخطط البياني منحنى يتناقص باستمرار ويقترب من المحور الأفقي كلما زاد التردد.", "kw": [["عكسياً", "عكسي"], ["منحنى", "المنحنى"], ["2πfC", "1/2πfC", "Xc"], ["يقترب", "المحور"]], "ch": 3, "id": "c3k033"}, {"k": "k", "topic": "المفاعلة السعوية", "yrs": "وزاري", "q": "متسعة ذات سعة صرف ربطت على مصدر فولطية متناوب متغير التردد، وضح ماذا تعمل المتسعة عند الترددات العالية جداً وعند الترددات الواطئة جداً من فولطية المصدر؟", "a": "عند الترددات العالية جداً تقل رادة السعة لأنها تتناسب عكسياً مع التردد وقد تصل إلى الصفر، فتعمل المتسعة عمل مفتاح مغلق (تعد المتسعة كدائرة مغلقة). وعند الترددات الواطئة جداً تزداد رادة السعة إلى مقدار كبير جداً، فتعمل المتسعة عمل مفتاح مفتوح، وهذا ما يحصل عند وجود المتسعة في دائرة التيار المستمر.", "kw": [["عكسياً", "عكسي"], ["مغلق", "مغلقة"], ["مفتوح", "مفتوحة"], ["التيار المستمر", "المستمر"]], "ch": 3, "id": "c3k034"}, {"k": "k", "topic": "المفاعلة السعوية", "yrs": "وزاري", "q": "ربط مصباح كهربائي على التوالي مع متسعة ذات سعة صرف في دائرة تيار متناوب، عند أي الترددات يكون المصباح أكثر توهجاً؟ وضح ذلك.", "a": "عند الترددات العالية، لأن رادة السعة Xc = 1/(2πfC) تقل فيزداد التيار Ic = V/Xc فيزداد التوهج. أما عند الترددات الواطئة فتزداد رادة السعة فيقل التيار ويقل التوهج.", "kw": [["العالية", "عالية"], ["تقل", "تقل رادة"], ["يزداد التيار", "التيار"], ["التوهج", "توهج"]], "ch": 3, "id": "c3k035"}, {"k": "k", "topic": "المفاعلة الحثية والسعوية", "yrs": "وزاري", "q": "ماذا يحصل لتوهج مصباح مربوط على التوالي مع ملف مهمل المقاومة (محث) عند الترددات العالية؟ وعند الترددات الواطئة؟ (بثبوت مقدار فولطية المصدر).", "a": "عند الترددات العالية يقل توهج المصباح، لأن رادة الحث تزداد فيقل التيار. وعند الترددات الواطئة يزداد توهج المصباح، لأن رادة الحث تقل فيزداد التيار.", "kw": [["يقل", "تقل التيار", "ينقص"], ["تزداد رادة", "رادة الحث"], ["الواطئة", "واطئة"]], "ch": 3, "id": "c3k036"}, {"k": "k", "topic": "المفاعلة السعوية", "yrs": "وزاري", "q": "وضح كيف يتغير كل من المقاومة ورادة السعة إذا تضاعف التردد الزاوي للمصدر في دائرة تيار متناوب متوالية الربط تحتوي على مقاومة ومتسعة ومصدر؟", "a": "المقاومة لا تتغير وتبقى ثابتة. ورادة السعة تقل إلى النصف عند مضاعفة التردد الزاوي، حسب العلاقة Xc = 1/(ω·C).", "kw": [["لا تتغير", "ثابتة", "تبقى"], ["النصف", "إلى النصف"], ["ω", "الزاوي"]], "ch": 3, "id": "c3k037"}, {"k": "k", "topic": "المفاعلة السعوية", "yrs": "وزاري", "q": "ماذا يحصل لتوهج مصباح مربوط على التوالي مع متسعة ذات سعة صرف عند زيادة التردد الزاوي للفولطية بثبوت مقدار فولطية المصدر؟ وماذا يحصل عند تقليله؟", "a": "عند زيادة التردد الزاوي يزداد توهج المصباح لأن رادة السعة تقل ويزداد التيار حسب Ic = Vc/Xc، وعند تقليل التردد الزاوي يقل توهج المصباح لأن رادة السعة تزداد فيقل التيار.", "kw": [["يزداد التوهج", "يزداد توهج", "زيادة التوهج"], ["تقل رادة", "رادة السعة"], ["يقل التوهج", "يقل توهج"]], "ch": 3, "id": "c3k038"}, {"k": "p", "topic": "المفاعلة السعوية", "yrs": "وزاري", "q": "ربطت متسعة سعتها (1/π) μF بين قطبي مصدر للفولطية المتناوبة فرق الجهد بين طرفيه (1.5 V). احسب مقدار رادة السعة ومقدار التيار في هذه الدائرة إذا كان تردد الدائرة: 1) 5 Hz 2) 5×10⁵ Hz.", "a": "<b>1) f = 5 Hz:</b> Xc = 1/(2πfC) = 1/(2π × 5 × (1/π) × 10⁻⁶) = 1/(10 × 10⁻⁶) = 10⁵ Ω<br><span class=\"res\">Xc = 10⁵ Ω</span><br>I = V/Xc = 1.5/10⁵ = 1.5×10⁻⁵ A<br><span class=\"res\">I = 1.5×10⁻⁵ A = 15 μA</span><br><b>2) f = 5×10⁵ Hz:</b> Xc = 1/(2π × 5×10⁵ × (1/π) × 10⁻⁶) = 1/1 = 1 Ω<br><span class=\"res\">Xc = 1 Ω</span><br>I = 1.5/1 = 1.5 A<br><span class=\"res\">I = 1.5 A</span>", "ch": 3, "id": "c3p007"}, {"k": "p", "topic": "المفاعلة السعوية", "yrs": "وزاري", "q": "ربطت متسعة سعتها (4/π) μF بين قطبي مصدر للفولطية المتناوبة فرق الجهد بين طرفيه (2.5 V). احسب مقدار رادة السعة وتيار الدائرة عند تردد الدائرة: 1) 5 Hz 2) 5×10⁵ Hz.", "a": "<b>1) f = 5 Hz:</b> Xc = 1/(2π × 5 × (4/π) × 10⁻⁶) = 1/(40 × 10⁻⁶) = 2.5×10⁴ Ω<br><span class=\"res\">Xc = 2.5×10⁴ Ω</span><br>I = 2.5/(2.5×10⁴) = 10⁻⁴ A<br><span class=\"res\">I = 10⁻⁴ A = 0.1 mA</span><br><b>2) f = 5×10⁵ Hz:</b> Xc = 1/(2π × 5×10⁵ × (4/π) × 10⁻⁶) = 1/4 = 0.25 Ω<br><span class=\"res\">Xc = 0.25 Ω</span><br>I = 2.5/0.25 = 10 A<br><span class=\"res\">I = 10 A</span>", "ch": 3, "id": "c3p008"}, {"k": "p", "topic": "المفاعلة السعوية", "yrs": "وزاري", "q": "ربطت متسعة سعتها (100/π) μF بين قطبي مصدر للفولطية المتناوبة، فرق الجهد بين طرفيه (25 V). احسب مقدار رادة السعة وتيار الدائرة إذا كان تردد الدائرة: 1) 5 Hz 2) 5×10⁵ Hz.", "a": "<b>1) f = 5 Hz:</b> Xc = 1/(2π × 5 × (100/π) × 10⁻⁶) = 1/(10⁻³) = 10³ Ω<br><span class=\"res\">Xc = 10³ Ω</span><br>I = 25/10³ = 25×10⁻³ A<br><span class=\"res\">I = 25 mA</span><br><b>2) f = 5×10⁵ Hz:</b> Xc = 1/(2π × 5×10⁵ × (100/π) × 10⁻⁶) = 1/100 = 0.01 Ω<br><span class=\"res\">Xc = 0.01 Ω</span><br>I = 25/0.01 = 2500 A<br><span class=\"res\">I = 2500 A</span>", "ch": 3, "id": "c3p009"}, {"k": "p", "topic": "المفاعلة السعوية", "yrs": "وزاري", "q": "مذبذب كهربائي مقدار فرق الجهد بين طرفيه ثابت (2.5 V)، إذا تغير تردده من 5 Hz إلى 5×10⁵ Hz، احسب مقدار كل من رادة المتسعة وتيار الدائرة عندما يربط بين طرفي المذبذب متسعة ذات سعة صرف فقط (C = 4/π μF).", "a": "<b>عند 5 Hz:</b> Xc = 2.5×10⁴ Ω، و I = 2.5/(2.5×10⁴) = 10⁻⁴ A<br><span class=\"res\">Xc = 2.5×10⁴ Ω ، I = 10⁻⁴ A</span><br><b>عند 5×10⁵ Hz:</b> Xc = 0.25 Ω، و I = 2.5/0.25 = 10 A<br><span class=\"res\">Xc = 0.25 Ω ، I = 10 A</span>", "ch": 3, "id": "c3p010"}, {"k": "k", "topic": "المفاعلة السعوية", "yrs": "وزاري", "q": "عند ازدياد تردد فولطية المذبذب في دائرة تيار متناوب تحتوي مذبذباً يولد فرق جهد ثابت، وربط بين طرفيه متسعة ذات سعة صرف ثابتة، يقل مقدار التيار المنساب في الدائرة. هل العبارة صح أم خطأ؟", "opts": ["صح", "خطأ"], "c": 1, "a": "خطأ. الصحيح: يزداد مقدار التيار المنساب في الدائرة لأن رادة السعة تقل بزيادة التردد.", "ch": 3, "id": "c3k039"}, {"k": "k", "topic": "المفاعلة الحثية", "yrs": "وزاري", "q": "دائرة تيار متناوب تحتوي مذبذباً يولد فرق جهد ثابت، ربط بين طرفيه محث صرف، عند ازدياد تردد فولطية المذبذب يقل مقدار التيار المنساب في الدائرة. هل العبارة صح أم خطأ؟", "opts": ["صح", "خطأ"], "c": 0, "a": "صح. لأن رادة الحث تزداد بزيادة التردد فيقل التيار.", "ch": 3, "id": "c3k040"}, {"k": "k", "topic": "القدرة في المتسعة", "yrs": "وزاري", "q": "ماذا يحصل عند ربط صفيحتي متسعة بين طرفي مصدر فولطية متناوبة؟", "a": "تشحن المتسعة وتتفرغ بالتعاقب وبصورة دورية، وبذلك تعتبر دائرتها مغلقة.", "kw": [["تشحن", "شحن"], ["تتفرغ", "تفرغ"], ["دورية", "دوري"]], "ch": 3, "id": "c3k041"}, {"k": "k", "topic": "القدرة في المتسعة", "yrs": "وزاري", "q": "ما مميزات منحنى القدرة الآنية في دائرة تيار متناوب تحتوي متسعة ذات سعة صرف؟", "a": "1) متجه الطور للتيار يسبق متجه الفولطية بزاوية Φ = π/2 أو ربع دورة. 2) منحنى القدرة الآنية يتغير بشكل جيبي. 3) تردده ضعف تردد التيار أو الفولطية، ويحتوي أجزاء موجبة وسالبة متساوية بالمساحة. 4) القدرة المتوسطة لدورة كاملة أو عدد صحيح من الدورات تساوي صفراً.", "kw": [["π/2", "ربع دورة", "الربع"], ["جيبي", "جيب"], ["ضعف"], ["صفر"]], "ch": 3, "id": "c3k042"}, {"k": "k", "topic": "المعاوقة (R-L-C)", "yrs": "وزاري", "q": "علام يعتمد مقدار المعاوقة الكلية لدائرة تيار متناوب متوالية الربط تحتوي مقاومة صرف ومحث صرف ومتسعة ذات سعة صرف (R-L-C)؟ وما العلاقة الرياضية التي تبين ذلك؟", "a": "تعتمد المعاوقة الكلية Z على المقاومة R، ومعامل الحث الذاتي L، وسعة المتسعة C، وتردد مصدر الفولطية f. والعلاقة: Z = √(R² + (2πfL − 1/(2πfC))²) أو Z = √(R² + (XL − XC)²)، حيث XL = 2πfL و XC = 1/(2πfC).", "kw": [["R", "المقاومة"], ["L", "الحث", "معامل الحث"], ["C", "السعة", "سعة المتسعة"], ["f", "التردد", "تردد"], ["√", "Z", "المعاوقة"]], "ch": 3, "id": "c3k043"}, {"k": "k", "topic": "فرق الطور", "yrs": "وزاري", "q": "ما الفرق بين المقاومة والرادة السعوية من حيث تأثيرها في فرق الطور بين الفولطية والتيار؟", "a": "المقاومة: فرق الطور بين الفولطية والتيار يساوي صفراً (θ = 0)، أي أن متجهي الطور للفولطية والتيار بالاتجاه نفسه. المتسعة: فرق الطور بين الفولطية والتيار مقداره π/2 (90°)، والتيار يسبق الفولطية بمقدار ربع دورة.", "kw": [["صفر", "θ = 0", "0"], ["π/2", "90", "ربع"], ["يسبق", "يتقدم", "تسبق"], ["المقاومة", "مقاومة"]], "ch": 3, "id": "c3k044"}, {"k": "k", "topic": "القدرة في الدائرة", "yrs": "وزاري", "q": "اختر الإجابة الصحيحة: دائرة تيار متناوب متوالية الربط تحتوي محثاً صرفاً ومتسعة ذات سعة صرف ومقاومة صرف (R-L-C)، فإن جميع القدرة في هذه الدائرة تتبدد خلال:", "opts": ["المقاومة", "المحث", "المتسعة", "العناصر الثلاثة"], "c": 0, "a": "تتبدد جميع القدرة خلال المقاومة، لأن المحث والمتسعة لا يبددان قدرة.", "ch": 3, "id": "c3k045"}, {"k": "k", "topic": "تغير الترددات", "yrs": "وزاري", "q": "وضح كيف ينغير مقدار كل من المقاومة ورادة الحث ورادة السعة إذا اضعف التردد الزاوي للمصدر (ω) إلى (2ω) في دائرة تحتوي متسعة ومحثاً ومقاومة متوالية الربط؟", "a": "المقاومة R لا تتغير مع تغير التردد الزاوي وتبقى ثابتة. رادة الحث XL تتضاعف بمضاعفة التردد الزاوي لأن XL = ωL، فيكون XL2 = 2 XL1. رادة السعة Xc تقل إلى نصف ما كانت عليه لأن Xc = 1/(ωC)، فيكون Xc2 = ½ Xc1.", "kw": [["ثابت", "لا تتغير", "تبقى"], ["يتضاعف", "ضعف", "2XL"], ["النصف", "½", "نصف"], ["ω", "الزاوي"]], "ch": 3, "id": "c3k046"}, {"k": "k", "topic": "عامل القدرة", "yrs": "وزاري", "q": "عرّف عامل القدرة.", "a": "عامل القدرة هو النسبة بين القدرة الحقيقية Preal إلى القدرة الظاهرية Papp، وهو يساوي cos Φ: Pf = Preal/Papp = cos Φ.", "kw": [["Preal", "الحقيقية"], ["Papp", "الظاهرية"], ["cos", "جتا", "كوس"]], "ch": 3, "id": "c3k047"}, {"k": "k", "topic": "عامل القدرة", "yrs": "وزاري", "q": "ما العلاقة بين القدرة الحقيقية والقدرة الظاهرية في دوائر التيار المتناوب التي تحتوي على مقاومة صرف ومتسعة صرف ومحث صرف؟", "a": "Pf = Preal/Papp، أو Preal = Papp × cos Φ، حيث Preal هي القدرة الحقيقية و Papp هي القدرة الظاهرية.", "kw": [["Preal", "الحقيقية"], ["Papp", "الظاهرية"], ["cos", "جتا", "Φ"]], "ch": 3, "id": "c3k048"}, {"k": "k", "topic": "عامل القدرة", "yrs": "وزاري", "q": "علام يعتمد مقدار عامل القدرة في دائرة تيار متناوب تحتوي مقاومة صرف ومتسعة ذات سعة صرف ومحث صرف متوالية الربط وليست في حالة رنين؟", "a": "يعتمد على: 1) نسبة القدرة الحقيقية Preal إلى القدرة الظاهرية Papp: Pf = Preal/Papp. 2) زاوية الطور Φ بين الفولطية الكلية والتيار الكلي: Pf = cos Φ. 3) مقدار المقاومة R ومعاوقة الدائرة Z: Pf = R/Z.", "kw": [["Preal", "الحقيقية"], ["cos", "Φ"], ["R/Z", "المعاوقة", "Z"]], "ch": 3, "id": "c3k049"}, {"k": "k", "topic": "عامل القدرة", "yrs": "وزاري", "q": "ما مقدار عامل القدرة في دائرة تيار متناوب إذا كان الحمل فيها يتألف من ملف ومتسعة والدائرة متوالية الربط وليست في حالة رنين؟ مع ذكر السبب.", "a": "يكون عامل القدرة محصوراً بين الصفر والواحد الصحيح: 0 < Pf < 1، لأن زاوية فرق الطور Φ تكون بين 0 و 90 (0 < Φ < 90)، والسبب وجود ممانعة كلية للدائرة Z وهي المعاكسة المشتركة للمقاومة والرادة.", "kw": [["0 < Pf < 1", "بين الصفر والواحد", "0 و 1", "صفر والواحد"], ["Z", "الممانعة", "المعاوقة"], ["المقاومة", "الرادة"]], "ch": 3, "id": "c3k050"}, {"k": "k", "topic": "عامل القدرة", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي على متسعة ومصباح متوهج، ما تأثير وضع مادة عازلة بين لوحي المتسعة على توهج المصباح وعلى عامل القدرة؟", "a": "1) يزداد توهج المصباح بسبب ازدياد سعة المتسعة C، وانقصان رادة السعة Xc، فيزداد التيار. 2) يزداد عامل القدرة لأن Pf = R/Z، وعند نقصان Xc تقل الممانعة Z = √(R² + Xc²) فيزداد Pf. (ملاحظة: إذا ذكر الطالب أن عامل القدرة يزداد نتيجة نقصان زاوية الطور بنقصان رادة السعة يعطى درجة كاملة على المطلب الثاني.)", "kw": [["توهج", "يزداد التوهج"], ["C", "السعة"], ["Xc", "رادة السعة", "نقصان"], ["Pf", "عامل القدرة"]], "ch": 3, "id": "c3k051"}, {"k": "k", "topic": "عامل القدرة", "yrs": "وزاري", "q": "ما مقدار عامل القدرة في دائرة تيار متناوب إذا كان الحمل فيها يتألف من مقاومة صرف؟ مع ذكر السبب.", "a": "Pf = 1، لأن زاوية فرق الطور بين فرق الفولطية العظمى وشدة التيار العظمى تساوي صفراً (cos 0 = 1)، أي أن القدرة الحقيقية تساوي القدرة الظاهرية، ومتجه الطور للفولطية ومتجه الطور للتيار بنفس الاتجاه.", "kw": [["1", "الواحد", "واحد"], ["صفر", "θ = 0", "Φ = 0"], ["الحقيقية", "الظاهرية"]], "ch": 3, "id": "c3k052"}, {"k": "k", "topic": "عامل القدرة", "yrs": "وزاري", "q": "ما مقدار عامل القدرة في دائرة تيار متناوب إذا كان الحمل فيها يتألف من محث صرف؟ مع ذكر السبب.", "a": "Pf = 0، لأن القدرة الحقيقية تساوي صفراً، وزاوية فرق الطور بين الفولطية والتيار تساوي 90° (π/2).", "kw": [["صفر", "0"], ["القدرة الحقيقية", "الحقيقية"], ["90", "π/2"]], "ch": 3, "id": "c3k053"}, {"k": "k", "topic": "عامل القدرة", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي محثاً صرفاً ومتسعة صرف ومقاومة صرف (R-L-C)، عندما تكون الممانعة الكلية للدائرة تساوي صفراً فإن عامل القدرة يكون أكبر من الواحد الصحيح. هل العبارة صح أم خطأ؟", "opts": ["صح", "خطأ"], "c": 1, "a": "خطأ. عامل القدرة يساوي الواحد الصحيح.", "ch": 3, "id": "c3k054"}, {"k": "k", "topic": "عامل القدرة", "yrs": "وزاري", "q": "ما الكميات الفيزيائية التي تقاس بالوحدات الآتية: volt × Amper؟", "a": "القدرة الظاهرية (Papp).", "kw": [["الظاهرية", "القدرة الظاهرية"]], "ch": 3, "id": "c3k055"}, {"k": "k", "topic": "عامل القدرة", "yrs": "وزاري", "q": "ما مقدار عامل القدرة في دائرة تيار متناوب إذا كان الحمل فيها يتألف من: أ) مقاومة صرف، ب) محث صرف، ج) متسعة ذات سعة صرف، د) ملف ومتسعة والدائرة متوالية الربط وليست في حالة رنين؟", "a": "أ) Pf = 1. ب) Pf = cos 90 = 0. ج) Pf = cos 90 = 0. د) 0 < Pf < 1.", "kw": [["1", "واحد"], ["0", "صفر"], ["0 < Pf < 1", "بين الصفر والواحد"]], "ch": 3, "id": "c3k056"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي ملفاً مقاومته (30 Ω) ومعامل حثه الذاتي (1.6/π) H، ومتسعة سعة صرف. فرق الجهد بين طرفي المصدر المتناوب (100 V) وتردده (50 Hz)، وكان عامل القدرة فيها (0.6). احسب: 1) التيار في الدائرة. 2) سعة المتسعة.", "a": "<b>1) التيار:</b> Pf = R/Z ⇒ 0.6 = 30/Z ⇒ Z = 50 Ω<br><span class=\"res\">Z = 50 Ω</span><br>I = V/Z = 100/50 = 2 A<br><span class=\"res\">I = 2 A</span><br><b>2) سعة المتسعة:</b> XL = 2πfL = 2π × 50 × 1.6/π = 160 Ω<br>Z² = R² + (XL − XC)² ⇒ 2500 = 900 + (160 − XC)² ⇒ (160 − XC)² = 1600 ⇒ 160 − XC = −40<br>XC = 200 Ω (الحل الوزاري)<br><span class=\"res\">XC = 200 Ω</span><br>C = 1/(2πf·XC) = 1/(2π × 50 × 200) = 0.159 × 10⁻³ F<br><span class=\"res\">C ≈ 159 μF</span><br><i>ملاحظة: المعادلة تعطي أيضاً XC = 120 Ω، وهي تعطي المعاوقة نفسها Z = 50 Ω، وسعتها ≈ 26.5 μF. الحل الوزاري يعتمد XC = 200 Ω.</i>", "ch": 3, "id": "c3p011"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي على ملف مقاومته (10Ω) ومعامل حثه الذاتي (1/π) H، ومقاومة صرف مقدارها (50Ω)، ومتسعة ذات سعة صرف، ومصدر للفولطية المتناوبة ترددها (50Hz) وفرق الجهد بين طرفيه (200V)، وكان عامل القدرة فيها (0.6). احسب: ① التيار في الدائرة. ② سعة المتسعة. ③ ارسم مخطط الممانعة واحسب زاوية فرق الطور بين متجه الفولطية الكلية ومتجه التيار.", "a": "<b>الحل التفصيلي:</b><br>المقاومة الكلية: R<sub>T</sub> = R<sub>ملف</sub> + R<sub>المقاومة</sub> = 10 + 50 = 60 Ω<br><b>1) التيار:</b><br>X<sub>L</sub> = 2πfL = 2π × 50 × (1/π) = 100 Ω<br>pf = V<sub>R</sub>/V<sub>T</sub> ⇒ 0.6 = V<sub>R</sub>/200 ⇒ V<sub>R</sub> = 120 V<br>I = V<sub>R</sub>/R<sub>T</sub> = 120/60 = 2 A<br>الممانعة: Z = V<sub>T</sub>/I = 200/2 = 100 Ω (وتتحقق: pf = R<sub>T</sub>/Z = 60/100 = 0.6)<br><span class=\"res\">I = 2 A</span><br><b>2) سعة المتسعة:</b><br>Z² = R<sub>T</sub>² + (X<sub>L</sub> − X<sub>C</sub>)² ⇒ 100² = 60² + (100 − X<sub>C</sub>)² ⇒ (100 − X<sub>C</sub>)² = 6400 ⇒ 100 − X<sub>C</sub> = 80 ⇒ X<sub>C</sub> = 20 Ω<br>C = 1/(2πf·X<sub>C</sub>) = 1/(2π × 50 × 20) = 1/(2000π) F = 0.159 × 10⁻³ F<br><span class=\"res\">C ≈ 159 μF</span><br><b>3) مخطط الممانعة وزاوية الطور:</b><br>tanθ = (X<sub>L</sub> − X<sub>C</sub>)/R<sub>T</sub> = (100 − 20)/60 = 80/60 = 4/3 ⇒ θ = 53°<br>المخطط: ضلع أفقي R<sub>T</sub> = 60، ضلع عمودي موجب (X<sub>L</sub> − X<sub>C</sub>) = 80، والوتر Z = 100. الدائرة حثية لأن X<sub>L</sub> > X<sub>C</sub>.", "ch": 3, "id": "c3p012"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي على ملف مقاومته (40Ω) ومعامل حثه الذاتي (1/π) H، ومتسعة ذات سعة صرف، ومصدر للفولطية المتناوبة ترددها (50Hz) وفرق الجهد بين طرفيه (100V)، وكان عامل القدرة فيها (0.8). احسب: ① التيار في الدائرة. ② رادة السعة للمتسعة.", "a": "<b>الحل التفصيلي:</b><br>X<sub>L</sub> = 2πfL = 2π × 50 × (1/π) = 100 Ω<br><b>1) التيار:</b> pf = R/Z ⇒ 0.8 = 40/Z ⇒ Z = 50 Ω<br>I = V/Z = 100/50 = 2 A<br><span class=\"res\">I = 2 A</span><br><b>2) رادة السعة:</b> Z² = R² + (X<sub>L</sub> − X<sub>C</sub>)² ⇒ 50² = 40² + (100 − X<sub>C</sub>)² ⇒ (100 − X<sub>C</sub>)² = 900 ⇒ 100 − X<sub>C</sub> = 30<br><span class=\"res\">X<sub>C</sub> = 70 Ω</span><br><i>ملاحظة: المعادلة تعطي أيضاً X<sub>C</sub> = 130 Ω (100 − X<sub>C</sub> = −30) وهي تعطي الممانعة نفسها. الحل الوزاري يعتمد X<sub>C</sub> = 70 Ω لأن الدائرة حثية (X<sub>L</sub> > X<sub>C</sub>) في الحل الوزاري.</i>", "ch": 3, "id": "c3p013"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "مصدر للفولطية المتناوبة ترددها الزاوي (100π rad/s) وفرق الجهد بين قطبيه (100V)، ربط بين قطبيه على التوالي متسعة سعتها (50/π) μF، وملف معامل حثه الذاتي (1.6/π) H، ومقاومة (30Ω). احسب: ① الممانعة الكلية. ② فرق الجهد عبر كل من المقاومة والمحث والمتسعة. ③ زاوية فرق الطور بين متجه الفولطية الكلية ومتجه التيار.", "a": "<b>الحل التفصيلي:</b><br>X<sub>L</sub> = ωL = 100π × (1.6/π) = 160 Ω<br>X<sub>C</sub> = 1/(ωC) = 1/(100π × (50/π) × 10⁻⁶) = 1/(5000 × 10⁻⁶) = 200 Ω<br><b>1) الممانعة:</b> Z² = R² + (X<sub>L</sub> − X<sub>C</sub>)² = 30² + (160 − 200)² = 900 + 1600 = 2500 ⇒ Z = 50 Ω<br><span class=\"res\">Z = 50 Ω</span><br>I = V/Z = 100/50 = 2 A<br><b>2) فروق الجهد:</b><br>V<sub>R</sub> = I·R = 2 × 30 = 60 V<br>V<sub>L</sub> = I·X<sub>L</sub> = 2 × 160 = 320 V<br>V<sub>C</sub> = I·X<sub>C</sub> = 2 × 200 = 400 V<br><span class=\"res\">V<sub>R</sub> = 60 V</span> <span class=\"res\">V<sub>L</sub> = 320 V</span> <span class=\"res\">V<sub>C</sub> = 400 V</span><br><b>3) زاوية الطور:</b> tanθ = (X<sub>L</sub> − X<sub>C</sub>)/R = (160 − 200)/30 = −4/3 ⇒ θ = −53°<br>الإشارة السالبة تعني أن الدائرة سعوية (X<sub>C</sub> > X<sub>L</sub>)، والتيار يتقدم الفولطية الكلية.", "ch": 3, "id": "c3p014"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "ربط ملف قطبي بين قطبي مصدر للفولطية المتناوبة (200V) بتردد (50Hz)، وكان تيار الدائرة (2A) ومقاومة الملف (60Ω). احسب: ① معامل الحث الذاتي للملف. ② زاوية فرق الطور بين متجه الفولطية الكلية ومتجه التيار مع رسم مخطط الممانعة. ③ القدرة الحقيقية والقدرة الظاهرية.", "a": "<b>الحل التفصيلي:</b><br><b>1) الحث الذاتي:</b> Z = V/I = 200/2 = 100 Ω<br>Z² = R² + X<sub>L</sub>² ⇒ 100² = 60² + X<sub>L</sub>² ⇒ X<sub>L</sub>² = 6400 ⇒ X<sub>L</sub> = 80 Ω<br>X<sub>L</sub> = 2πfL ⇒ L = X<sub>L</sub>/(2πf) = 80/(2π × 50) = 0.254 H<br><span class=\"res\">L ≈ 0.254 H</span><br><b>2) زاوية الطور:</b> tanθ = X<sub>L</sub>/R = 80/60 = 4/3 ⇒ θ = 53°. المخطط: ضلع أفقي R = 60، ضلع عمودي X<sub>L</sub> = 80، والوتر Z = 100.<br><b>3) القدرة:</b> P<sub>real</sub> = I²R = 2² × 60 = 240 W<br>P<sub>app</sub> = I·V<sub>T</sub> = 2 × 200 = 400 VA<br><span class=\"res\">P<sub>real</sub> = 240 W</span> <span class=\"res\">P<sub>app</sub> = 400 VA</span>", "ch": 3, "id": "c3p015"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي على مقاومة صرف مقدارها (6Ω) ومتسعة ذات رادة سعة (10Ω) ومحثاً صرفاً رادة حثه (18Ω)، والمجموعة مربوطة مع مصدر للفولطية المتناوبة (50V). احسب: ① الممانعة الكلية. ② التيار في الدائرة. ③ زاوية فرق الطور بين متجه الفولطية الكلية ومتجه التيار. ④ ارسم مخطط الممانعة وما خصائص الدائرة. ⑤ عامل القدرة.", "a": "<b>الحل التفصيلي:</b><br><b>1) الممانعة:</b> Z = √(R² + (X<sub>L</sub> − X<sub>C</sub>)²) = √(6² + (18 − 10)²) = √(36 + 64) = 10 Ω<br><span class=\"res\">Z = 10 Ω</span><br><b>2) التيار:</b> I = V/Z = 50/10 = 5 A<br><span class=\"res\">I = 5 A</span><br><b>3) زاوية الطور:</b> tanθ = (X<sub>L</sub> − X<sub>C</sub>)/R = (18 − 10)/6 = 8/6 = 4/3 ⇒ θ = 53°<br><b>4) المخطط والخصائص:</b> θ > 0 و X<sub>L</sub> > X<sub>C</sub> ⇒ الدائرة حثية (خواصها حثية) لأن زاوية فرق الطور موجبة.<br><b>5) عامل القدرة:</b> pf = cos θ = cos 53° = R/Z = 6/10 = 0.6<br><span class=\"res\">pf = 0.6</span>", "ch": 3, "id": "c3p016"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي محثاً صرفاً ومتسعة ذات سعة صرف ومقاومة صرف (30Ω)، وفرق الجهد بين طرفيها (100V) وتردده (50Hz)، وكانت القدرة الحقيقية المتبددة فيها (120W) ومقدار رادة الحث (160Ω). جد: ① التيار في الدائرة. ② سعة المتسعة. ③ ارسم مخطط الممانعة واحسب زاوية فرق الطور.", "a": "<b>الحل التفصيلي:</b><br><b>1) التيار:</b> P<sub>real</sub> = I²R ⇒ 120 = I² × 30 ⇒ I² = 4 ⇒ I = 2 A<br><span class=\"res\">I = 2 A</span><br><b>2) سعة المتسعة:</b> Z = V/I = 100/2 = 50 Ω<br>Z² = R² + (X<sub>L</sub> − X<sub>C</sub>)² ⇒ 2500 = 900 + (160 − X<sub>C</sub>)² ⇒ (160 − X<sub>C</sub>)² = 1600 ⇒ 160 − X<sub>C</sub> = ∓40 ⇒ X<sub>C</sub> = 200 Ω (خواص سعوية)<br>C = 1/(2πf·X<sub>C</sub>) = 1/(2π × 50 × 200) = 1/(2000π) F = 0.159 × 10⁻³ F<br><span class=\"res\">C ≈ 159 μF</span><br><b>3) زاوية الطور:</b> tanθ = (X<sub>L</sub> − X<sub>C</sub>)/R = (160 − 200)/30 = −4/3 ⇒ θ = −53°. المخطط: ضلع أفقي R = 30، ضلع عمودي (X<sub>L</sub> − X<sub>C</sub>) = −40، والوتر Z = 50.", "ch": 3, "id": "c3p017"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "ربط ملف معامل حثه الذاتي (2/(5π)) H ومقاومته صرف (30Ω)، متسعة ذات سعة صرف، ومصدر للفولطية المتناوبة (100V) بتردد (50Hz)، وكان عامل القدرة (0.6) وللدائرة خواص سعوية. احسب: ① التيار في الدائرة. ② سعة المتسعة. ③ ارسم مخطط الممانعة واحسب زاوية فرق الطور.", "a": "<b>الحل التفصيلي:</b><br><b>1) التيار:</b> pf = R/Z ⇒ 0.6 = 30/Z ⇒ Z = 50 Ω<br>I = V/Z = 100/50 = 2 A<br><span class=\"res\">I = 2 A</span><br><b>2) سعة المتسعة:</b> X<sub>L</sub> = 2πfL = 2π × 50 × 2/(5π) = 40 Ω<br>Z² = R² + (X<sub>L</sub> − X<sub>C</sub>)² ⇒ 2500 = 900 + (40 − X<sub>C</sub>)² ⇒ (40 − X<sub>C</sub>)² = 1600 ⇒ 40 − X<sub>C</sub> = −40 (لأن الدائرة سعوية) ⇒ X<sub>C</sub> = 80 Ω<br>C = 1/(2πf·X<sub>C</sub>) = 1/(2π × 50 × 80) = 1/(8000π) F = 40 × 10⁻⁶ F<br><span class=\"res\">C = 40 μF</span><br><b>3) زاوية الطور:</b> tanθ = (X<sub>L</sub> − X<sub>C</sub>)/R = (40 − 80)/30 = −4/3 ⇒ θ = −53°. المخطط: ضلع أفقي R = 30، ضلع عمودي (X<sub>L</sub> − X<sub>C</sub>) = −40، والوتر Z = 50.", "ch": 3, "id": "c3p018"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي مقاومة صرف (400Ω) ومتسعة ذات سعة صرف (100/π) μF ومحث صرف معامل حثه (4/π) H، مربوطة مع مصدر للفولطية المتناوبة (100V) وتردده الزاوي (100π rad/s). احسب: ① الممانعة الكلية والتيار. ② فرق الجهد عبر كل من المقاومة والمحث والمتسعة. ③ زاوية فرق الطور وخصائص الدائرة. ④ عامل القدرة.", "a": "<b>الحل التفصيلي:</b><br>X<sub>C</sub> = 1/(ωC) = 1/(100π × (100/π) × 10⁻⁶) = 1/(10⁻²) = 100 Ω<br>X<sub>L</sub> = ωL = 100π × (4/π) = 400 Ω<br><b>1) الممانعة والتيار:</b> Z² = 400² + (400 − 100)² = 160000 + 90000 = 250000 ⇒ Z = 500 Ω<br>I = V/Z = 100/500 = 0.2 A<br><span class=\"res\">Z = 500 Ω</span> <span class=\"res\">I = 0.2 A</span><br><b>2) فروق الجهد:</b> V<sub>R</sub> = I·R = 0.2 × 400 = 80 V<br>V<sub>L</sub> = I·X<sub>L</sub> = 0.2 × 400 = 80 V<br>V<sub>C</sub> = I·X<sub>C</sub> = 0.2 × 100 = 20 V<br><b>3) زاوية الطور:</b> tanθ = (X<sub>L</sub> − X<sub>C</sub>)/R = (400 − 100)/400 = 3/4 ⇒ θ = 37°. الدائرة حثية لأن X<sub>L</sub> > X<sub>C</sub>.<br><b>4) عامل القدرة:</b> pf = R/Z = 400/500 = 0.8<br><span class=\"res\">pf = 0.8</span>", "ch": 3, "id": "c3p019"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي مقاومة صرف (40Ω) ومتسعة ذات سعة صرف ومحث صرف مربوطة مع مصدر للفولطية المتناوبة (200V). إذا كانت (X<sub>C</sub> = 90Ω، X<sub>L</sub> = 120Ω، R = 40Ω). احسب: ① الممانعة الكلية. ② التيار المناسب في الدائرة. ③ زاوية فرق الطور بين متجه الفولطية الكلية ومتجه التيار، وارسم المخطط الطوري للممانعة وما خصائص هذه الدائرة.", "a": "<b>الحل التفصيلي:</b><br><b>1) الممانعة:</b> Z² = R² + (X<sub>L</sub> − X<sub>C</sub>)² = 40² + (120 − 90)² = 1600 + 900 = 2500 ⇒ Z = 50 Ω<br><span class=\"res\">Z = 50 Ω</span><br><b>2) التيار:</b> I = V/Z = 200/50 = 4 A<br><span class=\"res\">I = 4 A</span><br><b>3) زاوية الطور:</b> tanθ = (X<sub>L</sub> − X<sub>C</sub>)/R = (120 − 90)/40 = 30/40 = 3/4 ⇒ θ = 37°. المخطط: ضلع أفقي R = 40، ضلع عمودي (X<sub>L</sub> − X<sub>C</sub>) = 30، والوتر Z = 50. الدائرة حثية لأن X<sub>L</sub> > X<sub>C</sub>.", "ch": 3, "id": "c3p020"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "مصدر للفولطية المتناوبة (500V) بتردد زاوي (400 rad/s) ربط بين قطبيه على التوالي متسعة سعتها (10μF) وملف معامل حثه الذاتي (0.125H) ومقاومته (150Ω). احسب: ① الممانعة الكلية والتيار. ② فرق الجهد عبر المقاومة والمحث والمتسعة. ③ زاوية فرق الطور. ④ عامل القدرة وخصائص الدائرة.", "a": "<b>الحل التفصيلي:</b><br>X<sub>L</sub> = ωL = 400 × 0.125 = 50 Ω<br>X<sub>C</sub> = 1/(ωC) = 1/(400 × 10 × 10⁻⁶) = 10⁶/4000 = 250 Ω<br><b>1) الممانعة والتيار:</b> Z² = 150² + (50 − 250)² = 22500 + 40000 = 62500 ⇒ Z = 250 Ω<br>I = V/Z = 500/250 = 2 A<br><span class=\"res\">Z = 250 Ω</span> <span class=\"res\">I = 2 A</span><br><b>2) فروق الجهد:</b> V<sub>R</sub> = I·R = 2 × 150 = 300 V<br>V<sub>L</sub> = I·X<sub>L</sub> = 2 × 50 = 100 V<br>V<sub>C</sub> = I·X<sub>C</sub> = 2 × 250 = 500 V<br><b>3) زاوية الطور:</b> tanθ = (X<sub>L</sub> − X<sub>C</sub>)/R = (50 − 250)/150 = −4/3 ⇒ θ = −53°<br><b>4) عامل القدرة:</b> pf = R/Z = 150/250 = 0.6 (أو pf = V<sub>R</sub>/V<sub>T</sub> = 300/500 = 0.6). الدائرة سعوية لأن X<sub>C</sub> > X<sub>L</sub>.<br><span class=\"res\">pf = 0.6</span>", "ch": 3, "id": "c3p021"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي مقاومة صرف (30Ω) ومحثاً صرفاً رادة حثه (160Ω) ومتسعة رادتها (200Ω)، مربوطة مع مصدر للفولطية المتناوبة (100V). احسب: ① الممانعة الكلية. ② التيار المناسب في الدائرة. ③ زاوية فرق الطور بين متجه الفولطية الكلية ومتجه التيار، وارسم المخطط الطوري. ④ القدرة الحقيقية المستهلكة والقدرة الظاهرية المجهزة للدائرة.", "a": "<b>الحل التفصيلي:</b><br><b>1) الممانعة:</b> Z = √(R² + (X<sub>L</sub> − X<sub>C</sub>)²) = √(30² + (160 − 200)²) = √(900 + 1600) = √2500 = 50 Ω<br><span class=\"res\">Z = 50 Ω</span><br><b>2) التيار:</b> I = V/Z = 100/50 = 2 A<br><span class=\"res\">I = 2 A</span><br><b>3) زاوية الطور:</b> tanθ = (160 − 200)/30 = −4/3 ⇒ θ = −53°. الدائرة سعوية لأن X<sub>C</sub> > X<sub>L</sub>.<br><b>4) القدرة:</b> P<sub>real</sub> = I²R = 2² × 30 = 120 W<br>P<sub>app</sub> = I·V<sub>T</sub> = 2 × 100 = 200 VA<br><span class=\"res\">P<sub>real</sub> = 120 W</span> <span class=\"res\">P<sub>app</sub> = 200 VA</span>", "ch": 3, "id": "c3p022"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "ربط ملف معامل حثه الذاتي (1/(10π)) H بين قطبي مصدر للفولطية المتناوبة فرق جهده (100V)، فكانت زاوية فرق الطور بين متجه الفولطية الكلية ومتجه التيار (37°)، ومقدار التيار المناسب في الدائرة (5A). احسب: ① مقاومة الملف. ② تردد المصدر.", "a": "<b>الحل التفصيلي:</b><br><b>1) المقاومة:</b> Z = V/I = 100/5 = 20 Ω<br>pf = cos 37° = R/Z ⇒ 0.8 = R/20 ⇒ R = 16 Ω<br><span class=\"res\">R = 16 Ω</span><br><b>2) التردد:</b> X<sub>L</sub> = √(Z² − R²) = √(400 − 256) = 12 Ω<br>X<sub>L</sub> = 2πfL ⇒ 12 = 2πf × 1/(10π) = f/5 ⇒ f = 60 Hz<br><span class=\"res\">f = 60 Hz</span>", "ch": 3, "id": "c3p023"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي محثاً صرفاً ومقاومة صرف ومتسعة صرف، مربوطة مع مصدر للفولطية المتناوبة (200V) بتردد (50Hz)، وكان تيار الدائرة (2A) وعامل القدرة (0.6)، وكان فرق الجهد عبر المتسعة (40V)، وللدائرة خواص حثية. فما مقدار معامل الحث الذاتي للمحث؟", "a": "<b>الحل التفصيلي:</b><br>Z = V/I = 200/2 = 100 Ω<br>pf = R/Z ⇒ 0.6 = R/100 ⇒ R = 60 Ω<br>X<sub>C</sub> = V<sub>C</sub>/I = 40/2 = 20 Ω<br>Z² = R² + (X<sub>L</sub> − X<sub>C</sub>)² ⇒ 100² = 60² + (X<sub>L</sub> − 20)² ⇒ (X<sub>L</sub> − 20)² = 6400 ⇒ X<sub>L</sub> − 20 = 80 (لأن الدائرة حثية) ⇒ X<sub>L</sub> = 100 Ω<br>X<sub>L</sub> = 2πfL ⇒ 100 = 2π × 50 × L ⇒ L = 100/(100π) = 1/π H<br><span class=\"res\">L = 1/π H ≈ 0.318 H</span>", "ch": 3, "id": "c3p024"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "ربط ملف مقاومة صرف (30Ω)، معامل حثه الذاتي (0.01H)... مربوط بين قطبي مصدر للفولطية المتناوبة ترددها (500/π Hz) وفرق الجهد بين طرفيه (200V)، وكان عامل القدرة (0.6) وللدائرة خواص سعوية. احسب: ① التيار في الدائرة. ② سعة المتسعة. ③ زاوية فرق الطور.", "a": "<b>الحل التفصيلي:</b><br><b>1) التيار:</b> pf = R/Z ⇒ 0.6 = 30/Z ⇒ Z = 50 Ω<br>I = V/Z = 200/50 = 4 A<br><span class=\"res\">I = 4 A</span><br><b>2) السعة:</b> X<sub>L</sub> = 2πfL = 2π × (500/π) × 0.01 = 10 Ω<br>Z² = R² + (X<sub>L</sub> − X<sub>C</sub>)² ⇒ 2500 = 900 + (10 − X<sub>C</sub>)² ⇒ (10 − X<sub>C</sub>)² = 1600 ⇒ 10 − X<sub>C</sub> = −40 ⇒ X<sub>C</sub> = 50 Ω<br>C = 1/(2πf·X<sub>C</sub>) = 1/(2π × (500/π) × 50) = 1/50000 = 2 × 10⁻⁵ F<br><span class=\"res\">C = 2 × 10⁻⁵ F = 20 μF</span><br><b>3) زاوية الطور:</b> tanθ = (X<sub>L</sub> − X<sub>C</sub>)/R = (10 − 50)/30 = −4/3 ⇒ θ = −53° (الدائرة سعوية).", "ch": 3, "id": "c3p025"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "ربط ملف معامل حثه الذاتي (4/(5π)) H ومقاومته مع مصدر للفولطية المتناوبة فرق جهده (200V)، فكانت زاوية فرق الطور بين متجه الفولطية الكلية ومتجه التيار (53°) وتيار الدائرة (2A). احسب: ① مقاومة الملف. ② تردد المصدر.", "a": "<b>الحل التفصيلي:</b><br>Z = V/I = 200/2 = 100 Ω<br>pf = cos 53° = 0.6 = R/Z ⇒ R = 60 Ω<br><span class=\"res\">R = 60 Ω</span><br>X<sub>L</sub> = √(Z² − R²) = √(10000 − 3600) = 80 Ω<br>X<sub>L</sub> = 2πfL ⇒ 80 = 2πf × 4/(5π) = 8f/5 ⇒ f = 50 Hz<br><span class=\"res\">f = 50 Hz</span>", "ch": 3, "id": "c3p026"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "ربط ملف (مهمل المقاومة؟) معامل حثه الذاتي مع بطارية فرق جهدها (20V)، وكان التيار (5A). ثم فصل الملف عن البطارية وربط بين قطبيه مصدر للفولطية المتناوبة المقدار الأعظم (20√2 V) بتردد (700/22 Hz)، فكان تيار الدائرة (4A). احسب: ① معامل الحث الذاتي. ② زاوية فرق الطور بين الفولطية الكلية والتيار مع رسم مخطط الممانعة. ③ معامل القدرة. ④ القدرة الحقيقية والقدرة الظاهرية.", "a": "<b>الحل التفصيلي:</b><br><b>1) الحث الذاتي:</b> مقاومة الملف R = V/I = 20/5 = 4 Ω. الفولطية المؤثرة V<sub>eff</sub> = V<sub>m</sub>/√2 = 20 V. الممانعة Z = V<sub>eff</sub>/I = 20/4 = 5 Ω<br>Z² = R² + X<sub>L</sub>² ⇒ 25 = 16 + X<sub>L</sub>² ⇒ X<sub>L</sub> = 3 Ω<br>ω = 2πf = 2 × (22/7) × (700/22) = 200 rad/s<br>X<sub>L</sub> = ωL ⇒ L = 3/200 = 0.015 H<br><span class=\"res\">L = 0.015 H</span> <i>(ملاحظة: كتب الكتاب 0.15 H وهو خطأ حسابي، والصحيح 0.015 H)</i><br><b>2) زاوية الطور:</b> tanφ = X<sub>L</sub>/R = 3/4 ⇒ φ = 37°. المخطط: ضلع أفقي R = 4، ضلع عمودي X<sub>L</sub> = 3، والوتر Z = 5.<br><b>3) معامل القدرة:</b> pf = cos φ = R/Z = 4/5 = 0.8<br><b>4) القدرتان:</b> P<sub>real</sub> = I²R = 4² × 4 = 64 W<br>P<sub>app</sub> = I·V<sub>T</sub> = 4 × 20 = 80 VA<br><span class=\"res\">P<sub>real</sub> = 64 W</span> <span class=\"res\">P<sub>app</sub> = 80 VA</span>", "ch": 3, "id": "c3p027"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "مصدر للفولطية المتناوبة ترددها الزاوي (1000 rad/s) وفرق الجهد بين قطبيه (200V)، ربط بين قطبيه على التوالي متسعة سعتها (20μF) وملف معامل حثه (0.01H) ومقاومة (30Ω). احسب: ① الممانعة الكلية والتيار. ② فرق الجهد عبر المقاومة والمحث والمتسعة. ③ زاوية فرق الطور. ④ عامل القدرة وخصائص الدائرة.", "a": "<b>الحل التفصيلي:</b><br>X<sub>C</sub> = 1/(ωC) = 1/(1000 × 20 × 10⁻⁶) = 1/0.02 = 50 Ω<br>X<sub>L</sub> = ωL = 1000 × 0.01 = 10 Ω<br><b>1) الممانعة والتيار:</b> Z² = R² + (X<sub>L</sub> − X<sub>C</sub>)² = 30² + (10 − 50)² = 900 + 1600 = 2500 ⇒ Z = 50 Ω<br>I = V/Z = 200/50 = 4 A<br><span class=\"res\">Z = 50 Ω</span> <span class=\"res\">I = 4 A</span><br><b>2) فروق الجهد:</b> V<sub>R</sub> = I·R = 4 × 30 = 120 V<br>V<sub>L</sub> = I·X<sub>L</sub> = 4 × 10 = 40 V<br>V<sub>C</sub> = I·X<sub>C</sub> = 4 × 50 = 200 V<br><span class=\"res\">V<sub>R</sub> = 120 V</span> <span class=\"res\">V<sub>L</sub> = 40 V</span> <span class=\"res\">V<sub>C</sub> = 200 V</span><br><b>3) زاوية الطور:</b> tanθ = (X<sub>L</sub> − X<sub>C</sub>)/R = (10 − 50)/30 = −4/3 ⇒ θ = −53°<br><b>4) عامل القدرة:</b> pf = cos θ = R/Z = 30/50 = 0.6. الدائرة سعوية لأن X<sub>C</sub> > X<sub>L</sub>.<br><span class=\"res\">pf = 0.6</span>", "ch": 3, "id": "c3p028"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي على ملف مقاومته (40Ω) ومعامل حثه الذاتي، ومتسعة ذات سعة صرف، ومصدر للفولطية المتناوبة (240V) بتردد (500/π Hz)، وكانت رادة الحث للملف (120Ω) ورادة السعة للمتسعة (90Ω). احسب: ① معامل الحث الذاتي للملف. ② سعة المتسعة. ③ الممانعة الكلية وتيار الدائرة. ④ زاوية فرق الطور بين متجه الفولطية الكلية ومتجه التيار.", "a": "<b>الحل التفصيلي:</b><br><b>1) معامل الحث:</b> X<sub>L</sub> = 2πfL ⇒ 120 = 2π × (500/π) × L = 1000 L ⇒ L = 0.12 H<br><span class=\"res\">L = 0.12 H</span><br><b>2) السعة:</b> X<sub>C</sub> = 1/(2πfC) ⇒ 90 = 1/(1000 C) ⇒ C = 1/(9 × 10⁴) F ≈ 1.1 × 10⁻⁵ F<br><span class=\"res\">C ≈ 11 μF</span> <i>(ملاحظة: كتب الكتاب 0.1 × 10⁻⁴ F وهو تقريب، والقيمة الدقيقة ≈ 1.1 × 10⁻⁵ F)</i><br><b>3) الممانعة والتيار:</b> Z² = 40² + (120 − 90)² = 1600 + 900 = 2500 ⇒ Z = 50 Ω<br>I = V/Z = 240/50 = 4.8 A<br><span class=\"res\">Z = 50 Ω</span> <span class=\"res\">I = 4.8 A</span><br><b>4) زاوية الطور:</b> tanθ = (120 − 90)/40 = 3/4 ⇒ θ = 37° (الدائرة حثية لأن X<sub>L</sub> > X<sub>C</sub>).", "ch": 3, "id": "c3p029"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "ربط ملف مقاومته (R) ومعامل حثه الذاتي بين قطبي مصدر للفولطية المتناوبة المقدار المؤثر (100V) بتردد (2500 Hz)، فكانت زاوية فرق الطور بين متجه الفولطية الكلية ومتجه التيار (60°) ومقدار القدرة الحقيقية فيه (500W). احسب: ① مقاومة الملف. ② معامل الحث الذاتي للملف.", "a": "<b>الحل التفصيلي:</b><br><b>1) التيار:</b> P<sub>real</sub> = I·V·cos φ ⇒ 500 = I × 100 × cos 60° = I × 50 ⇒ I = 10 A<br>Z = V/I = 100/10 = 10 Ω<br>cos φ = R/Z ⇒ 1/2 = R/10 ⇒ R = 5 Ω<br><span class=\"res\">R = 5 Ω</span><br><b>2) الحث الذاتي:</b> Z² = R² + X<sub>L</sub>² ⇒ 100 = 25 + X<sub>L</sub>² ⇒ X<sub>L</sub> = 5√3 Ω ≈ 8.66 Ω<br>X<sub>L</sub> = 2πfL ⇒ L = 5√3/(2π × 2500) = (√3/π) × 10⁻³ H ≈ 0.55 × 10⁻³ H<br><span class=\"res\">L ≈ 0.55 mH</span>", "ch": 3, "id": "c3p030"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "ربط ملف بين قطبي بطارية فرق الجهد بينهما (120V) فكانت القدرة المستهلكة في الملف (960W). فاذا فصل الملف عن البطارية وربط بين قطبي مصدر للفولطية المتناوبة المقدار المؤثر لفرق الجهد بينهما (125V) بتردد (200/π Hz) كان تيار الدائرة (5A). جد معامل الحث الذاتي للملف وعامل القدرة للدائرة.", "a": "<b>الحل التفصيلي:</b><br><b>1) مقاومة الملف (من البطارية):</b> P = V²/R ⇒ R = 120²/960 = 15 Ω<br><b>2) مع المصدر المتناوب:</b> Z = V/I = 125/5 = 25 Ω<br>Z² = R² + X<sub>L</sub>² ⇒ 625 = 225 + X<sub>L</sub>² ⇒ X<sub>L</sub> = 20 Ω<br>X<sub>L</sub> = 2πfL ⇒ 20 = 2π × (200/π) × L = 400 L ⇒ L = 0.05 H<br><span class=\"res\">L = 0.05 H</span><br><b>3) عامل القدرة:</b> pf = R/Z = 15/25 = 0.6<br><span class=\"res\">pf = 0.6</span>", "ch": 3, "id": "c3p031"}, {"k": "p", "topic": "الدائرة R-L-C المتوالية", "yrs": "وزاري", "q": "ربط ملف بين طرفي بطارية فرق الجهد بينهما (20V)، وكان تيار الدائرة (5A). فاذا فصل الملف عن البطارية وربط بين طرفيه مصدر للفولطية المتناوبة المقدار المؤثر (20V) بتردد (100/π Hz)، وكان تيار الدائرة (4A). احسب: ① معامل الحث الذاتي للملف. ② زاوية فرق الطور بين الفولطية الكلية والتيار مع رسم المخطط الطوري للممانعة. ③ معامل القدرة. ④ القدرة الحقيقية والقدرة الظاهرية.", "a": "<b>الحل التفصيلي:</b><br><b>1) الحث الذاتي:</b> R = V/I = 20/5 = 4 Ω<br>Z = V/I = 20/4 = 5 Ω<br>Z² = R² + X<sub>L</sub>² ⇒ 25 = 16 + X<sub>L</sub>² ⇒ X<sub>L</sub> = 3 Ω<br>X<sub>L</sub> = 2πfL ⇒ 3 = 2π × (100/π) × L = 200 L ⇒ L = 0.015 H<br><span class=\"res\">L = 15 × 10⁻³ H</span><br><b>2) زاوية الطور:</b> tanφ = X<sub>L</sub>/R = 3/4 ⇒ φ = 37°. المخطط: ضلع أفقي R = 4، ضلع عمودي X<sub>L</sub> = 3، والوتر Z = 5.<br><b>3) معامل القدرة:</b> pf = cos φ = R/Z = 4/5 = 0.8<br><b>4) القدرتان:</b> P<sub>real</sub> = I²R = 4² × 4 = 64 W<br>P<sub>app</sub> = I·V = 4 × 20 = 80 VA<br><span class=\"res\">P<sub>real</sub> = 64 W</span> <span class=\"res\">P<sub>app</sub> = 80 VA</span>", "ch": 3, "id": "c3p032"}, {"k": "k", "topic": "الاهتزاز الكهرومغناطيسي", "yrs": "وزاري", "q": "اختر الإجابة الصحيحة: في دائرة الاهتزاز الكهرومغناطيسي عند اللحظة التي تكون فيها الطاقة المختزنة في المجال الكهربائي بين صفيحتي المتسعة بأعظم مقدار، يكون فيها مقدار التيار:", "opts": ["أعظم ما يمكن", "نصف مقدار الأعظم", "صفراً"], "c": 2, "a": "يكون التيار صفراً، لأن الطاقة الكهربائية بأعظم مقدار عندما تكون شحنة المتسعة بأعظم مقدار، وعندها يكون التيار صفراً (إذ تنعدم الطاقة المغناطيسية).", "ch": 3, "id": "c3k057"}, {"k": "k", "topic": "الاهتزاز الكهرومغناطيسي", "yrs": "وزاري", "q": "اختر الإجابة الصحيحة: في دائرة الاهتزاز الكهرومغناطيسي عند اللحظة التي يكون فيها مقدار التيار صفراً، تكون الطاقة المختزنة بين صفيحتي المتسعة:", "opts": ["بأعظم مقدار", "نصف مقدار الأعظم", "تساوي 0.707 من مقدار الأعظم"], "c": 0, "a": "تكون الطاقة الكهربائية بأعظم مقدار لأن التيار صفر، وتكون الطاقة كلها مختزنة في المجال الكهربائي للمتسعة.", "ch": 3, "id": "c3k058"}, {"k": "k", "topic": "الاهتزاز الكهرومغناطيسي", "yrs": "وزاري", "q": "علام يعتمد التردد الطبيعي لدائرة الاهتزاز الكهرومغناطيسي؟ وكيف يتناسب مع كل منهما؟", "a": "يعتمد التردد الطبيعي على: 1) معامل الحث الذاتي للملف: تناسب عكسي. 2) سعة المتسعة: تناسب عكسي. والعلاقة: fr = 1/(2π√(LC)).", "kw": [["معامل الحث", "الحث الذاتي", "الحث"], ["عكسي"], ["سعة المتسعة", "المتسعة"], ["1/(2π", "2π√", "2π"]], "ch": 3, "id": "c3k059"}, {"k": "k", "topic": "الاهتزاز الكهرومغناطيسي", "yrs": "وزاري", "q": "كيف يمكن الحصول على حالة الرنين في دائرة الاهتزاز الكهرومغناطيسي؟", "a": "بتوليف هذه الدائرة مع تردد الإشارة المطلوب تسلمها، أي جعل تردد دائرة الاستقبال مساوياً لتردد الإشارة المطلوب تسلمها (تردد المصدر = التردد الطبيعي للدائرة).", "kw": [["توليف", "التوليف"], ["تردد الإشارة", "الإشارة"], ["مساويا", "مساوياً", "يساوي", "مساو"]], "ch": 3, "id": "c3k060"}, {"k": "k", "topic": "الاهتزاز الكهرومغناطيسي", "yrs": "وزاري", "q": "ماذا يحصل لسعة الاهتزاز الكهربائي في دائرة الاهتزاز الكهرومغناطيسي العملية التي تحتوي على متسعة ومحث (غير مهمل المقاومة)؟ ولماذا؟", "a": "تتلاشى سعة الاهتزاز مع الزمن (تتناقص تدريجياً حتى تنعدم)، بسبب احتواء مثل هذه الدائرة على مقاومة، فتتبدد الطاقة على شكل حرارة في المقاومة.", "kw": [["تتلاشى", "تتناقص", "تضمحل"], ["مقاومة", "المقاومة"], ["حرارة", "تبدد"]], "ch": 3, "id": "c3k061"}, {"k": "k", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "ما الأهمية العملية لدوائر التيار المتناوب R-L-C المتوالية الربط؟", "a": "تكمن أهميتها في طريقة تجاوبها مع مصادر ذات ترددات مختلفة، فتجعل القدرة المتوسطة المنتقلة إلى الدائرة بأكبر مقدار عند التردد الرنيني، ومثال ذلك دوائر التنقيم المستعملة في أجهزة الراديو.", "kw": [["تجاوب", "تتجاوب"], ["ترددات", "تردد"], ["القدرة", "القدرة المتوسطة"], ["تنقيم", "الراديو"]], "ch": 3, "id": "c3k062"}, {"k": "k", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "من شرط الرنين الكهربائي أثبت أن: ωr = 1/√(LC).", "a": "عند الرنين تتساوى رادة الحث مع رادة السعة: X_L = X_C ⇒ ωL = 1/(ωC) ⇒ ω²_r = 1/(LC) ⇒ ω_r = 1/√(LC).", "kw": [["X_L = X_C", "XL = XC", "ωL", "ωL = 1"], ["ω²", "ω2", "ω²r", "ω^2"], ["1/(LC)", "1/LC", "LC"], ["√", "الجذر"]], "ch": 3, "id": "c3k063"}, {"k": "k", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "ضع كلمة (صح) أمام العبارة الصحيحة وكلمة (خطأ) أمام العبارة غير الصحيحة مع تصحيح الخطأ دون أن تغير ما تحته خط: دائرة تيار متناوب متوالية الربط تحتوي محثاً صرفاً ومتسعة ذات سعة صرف ومقاومة صرف (R-L-C) ومذبذب كهربائي عندما يكون تردد المذبذب أصغر من التردد الرنيني لهذه الدائرة فإنها تمتلك خواص حثية لكون X_C > X_L.", "a": "خطأ، والتصحيح: تمتلك خواص سعوية لكون X_C > X_L.", "kw": [["خطأ"], ["سعوية", "سعوي"], ["X_C > X_L", "XC > XL", "XC>XL"]], "ch": 3, "id": "c3k064"}, {"k": "k", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "اختر الإجابة الصحيحة: دائرة تيار متناوب R-L-C متوالية الربط، عندما تكون الممانعة الكلية للدائرة بأصغر مقدار وتيار الدائرة بأكبر مقدار، فإن عامل القدرة فيها:", "opts": ["أكبر من الواحد الصحيح", "أقل من الواحد الصحيح", "يساوي الواحد الصحيح", "صفراً"], "c": 2, "a": "عامل القدرة يساوي الواحد الصحيح لأن الممانعة أصغر ما يمكن تساوي المقاومة (Z = R) فتكون pf = R/Z = 1 وزاوية الطور صفر.", "ch": 3, "id": "c3k065"}, {"k": "k", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "اختر الإجابة الصحيحة: دائرة تيار متناوب R-L-C متوالية الربط ومذبذب كهربائي، عندما يكون تردد المذبذب أصغر من التردد الرنيني لهذه الدائرة، فإنها تمتلك:", "opts": ["خواص حثية لأن X_C > X_L", "خواص سعوية لأن X_C > X_L", "خواص سعوية لأن X_L > X_C", "خواص أومية خالصة لأن X_L = X_C"], "c": 1, "a": "عند تردد أصغر من الرنيني تكون رادة السعة أكبر من رادة الحث (X_C > X_L) فتكون الدائرة سعوية.", "ch": 3, "id": "c3k066"}, {"k": "k", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "ما مميزات دائرة الرنين التوالي الكهربائية التي تحتوي على مقاومة ومحث ومتسعة ذات سعة صرف ومذبذب كهربائي؟ (اذكر ثلاث ميزات فقط)", "a": "1) التردد الرنيني هو التردد الذي يجعل X_L = X_C، وعندها تكون الرادة المحصلة X = X_L − X_C = 0، وتكون V_L = V_C، و V_X = V_L − V_C = 0. 2) الممانعة الكلية تساوي المقاومة Z = R (أصغر ما يمكن). 3) متجه الطور للفولطية الكلية ومتجه التيار بطور واحد، أي زاوية فرق الطور Φ = 0، وعامل القدرة pf = cos 0 = 1، فتكون القدرة الحقيقية مساوية للقدرة الظاهرية.", "kw": [["X_L = X_C", "XL = XC", "ωL"], ["Z = R", "الممانعة", "أصغر ما يمكن"], ["صفر", "Φ = 0", "زاوية فرق الطور", "بطور واحد"], ["الواحد", "pf = 1", "1"]], "ch": 3, "id": "c3k067"}, {"k": "k", "topic": "عامل النوعية", "yrs": "وزاري", "q": "ما المقصود بعامل النوعية؟ وعلام يعتمد؟", "a": "عامل النوعية هو نسبة التردد الزاوي الرنيني (ω_r) إلى نطاق التردد الزاوي (Δω)، ويرمز له Qf: Qf = (1/R)√(L/C). ويعتمد على معامل الحث الذاتي للمحث، وسعة المتسعة، ومقاومة الدائرة.", "kw": [["نسبة", "النسبة"], ["Δω", "نطاق", "نطاق التردد"], ["معامل الحث", "الحث"], ["سعة المتسعة", "المتسعة"], ["مقاومة", "المقاومة"]], "ch": 3, "id": "c3k068"}, {"k": "k", "topic": "عامل النوعية", "yrs": "وزاري", "q": "اختر الإجابة الصحيحة: عامل النوعية يعطى بالعلاقة:", "opts": ["Qf = (1/R)×√(C/L)", "Qf = (1/R)×√(L/C)", "Qf = R×√(LC)", "Qf = R×√(C/L)"], "c": 1, "a": "Qf = (1/R)√(L/C)، وتعتمد على معامل الحث الذاتي وسعة المتسعة ومقاومة الدائرة.", "ch": 3, "id": "c3k069"}, {"k": "k", "topic": "عامل النوعية", "yrs": "وزاري", "q": "علل: يزداد عامل النوعية في الدائرة الرنينية المتوالية الربط كلما كانت مقاومة هذه الدائرة صغيرة المقدار.", "a": "لأنه عند كون مقاومة الدائرة صغيرة يكون منحنى القدرة المتوسطة حاداً وعالياً، فيكون عرض نطاق التردد الزاوي Δω صغيراً، وبالتالي يكون عامل النوعية Qf = (1/R)√(L/C) عالياً.", "kw": [["حاد", "حادا", "حادًا"], ["Δω", "عرض نطاق", "نطاق"], ["صغير", "صغيرا"], ["عال", "عالي", "عاليا"]], "ch": 3, "id": "c3k070"}, {"k": "k", "topic": "عامل النوعية", "yrs": "وزاري", "q": "يقل عامل النوعية في الدائرة الرنينية المتوالية الربط كلما كانت مقاومة هذه الدائرة كبيرة المقدار. علل ذلك؟", "a": "لأنه عند كون المقاومة كبيرة المقدار يصبح منحنى القدرة المتوسطة واسعاً (عريضاً)، فيكون عرض نطاق التردد الزاوي Δω كبيراً، وبالتالي يكون Qf = (1/R)√(L/C) صغيراً.", "kw": [["واسع", "عريض", "عريضا"], ["Δω", "عرض نطاق", "نطاق"], ["كبير", "كبيرا"], ["صغير", "صغيرا", "صغيراً"]], "ch": 3, "id": "c3k071"}, {"k": "k", "topic": "عامل النوعية", "yrs": "وزاري", "q": "علام يعتمد عامل النوعية في دائرة تيار متناوب متوالية الربط تحتوي مقاومة صرف ومحث صرف ومتسعة ذات سعة صرف (R-L-C)؟ وعلام يعتمد مقدار عامل النوعية؟", "a": "يعتمد عامل النوعية على: 1) التردد الزاوي الرنيني ω_r. 2) نطاق التردد الزاوي Δω. والعلاقة: Qf = ω_r/Δω، وفق العلاقة Qf = (1/R)√(L/C)، أي يعتمد على R و L و C.", "kw": [["التردد الزاوي الرنيني", "ω_r", "ωr"], ["نطاق التردد", "Δω"], ["(1/R)", "1/R", "المقاومة", "مقاومة"], ["√(L/C)", "L/C", "√", "الجذر"]], "ch": 3, "id": "c3k072"}, {"k": "k", "topic": "عامل النوعية", "yrs": "وزاري", "q": "ما تأثير زيادة المقاومة الكهربائية على عامل النوعية في دائرة تيار متناوب رنينية متوالية الربط؟", "a": "يقل عامل النوعية عند زيادة المقاومة، لأنه يتناسب عكسياً مع المقاومة حسب العلاقة Qf = (1/R)√(L/C)، أو Qf = ω_r/Δω حيث Δω = R/L يتناسب طردياً مع المقاومة.", "kw": [["يقل", "تقل", "ينقص"], ["عكسي", "عكسياً"], ["المقاومة", "R"]], "ch": 3, "id": "c3k073"}, {"k": "k", "topic": "عامل النوعية", "yrs": "وزاري", "q": "ما تأثير زيادة المقاومة الكهربائية على نطاق التردد الزاوي وعامل النوعية في دائرة تيار متناوب رنينية متوالية الربط؟", "a": "يزداد نطاق التردد الزاوي بزيادة المقاومة لأنه يتناسب طردياً معها: Δω = R/L، ويقل عامل النوعية بزيادة المقاومة لأنه يتناسب عكسياً معها: Qf = (1/R)√(L/C).", "kw": [["نطاق", "Δω"], ["يزداد", "يزيد", "تزداد"], ["طردي", "طردياً"], ["يقل", "تقل", "عكسي", "عكسياً"]], "ch": 3, "id": "c3k074"}, {"k": "k", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "علام يعتمد مقدار التردد الزاوي الرنيني في الدائرة الرنينية؟", "a": "يعتمد على الجذر التربيعي لمعامل الحث الذاتي للملف وسعة المتسعة: ω_r = 1/√(LC).", "kw": [["الجذر", "√"], ["معامل الحث", "الحث"], ["سعة المتسعة", "المتسعة"]], "ch": 3, "id": "c3k075"}, {"k": "k", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "علام يعتمد نطاق التردد الزاوي؟", "a": "يعتمد على المقاومة R ويتناسب معها طردياً، وعلى معامل الحث الذاتي للملف L ويتناسب معه عكسياً، حسب العلاقة Δω = R/L.", "kw": [["المقاومة", "R"], ["طردي", "طردياً"], ["معامل الحث", "الحث", "L"], ["عكسي", "عكسياً"], ["R/L", "Δω"]], "ch": 3, "id": "c3k076"}, {"k": "k", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "ما المقصود بـ نطاق التردد الزاوي؟", "a": "هو الفرق بين التردد الزاوي الأعلى والتردد الزاوي الأدنى عند منتصف المقدار الأعظم للقدرة المتوسطة: Δω = ω₂ − ω₁، ويتناسب طردياً مع المقاومة (R) وعكسياً مع معامل الحث الذاتي (L): Δω = R/L.", "kw": [["منتصف", "المنتصف"], ["ω₂ − ω₁", "ω2", "ω1", "ω₂", "ω₁"], ["طردي", "طردياً"], ["عكسي", "عكسياً"]], "ch": 3, "id": "c3k077"}, {"k": "p", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "دائرة اهتزاز كهرومغناطيسية تتألف من متسعة ذات سعة صرف (50/π) μF ومحث صرف معامل حثه الذاتي (5/π) mH. احسب: ① التردد الطبيعي لهذه الدائرة. ② التردد الزاوي الطبيعي لهذه الدائرة.", "a": "<b>الحل التفصيلي:</b><br>L = (5/π) × 10⁻³ H، C = (50/π) × 10⁻⁶ F<br><b>1) التردد الطبيعي:</b> f_r = 1/(2π√(LC)) = 1/(2π√((5/π)(50/π) × 10⁻⁹)) = 1/(2π × 1.592 × 10⁻⁴) ≈ 1000 Hz<br><span class=\"res\">f_r = 10³ Hz</span><br><b>2) التردد الزاوي:</b> ω = 2πf = 2π × 1000 ≈ 6.28 × 10³ rad/s<br><span class=\"res\">ω = 6.28 × 10³ rad/s</span>", "ch": 3, "id": "c3p033"}, {"k": "p", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "دائرة اهتزاز كهرومغناطيسية تتألف من متسعة ذات سعة صرف (100/π) μF ومحث صرف معامل حثه الذاتي (10/π) mH. احسب: ① التردد الطبيعي لهذه الدائرة. ② التردد الزاوي الطبيعي لهذه الدائرة.", "a": "<b>الحل التفصيلي:</b><br>LC = (10/π) × 10⁻³ × (100/π) × 10⁻⁶ = 1000/π² × 10⁻⁹ ≈ 1.013 × 10⁻⁷<br><b>1) التردد الطبيعي:</b> f = 1/(2π√(LC)) = 1/(2π√(1000/π² × 10⁻⁹)) = 1/(2π × 10⁻³/π) = 1/(2 × 10⁻³) = 500 Hz<br><span class=\"res\">f = 500 Hz</span><br><b>2) التردد الزاوي:</b> ω = 2πf = 2π × 500 = 1000 rad/s<br>أو: ω = 1/√(LC) = 1/(10⁻³/π) = 1000 rad/s<br><span class=\"res\">ω = 1000 rad/s</span>", "ch": 3, "id": "c3p034"}, {"k": "p", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي ملفاً معامل حثه الذاتي (1/π) H ومتسعة سعتها (1/π) μF ومقاومة (5Ω)، فإذا وضعت عليها فولطية متناوبة مقدارها (10V) أصبحت الدائرة في حالة رنين. احسب: ① التردد الرنيني. ② تيار الدائرة. ③ القدرة الظاهرية. ④ عامل القدرة. ⑤ ارسم مخطط الممانعة للدائرة الرنينية.", "a": "<b>الحل التفصيلي:</b><br><b>1) التردد الرنيني:</b> f_r = 1/(2π√(LC)) = 1/(2π√((1/π)(1/π) × 10⁻⁶)) = 1/(2π × 10⁻³/π) = 1/(2 × 10⁻³) = 500 Hz<br><span class=\"res\">f_r = 500 Hz</span><br><b>2) التيار:</b> في الرنين Z = R = 5 Ω ⇒ I = V/Z = 10/5 = 2 A<br><span class=\"res\">I = 2 A</span><br><b>3) القدرة الظاهرية:</b> P<sub>app</sub> = I·V = 2 × 10 = 20 VA<br><span class=\"res\">P<sub>app</sub> = 20 VA</span><br><b>4) عامل القدرة:</b> pf = R/Z = 5/5 = 1 (لأن Φ = 0)<br><b>5) المخطط:</b> في الرنين X_L = X_C فيكون المخطط ضلعاً أفقياً فقط (هو R = Z) بلا ضلع عمودي، والزاوية Φ = 0.", "ch": 3, "id": "c3p035"}, {"k": "p", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي ملفاً مقاومته (20Ω) ومتسعة سعتها (50μF) ومصدراً للفولطية المتناوبة مقدارها (100V) بتردد (100/π Hz)، كانت القدرة الحقيقية فيها تساوي القدرة الظاهرية. احسب: ① معامل الحث الذاتي للملف وتيار الدائرة. ② رادة الحث ورادة السعة. ③ زاوية فرق الطور. ④ عامل القدرة.", "a": "<b>الحل التفصيلي:</b><br><b>الدائرة في حالة رنين</b> لأن P<sub>real</sub> = P<sub>app</sub> ⇒ pf = 1 ⇒ Z = R = 20 Ω<br><b>1) التيار:</b> I = V/Z = 100/20 = 5 A<br>ω_r = 2πf = 2π × 100/π = 200 rad/s<br><span class=\"res\">I = 5 A</span><br><b>2) رادة السعة:</b> X_C = 1/(ωC) = 1/(200 × 50 × 10⁻⁶) = 100 Ω<br>X_L = X_C = 100 Ω ⇒ L = X_L/ω = 100/200 = 0.5 H<br><span class=\"res\">X_C = 100 Ω</span> <span class=\"res\">L = 0.5 H</span><br><b>3) زاوية الطور:</b> tanΦ = (X_L − X_C)/R = 0 ⇒ Φ = 0<br><b>4) عامل القدرة:</b> pf = cos 0 = 1<br><span class=\"res\">pf = 1</span>", "ch": 3, "id": "c3p036"}, {"k": "p", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي مقاومة صرف (10Ω) ومحثاً صرفاً معامل حثه (200 μH) ومتسعة ذات سعة صرف (20 nF) ومذبذباً كهربائياً فرق الجهد بين قطبيه (100V)، والدائرة في حالة رنين. احسب: ① التردد الزاوي الرنيني. ② التيار المناسب في الدائرة. ③ رادة الحث والرادة المحصلة. ④ عامل القدرة. ⑤ عامل النوعية.", "a": "<b>الحل التفصيلي:</b><br><b>1) التردد الزاوي الرنيني:</b> ω_r = 1/√(LC) = 1/√(200 × 10⁻⁶ × 20 × 10⁻⁹) = 1/(2 × 10⁻⁶) = 5 × 10⁵ rad/s<br><span class=\"res\">ω_r = 5 × 10⁵ rad/s</span><br><b>2) التيار:</b> في الرنين Z = R = 10 Ω ⇒ I = V/R = 100/10 = 10 A<br><span class=\"res\">I = 10 A</span><br><b>3) رادة الحث والسعة:</b> X_L = ω_r·L = 5 × 10⁵ × 200 × 10⁻⁶ = 100 Ω، و X_C = 1/(ω_r·C) = 1/(5 × 10⁵ × 20 × 10⁻⁹) = 100 Ω، والرادة المحصلة X = X_L − X_C = 0<br><span class=\"res\">X_L = 100 Ω</span> <span class=\"res\">X = 0</span><br><b>4) عامل القدرة:</b> pf = cos 0 = 1<br><b>5) عامل النوعية:</b> Q_f = (1/R)√(L/C) = (1/10)√(200 × 10⁻⁶ / 20 × 10⁻⁹) = (1/10)√(10⁴) = 10<br><span class=\"res\">Q_f = 10</span>", "ch": 3, "id": "c3p037"}, {"k": "p", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط فيها ملف مقاومته (500Ω) ومتسعة سعتها (0.5μF) ومصدر للفولطية المتناوبة مقدارها (100V) بتردد زاوي (1000 rad/s) فكانت الممانعة الكلية للدائرة (500Ω). جد مقدار: ① كل من رادة الحث ورادة السعة. ② زاوية فرق الطور بين متجه الفولطية الكلية ومتجه التيار. ③ سعة المتسعة التي تجعل متجه الفولطية الكلية يتأخر عن متجه التيار بزاوية فرق طور (π/4).", "a": "<b>الحل التفصيلي:</b><br><b>الدائرة في حالة رنين</b> لأن Z = R = 500 Ω<br><b>1) رادة السعة والحث:</b> X_C = 1/(ωC) = 1/(1000 × 0.5 × 10⁻⁶) = 2000 Ω<br>X_L = X_C = 2000 Ω (حالة رنين)<br><span class=\"res\">X_L = 2000 Ω</span> <span class=\"res\">X_C = 2000 Ω</span><br><b>2) زاوية الطور:</b> tanθ = (X_L − X_C)/R = 0/500 = 0 ⇒ θ = 0<br><b>3) السعة المطلوبة:</b> θ = −π/4 ⇒ tanθ = −1 = (2000 − X_C)/500 ⇒ X_C = 2500 Ω<br>C = 1/(ωX_C) = 1/(1000 × 2500) = 4 × 10⁻⁷ F = 0.4 μF<br><span class=\"res\">C = 0.4 μF</span>", "ch": 3, "id": "c3p038"}, {"k": "p", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط فيها ملف مقاومته (500Ω) ومعامل حثه الذاتي (0.2H) ومتسعة متغيرة السعة ومصدر للفولطية المتناوبة مقدارها (400V) بتردد (5000/π Hz). احسب: ① سعة المتسعة التي تجعل الدائرة في حالة رنين وتيار الدائرة. ② كل من رادة الحث ورادة السعة. ③ عامل النوعية. ④ سعة المتسعة التي تجعل متجه الفولطية الكلية يتأخر عن متجه التيار بزاوية فرق طور (π/4).", "a": "<b>الحل التفصيلي:</b><br><b>1) السعة في الرنين:</b> ω = 2πf = 2π × 5000/π = 10⁴ rad/s<br>ω_r = 1/√(LC) ⇒ C = 1/(ω²L) = 1/(10⁸ × 0.2) = 5 × 10⁻⁸ F<br>التيار: Z = R = 500 Ω ⇒ I = V/R = 400/500 = 0.8 A<br><span class=\"res\">C = 5 × 10⁻⁸ F</span> <span class=\"res\">I = 0.8 A</span><br><b>2) رادة الحث والسعة:</b> X_L = ωL = 10⁴ × 0.2 = 2000 Ω = X_C<br><span class=\"res\">X_L = X_C = 2000 Ω</span><br><b>3) عامل النوعية:</b> Q_f = (1/R)√(L/C) = (1/500)√(0.2/(5 × 10⁻⁸)) = (1/500)√(4 × 10⁶) = 2000/500 = 4<br><span class=\"res\">Q_f = 4</span><br><b>4) السعة المطلوبة:</b> tan(−π/4) = (2000 − X_C)/500 = −1 ⇒ X_C = 2500 Ω ⇒ C = 1/(ωX_C) = 1/(10⁴ × 2500) = 4 × 10⁻⁸ F<br><span class=\"res\">C = 4 × 10⁻⁸ F</span>", "ch": 3, "id": "c3p039"}, {"k": "p", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي على ملف مقاومته (500Ω) ومعامل حثه الذاتي (2H) ومتسعة سعتها (0.5μF) وفولطية متناوبة (100V)، والدائرة في حالة رنين. احسب: ① التردد الزاوي الرنيني. ② التيار المناسب في الدائرة. ③ عامل القدرة. ④ القدرة الظاهرية. ⑤ ارسم مخطط الممانعة للدائرة الرنينية.", "a": "<b>الحل التفصيلي:</b><br><b>1) التردد الزاوي الرنيني:</b> ω_r = 1/√(LC) = 1/√(2 × 0.5 × 10⁻⁶) = 1/10⁻³ = 1000 rad/s<br><span class=\"res\">ω_r = 1000 rad/s</span><br><b>2) التيار:</b> في الرنين Z = R = 500 Ω ⇒ I = V/R = 100/500 = 0.2 A<br><span class=\"res\">I = 0.2 A</span><br><b>3) عامل القدرة:</b> pf = R/Z = 500/500 = 1<br><span class=\"res\">pf = 1</span><br><b>4) القدرة الظاهرية:</b> P<sub>app</sub> = I·V = 0.2 × 100 = 20 VA<br><span class=\"res\">P<sub>app</sub> = 20 VA</span><br><b>5) المخطط:</b> في الرنين X_L = X_C فيكون المخطط ضلعاً أفقياً فقط بطول R = Z = 500 Ω.", "ch": 3, "id": "c3p040"}, {"k": "p", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "مصدر للفولطية المتناوبة تردده الزاوي (500 rad/s) فرق الجهد بين قطبيه (300V)، ربط بين قطبيه على التوالي متسعة سعتها (20μF) وملف معامل حثه الذاتي (0.2H) ومقاومته (150Ω). احسب: ① فرق الجهد عبر كل من المقاومة والمحث والمتسعة. ② عامل القدرة وزاوية فرق الطور. ③ القدرة الحقيقية والقدرة الظاهرية.", "a": "<b>الحل التفصيلي:</b><br><b>ملاحظة:</b> نص الكتاب كتب (500π rad/s) والحل المعتمد في الكتاب يستعمل ω = 500 rad/s.<br>X_L = ωL = 500 × 0.2 = 100 Ω<br>X_C = 1/(ωC) = 1/(500 × 20 × 10⁻⁶) = 100 Ω ⇒ X_L = X_C (حالة رنين)<br>Z = R = 150 Ω ⇒ I = V/Z = 300/150 = 2 A<br><b>1) فروق الجهد:</b> V<sub>R</sub> = I·R = 2 × 150 = 300 V<br>V<sub>L</sub> = I·X_L = 2 × 100 = 200 V<br>V<sub>C</sub> = I·X_C = 2 × 100 = 200 V<br><span class=\"res\">V<sub>R</sub> = 300 V</span> <span class=\"res\">V<sub>L</sub> = 200 V</span> <span class=\"res\">V<sub>C</sub> = 200 V</span><br><b>2) زاوية الطور وعامل القدرة:</b> θ = 0، pf = cos 0 = 1<br><b>3) القدرتان:</b> P<sub>real</sub> = I²R = 4 × 150 = 600 W، P<sub>app</sub> = I·V = 2 × 300 = 600 VA<br><span class=\"res\">P<sub>real</sub> = 600 W</span> <span class=\"res\">P<sub>app</sub> = 600 VA</span>", "ch": 3, "id": "c3p041"}, {"k": "p", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي على مقاومة صرف (3Ω) ومحث صرف (L = 0.04 H) ومتسعة ذات سعة صرف (C = 25 μF) ومصدر فرق جهده (75V) والدائرة في حالة رنين. احسب: ① الفولطية عبر كل من المقاومة والمحث والمتسعة وفولطية الرنين. ② عامل النوعية للدائرة.", "a": "<b>الحل التفصيلي:</b><br><b>الدائرة في حالة رنين:</b> Z = R = 3 Ω<br>I = V/Z = 75/3 = 25 A<br>f_r = 1/(2π√(LC)) = 1/(2π√(0.04 × 25 × 10⁻⁶)) = 1/(2π × 10⁻³) = 500/π Hz<br>X_L = 2πf_r L = 2π × (500/π) × 0.04 = 40 Ω = X_C<br><b>1) الفولطية:</b> V_R = I·R = 25 × 3 = 75 V<br>V_L = I·X_L = 25 × 40 = 1000 V<br>V_C = I·X_C = 25 × 40 = 1000 V<br>V_X = V_L − V_C = 0 (فولطية الرنين = 75 V)<br><span class=\"res\">V_R = 75 V</span> <span class=\"res\">V_L = 1000 V</span> <span class=\"res\">V_C = 1000 V</span><br><b>2) عامل النوعية:</b> Q_f = (1/R)√(L/C) = (1/3)√(0.04/(25 × 10⁻⁶)) = (1/3)√1600 = 40/3 ≈ 13.33<br><span class=\"res\">Q_f ≈ 13.33</span>", "ch": 3, "id": "c3p042"}, {"k": "p", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط تحتوي على مقاومة صرف (500Ω) ومحث صرف (L = 4H) ومتسعة ذات سعة صرف (C = 0.25μF) ومذبذب كهربائي فرق الجهد بين طرفيه (200V)، والدائرة في حالة رنين. احسب: ① التردد الزاوي الرنيني. ② رادة الحث ورادة السعة المحصلة. ③ التيار المناسب في الدائرة. ④ الفولطية عبر كل من المقاومة والمحث والمتسعة.", "a": "<b>الحل التفصيلي:</b><br><b>1) التردد الزاوي الرنيني:</b> ω_r = 1/√(LC) = 1/√(4 × 0.25 × 10⁻⁶) = 1/10⁻³ = 1000 rad/s<br><span class=\"res\">ω_r = 1000 rad/s</span><br><b>2) الرادة:</b> X_L = ω_r·L = 1000 × 4 = 4000 Ω = X_C ⇒ الرادة المحصلة X = X_C − X_L = 0<br><span class=\"res\">X_L = X_C = 4000 Ω</span><br><b>3) التيار:</b> Z = R = 500 Ω ⇒ I = V/Z = 200/500 = 0.4 A<br><span class=\"res\">I = 0.4 A</span><br><b>4) الفولطية:</b> V_R = I·R = 0.4 × 500 = 200 V<br>V_L = I·X_L = 0.4 × 4000 = 1600 V = V_C<br>V_X = V_L − V_C = 0<br><span class=\"res\">V_R = 200 V</span> <span class=\"res\">V_L = V_C = 1600 V</span>", "ch": 3, "id": "c3p043"}, {"k": "p", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط الحمل فيها ملف مقاومته (10Ω) ومعامل حثه الذاتي (0.5H) ومتسعة متغيرة السعة، ومصدر للفولطية المتناوبة مقداره (100V) بتردد (700/22 Hz)، وكانت القدرة الحقيقية المستهلكة في الدائرة تساوي القدرة الظاهرية المجهزة لها. احسب مقدار: ① كل من رادة الحث ورادة السعة. ② سعة المتسعة. ③ تيار الدائرة وزاوية فرق الطور وعامل القدرة. ④ عامل النوعية للدائرة.", "a": "<b>الحل التفصيلي:</b><br><b>الدائرة في حالة رنين</b> لأن P<sub>real</sub> = P<sub>app</sub> ⇒ pf = 1 ⇒ θ = 0<br>ω = 2πf = 2 × (22/7) × (700/22) = 200 rad/s<br><b>1) الرادات:</b> X_L = ωL = 200 × 0.5 = 100 Ω<br>X_C = X_L = 100 Ω (حالة رنين)<br><span class=\"res\">X_L = 100 Ω</span> <span class=\"res\">X_C = 100 Ω</span><br><b>2) السعة:</b> X_C = 1/(ωC) ⇒ 100 = 1/(200C) ⇒ C = 1/(200 × 100) = 5 × 10⁻⁵ F<br><span class=\"res\">C = 5 × 10⁻⁵ F = 50 μF</span><br><b>3) التيار والزاوية وعامل القدرة:</b> Z = R = 10 Ω ⇒ I = V/Z = 100/10 = 10 A<br>θ = 0، pf = cos 0 = 1<br><span class=\"res\">I = 10 A</span> <span class=\"res\">pf = 1</span><br><b>4) عامل النوعية:</b> Q_f = (1/R)√(L/C) = (1/10)√(0.5/(5 × 10⁻⁵)) = (1/10)√(10⁴) = 10<br>أو: Q_f = ω_r/Δω حيث Δω = R/L = 20 rad/s ⇒ Q_f = 200/20 = 10<br><span class=\"res\">Q_f = 10</span>", "ch": 3, "id": "c3p044"}, {"k": "p", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "مقاومة صرف مقدارها (150Ω) ربطت على التوالي مع ملف مهمل المقاومة معامل حثه الذاتي (0.2H) ومتسعة ذات سعة صرف، وربطت المجموعة بين قطبي مصدر للفولطية المتناوبة تردده (500/π Hz) وفرق الجهد بين طرفيه (300V). احسب مقدار: ① سعة المتسعة التي تجعل الدائرة في حالة رنين. ② عامل القدرة وزاوية فرق الطور بين الفولطية الكلية والتيار. ③ ارسم المخطط الطوري للممانعة. ④ تيار الدائرة.", "a": "<b>الحل التفصيلي:</b><br>f = 500/π ⇒ ω = 2πf = 1000 rad/s<br><b>1) السعة:</b> في الرنين X_L = X_C ⇒ ω²LC = 1 ⇒ C = 1/(ω²L) = 1/(10⁶ × 0.2) = 5 × 10⁻⁶ F<br><span class=\"res\">C = 5 μF</span><br>X_L = ωL = 1000 × 0.2 = 200 Ω = X_C<br><b>2) عامل القدرة وزاوية الطور:</b> Z = R = 150 Ω ⇒ θ = 0، pf = cos 0 = R/Z = 1<br><span class=\"res\">pf = 1</span> <span class=\"res\">θ = 0</span><br><b>3) المخطط:</b> ضلع أفقي بطول R = Z = 150 Ω، بلا ضلع عمودي لأن X_L = X_C.<br><b>4) التيار:</b> I = V/Z = 300/150 = 2 A<br><span class=\"res\">I = 2 A</span>", "ch": 3, "id": "c3p045"}, {"k": "p", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "مقاومة صرف مقدارها (4Ω) ربطت على التوالي مع ملف مهمل المقاومة معامل حثه الذاتي (0.5H) ومتسعة ذات سعة صرف، وربطت المجموعة بين قطبي مصدر للفولطية المتناوبة تردده (50Hz) وفرق الجهد بين طرفيه (100V). احسب: ① عامل القدرة في الدائرة وزاوية فرق الطور بين الفولطية الكلية والتيار. ② سعة المتسعة التي تجعل الدائرة في حالة رنين. ③ تيار الدائرة.", "a": "<b>الحل التفصيلي:</b><br><b>1) عامل القدرة:</b> في حالة الرنين تكون الدائرة أومية خالصة، θ = 0، pf = 1<br><span class=\"res\">pf = 1</span> <span class=\"res\">θ = 0</span><br><b>2) سعة المتسعة:</b> ω = 2π × 50 = 100π rad/s<br>X_L = ωL = 100π × 0.5 = 50π Ω = X_C ⇒ X_C = 1/(ωC)<br>C = 1/(ω·X_C) = 1/(100π × 50π) = 1/(5000π²) = 2 × 10⁻⁴/π² F ≈ 2 × 10⁻⁴/π² F<br><span class=\"res\">C = 2 × 10⁻⁴/π² F</span><br><b>3) التيار:</b> Z = R = 4 Ω ⇒ I = V/R = 100/4 = 25 A<br><span class=\"res\">I = 25 A</span>", "ch": 3, "id": "c3p046"}, {"k": "p", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "دائرة تيار متناوب متوالية الربط الحمل فيها ملف مقاومته (500Ω) ومتسعة متغيرة السعة، إذا أخذت من سعتها (50nF) ومصدر للفولطية المتناوبة مقداره (400V) بتردد زاوي (10⁴ rad/s)، أصبحت الفولطية الكلية تتأخر عن التيار بزاوية فرق طور (45°). احسب مقدار: ① معامل الحث الذاتي للملف. ② تيار الدائرة.", "a": "<b>الحل التفصيلي:</b><br><b>1) الممانعة وعامل الطور:</b> cos 45° = R/Z ⇒ Z = 500√2 ≈ 707 Ω، و X² = Z² − R² = 250000 ⇒ |X| = 500<br>الفولطية تتأخر عن التيار، أي الدائرة سعوية ⇒ X = X_L − X_C = −500 Ω<br>X_C = 1/(ωC) = 1/(10⁴ × 50 × 10⁻⁹) = 2000 Ω <i>(ملاحظة: الحل المعتمد في الكتاب يستعمل C = 50 nF)</i><br>X_L = X_C − 500 = 1500 Ω ⇒ L = X_L/ω = 1500/10⁴ = 0.15 H<br><span class=\"res\">L = 0.15 H</span><br><b>2) التيار:</b> I = V/Z = 400/707 ≈ 0.57 A (أو 400/700 ≈ 0.57 A)<br><span class=\"res\">I ≈ 0.57 A</span>", "ch": 3, "id": "c3p047"}, {"k": "p", "topic": "الرنين في دوائر التيار المتناوب", "yrs": "وزاري", "q": "مقاومة صرف مقدارها (150Ω) ربطت على التوالي مع ملف مهمل المقاومة معامل حثه الذاتي (10/π) mH ومتسعة ذات سعة صرف (1/π) μF، ربطت المجموعة بين قطبي مصدر للفولطية المتناوبة فرق الجهد بين طرفيه (300V)، وكانت الممانعة الكلية للدائرة (150Ω). احسب مقدار: ① كل من رادة الحث ورادة السعة. ② عامل النوعية. ③ عامل القدرة وزاوية فرق الطور بين الفولطية الكلية والتيار. ④ تيار الدائرة. ⑤ ارسم المخطط الطوري للممانعة.", "a": "<b>الحل التفصيلي:</b><br><b>الدائرة في حالة رنين</b> لأن Z = R = 150 Ω<br><b>1) الرادات:</b> ω_r = 1/√(LC) = 1/√((10/π) × 10⁻³ × (1/π) × 10⁻⁶) = 1/(10⁻⁴/π) = 10⁴π rad/s<br>X_L = ω_r·L = 10⁴π × (10/π) × 10⁻³ = 100 Ω<br>X_C = 1/(ω_r·C) = 1/(10⁴π × (1/π) × 10⁻⁶) = 100 Ω<br><span class=\"res\">X_L = 100 Ω</span> <span class=\"res\">X_C = 100 Ω</span><br><b>2) عامل النوعية:</b> Q_f = (1/R)√(L/C) = (1/150)√(10⁴) = 100/150 = 2/3 ≈ 0.67<br><span class=\"res\">Q_f = 2/3 ≈ 0.67</span><br><b>3) عامل القدرة وزاوية الطور:</b> pf = R/Z = 150/150 = 1، و tanΦ = (X_L − X_C)/R = 0 ⇒ Φ = 0°<br><span class=\"res\">pf = 1</span> <span class=\"res\">Φ = 0°</span><br><b>4) التيار:</b> I = V/Z = 300/150 = 2 A (وفيه V_T = V_R)<br><span class=\"res\">I = 2 A</span><br><b>5) المخطط:</b> ضلع أفقي بطول R = Z = 150 Ω بلا ضلع عمودي لأن X_L = X_C.", "ch": 3, "id": "c3p048"}, {"k": "k", "topic": "الدوائر المتوازية", "yrs": "وزاري", "q": "اختر الإجابة الصحيحة: دائرة تيار متناوب متوازية الربط تحتوي على مقاومة صرف ومتسعة ذات سعة صرف ومحث صرف (R-L-C)، تكون خواصها حثية إذا كانت:", "opts": ["رادة الحث X_L أكبر من رادة السعة X_C", "رادة السعة X_C أكبر من
