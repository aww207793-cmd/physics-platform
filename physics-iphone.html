ss='m'>E<sub>k</sub> = E − E<sub>d</sub></span> أو <span class='m'>E<sub>k</sub> = E/K</span>.", "kw": [["يقل", "ينقص", "تقل"], ["E/K", "ثابت العزل", "K", "E-Ed", "Ed"]], "id": "c1k5"}, {"ch": 1, "k": "k", "topic": "العازل الكهربائي", "yrs": "2/2015", "q": "ما تأثير المجال الكهربائي المنتظم في المواد العازلة غير القطبية الموضوعة بين صفيحتي متسعة مشحونة؟", "a": "يعمل المجال الكهربائي بين صفيحتي المتسعة على ازاحة مركزي الشحنتين الموجبة والسالبة في الجزيئة الواحدة بازاحة ضئيلة، وهذا يعني انها تكتسب بصورة مؤقتة عزوماً كهربائية ثنائية القطب بطريقة الحث الكهربائي وبهذا يتحول الجزيء الى دايبول كهربائي يصطف باتجاه المجال الكهربائي ويصبح العازل مستقطباً.", "kw": [["ازاحه", "يزيح", "ازاحة مركزي"], ["مؤقت", "مؤقته", "الحث"], ["دايبول", "ثنائيه القطب", "عزم"], ["يصطف", "اتجاه المجال", "مستقطب", "استقطاب"]], "id": "c1k6"}, {"ch": 1, "k": "k", "topic": "العازل الكهربائي", "yrs": "1/2014 اسئلة النازحين", "q": "في اي نوع من انواع العوازل الكهربائية تظهر شحنات سطحية على وجهيها؟ اذكر العلاقة الرياضية للمجال الكهربائي المتولد من هذه الشحنات.", "a": "العوازل الغير قطبية هي التي تظهر شحنات سطحية على وجهيها.<br>العلاقة الرياضية للمجال الكهربائي المتولد هي: <span class='m'>E<sub>k</sub> = E − E<sub>d</sub></span>", "kw": [["غير قطبيه", "الغير قطبيه", "غير قطبية", "الغير قطبية"], ["E − E", "E-E", "E−E", "Ed", "E_d", "E−Ed", "E − Ed", "E-Ed", "Ek", "E_k"]], "id": "c1k7"}, {"ch": 1, "k": "k", "topic": "العازل الكهربائي", "yrs": "3/2015 · 1/2016 اسئلة النازحين · 2/2024 محاولات", "q": "ماذا يحصل لمقدار المجال الكهربائي بين صفيحتي المتسعة عند ادخال مادة عازلة بين صفيحتيها؟ ولماذا؟ (أو) ماذا يحصل للمجال الكهربائي بين صفيحتي متسعة مشحونة ومفصولة عن المصدر عند ادخال مادة عازلة كهربائية بين صفيحتيها؟", "a": "يقل مقدار المجال الكهربائي بين صفيحتي المتسعة عند ادخال مادة عازلة بين صفيحتيها، بسبب تكون مجال كهربائي داخل العازل (E<sub>d</sub>) يعاكس بالاتجاه المجال الكهربائي بين صفيحتي المتسعة (E) فيكون المجال المحصل <span class='m'>E<sub>k</sub> = E/K</span> أي فيقل بنسبة ثابت العزل للمادة (<span class='m'>E<sub>k</sub> = E − E<sub>d</sub></span>).", "kw": [["يقل", "ينقص", "تقل"], ["مجال", "Ed", "داخل العازل"], ["يعاكس", "عكس", "معاكس"], ["E/K", "ثابت العزل", "نسبه ثابت"]], "id": "c1k8"}, {"ch": 1, "k": "k", "topic": "العازل الكهربائي", "yrs": "اسئلة الفصل 2013 تمهيدي · 2015 تمهيدي · 1/2016 اسئلة النازحين · 2/2016 خارج القطر · 1/2017 موصل · 1/2019 · 2/2025", "q": "علل: يقل مقدار المجال الكهربائي بين صفيحتي المتسعة عند ادخال مادة عازلة بين صفيحتيها؟ (أو) علل: يقل مقدار المجال الكهربائي بين صفيحتي متسعة مشحونة ومفصولة عند ادخال مادة عازلة بين صفيحتيها؟", "a": "بسبب تولد مجال كهربائي داخل العازل (E<sub>d</sub>) يعاكس بالاتجاه المجال الكهربائي بين صفيحتي المتسعة (E) فيكون المجال المحصل: <span class='m'>E<sub>k</sub> = E/K</span> اي فيقل بنسبة ثابت العزل للمادة (<span class='m'>E<sub>k</sub> = E − E<sub>d</sub></span>).", "kw": [["تولد", "يتولد", "تكون", "مجال داخل العازل", "Ed"], ["يعاكس", "عكس", "معاكس"], ["E/K", "ثابت العزل", "نسبه ثابت"], ["يقل", "ينقص"]], "id": "c1k9"}, {"ch": 1, "k": "k", "topic": "العازل الكهربائي", "yrs": "1/2017 اسئلة خارج القطر تطبيقي", "q": "يلاحظ على كل متسعة كتابة اقصى جهد كهربائي تعمل فيه المتسعة، فهل ترى ان ذلك ضروريا؟ وضح ذلك.", "a": "نعم ضروريا جدا. لأنه عند الاستمرار في زيادة مقدار فرق الجهد المسلط بين صفيحتيها يتسبب في ازدياد مقدار المجال الكهربائي بين الصفيحتين الى حد كبير جدا قد يحصل عنده الانهيار الكهربائي للعازل نتيجة لعبور الشرارة الكهربائية خلاله فتنفرغ عندئذ المتسعة من جميع شحنتها وهذا يعني تلف المتسعة.", "kw": [["نعم", "ضروري"], ["زياده فرق الجهد", "زياده الجهد", "الاستمرار"], ["انهيار", "الانهيار الكهربائي", "تخترق"], ["شراره", "عبور", "تنفرغ", "تلف"]], "id": "c1k10"}, {"ch": 1, "k": "k", "topic": "العازل الكهربائي", "yrs": "اسئلة الفصل · 1/2020 تطبيقي", "q": "متسعة ذات الصفيحتين المتوازيتين مشحونة ومفصولة عن البطارية، لو ملأ الحيز بين صفيحتيها بالماء النقي بدلاً من الهواء، ماذا يحصل لفرق الجهد بين صفيحتيها؟ ما تعليل ذلك.", "a": "بما ان المتسعة مفصولة عن المصدر فان إدخال العازل يسبب نقصان مقدار المجال الكهربائي بين الصفيحتين بنسبة ثابت العزل (k) فيقل فرق الجهد بنسبة (k).<br>حسب العلاقة الاتية: <span class='m'>E<sub>k</sub> = E/K</span><br>وبما ان: <span class='m'>E = ΔV/d</span> , <span class='m'>ΔV = E<sub>d</sub></span><br>فيكون <span class='m'>ΔV ∝ E</span> بين الصفيحتين وبثبوت البعد d بين الصفيحتين <span class='m'>ΔV<sub>k</sub> = ΔV/K</span><br><b>او:</b> عند ادخال العازل تزداد سعة المتسعة الجديدة بثبوت الشحنة وسوف يقل فرق الجهد حسب العلاقة: <span class='m'>C = Q/ΔV</span>", "kw": [["يقل", "ينقص", "نقصان"], ["فرق الجهد", "ΔV", "الجهد"], ["ثابت العزل", "K", "ΔV/K"], ["المجال", "E/K", "مفصوله", "الشحنه ثابته", "تزداد السعه"]], "id": "c1k11"}, {"ch": 1, "k": "k", "topic": "العازل الكهربائي", "yrs": "1/2023 احيائي", "q": "ما مميزات العوازل غير القطبية؟", "a": "1) البعد بين مركزي شحنتيها الموجبة والسالبة غير ثابت.<br>2) عند أدخال العازل بين صفيحتي متسعة مشحونة سيعمل المجال الكهربائي بين صفيحتيها على ازاحة مركزي الشحنتين الموجبة والسالبة في الجزيئة الواحدة بإزاحة ضئيلة.<br>3) تكتسب بصورة مؤقتة عزوماً كهربائية ثنائية القطب بطريقة الحث الكهربائي وبهذا يتحول الجزيء الى دايبول كهربائي يصطف باتجاه معاكس لاتجاه المجال الكهربائي المؤثر.<br>4) تظهر شحنة سطحية موجبة على وجه العازل المقابل للصفيحة السالبة للمتسعة وشحنة سطحية سالبة على وجه العازل المقابل للصفيحة الموجبة (العازل متعادل كهربائياً ويصبح العازل مستقطباً).<br>5) الشحنتان السطحيتان على وجهي العازل تولدان مجالاً كهربائياً داخل العازل (E<sub>d</sub>) يعاكس في اتجاهه المجال المؤثر بين الصفيحتين (E) فيعمل على اضعاف المجال الكهربائي الخارجي المؤثر <span class='m'>[E<sub>k</sub> = E − E<sub>d</sub>]</span>.", "kw": [["غير ثابت", "البعد"], ["ازاحه", "يزيح"], ["مؤقته", "مؤقت", "الحث", "ثنائيه القطب"], ["شحنه سطحيه", "مستقطب", "استقطاب"], ["Ed", "يعاكس", "يضعف", "اضعاف"]], "id": "c1k12"}, {"ch": 1, "k": "k", "topic": "العازل الكهربائي", "yrs": "3/2013 · 3/2016 · 2019 · 3/2019 تمهيدي · 3/2020 · 2020 تطبيقي · 3/2023 احيائي · 3/2023 تطبيقي · 3/2025 تطبيقي · 2025 تمهيدي", "q": "اذكر نشاط يبين تأثير ادخال العازل الكهربائي بين صفيحتي متسعة مشحونة ومفصولة عن البطارية في مقدار فرق الجهد الكهربائي بينهما (تجربة فرادي) وما تأثيره في سعة المتسعة؟ [الشكل: متسعة ذات صفيحتين متوازيتين مربوطة ببطارية ومفتاح، ثم مربوطة بفولتميتر، ثم لوح من مادة عازلة يدخل بين الصفيحتين].", "a": "<b>أدوات النشاط:</b> متسعة ذات الصفيحتين المتوازيتين (الهواء عازل بينهما) مشحونة ومفصولة عن البطارية، فولتميتر، أسلاك توصيل، لوح من مادة عازلة ثابت عزلها K.<br><b>الرسم التخطيطي:</b><svg viewBox=\"0 0 300 190\" style=\"max-width:340px;width:100%;display:block;margin:8px 0\" role=\"img\" aria-label=\"رسم المتسعة مع العازل\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"92\" y=\"34\" width=\"10\" height=\"110\" fill=\"currentColor\"/><rect x=\"190\" y=\"34\" width=\"10\" height=\"110\" fill=\"currentColor\"/><rect x=\"120\" y=\"50\" width=\"48\" height=\"78\" stroke-dasharray=\"5 4\" fill=\"#fbbf2433\"/><path d=\"M102 90H190\" stroke-dasharray=\"2 0\" stroke=\"none\"/><path d=\"M97 34V12H250V150H200\" /><circle cx=\"250\" cy=\"90\" r=\"18\"/></g><g font-family=\"Almarai,Arial\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"97\" y=\"165\">صفيحة +Q</text><text x=\"195\" y=\"165\">صفيحة −Q</text><text x=\"144\" y=\"46\">عازل K</text><text x=\"250\" y=\"95\" font-size=\"12\">V</text><text x=\"250\" y=\"130\" font-size=\"12\">فولتميتر</text></g></svg><b>خطوات النشاط:</b><br>1) نربط أحد قطبي البطارية بإحدى الصفيحتين، ثم نربط الصفيحة الأخرى بالقطب الآخر، ونفصل البطارية عن المتسعة فتبقى الشحنة مختزنة (+Q و −Q).<br>2) نربط الفولتميتر بين صفيحتي المتسعة فيقرأ فرق الجهد <span class=\"m\">ΔV</span>.<br>3) ندخل اللوح العازل بين الصفيحتين فنلاحظ نقصان قراءة الفولتميتر.<br><b>الاستنتاج:</b> إدخال العازل يقلل فرق الجهد بين الصفيحتين بنسبة ثابت العزل، أي <span class=\"m\">ΔV<sub>k</sub> = ΔV / K</span>، ولأن الشحنة ثابتة فإن سعة المتسعة تزداد: <span class=\"m\">C<sub>k</sub> = K·C</span>.", "kw": [["بطاريه", "تشحن", "نشحن"], ["نفصل", "فصل البطاريه"], ["فولتميتر", "فولطميتر"], ["ندخل", "ادخال", "لوح عازل"], ["نقصان", طبيقي", "q": "ماذا يحصل، مع ذكر السبب: الطاقة المختزنة في المجال الكهربائي بين صفيحتي متسعة ذات الصفيحتين المتوازيتين مشحونة ومفصولة عن المصدر عند إدخال لوح عازل كهربائياً ثابت عزله (k=2) بين صفيحتيها.", "a": "تقل إلى النصف وفق العلاقة الآتية:<br><span class=\"m\">P.E = ½ C(ΔV)²</span><br><span class=\"m\">P.E<sub>K</sub>/P.E = ½ C<sub>K</sub>(ΔV<sub>K</sub>)² / ½ C(ΔV)² = ½·2C·(½ΔV)² / ½C(ΔV)² = 2 × ¼ = ½</span><br><span class=\"m\">P.E<sub>K</sub> = ½ P.E</span><br>ملاحظة: الإثبات يكون وفق أي علاقة أخرى.", "kw": [["تقل", "تنقص", "النصف", "1/2"], ["مفصوله", "شحنه ثابته", "Q ثابت"], ["سعه", "تزداد", "ضعف", "2"], ["فرق الجهد", "ΔV", "يقل"]], "id": "c1k23"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "1/2014", "q": "ماذا يحصل لمقدار المجال الكهربائي والشحنة المختزنة بين صفيحتي المتسعة ذات الصفيحتين المتوازيتين مربوطة بطارية بين صفيحتيها عند إبعاد الصفيحتين عن بعضهما قليلاً مع بقائها موصولة بالبطارية.", "a": "المجال الكهربائي: يقل حسب العلاقة <span class=\"m\">E = ΔV/d</span><br>الشحنة المختزنة: تقل، لأن ازدياد البعد بين الصفيحتين يؤدي إلى نقصان السعة وبالتالي تقل الشحنة الكهربائية حسب العلاقة <span class=\"m\">Q ∝ C</span>", "kw": [["المجال", "E"], ["يقل", "ينقص"], ["البعد", "d"], ["السعه", "تنقص", "تقل"], ["الشحنه", "Q"]], "id": "c1k24"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "2/2014", "q": "متسعة ذات الصفيحتين المتوازيتين الهواء عازل بين صفيحتيها، ربطت بين قطبي بطارية، أدخل عازل كهربائي بين صفيحتيها ثابت عزله (K = 4) والمتسعة مازالت موصولة بالبطارية، ماذا يحصل لكل من الكميات الآتية للمتسعة (مع ذكر السبب): 1- فرق الجهد بين صفيحتيها. 2- سعتها.", "a": "1) يبقى ثابتاً لوجود البطارية.<br>2) تزداد أربع أمثال ما كانت عليه وفق العلاقة <span class=\"m\">C<sub>K</sub> = C·K = 4C</span>", "kw": [["ثابت", "يبقى", "لا يتغير"], ["بطاريه", "موصوله", "مصدر"], ["تزداد", "تزيد"], ["اربع", "4", "K"]], "id": "c1k25"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "اسئلة الفصل · 1/2013 اسئلة خارج القطر · 2/2014 اسئلة النازحين · 2/2018 · 2020 تمهيدي", "q": "عند مضاعفة مقدار فرق الجهد الكهربائي بين صفيحتي متسعة ذات سعة ثابتة، وضح ماذا يحصل لمقدار الشحنة المختزنة (Q) في أي من صفيحتيها. (أو) ماذا يحصل، مع ذكر السبب: الشحنة المختزنة (Q) في أي من صفيحتي متسعة ذات سعة ثابتة عند مضاعفة مقدار فرق الجهد الكهربائي بين صفيحتيها.", "a": "تتضاعف مقدار الشحنة المختزنة (Q) في كلا صفيحتيها.<br>السبب: لأن مقدار الشحنة يتناسب طردياً مع فرق الجهد حسب العلاقة <span class=\"m\">Q = C·ΔV</span> بثبوت السعة.<br><span class=\"m\">ΔV₂ = 2ΔV₁ ⇒ Q₁/Q₂ = ΔV₁/ΔV₂ = ΔV₁/2ΔV₁ ⇒ Q₂ = 2Q₁</span><br>أو: <span class=\"m\">Q₁ = CΔV₁ ، Q₂ = CΔV₂ = C(2ΔV₁) = 2CΔV₁ = 2Q₁</span>", "kw": [["تتضاعف", "تزداد", "ضعف", "2"], ["طرد", "تناسب"], ["Q=CΔV", "Q = C", "CΔV"], ["سعه ثابته", "C ثابت", "بثبوت السعه"]], "id": "c1k26"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "2/2024", "q": "ماذا يحصل لمقدار الشحنة المختزنة (Q) والطاقة المختزنة في المجال الكهربائي بين صفيحتي متسعة ذات سعة ثابتة عند مضاعفة فرق الجهد بين صفيحتيها.", "a": "الشحنة تتضاعف والطاقة المختزنة تصبح أربع أمثال ما كانت عليه. <span class=\"m\">PE₂ = 4PE₁</span> و <span class=\"m\">Q₂ = 2Q₁</span>", "kw": [["الشحنه", "Q"], ["تتضاعف", "ضعف", "2", "تزداد"], ["الطاقه", "PE"], ["اربع", "4", "اربعه امثال"]], "id": "c1k27"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "2/2014 اسئلة خارج القطر · 1/2018 اسئلة خارج القطر · 1/2018 تطبيقي · 2023 تمهيدي احيائي", "q": "ما تأثير إدخال مادة عازلة كهربائياً ثابت عزلها (6) بين صفيحتي متسعة ذات الصفيحتين المتوازيتين مربوطة بين قطبي بطارية بدلاً من الهواء في: أولاً: فرق الجهد بين صفيحتيها. ثانياً: سعتها.", "a": "1) فرق الجهد بين صفيحتيها يبقى ثابتاً ويساوي فرق جهد البطارية <span class=\"m\">ΔV<sub>battery</sub> = ΔV</span> (لأن المتسعة متصلة بالبطارية).<br>2) تزداد سعة المتسعة إلى ستة أمثال ما كانت عليه <span class=\"m\">C<sub>K</sub> = K·C = 6C</span>", "kw": [["فرق الجهد", "ΔV"], ["ثابت", "يبقى", "لا يتغير"], ["بطاريه", "متصله", "موصوله"], ["سعه", "تزداد", "ستة", "6", "K"]], "id": "c1k28"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "اسئلة الفصل · 3/2018 تطبيقي · 1/2025", "q": "متسعة مشحونة فرق الجهد بين صفيحتيها عال جداً (وهي مفصولة عن مصدر الفولطية) تكون مثل هذه المتسعة ولمدة طويلة خطرة عند لمسها باليد مباشرة. ما تفسير ذلك.", "a": "خطورتها تكمن في أن مقدار الشحنة المختزنة في أي من صفيحتيها كبير جداً لأن فرق جهدها كبير جداً <span class=\"m\">Q = CΔV</span>، وعند لمس صفيحتيها بواسطة اليد (الكف) مباشرة تتفرغ المتسعة من شحنتها حيث تعد اليد مادة موصلة بين الصفيحتين.", "kw": [["شحنه", "Q"], ["كبير", "عال"], ["فرق الجهد", "ΔV"], ["لمس", "اليد", "الكف"], ["تتفرغ", "تفريغ"]], "id": "c1k29"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "3/2019 · 2/2022 · 3/2024", "q": "وضح كيف يتغير مقدار سعة المتسعة ذات الصفيحتين المتوازيتين عملياً بتغير البعد بين الصفيحتين المتوازيتين d؟ (أو) وضح بنشاط مع الرسم كيف يتغير مقدار سعة المتسعة ذات الصفيحتين المتوازيتين عملياً مع تغير البعد d؟", "a": "<b>أدوات النشاط:</b> متسعة ذات الصفيحتين المتوازيتين مشحونة ثم مفصولة عن البطارية (شحنتها Q ثابتة)، فولتميتر، أسلاك توصيل، مسطرة لقياس البعد.<br><b>الرسم التخطيطي:</b><svg viewBox=\"0 0 300 170\" style=\"max-width:340px;width:100%;display:block;margin:8px 0\" role=\"img\" aria-label=\"رسم المتسعة وتغير البعد\"><g fill=\"currentColor\"><rect x=\"90\" y=\"30\" width=\"8\" height=\"110\"/><rect x=\"170\" y=\"30\" width=\"8\" height=\"110\"/></g><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M94 30V12H200V30\"/><path d=\"M174 140V158H200\"/><circle cx=\"240\" cy=\"85\" r=\"16\"/><path d=\"M200 12V69M200 101V158M200 69H224M200 101H224\" /></g><g font-family=\"Almarai,Arial\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"240\" y=\"90\" font-size=\"12\">V</text><text x=\"240\" y=\"122\">فولتميتر</text><text x=\"134\" y=\"100\">d</text><text x=\"94\" y=\"165\" font-size=\"12\">+Q</text><text x=\"174\" y=\"165\" font-size=\"12\">−Q</text></g></svg><b>خطوات النشاط:</b><br>1) نشحن المتسعة بالبطارية ثم نفصلها عنها، فتبقى شحنتها Q ثابتة.<br>2) نربط الفولتميتر بين صفيحتيها فيقرأ فرق الجهد ΔV ونسجل البعد الابتدائي d.<br>3) نقرب الصفيحتين من بعضهما فيقل البعد d، فنلاحظ أن قراءة الفولتميتر تقل.<br>4) نبعد الصفيحتين فيزداد البعد d، فنلاحظ أن قراءة الفولتميتر تزداد.<br><b>التحليل:</b> بما أن الشحنة Q ثابتة، فإن السعة تتناسب عكسياً مع فرق الجهد: <span class=\"m\">C = Q/ΔV</span>، وبما أن ΔV يقل عند تقريب الصفيحتين فإن السعة تزداد. ومن القانون <span class=\"m\">C = ε₀A/d</span> نجد أن السعة تتناسب عكسياً مع البعد: <span class=\"m\">C ∝ 1/d</span>.<br><b>الاستنتاج:</b> كلما قل البعد d بين الصفيحتين زادت سعة المتسعة، وكلما زاد البعد قلت السعة، بشرط بقاء المساحة A ونوع العازل ثابتين. وإذا قل البعد إلى النصف تتضاعف السعة، وإذا نقص فرق الجهد إلى النصف.<br><b>ملاحظة:</b> يجب فصل المتسعة عن البطارية قبل تغيير البعد، لأن بقاءها متصلة يثبت فرق الجهد فتتغير الشحنة بدلاً من فرق الجهد.", "kw": [["فولطميتر", "فولتميتر"], ["مشحونه", "مفصوله", "شحنه ثابته"], ["تقريب", "قرب", "نصف", "d/2", "1/2"], ["قراءه", "فرق الجهد", "تقل"], ["C=Q/ΔV", "سعه", "تزداد"], ["عكس", "1/d"]], "id": "c1k30"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "1/2021", "q": "وضح تأثير إدخال مادة عازلة كهربائياً، ثابت عزلها (K = 2) بين صفيحتي متسعة ذات الصفيحتين المتوازيتين مشحونة ومفصولة عن البطارية بدلاً من الهواء في: (فرق الجهد بين صفيحتيها، الطاقة المختزنة في المجال الكهربائي بين صفيحتيها).", "a": "فرق الجهد بين صفيحتيها يقل إلى النصف: <span class=\"m\">ΔV<sub>K</sub> = ΔV/K = ½ΔV</span><br>أو: <span class=\"m\">Q<sub>K</sub> = Q ، C<sub>K</sub> = KC = 2C ، ΔV<sub>K</sub> = Q<sub>K</sub>/C<sub>K</sub> = Q/2C = ½ΔV</span><br>الطاقة الكهربائية المتكافئة تقل إلى النصف: <span class=\"m\">P.E<sub>K</sub>/P.E = ½Q<sub>K</sub>ΔV<sub>K</sub> / ½QΔV = ½</span><br>طريقة أخرى: <span class=\"m\">P.E = ½QΔV ، P.E<sub>K</sub> = ½Q<sub>K</sub>ΔV<sub>K</sub> = ½Q·½ΔV = ½·(½QΔV) = ½P.E</span>", "kw": [["فرق الجهد", "ΔV"], ["يقل", "ينقص"], ["نصف", "1/2", "K"], ["الطاقه", "PE"]], "id": "c1k31"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "2022 تمهيدي", "q": "وضح عملياً كيف يتغير مقدار سعة المتسعة بتغير المساحة (A) السطحية المتقابلة للصفيحتين؟", "a": "نجلب متسعة مشحونة ومفصولة عن المصدر ومربوطة بين طرفي فولطميتر لقياس فرق الجهد (ΔV) فتكون قراءة الفولطميتر عند تدريجة معينة، فعندما تكون المساحة السطحية المتقابلة للمتسعة تساوي A، وبتقليل المساحة إلى نصف ما كانت عليه ½A وذلك بإزاحة الصفيحتين جانباً (مع المحافظة على بقاء الشحنة ثابتاً) نلاحظ ازدياد قراءة الفولطميتر إلى ضعف ما كانت عليه (2ΔV) وفق العلاقة <span class=\"m\">C = Q/ΔV</span>؛ لذلك تقل السعة بازدياد فرق الجهد بثبوت الشحنة (تناسب عكسي)، نستنتج أن سعة المتسعة تقل بنقصان المساحة المتقابلة والعكس صحيح (تناسب طردي) <span class=\"m\">C ∝ A</span><br>(الرسم: لا يحاسب على الرسم)", "kw": [["فولطميتر", "فولتميتر"], ["مشحونه", "مفصوله"], ["تقليل", "نصف", "ازاحه", "1/2"], ["قراءه", "ضعف", "تزداد", "2"], ["C=Q/ΔV", "سعه", "تقل"], ["طرد", "A"]], "id": "c1k32"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "3/2014", "q": "اختر الإجابة الصحيحة: متسعة ذات الصفيحتين المتوازيتين سعتها (40μF) الهواء يملأ الحيز بين صفيحتيها. إذا أدخلت مادة عازلة بين صفيحتيها ازدادت سعتها بمقدار (70μF) فإن ثابت عزل تلك المادة تساوي:", "opts": ["1.4", "0.71", "2.75", "2.2"], "c": 2, "a": "الحل: C = 40 μF، وبعد إدخال العازل تصبح C_k = 40 + 70 = 110 μF. ثابت العزل K = C_k/C = 110/40 = 2.75. الجواب: 2.75", "id": "c1k33"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "2/2016", "q": "اختر الإجابة الصحيحة: متسعة مقدار سعتها (20 nF) ولكي تخزن طاقة في مجالها الكهربائي مقدارها (256×10⁻⁸ J) يتطلب ربطها بمصدر فرق جهده مستمر يساوي:", "opts": ["500v", "150v", "16v", "12v"], "c": 2, "a": "الحل: PE = ½CΔV² ⇒ ΔV = √(2PE/C) = √(2 × 256×10⁻⁸ / 20×10⁻⁹) = √256 = 16 V. الجواب: 16 V", "id": "c1k34"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "1/2017 اسئلة خارج القطر · 2023 تمهيدي احيائي", "q": "اختر الإجابة الصحيحة: متسعة مقدار سعتها (60μF) ولكي تخزن طاقة في مجالها الكهربائي مقدارها (4.8J) يتطلب ربطها بمصدر فرق جهده مستمر يساوي:", "opts": ["600v", "350v", "400V", "250v"], "c": 2, "a": "الحل: ΔV = √(2PE/C) = √(2 × 4.8 / 60×10⁻⁶) = √160000 = 400 V. الجواب: 400 V", "id": "c1k35"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "2/2019", "q": "اختر الإجابة الصحيحة: عند مضاعفة فرق الجهد الكهربائي بين صفيحتي متسعة ذات سعة ثابتة، فإن مقدار الشحنة المختزنة (Q) في أي من صفيحتيها تصبح:", "opts": ["Q", "4Q", "2Q", "½Q"], "c": 2, "a": "عند ثبوت C تتناسب الشحنة طردياً مع فرق الجهد: Q = CΔV، فإذا ضوعف ΔV تضاعفت الشحنة وتصبح 2Q. الجواب: 2Q", "id": "c1k36"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "2/2019 تطبيقي", "q": "اختر الإجابة الصحيحة: متسعة ذات الصفيحتين المتوازيتين سعتها (30μF) الهواء يملأ الحيز بين صفيحتيها. إذا أدخلت مادة عازلة بين صفيحتيها ازدادت سعتها بمقدار (60μF) فإن ثابت عزل تلك المادة تساوي:", "opts": ["2", "3", "4", "5"], "c": 1, "a": "الحل: C = 30 μF، C_k = 30 + 60 = 90 μF، ثابت العزل K = 90/30 = 3. الجواب: 3", "id": "c1k37"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "2020 تمهيدي تطبيقي · 2021 تمهيدي", "q": "اختر الإجابة الصحيحة: متسعة ذات الصفيحتين المتوازيتين سعتها (C) أبعدت صفيحتيها من بعضهما حتى صار البعد بينهما (3) مرات ما كان عليه فإن مقدار سعتها الجديدة تساوي:", "opts": ["9C", "3C", "1/9 C", "1/3 C"], "c": 3, "a": "البعد صار ثلاثة أمثال، وبما أن C = ε₀A/d فإن السعة تقل إلى الثلث: C_k = C/3. الجواب: (1/3) C", "id": "c1k38"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "1/2020 تطبيقي", "q": "اختر الإجابة الصحيحة: متسعة ذات الصفيحتين المتوازيتين سعتها (50μF) الهواء عازل بين صفيحتيها. إذا أدخلت مادة عازلة بين صفيحتيها ازدادت سعتها بمقدار (60μF) فإن ثابت عزل تلك المادة تساوي:", "opts": ["0.45", "0.55", "1.1", "2.2"], "c": 3, "a": "الحل: C = 50 μF، C_k = 50 + 60 = 110 μF، ثابت العزل K = 110/50 = 2.2. الجواب: 2.2", "id": "c1k39"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "1/2020", "q": "اختر الإجابة الصحيحة: متسعة مقدار سعتها (40μF) ولكي تخزن طاقة في مجالها الكهربائي مقدارها (7.2J) يتطلب ربطها بمصدر فرق جهده مستمر يساوي:", "opts": ["600v", "150v", "160v", "120v"], "c": 0, "a": "الحل: ΔV = √(2PE/C) = √(2 × 7.2 / 40×10⁻⁶) = √360000 = 600 V. الجواب: 600 V", "id": "c1k40"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "2/2020", "q": "اختر الإجابة الصحيحة: عندما تقل المساحة السطحية المتقابلة بين صفيحتي متسعة ذات الصفيحتين المتوازيتين مشحونة ومفصولة إلى نصف ما كانت عليه، فإن فرق الجهد بين صفيحتيها مقارنة بما كان عليه يصبح:", "opts": ["نصف ما كان عليه", "ضعف ما كان عليه", "ربع ما كان عليه", "لا يتأثر"], "c": 1, "a": "المتسعة مفصولة فالشحنة Q ثابتة. المساحة صارت نصف ما كانت، فالسعة C = ε₀A/d تصبح نصف ما كانت، وبما أن ΔV = Q/C فإن فرق الجهد يتضاعف. الجواب: ضعف ما كان عليه", "id": "c1k41"}, {"ch": 1, "k": "k", "topic": "العوامل المؤثرة في سعة المتسعة ذات الصفيحتين المتوازيتين", "yrs": "2022 تمهيدي", "q": "اختر الإجابة الصحيحة: متسعة ذات الصفيحتين المتوازيتين سعتها (C) قربت صفيحتيها من بعضهما حتى صار البعد بينهما (1/3) ما كان عليه فإن مقدار سعتها الجديدة يساوي:", "opts": ["9C", "3C", "1/9 C", "1/3 C"], "c": 1, "a": "البعد صار ثلث ما كان، وبما أن C = ε₀A/d فإن السعة تصبح ثلاثة أمثال: C_k = 3C. الجواب: 3C", "id": "c1k42"}, {"ch": 1, "k": "p", "topic": "المسائل الحسابية - المتسعة المنفردة", "yrs": "2013 تمهيدي", "q": "متسعة ذات الصفيحتين المتوازيتين البعد بين صفيحتيها (0.5 cm) وكل من صفيحتيها مربعة الشكل طول ضلع كل منها (10 cm) ويفصل بينهما الفراغ (علماً أن سماحية الفراغ ε₀ = 8.85×10⁻¹² ). ما مقدار: 1) سعة المتسعة. 2) الشحنة المختزنة في أي من صفيحتيها بعد تسليط فرق جهد (10v) بينهما.", "a": "<b>المعطيات:</b> d = 0.5 cm = 5×10⁻³ m، طول الضلع = 10 cm = 0.1 m، ε₀ = 8.85×10⁻¹² ، ΔV = 10 V<br>\n<b>1) سعة المتسعة:</b><br>مساحة الصفيحة A = (0.1)² = 0.01 m²<br>\n<span class=\"m\">C = ε₀A/d = (8.85×10⁻¹² × 0.01)/(5×10⁻³)</span><br>\n<span class=\"res\">C = 1.77×10⁻¹¹ F = 17.7 pF</span><br>\n<b>2) الشحنة على أي صفيحة:</b><br>\n<span class=\"m\">Q = C·ΔV = 1.77×10⁻¹¹ × 10</span><br>\n<span class=\"res\">Q = 1.77×10⁻¹⁰ C = 177 pC</span>", "parts": [{"l": "سعة المتسعة", "v": [1.77e-11, 17.7, 0.0177], "u": "F (أو pF أو nF)"}, {"l": "الشحنة المختزنة", "v": [1.77e-10, 177, 0.177], "u": "C (أو pC أو nC)"}], "id": "c1p43"}, {"ch": 1, "k": "p", "topic": "المسائل الحسابية - المتسعة المنفردة", "yrs": "2/2015 خارج القطر", "q": "متسعة سعتها (15μF) مشحونة بفرق جهد (300V) وربطت على التوازي مع متسعة أخرى غير مشحونة فأصبح فرق الجهد على طرفي المجموعة (100V) احسب: 1) سعة المتسعة الثانية. 2) شحنة كل متسعة بعد الربط. 3) إذا وضع بين صفيحتي المتسعة الأولى مادة عازلة فأصبح فرق جهد المجموعة (75V) جد ثابت عزل تلك المادة.", "a": "<b>المعطيات:</b> C₁ = 15 μF مشحونة بـ 300 V، والمتسعة الثانية غير مشحونة، وبعد الربط على التوازي ΔV = 100 V. المجموعة مفصولة عن المصدر فالشحنة الكلية ثابتة.<br>\n<b>1) سعة المتسعة الثانية:</b><br>الشحنة الكلية قبل الربط تكون على الأولى فقط: Q = C₁·V₁ = 15×10⁻⁶ × 300 = 4.5×10⁻³ C = 4500 μC<br>\nبعد الربط على التوازي: Q = (C₁ + C₂)·ΔV<br>\n<span class=\"m\">4500 = (15 + C₂) × 100</span> ⇒ 15 + C₂ = 45 ⇒<br>\n<span class=\"res\">C₂ = 30 μF</span><br>\n<b>2) شحنة كل متسعة بعد الربط:</b><br>\nQ₁ = C₁·ΔV = 15 × 100 = 1500 μC<br>\nQ₂ = C₂·ΔV = 30 × 100 = 3000 μC<br>\n<span class=\"res\">Q₁ = 1500 μC ، Q₂ = 3000 μC</span> (مجموعهما 4500 μC كما هو متوقع)<br>\n<b>3) ثابت عزل المادة في المتسعة الأولى:</b><br>\nبعد إدخال العازل تصبح سعة الأولى C₁k = K·15، والشحنة الكلية ما زالت 4500 μC، وفرق جهد المجموعة 75 V:<br>\n<span class=\"m\">C<sub>total</sub> = Q/ΔV = 4500/75 = 60 μF</span><br>\n<span class=\"m\">K·15 + 30 = 60</span> ⇒ K·15 = 30<br>\n<span class=\"res\">K = 2</span>", "parts": [{"l": "سعة المتسعة الثانية", "v": [30, 3e-05], "u": "μF (أو F)"}, {"l": "شحنة المتسعة الأولى", "v": [1500, 0.0015], "u": "μC (أو C)"}, {"l": "شحنة المتسعة الثانية", "v": [3000, 0.003], "u": "μC (أو C)"}, {"l": "ثابت العزل", "v": [2], "u": ""}], "id": "c1p44"}, {"ch": 1, "k": "p", "topic": "المسائل الحسابية - المتسعة المنفردة", "yrs": "1/2015 خارج القطر", "q": "متسعة سعتها (2μf) والبعد بين لوحيها (0.1mm) شحنت بمصدر فرق جهده (30V). 1) احسب شحنة المتسعة ومقدار المجال الكهربائي بين صفيحتيها. 2) إذا فصلت المتسعة عن المصدر وأدخل لوح عازل كهربائي بين صفيحتيها أصبحت الطاقة المختزنة في المجال الكهربائي للمتسعة (3×10⁻⁴ J) احسب فرق الجهد للمتسعة بعد وضع العازل وثابت العزل للمادة العازلة؟", "a": "<b>المعطيات:</b> C = 2 μF، d = 0.1 mm = 1×10⁻⁴ m، ΔV = 30 V.<br>\n<b>1) الشحنة والمجال:</b><br>\n<span class=\"m\">Q = C·ΔV = 2×10⁻⁶ × 30</span> ⇒ <span class=\"res\">Q = 6×10⁻⁵ C = 60 μC</span><br>\n<span class=\"m\">E = ΔV/d = 30 / 10⁻⁴</span> ⇒ <span class=\"res\">E = 3×10⁵ V/m</span><br>\n<b>2) فرق الجهد بعد العازل وثابت العزل:</b><br>\nالطاقة الابتدائية: PE = ½QΔV = ½ × 6×10⁻⁵ × 30 = 9×10⁻⁴ J<br>\nبما أن المتسعة مفصولة فالشحنة Q ثابتة. بعد العازل تصبح الطاقة 3×10⁻⁴ J<br>\n<span class=\"m\">PE<sub>k</sub> = PE/K</span> ⇒ K = 9×10⁻⁴ / 3×10⁻⁴<br>\n<span class=\"res\">K = 3</span><br>\n<span class=\"m\">ΔV<sub>k</sub> = ΔV/K = 30/3</span><br>\n<span class=\"res\">ΔV بعد العازل = 10 V</span><br>\nتحقق: C<sub>k</sub> = Q/ΔV<sub>k</sub> = 6×10⁻⁵ / 10 = 6 μF = 3 × 2 μF ✓", "parts": [{"l": "شحنة المتسعة", "v": [60, 6e-05], "u": "μC (أو C)"}, {"l": "المجال الكهربائي", "v": [300000.0], "u": "V/m"}, {"l": "فرق الجهد بعد وضع العازل", "v": [10], "u": "V"}, {"l": "ثابت العزل", "v": [3], "u": ""}], "id": "c1p45"}, {"ch": 1, "k": "p", "topic": "المسائل الحسابية - المتسعة المنفردة", "yrs": "2016 تمهيدي", "q": "متسعة ذات الصفيحتين المتوازيتين سعتها (8μF) ربطت بين قطبي بطارية فرق الجهد بين قطبيها (10v). 1) ما مقدار الشحنة المختزنة في أي من صفيحتي المتسعة؟ 2) إذا فصلت المتسعة عن البطارية وأدخل لوح عازل كهربائي بين صفيحتيها ثابت العزل له يساوي (2)، جد مقدار فرق الجهد بين صفيحتي المتسعة ومقدار سعة المتسعة في حالة العازل بين صفيحتيها.", "a": "<b>المعطيات:</b> C = 8 μF، ΔV = 10 V (متصلة بالبطارية)، ثم تفصل وتدخل عازل K = 2.<br>\n<b>1) الشحنة على أي صفيحة:</b><br>\n<span class=\"m\">Q = C·ΔV = 8×10⁻⁶ × 10</span><br>\n<span class=\"res\">Q = 8×10⁻⁵ C = 80 μC</span><br>\n<b>2) فرق الجهد وسعة المتسعة بعد العازل:</b><br>\nالمتسعة مفصولة فالشحنة ثابتة Q = 80 μC.<br>\n<span class=\"m\">C<sub>k</sub> = K·C = 2 × 8 = 16 μF</span><br>\n<span class=\"m\">ΔV<sub>k</sub> = Q/C<sub>k</sub> = 80/16 = 5 V</span><br>\n<span class=\"res\">ΔV بعد العازل = 5 V ، C<sub>k</sub> = 16 μF</span>", "parts": [{"l": "الشحنة المختزنة", "v": [80, 8e-05], "u": "μC (أو C)"}, {"l": "فرق الجهد بعد العازل", "v": [5], "u": "V"}, {"l": "سعة المتسعة بعد العازل", "v": [16, 1.6e-05], "u": "μF (أو F)"}], "id": "c1p46"}, {"ch": 1, "k": "p", "topic": "المسائل الحسابية - المتسعة المنفردة", "yrs": "3/2016 خارج القطر · 1/2014 اسئلة الانبار", "q": "ما مقدار الطاقة المختزنة في المجال الكهربائي لمتسعة سعتها (5 μF) إذا شحنت لفرق جهد كهربائي (4000V)؟ وما مقدار القدرة التي تحصل عليها عند تفريغها بزمن (10 μs)؟", "a": "<b>المعطيات:</b> C = 5 μF، ΔV = 4000 V، زمن التفريغ t = 10 μs.<br>\n<b>1) الطاقة المختزنة:</b><br>\n<span class=\"m\">PE = ½·C·ΔV² = ½ × 5×10⁻⁶ × (4000)²</span><br>\n<span class=\"m\">= ½ × 5×10⁻⁶ × 1.6×10⁷ = 40 J</span><br>\n<span class=\"res\">PE = 40 J</span><br>\n<b>2) القدرة عند التفريغ:</b><br>\n<span class=\"m\">P = PE/t = 40 / (10×10⁻⁶)</span><br>\n<span class=\"res\">P = 4×10⁶ W = 4 MW</span>", "parts": [{"l": "الطاقة المختزنة", "v": [40], "u": "J"}, {"l": "القدرة", "v": [4000000.0, 4000, 4], "u": "W (أو kW أو MW)"}], "id": "c1p47"}, {"ch": 1, "k": "p", "topic": "المسائل الحسابية - المتسعة المنفردة", "yrs": "2022 تمهيدي تطبيقي", "q": "ما مقدار الطاقة المختزنة في المجال الكهربائي لمتسعة سعتها (20 μF) إذا شحنت لفرق جهد كهربائي (500V)؟ وما مقدار القدرة التي تحصل عليها عند تفريغها بزمن (10 μs)؟", "a": "<b>المعطيات:</b> C = 20 μF، ΔV = 500 V، t = 10 μs.<br>\n<b>1) الطاقة المختزنة:</b><br>\n<span class=\"m\">PE = ½·C·ΔV² = ½ × 20×10⁻⁶ × (500)²</span><br>\n<span class=\"m\">= ½ × 20×10⁻⁶ × 2.5×10⁵ = 2.5 J</span><br>\n<span class=\"res\">PE = 2.5 J</span><br>\n<b>2) القدرة عند التفريغ:</b><br>\n<span class=\"m\">P = PE/t = 2.5 / (10×10⁻⁶)</span><br>\n<span class=\"res\">P = 2.5×10⁵ W</span>", "parts": [{"l": "الطاقة المختزنة", "v": [2.5], "u": "J"}, {"l": "القدرة", "v": [250000.0, 250, 0.25], "u": "W (أو kW أو MW)"}], "id": "c1p48"}, {"ch": 1, "k": "p", "topic": "المسائل الحسابية - المتسعة المنفردة", "yrs": "2018 تمهيدي", "q": "متسعة ذات الصفيحتين المتوازيتين سعتها (6 μF) ربطت بين قطبي بطارية فرق الجهد بين قطبيها (30v). 1) ما مقدار الشحنة المختزنة في أي من صفيحتي المتسعة؟ 2) إذا فصلت المتسعة عن البطارية وأدخل لوح عازل كهربائي بين صفيحتيها هبط فرق الجهد بين صفيحتيها إلى (5V)، ما مقدار سعة المتسعة في حالة العازل بين صفيحتيها.", "a": "<b>المعطيات:</b> C = 6 μF، ΔV = 30 V (متصلة)، ثم تفصل ويدخل عازل فيهبط الجهد إلى 5 V.<br>\n<b>1) الشحنة:</b><br>\n<span class=\"m\">Q = C·ΔV = 6×10⁻⁶ × 30</span><br>\n<span class=\"res\">Q = 1.8×10⁻⁴ C = 180 μC</span><br>\n<b>2) سعة المتسعة بوجود العازل:</b><br>\nالمتسعة مفصولة فالشحنة ثابتة، فـ C<sub>k</sub> = Q/ΔV<sub>k</sub><br>\n<span class=\"m\">C<sub>k</sub> = 180 / 5 = 36 μF</span><br>\n<span class=\"res\">C<sub>k</sub> = 36 μF</span><br>\n(ثابت العزل: K = ΔV/ΔV<sub>k</sub> = 30/5 = 6)", "parts": [{"l": "الشحنة المختزنة", "v": [180, 0.00018], "u": "μC (أو C)"}, {"l": "سعة المتسعة في حالة العازل", "v": [36, 3.6e-05], "u": "μF (أو F)"}], "id": "c1p49"}, {"ch": 1, "k": "p", "topic": "المسائل الحسابية - المتسعة المنفردة", "yrs": "2018 تمهيدي تطبيقي", "q": "متسعة ذات الصفيحتين المتوازيتين سعتها (20 μF) ربطت بين قطبي بطارية فرق الجهد بين قطبيها (6v) فإذا فصلت المتسعة عن البطارية ثم أدخل بين صفيحتيها لوحاً من مادة عازلة كهربائياً ثابت عزلها (3) يملأ الحيز بينهما، ما مقدار: 1) الشحنة المختزنة في أي من صفيحتي المتسعة. 2) سعة المتسعة بوجود العازل الكهربائي. 3) فرق الجهد بين صفيحتي المتسعة بعد إدخال العازل.", "a": "<b>المعطيات:</b> C = 20 μF، ΔV = 6 V، ثم تفصل ويدخل عازل K = 3.<br>\n<b>1) الشحنة على أي صفيحة:</b><br>\n<span class=\"m\">Q = C·ΔV = 20×10⁻⁶ × 6</span><br>\n<span class=\"res\">Q = 1.2×10⁻⁴ C = 120 μC</span><br>\n<b>2) سعة المتسعة مع العازل:</b><br>\n<span class=\"m\">C<sub>k</sub> = K·C = 3 × 20</span><br>\n<span class=\"res\">C<sub>k</sub> = 60 μF</span><br>\n<b>3) فرق الجهد بعد العازل:</b><br>\nالشحنة ثابتة: <span class=\"m\">ΔV<sub>k</sub> = Q/C<sub>k</sub> = 120 / 60</span><br>\n<span class=\"res\">ΔV<sub>k</sub> = 2 V</span> (وهو يساوي ΔV/K = 6/3)", "parts": [{"l": "الشحنة المختزنة", "v": [120, 0.00012], "u": "μC (أو C)"}, {"l": "سعة المتسعة بوجود العازل", "v": [60, 6e-05], "u": "μF (أو F)"}, {"l": "فرق الجهد بعد إدخال العازل", "v": [2], "u": "V"}], "id": "c1p50"}, {"ch": 1, "k": "p", "topic": "المسائل الحسابية - المتسعة المنفردة", "yrs": "2021 تمهيدي تطبيقي", "q": "متسعة ذات الصفيحتين المتوازيتين سعتها (C = 5 μF) ربطت بين قطبي بطارية فرق الجهد بين قطبيها (40 V). 1) ما مقدار الشحنة المختزنة في أي من صفيحتيها؟ 2) إذا فصلت المتسعة عن البطارية وأدخل عازل بين صفيحتيها هبط فرق الجهد بين صفيحتيها إلى (10 V)، ما مقدار سعة المتسعة في حالة العازل بين صفيحتيها؟ 3) ما مقدار الطاقة المختزنة في المجال الكهربائي بين صفيحتي المتسعة بعد وضع العازل؟", "a": "<b>المعطيات:</b> C = 5 μF، ΔV = 40 V (متصلة)، ثم تفصل ويدخل عازل فيهبط الجهد إلى 10 V.<br>\n<b>1) الشحنة:</b><br>\n<span class=\"m\">Q = C·ΔV = 5×10⁻⁶ × 40</span><br>\n<span class=\"res\">Q = 2×10⁻⁴ C = 200 μC</span><br>\n<b>2) سعة المتسعة بوجود العازل:</b><br>\nالشحنة ثابتة: <span class=\"m\">C<sub>k</sub> = Q/ΔV<sub>k</sub> = 200 / 10</span><br>\n<span class=\"res\">C<sub>k</sub> = 20 μF</span><br>\n<b>3) الطاقة بعد وضع العازل:</b><br>\n<span class=\"m\">PE<sub>k</sub> = ½·Q·ΔV<sub>k</sub> = ½ × 200×10⁻⁶ × 10</span><br>\n<span class=\"res\">PE<sub>k</sub> = 1×10⁻³ J = 1 mJ</span><br>\nتحقق: ثابت العزل K = 40/10 = 4، والطاقة الابتدائية 4×10⁻³ J، و 4×10⁻³ / 4 = 1×10⁻³ J ✓", "parts": [{"l": "الشحنة المختزنة", "v": [200, 0.0002], "u": "μC (أو C)"}, {"l": "سعة المتسعة في حالة العازل", "v": [20, 2e-05], "u": "μF (أو F)"}, {"l": "الطاقة المختزنة بعد وضع العازل", "v": [0.001, 1], "u": "J (أو mJ)"}], "id": "c1p51"}, {"ch": 1, "k": "p", "topic": "المسائل الحسابية - المتسعة المنفردة", "yrs": "1/2019", "q": "متسعة ذات الصفيحتين المتوازيتين البعد بين صفيحتيها (0.4 cm) وكل من صفيحتيها مربعة الشكل طول ضلع كل منها (10 cm) ويفصل بينهما فراغ [علماً أن سماحية الفراغ ε₀ = 8.85×10⁻¹² C²/N·m²]: 1) ما مقدار سعة المتسعة. 2) ما مقدار الشحنة المختزنة في أي من صفيحتيها بعد تسليط فرق جهد (10 V) بينهما. 3) إذا فصلت المتسعة عن البطارية وأدخل لوح عازل كهربائياً هبط فرق الجهد بين صفيحتيها إلى (5V) فما مقدار ثابت العزل للوح العازل؟ وما مقدار سعة المتسعة في حالة العازل بين صفيحتيها؟", "a": "<b>المعطيات:</b> d = 0.4 cm = 4×10⁻³ m، الضلع = 0.1 m فالمساحة A = 0.01 m²، ε₀ = 8.85×10⁻¹²، ΔV = 10 V.<br>\n<b>1) سعة المتسعة:</b><br>\n<span class=\"m\">C = ε₀A/d = (8.85×10⁻¹² × 0.01)/(4×10⁻³)</span><br>\n<span class=\"res\">C = 2.21×10⁻¹¹ F ≈ 22.1 pF</span><br>\n<b>2) الشحنة:</b><br>\n<span class=\"m\">Q = C·ΔV = 2.21×10⁻¹¹ × 10</span><br>\n<span class=\"res\">Q ≈ 2.21×10⁻¹⁰ C ≈ 221 pC</span><br>\n<b>3) ثابت العزل وسعة المتسعة مع العازل:</b><br>\nالمتسعة مفصولة فالشحنة ثابتة. ΔV<sub>k</sub> = 5 V<br>\n<span class=\"m\">K = ΔV/ΔV<sub>k</sub> = 10/5</span><br>\n<span class=\"res\">K = 2</span><br>\n<span class=\"m\">C<sub>k</sub> = K·C = 2 × 22.1 pF</span><br>\n<span class=\"res\">C<sub>k</sub> ≈ 44.25 pF</span>", "parts": [{"l": "سعة المتسعة", "v": [2.21e-11, 22.1, 0.0221], "u": "F (أو pF أو nF)"}, {"l": "الشحنة المختزنة", "v": [2.21e-10, 221, 0.221], "u": "C (أو pC أو nC)"}, {"l": "ثابت العزل", "v": [2], "u": ""}, {"l": "سعة المتسعة في حالة العازل", "v": [4.42e-11, 44.2, 0.0442], "u": "F (أو pF أو nF)"}], "id": "c1p52"}, {"ch": 1, "k": "p", "topic": "المسائل الحسابية - المتسعة المنفردة", "yrs": "1/2019 خارج القطر تطبيقي", "q": "متسعة ذات الصفيحتين المتوازيتين سعتها (5 μF) ربطت بين قطبي بطارية فرق الجهد بين قطبيها (30v). 1) ما مقدار الشحنة المختزنة في أي من صفيحتي المتسعة؟ 2) إذا فصلت المتسعة عن البطارية وأدخل لوح عازل كهربائي بين صفيحتيها ثابت عزله (k). أصبحت الطاقة المختزنة في المجال الكهربائي (11.25×10⁻⁴ J)، ما مقدار سعة المتسعة في حالة العازل بين صفيحتيها؟ وما مقدار ثابت العزل (k)؟", "a": "<b>المعطيات:</b> C = 5 μF، ΔV = 30 V (متصلة)، ثم تفصل ويدخل عازل K، فتصبح PE<sub>k</sub> = 11.25×10⁻⁴ J.<br>\n<b>1) الشحنة:</b><br>\n<span class=\"m\">Q = C·ΔV = 5×10⁻⁶ × 30</span><br>\n<span class=\"res\">Q = 1.5×10⁻⁴ C = 150 μC</span><br>\n<b>2) سعة المتسعة مع العازل وثابت العزل:</b><br>\nالطاقة الابتدائية: PE = ½QΔV = ½ × 1.5×10⁻⁴ × 30 = 2.25×10⁻³ J<br>\nالمتسعة مفصولة فالشحنة ثابتة، و PE<sub>k</sub> = PE/K<br>\n<span class=\"m\">K = PE/PE<sub>k</sub> = 2.25×10⁻³ / 11.25×10⁻⁴ = 2</span><br>\n<span class=\"res\">K = 2</span><br>\n<span class=\"m\">C<sub>k</sub> = K·C = 2 × 5 μF</span><br>\n<span class=\"res\">C<sub>k</sub> = 10 μF</span>", "parts": [{"l": "الشحنة المختزنة", "v": [150, 0.00015], "u": "μC (أو C)"}, {"l": "سعة المتسعة في حالة العازل", "v": [10, 1e-05], "u": "μF (أو F)"}, {"l": "ثابت العزل", "v": [2], "u": ""}], "id": "c1p53"}, {"ch": 1, "k": "k", "topic": "ربط المتسعات على التوازي", "yrs": "1/2018 خارج القطر (تطبيقي) · 1/2019 · 2/2022 خارج القطر (تطبيقي)", "q": "ما الغرض من ربط المتسعات على التوازي؟", "a": "لنحصل على سعة مكافئة كبيرة المقدار يمكن بواسطتها تخزين شحنة كهربائية كبيرة المقدار وبفرق جهد واطئ، حيث لا يمكن الحصول على ذلك باستعمال متسعة واحدة.", "kw": [["سعه مكافئه", "سعه كبيره", "كبيره"], ["شحنه"], ["جهد واطي", "جهد صغير", "فرق جهد", "واطي"]], "id": "c1k54"}, {"ch": 1, "k": "k", "topic": "ربط المتسعات على التوازي", "yrs": "2/2016 (أسئلة الفصل) · 1/2017 · 3/2017 الموصل · 3/2024 · 3/2024 محاولات", "q": "علل: ازدياد السعة المكافئة لمجموعة من المتسعات المربوطة على التوازي.", "a": "بسبب زيادة المساحة السطحية المتقابلة لصفيحتي المتسعة المكافئة للمجموعة المتوازية (<span class=\"m\">C ∝ A</span>) بثبوت البعد بين الصفيحتين ونوع العازل.", "kw": [["مساحه"], ["سطحيه", "متقابله", "صفيحتي"], ["بعد", "ثبوت", "ثابت"], ["عازل", "نوع"]], "id": "c1k55"}, {"ch": 1, "k": "k", "topic": "ربط المتسعات على التوازي", "yrs": "3/2017 الموصل · 2020 · 1/2025 (أسئلة الفصل)", "q": "لديك ثلاث متسعات متماثلة سعة كل منها (C) ومصدراً للفولطية المستمرة فرق الجهد بين قطبيه ثابت المقدار. ارسم مخططاً لدائرة كهربائية تبين فيه الطريقة المناسبة لربط المتسعات الثلاث جميعاً في الدائرة للحصول على أكبر مقدار للطاقة الكهربائية يمكن خزنها في المجموعة، ثم أثبت أن الترتيب الذي تختاره هو الأفضل.", "a": "تربط المتسعات على التوازي مع بعضها بين قطبي البطارية فتزداد السعة المكافئة.<br><span class=\"m\">C<sub>eq</sub> = C₁ + C₂ + C₃ = 3C</span><br>الطاقة المختزنة في متسعة واحدة: <span class=\"m\">PE = ½ C (ΔV)²</span><br>الطاقة الكلية: <span class=\"m\">PE<sub>T</sub> = ½ C<sub>eq</sub> (ΔV)²</span><br><span class=\"m\">PE<sub>T</sub> / PE₁ = ½(3C)(ΔV)² / ½C(ΔV)² = 3</span> ⇒ <span class=\"m\">PE<sub>T</sub> = 3 PE₁</span><br>فتزداد الطاقة إلى ثلاثة أمثال ما كانت عليه للمتسعة الواحدة.<br><b>طريقة ثانية:</b> <span class=\"m\">PE ∝ C</span> بثبوت ΔV ⇒ <span class=\"m\">PE<sub>T</sub>/PE₁ = C<sub>eq</sub>/C = 3C/C = 3</span>.", "kw": [["توازي"], ["سعه مكافئه", "مكافئه", "تزداد", "ازداد"], ["3c", "ثلاث", "ثلاثه", "3"], ["طاقه"]], "id": "c1k56"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "1/2013 خارج القطر · 2/2017 خارج القطر", "q": "متسعتان (C₁ = 26 μF , C₂ = 18 μF) مربوطتان على التوازي ربطت المجموعة إلى مصدر فرق الجهد بين قطبيه (50 V)، إذا أدخل لوح من مادة عازلة ثابت عزلها k بين صفيحتي المتسعة الأولى وما زالت المجموعة مربوطة بالبطارية فإذا كانت الشحنة الكلية (3500 μC) احسب: (a) ثابت العزل (k). (b) الشحنة المختزنة في أي من صفيحتي كل متسعة بعد إدخال العازل.", "parts": [{"l": "ثابت العزل k", "v": [2], "u": ""}, {"l": "شحنة المتسعة الأولى بعد العازل", "v": [2600, 0.0026], "u": "μC"}, {"l": "شحنة المتسعة الثانية", "v": [900, 0.0009], "u": "μC"}], "a": "<b>المعطيات:</b> C₁ = 26 μF، C₂ = 18 μF على التوازي، ΔV = 50 V (المجموعة متصلة بالمصدر)، الشحنة الكلية بعد العازل 3500 μC.<br>\n<b>(a) ثابت العزل:</b><br>\nΔV ثابت لأن المجموعة متصلة بالمصدر. السعة الكلية بعد العازل:<br>\n<span class=\"m\">C<sub>T</sub> = Q<sub>T</sub>/ΔV = 3500 / 50 = 70 μF</span><br>\n<span class=\"m\">C<sub>T</sub> = K·C₁ + C₂ ⇒ 70 = 26K + 18</span><br>\n<span class=\"m\">26K = 52</span><br>\n<span class=\"res\">K = 2</span><br>\n<b>(b) الشحنة على كل متسعة:</b><br>\n<span class=\"m\">Q₁ = K·C₁·ΔV = 2 × 26 × 50</span><br>\n<span class=\"res\">Q₁ = 2600 μC</span><br>\n<span class=\"m\">Q₂ = C₂·ΔV = 18 × 50</span><br>\n<span class=\"res\">Q₂ = 900 μC</span><br>\nتحقق: Q₁ + Q₂ = 3500 μC ✓", "id": "c1p57"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "2/2014 أسئلة النازحين", "q": "متسعتان من ذوات الصفيحتين المتوازيتين (C₁ = 6 μF , C₂ = 2 μF) مربوطتان مع بعضهما على التوازي، ومجموعتهما ربطت بين قطبي بطارية فرق الجهد بين قطبيها (12 V) احسب: (1) شحنة كل متسعة والشحنة الكلية. (2) أدخل لوح عازل كهربائي ثابت عزله (2) بين صفيحتي المتسعة الأولى (مع بقاء البطارية مربوطة بين طرفي المجموعة) فما مقدار الشحنة المختزنة في أي من صفيحتي كل متسعة بعد إدخال العازل والشحنة الكلية؟", "parts": [{"l": "شحنة المتسعة الأولى", "v": [72, 7.2e-05], "u": "μC"}, {"l": "شحنة المتسعة الثانية", "v": [24, 2.4e-05], "u": "μC"}, {"l": "الشحنة الكلية", "v": [96, 9.6e-05], "u": "μC"}, {"l": "شحنة الأولى بعد العازل", "v": [144, 0.000144], "u": "μC"}, {"l": "الشحنة الكلية بعد العازل", "v": [168, 0.000168], "u": "μC"}], "a": "<b>المعطيات:</b> C₁ = 6 μF، C₂ = 2 μF على التوازي، ΔV = 12 V.<br>\n<b>(1) الشحنة قبل العازل:</b><br>\n<span class=\"m\">Q₁ = C₁·ΔV = 6 × 12 = 72 μC</span><br>\n<span class=\"m\">Q₂ = C₂·ΔV = 2 × 12 = 24 μC</span><br>\n<span class=\"res\">Q₁ = 72 μC ، Q₂ = 24 μC ، Q<sub>T</sub> = 96 μC</span><br>\n<b>(2) بعد إدخال العازل K = 2 في المتسعة الأولى (والبطارية متصلة):</b><br>\nΔV ثابت = 12 V، و C₁k = K·C₁ = 2 × 6 = 12 μF<br>\n<span class=\"m\">Q₁ = 12 × 12 = 144 μC</span><br>\n<span class=\"m\">Q₂ = 2 × 12 = 24 μC</span> (لا تتغير)<br>\n<span class=\"res\">Q₁ = 144 μC ، Q₂ = 24 μC ، Q<sub>T</sub> = 168 μC</span>", "id": "c1p58"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "2/2013 · 2/2017 أسئلة الموصل", "q": "متسعتان مربوطتان على التوازي (C₁ = 12 μF , C₂ = 6 μF) فإذا شحنت المجموعة بشحنة كلية (180 μC) بواسطة مصدر للفولطية المستمرة ثم فصلت عنه: (a) احسب مقدار شحنة كل متسعة وفرق الجهد بين صفيحتيها والطاقة المختزنة في المجال الكهربائي فيها. (b) أدخل لوح من مادة عازلة ثابت عزلها (4) بين صفيحتي المتسعة الثانية، فما مقدار الشحنة المختزنة في أي من صفيحتي كل متسعة وفرق الجهد والطاقة المختزنة بين صفيحتي كل متسعة بعد إدخال العازل؟", "parts": [{"l": "فرق الجهد قبل العازل", "v": [10], "u": "V"}, {"l": "شحنة الأولى قبل العازل", "v": [120, 0.00012], "u": "μC"}, {"l": "طاقة الأولى قبل العازل", "v": [0.0006, 600], "u": "μJ"}, {"l": "فرق الجهد بعد العازل", "v": [5], "u": "V"}, {"l": "شحنة الثانية بعد العازل", "v": [120, 0.00012], "u": "μC"}, {"l": "طاقة الأولى بعد العازل", "v": [0.00015, 150], "u": "μJ"}], "a": "<b>المعطيات:</b> C₁ = 12 μF، C₂ = 6 μF على التوازي، الشحنة الكلية Q<sub>T</sub> = 180 μC، المجموعة مفصولة عن المصدر.<br>\n<b>(a) قبل العازل:</b><br>\nالسعة الكلية: C<sub>T</sub> = 12 + 6 = 18 μF<br>\n<span class=\"m\">ΔV = Q<sub>T</sub>/C<sub>T</sub> = 180/18 = 10 V</span><br>\n<span class=\"res\">ΔV = 10 V</span><br>\n<span class=\"m\">Q₁ = 12 × 10 = 120 μC</span> ، <span class=\"m\">Q₂ = 6 × 10 = 60 μC</span><br>\n<span class=\"m\">PE₁ = ½Q₁ΔV = ½ × 120×10⁻⁶ × 10 = 600 μJ</span><br>\n<span class=\"m\">PE₂ = ½Q₂ΔV = ½ × 60×10⁻⁶ × 10 = 300 μJ</span><br>\n<span class=\"res\">Q₁ = 120 μC ، Q₂ = 60 μC ، PE₁ = 600 μJ ، PE₂ = 300 μJ</span><br>\n<b>(b) بعد إدخال العازل K = 4 في المتسعة الثانية (مفصولة فالشحنة الكلية 180 μC):</b><br>\nC₂k = 4 × 6 = 24 μF، والسعة الكلية = 12 + 24 = 36 μF<br>\n<span class=\"m\">ΔV = 180/36 = 5 V</span><br>\n<span class=\"m\">Q₁ = 12 × 5 = 60 μC</span> ، <span class=\"m\">Q₂ = 24 × 5 = 120 μC</span><br>\n<span class=\"m\">PE₁ = ½ × 60×10⁻⁶ × 5 = 150 μJ</span><br>\n<span class=\"m\">PE₂ = ½ × 120×10⁻⁶ × 5 = 300 μJ</span><br>\n<span class=\"res\">Q₁ = 60 μC ، Q₂ = 120 μC ، ΔV = 5 V ، PE₁ = 150 μJ ، PE₂ = 300 μJ</span>", "id": "c1p59"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "1/2015 · 1/2021 أحيائي", "q": "متسعتان موصولتان على التوازي (C₁ = 4 μF , C₂ = 8 μF) فإذا شحنت مجموعتهما بشحنة كلية مقدارها (600 μC) بواسطة مصدر للفولطية المستمرة ثم فصلت عنه، احسب: (1) الشحنة المختزنة على أي من صفيحتي كل متسعة. (2) أدخل لوح من مادة عازلة ثابت عزلها (k) بين صفيحتي المتسعة الثانية فأصبحت شحنتها المختزنة (480 μC)، فما مقدار ثابت العزل (k)؟", "parts": [{"l": "شحنة المتسعة الأولى", "v": [200, 0.0002], "u": "μC"}, {"l": "شحنة المتسعة الثانية", "v": [400, 0.0004], "u": "μC"}, {"l": "ثابت العزل k", "v": [2], "u": ""}], "a": "<b>المعطيات:</b> C₁ = 4 μF، C₂ = 8 μF على التوازي، الشحنة الكلية 600 μC، ثم تفصل عن المصدر.<br>\n<b>(1) الشحنة على كل متسعة:</b><br>\nالسعة الكلية = 4 + 8 = 12 μF، فرق الجهد المشترك: <span class=\"m\">ΔV = 600/12 = 50 V</span><br>\n<span class=\"m\">Q₁ = 4 × 50 = 200 μC</span> ، <span class=\"m\">Q₂ = 8 × 50 = 400 μC</span><br>\n<span class=\"res\">Q₁ = 200 μC ، Q₂ = 400 μC</span><br>\n<b>(2) ثابت العزل في المتسعة الثانية (بعد أن أصبحت شحنتها 480 μC):</b><br>\nبعد العازل: C₂k = 8K، والشحنة الكلية 600 μC، والفرق المشترك V = 600/(4 + 8K)<br>\nQ₂ = C₂k·V ⇒ <span class=\"m\">480 = 8K × 600/(4 + 8K)</span><br>\n<span class=\"m\">480(4 + 8K) = 4800K ⇒ 1920 + 3840K = 4800K ⇒ 960K = 1920</span><br>\n<span class=\"res\">K = 2</span><br>\nتحقق: C₂k = 16 μF، V = 600/20 = 30 V، Q₂ = 16 × 30 = 480 μC ✓", "id": "c1p60"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "1/2015 أسئلة النازحين · تمهيدي 2024", "q": "متسعتان (C₁ = 9 μF , C₂ = 3 μF) مربوطتان على التوازي فإذا شحنت مجموعتهما بشحنة كلية (288 μC) بواسطة مصدر للفولطية المستمرة، ثم فصلت عنه: (1) احسب مقدار الشحنة المختزنة على أي من صفيحتي كل متسعة. (2) أدخل لوح من مادة عازلة ثابت عزلها (5) بين صفيحتي المتسعة الثانية، فما مقدار الشحنة المختزنة في أي من صفيحتي كل متسعة وفرق جهد كل متسعة بعد وضع العازل؟", "parts": [{"l": "شحنة المتسعة الأولى قبل العازل", "v": [216, 0.000216], "u": "μC"}, {"l": "شحنة المتسعة الثانية قبل العازل", "v": [72, 7.2e-05], "u": "μC"}, {"l": "فرق الجهد بعد العازل", "v": [12], "u": "V"}, {"l": "شحنة الأولى بعد العازل", "v": [108, 0.000108], "u": "μC"}, {"l": "شحنة الثانية بعد العازل", "v": [180, 0.00018], "u": "μC"}], "a": "<b>المعطيات:</b> C₁ = 9 μF، C₂ = 3 μF على التوازي، الشحنة الكلية 288 μC، ثم تفصل عن المصدر.<br>\n<b>(1) الشحنة على كل متسعة:</b><br>\nالسعة الكلية = 9 + 3 = 12 μF<br>\n<span class=\"m\">ΔV = 288/12 = 24 V</span><br>\n<span class=\"m\">Q₁ = 9 × 24 = 216 μC</span> ، <span class=\"m\">Q₂ = 3 × 24 = 72 μC</span><br>\n<span class=\"res\">Q₁ = 216 μC ، Q₂ = 72 μC</span><br>\n<b>(2) بعد إدخال عازل K = 5 بين صفيحتي المتسعة الثانية:</b><br>\nC₂k = 5 × 3 = 15 μF، والسعة الكلية = 9 + 15 = 24 μF<br>\n<span class=\"m\">ΔV = 288/24 = 12 V</span><br>\n<span class=\"m\">Q₁ = 9 × 12 = 108 μC</span><br>\n<span class=\"m\">Q₂k = 15 × 12 = 180 μC</span><br>\n<span class=\"res\">Q₁ = 108 μC ، Q₂ (بعد العازل) = 180 μC</span>", "id": "c1p61"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "2/2015 خارج القطر", "q": "متسعة سعتها (15 μF) مشحونة بفرق جهد (300 V) وربطت على التوازي مع متسعة أخرى غير مشحونة فأصبح فرق الجهد على طرفي المجموعة (100 V). احسب: (1) سعة المتسعة الثانية. (2) شحنة كل متسعة بعد الربط. (3) إذا وضع بين صفيحتي المتسعة الأولى مادة عازلة أصبح فرق جهد المجموعة (75 V)، جد ثابت عزل تلك المادة.", "parts": [{"l": "سعة المتسعة الثانية", "v": [30, 3e-05], "u": "μF"}, {"l": "شحنة الأولى بعد الربط", "v": [1500, 0.0015], "u": "μC"}, {"l": "شحنة الثانية بعد الربط", "v": [3000, 0.003], "u": "μC"}, {"l": "ثابت العزل", "v": [2], "u": ""}], "a": "<b>المعطيات:</b> C₁ = 15 μF مشحونة بـ 300 V، والمتسعة الثانية غير مشحونة، وبعد الربط على التوازي ΔV = 100 V. المجموعة مفصولة عن المصدر فالشحنة الكلية ثابتة.<br>\n<b>1) سعة المتسعة الثانية:</b><br>الشحنة الكلية قبل الربط تكون على الأولى فقط: Q = C₁·V₁ = 15×10⁻⁶ × 300 = 4.5×10⁻³ C = 4500 μC<br>\nبعد الربط على التوازي: Q = (C₁ + C₂)·ΔV<br>\n<span class=\"m\">4500 = (15 + C₂) × 100</span> ⇒ 15 + C₂ = 45 ⇒<br>\n<span class=\"res\">C₂ = 30 μF</span><br>\n<b>2) شحنة كل متسعة بعد الربط:</b><br>\nQ₁ = C₁·ΔV = 15 × 100 = 1500 μC<br>\nQ₂ = C₂·ΔV = 30 × 100 = 3000 μC<br>\n<span class=\"res\">Q₁ = 1500 μC ، Q₂ = 3000 μC</span> (مجموعهما 4500 μC كما هو متوقع)<br>\n<b>3) ثابت عزل المادة في المتسعة الأولى:</b><br>\nبعد إدخال العازل تصبح سعة الأولى C₁k = K·15، والشحنة الكلية ما زالت 4500 μC، وفرق جهد المجموعة 75 V:<br>\n<span class=\"m\">C<sub>total</sub> = Q/ΔV = 4500/75 = 60 μF</span><br>\n<span class=\"m\">K·15 + 30 = 60</span> ⇒ K·15 = 30<br>\n<span class=\"res\">K = 2</span>", "id": "c1p62"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "2/2016", "q": "متسعتان مربوطتان مع بعضهما على التوازي (C₁ = 6 μF , C₂ = 12 μF) فإذا شحنت مجموعتهما بشحنة كلية (180 μC) بواسطة مصدر للفولطية المستمرة ثم فصلت عنه وأدخل لوح من مادة عازلة كهربائية ثابت عزلها (4) بين صفيحتي المتسعة الأولى، جد مقدار الشحنة المختزنة بين صفيحتي كل متسعة وفرق جهد كل متسعة قبل وبعد إدخال العازل.", "parts": [{"l": "فرق الجهد قبل العازل", "v": [10], "u": "V"}, {"l": "شحنة الأولى قبل العازل", "v": [60, 6e-05], "u": "μC"}, {"l": "شحنة الثانية قبل العازل", "v": [120, 0.00012], "u": "μC"}, {"l": "فرق الجهد بعد العازل", "v": [5], "u": "V"}, {"l": "شحنة الأولى بعد العازل", "v": [120, 0.00012], "u": "μC"}], "a": "<b>المعطيات:</b> C₁ = 6 μF، C₂ = 12 μF على التوازي، الشحنة الكلية 180 μC، ثم تفصل عن المصدر. بعد العازل K = 4 في الأولى.<br>\n<b>قبل العازل:</b><br>\nC<sub>T</sub> = 6 + 12 = 18 μF ⇒ ΔV = 180/18 = 10 V<br>\n<span class=\"m\">Q₁ = 6 × 10 = 60 μC</span> ، <span class=\"m\">Q₂ = 12 × 10 = 120 μC</span><br>\n<span class=\"res\">قبل: Q₁ = 60 μC ، Q₂ = 120 μC ، ΔV = 10 V لكل منهما</span><br>\n<b>بعد العازل:</b> C₁k = 4 × 6 = 24 μF، والسعة الكلية = 24 + 12 = 36 μF، والشحنة ثابتة 180 μC<br>\n<span class=\"m\">ΔV = 180/36 = 5 V</span><br>\n<span class=\"m\">Q₁ = 24 × 5 = 120 μC</span> ، <span class=\"m\">Q₂ = 12 × 5 = 60 μC</span><br>\n<span class=\"res\">بعد: Q₁ = 120 μC ، Q₂ = 60 μC ، ΔV = 5 V لكل منهما</span>", "id": "c1p63"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "1/2016 أسئلة النازحين · 2/2018 تطبيقي", "q": "متسعتان مربوطتان على التوازي (C₁ = 2 μF , C₂ = 6 μF) فإذا شحنت المجموعة بشحنة كلية (400 μC) بواسطة مصدر للفولطية المستمرة ثم فصلت عنه: (a) احسب مقدار الشحنة المختزنة لكل متسعة في أي من صفيحتيها. (b) ادخل لوح من مادة عازلة ثابت عزلها (2) بين صفيحتي المتسعة الأولى، فما مقدار الشحنة المختزنة في أي من صفيحتي كل متسعة بعد إدخال العازل؟", "parts": [{"l": "شحنة الأولى قبل العازل", "v": [100, 0.0001], "u": "μC"}, {"l": "شحنة الثانية قبل العازل", "v": [300, 0.0003], "u": "μC"}, {"l": "شحنة الأولى بعد العازل", "v": [160, 0.00016], "u": "μC"}, {"l": "شحنة الثانية بعد العازل", "v": [240, 0.00024], "u": "μC"}], "a": "<b>المعطيات:</b> C₁ = 2 μF، C₂ = 6 μF على التوازي، الشحنة الكلية 400 μC، ثم تفصل. بعد العازل K = 2 في الأولى.<br>\n<b>(a) قبل العازل:</b><br>\nC<sub>T</sub> = 2 + 6 = 8 μF ⇒ ΔV = 400/8 = 50 V<br>\n<span class=\"m\">Q₁ = 2 × 50 = 100 μC</span> ، <span class=\"m\">Q₂ = 6 × 50 = 300 μC</span><br>\n<span class=\"res\">Q₁ = 100 μC ، Q₂ = 300 μC</span><br>\n<b>(b) بعد العازل:</b> C₁k = 2 × 2 = 4 μF، C<sub>T</sub> = 4 + 6 = 10 μF<br>\n<span class=\"m\">ΔV = 400/10 = 40 V</span><br>\n<span class=\"m\">Q₁ = 4 × 40 = 160 μC</span> ، <span class=\"m\">Q₂ = 6 × 40 = 240 μC</span><br>\n<span class=\"res\">Q₁ = 160 μC ، Q₂ = 240 μC</span>", "id": "c1p64"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "3/2017 تطبيقي", "q": "لديك ثلاث متسعات سعاتها (C₁ = 8 μF , C₂ = 12 μF , C₃ = 24 μF) ومصدر للفولطية فرق الجهد بين طرفيه (6 V). وضح مع الرسم مخططاً للدائرة الكهربائية كيفية ربط المتسعات الثلاث بعضها ببعض للحصول على: (1) أكبر مقدار للسعة المكافئة، وما مقدار الشحنة المختزنة في كل متسعة وللمجموعة؟ (2) أصغر مقدار للسعة المكافئة، وما مقدار الشحنة المختزنة في كل متسعة وفي المجموعة؟", "parts": [{"l": "أكبر سعة مكافئة", "v": [44, 4.4e-05], "u": "μF"}, {"l": "شحنة المتسعة الأولى (توازي)", "v": [48, 4.8e-05], "u": "μC"}, {"l": "شحنة المتسعة الثانية (توازي)", "v": [72, 7.2e-05], "u": "μC"}, {"l": "شحنة المتسعة الثالثة (توازي)", "v": [144, 0.000144], "u": "μC"}, {"l": "الشحنة الكلية (توازي)", "v": [264, 0.000264], "u": "μC"}, {"l": "أصغر سعة مكافئة", "v": [4, 4e-06], "u": "μF"}, {"l": "الشحنة في كل متسعة (توالي)", "v": [24, 2.4e-05], "u": "μC"}], "a": "<b>المعطيات:</b> C₁ = 8 μF، C₂ = 12 μF، C₃ = 24 μF، فرق جهد المصدر 6 V.<br>\n<b>(1) أكبر سعة مكافئة: توصيل التوازي</b><br>\n<span class=\"m\">C<sub>eq</sub> = 8 + 12 + 24 = 44 μF</span><br>\nكل متسعة على التوازي تأخذ فرق الجهد نفسه 6 V:<br>\n<span class=\"m\">Q₁ = 8 × 6 = 48 μC</span> ، <span class=\"m\">Q₂ = 12 × 6 = 72 μC</span> ، <span class=\"m\">Q₃ = 24 × 6 = 144 μC</span><br>\n<span class=\"res\">Q<sub>T</sub> = 48 + 72 + 144 = 264 μC</span><br>\n<b>(2) أصغر سعة مكافئة: توصيل التوالي</b><br>\n<span class=\"m\">1/C<sub>eq</sub> = 1/8 + 1/12 + 1/24 = (3 + 2 + 1)/24 = 6/24</span><br>\n<span class=\"res\">C<sub>eq</sub> = 4 μF</span><br>\nالشحنة متساوية في المتسعات الثلاث: <span class=\"m\">Q = C<sub>eq</sub> × 6 = 4 × 6 = 24 μC</span><br>\n<span class=\"m\">ΔV₁ = 24/8 = 3 V</span> ، <span class=\"m\">ΔV₂ = 24/12 = 2 V</span> ، <span class=\"m\">ΔV₃ = 24/24 = 1 V</span> (مجموعها 6 V ✓)<br>\n<span class=\"res\">Q لكل متسعة = 24 μC ، Q<sub>T</sub> = 24 μC</span>", "id": "c1p65"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "2/2016 خارج القطر", "q": "متسعتان مربوطتان مع بعضهما على التوازي (C₁ = 8 μF , C₂ = 12 μF) فإذا شحنت مجموعتهما بشحنة كلية (640 μC) بواسطة مصدر للفولطية المستمرة ثم فصلت عنه وأدخل لوح من مادة عازلة كهربائية ثابت عزلها (2) بين صفيحتي المتسعة الثانية، فما مقدار الشحنة المختزنة في أي من صفيحتي كل متسعة والطاقة المختزنة في المجال الكهربائي بين صفيحتي كل متسعة قبل وبعد إدخال العازل.", "parts": [{"l": "فرق الجهد قبل العازل", "v": [32], "u": "V"}, {"l": "شحنة الأولى قبل العازل", "v": [256, 0.000256], "u": "μC"}, {"l": "شحنة الثانية قبل العازل", "v": [384, 0.000384], "u": "μC"}, {"l": "طاقة الأولى قبل العازل", "v": [0.004096, 4096], "u": "μJ"}, {"l": "طاقة الثانية قبل العازل", "v": [0.006144, 6144], "u": "μJ"}, {"l": "فرق الجهد بعد العازل", "v": [20], "u": "V"}, {"l": "شحنة الثانية بعد العازل", "v": [480, 0.00048], "u": "μC"}, {"l": "طاقة الأولى بعد العازل", "v": [0.0016, 1600], "u": "μJ"}, {"l": "طاقة الثانية بعد العازل", "v": [0.0048, 4800], "u": "μJ"}], "a": "<b>المعطيات:</b> C₁ = 8 μF، C₂ = 12 μF على التوازي، الشحنة الكلية 640 μC، ثم تفصل. بعد العازل K = 2 في الثانية.<br>\n<b>قبل العازل:</b><br>\nC<sub>T</sub> = 20 μF ⇒ ΔV = 640/20 = 32 V<br>\n<span class=\"m\">Q₁ = 8 × 32 = 256 μC</span> ، <span class=\"m\">Q₂ = 12 × 32 = 384 μC</span><br>\n<span class=\"m\">PE₁ = ½Q₁ΔV = ½ × 256×10⁻⁶ × 32 = 4.096×10⁻³ J</span><br>\n<span class=\"m\">PE₂ = ½Q₂ΔV = ½ × 384×10⁻⁶ × 32 = 6.144×10⁻³ J</span><br>\n<span class=\"res\">قبل: Q₁ = 256 μC ، Q₂ = 384 μC ، PE₁ = 4.096 mJ ، PE₂ = 6.144 mJ</span><br>\n<b>بعد العازل:</b> C₂k = 2 × 12 = 24 μF، C<sub>T</sub> = 8 + 24 = 32 μF<br>\n<span class=\"m\">ΔV = 640/32 = 20 V</span><br>\n<span class=\"m\">Q₁ = 8 × 20 = 160 μC</span> ، <span class=\"m\">Q₂ = 24 × 20 = 480 μC</span><br>\n<span class=\"m\">PE₁ = ½ × 160×10⁻⁶ × 20 = 1.6 mJ</span> ، <span class=\"m\">PE₂ = ½ × 480×10⁻⁶ × 20 = 4.8 mJ</span><br>\n<span class=\"res\">بعد: Q₁ = 160 μC ، Q₂ = 480 μC ، PE₁ = 1.6 mJ ، PE₂ = 4.8 mJ</span>", "id": "c1p66"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "3/2018", "q": "ثلاث متسعات (4μF , 8μF , 12μF) مربوطة مع بعضها على التوازي ، ربطت المجموعة بين قطبي بطارية فرق الجهد بين قطبيها (24 V) ، احسب مقدار: (1) السعة المكافئة للمجموعة. (2) الشحنة المختزنة في أي من صفيحتي كل متسعة. (3) الشحنة الكلية المختزنة في المجموعة. (4) الطاقة المختزنة في المجال الكهربائي للمتسعة الاولى فقط.", "a": "<b>المعطيات:</b> C₁ = 4 μF، C₂ = 8 μF، C₃ = 12 μF على التوازي، ΔV = 24 V.<br>\n<b>(1) السعة المكافئة:</b><br>\n<span class=\"m\">C<sub>eq</sub> = 4 + 8 + 12 = 24 μF</span><br>\n<span class=\"res\">C<sub>eq</sub> = 24 μF</span><br>\n<b>(2) الشحنة على كل صفيحة:</b><br>\n<span class=\"m\">Q₁ = 4 × 24 = 96 μC</span> ، <span class=\"m\">Q₂ = 8 × 24 = 192 μC</span> ، <span class=\"m\">Q₃ = 12 × 24 = 288 μC</span><br>\n<span class=\"res\">Q₁ = 96 μC ، Q₂ = 192 μC ، Q₃ = 288 μC</span><br>\n<b>(3) الشحنة الكلية:</b> <span class=\"res\">Q<sub>T</sub> = 96 + 192 + 288 = 576 μC</span> (وتساوي C<sub>eq</sub>×ΔV = 24 × 24)<br>\n<b>(4) الطاقة للمتسعة الأولى فقط:</b><br>\n<span class=\"m\">PE₁ = ½ C₁ ΔV² = ½ × 4×10⁻⁶ × (24)² = ½ × 4×10⁻⁶ × 576</span><br>\n<span class=\"res\">PE₁ = 1.152×10⁻³ J = 1.152 mJ</span>", "parts": [{"l": "السعة المكافئة", "v": [24, 2.4e-05], "u": "μF"}, {"l": "شحنة المتسعة الأولى", "v": [96, 9.6e-05], "u": "μC"}, {"l": "شحنة المتسعة الثانية", "v": [192, 0.000192], "u": "μC"}, {"l": "شحنة المتسعة الثالثة", "v": [288, 0.000288], "u": "μC"}, {"l": "الشحنة الكلية", "v": [576, 0.000576], "u": "μC"}, {"l": "الطاقة المختزنة في المتسعة الأولى", "v": [0.001152, 1152], "u": "J"}], "id": "c1p67"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "2019 تمهيدي · 1/2019 خارج القطر", "q": "متسعتان (C₁ = 12μF , C₂ = 8μF) وصلتا على التوازي ، فإذا شحنت مجموعتهما بشحنة كلية مقدارها (400 μC) بواسطة مصدر للفولطية المستمرة ، ثم فصلت عنه احسب عن كل متسعة: (1) الشحنة المختزنة على اي من صفيحتيها والطاقة المختزنة في المجال الكهربائي بين صفيحتيها. (2) ادخل لوح من مادة عازلة ثابت عزلها (K) بين صفيحتي المتسعة الاولى فانخفض فرق جهد المجموعة إلى (5V) ، فما مقدار ثابت العزل الكهربائي (K)؟", "a": "<b>المعطيات:</b> C₁ = 12 μF، C₂ = 8 μF على التوازي، الشحنة الكلية 400 μC، ثم تفصل. بعد العازل K في الأولى يصبح ΔV = 5 V.<br>\n<b>(1) قبل العازل:</b><br>\nC<sub>T</sub> = 20 μF ⇒ ΔV = 400/20 = 20 V<br>\n<span class=\"m\">Q₁ = 12 × 20 = 240 μC</span> ، <span class=\"m\">Q₂ = 8 × 20 = 160 μC</span><br>\n<span class=\"m\">PE₁ = ½ × 240×10⁻⁶ × 20 = 2.4 mJ</span> ، <span class=\"m\">PE₂ = ½ × 160×10⁻⁶ × 20 = 1.6 mJ</span><br>\n<span class=\"res\">Q₁ = 240 μC ، Q₂ = 160 μC ، PE₁ = 2.4 mJ ، PE₂ = 1.6 mJ</span><br>\n<b>(2) ثابت العزل K:</b><br>\nالشحنة الكلية ثابتة 400 μC، و C₁k = 12K، والسعة الكلية = 12K + 8<br>\n<span class=\"m\">ΔV = 400/(12K + 8) = 5</span> ⇒ 12K + 8 = 80 ⇒ 12K = 72<br>\n<span class=\"res\">K = 6</span><br>\nتحقق: Q₁ = 72 × 5 = 360 μC ، Q₂ = 8 × 5 = 40 μC ، مجموعهما 400 μC ✓", "parts": [{"l": "شحنة المتسعة الأولى", "v": [240, 0.00024], "u": "μC"}, {"l": "شحنة المتسعة الثانية", "v": [160, 0.00016], "u": "μC"}, {"l": "طاقة المتسعة الأولى", "v": [0.0024, 2400], "u": "J"}, {"l": "طاقة المتسعة الثانية", "v": [0.0016, 1600], "u": "J"}, {"l": "ثابت العزل K", "v": [6], "u": ""}], "id": "c1p68"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "2/2019", "q": "متسعتان من ذوات الصفيحتين المتوازيتين (C₁ = 4 μF , C₂ = 6 μF) مربوطتان مع بعضهما على التوازي ومجموعهما ربطت بين قطبي بطارية فرق الجهد بين قطبيها (50 V). (1) احسب لكل متسعة مقدار الشحنة المختزنة في اي من صفيحتيها. (2) ادخل لوح من مادة عازلة كهربائيا ثابت عزلها (3) بين صفيحتي المتسعة الثانية , وما زالت المجموعة متصلة بالبطارية احسب فرق جهد كل متسعة والشحنة المختزنة بين صفيحتي كل متسعة بعد ادخال العازل.", "a": "<b>المعطيات:</b> C₁ = 4 μF، C₂ = 6 μF على التوازي، ΔV = 50 V (متصلة بالبطارية).<br>\n<b>(1) الشحنة قبل العازل:</b><br>\n<span class=\"m\">Q₁ = 4 × 50 = 200 μC</span> ، <span class=\"m\">Q₂ = 6 × 50 = 300 μC</span><br>\n<span class=\"res\">Q₁ = 200 μC ، Q₂ = 300 μC</span><br>\n<b>(2) بعد إدخال العازل K = 3 في الثانية، والبطارية متصلة:</b><br>\nفرق الجهد ثابت = 50 V على كل متسعة (لأنهما على التوازي مع المصدر).<br>\nC₂k = 3 × 6 = 18 μF<br>\n<span class=\"m\">Q₁ = 200 μC (لا تتغير)</span><br>\n<span class=\"m\">Q₂ = 18 × 50 = 900 μC</span><br>\n<span class=\"res\">فرق جهد كل متسعة = 50 V ، Q₁ = 200 μC ، Q₂ = 900 μC</span>", "parts": [{"l": "شحنة المتسعة الأولى قبل العازل", "v": [200, 0.0002], "u": "μC"}, {"l": "شحنة المتسعة الثانية قبل العازل", "v": [300, 0.0003], "u": "μC"}, {"l": "فرق جهد كل متسعة بعد العازل", "v": [50], "u": "V"}, {"l": "شحنة المتسعة الأولى بعد العازل", "v": [200, 0.0002], "u": "μC"}, {"l": "شحنة المتسعة الثانية بعد العازل", "v": [900, 0.0009], "u": "μC"}], "id": "c1p69"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "2021 تمهيدي احيائي", "q": "اربع متسعات سعتها حسب الترتيب (4μF , 8μF , 12μF , 6μF) مربوطة مع بعضها على التوازي ربطت المجموعة بين قطبي بطارية فرق الجهد بين قطبيها (12 V) احسب مقدار: (1) السعة المكافئة للمجموعة (2) الشحنة المختزنة في اي من صفيحتي كل متسعة (3) الشحنة الكلية المختزنة في المجموعة.", "a": "<b>المعطيات:</b> C₁ = 4، C₂ = 8، C₃ = 12، C₄ = 6 (µF) على التوازي، ΔV = 12 V.<br>\n<b>(1) السعة المكافئة:</b><br>\n<span class=\"m\">C<sub>eq</sub> = 4 + 8 + 12 + 6 = 30 μF</span><br>\n<span class=\"res\">C<sub>eq</sub> = 30 μF</span><br>\n<b>(2) الشحنة على كل صفيحة:</b><br>\n<span class=\"m\">Q₁ = 4 × 12 = 48 μC</span> ، <span class=\"m\">Q₂ = 8 × 12 = 96 μC</span><br>\n<span class=\"m\">Q₃ = 12 × 12 = 144 μC</span> ، <span class=\"m\">Q₄ = 6 × 12 = 72 μC</span><br>\n<span class=\"res\">Q₁ = 48 μC ، Q₂ = 96 μC ، Q₃ = 144 μC ، Q₄ = 72 μC</span><br>\n<b>(3) الشحنة الكلية:</b><br>\n<span class=\"res\">Q<sub>T</sub> = 48 + 96 + 144 + 72 = 360 μC</span> (وتساوي C<sub>eq</sub> × ΔV = 30 × 12)", "parts": [{"l": "السعة المكافئة", "v": [30, 3e-05], "u": "μF"}, {"l": "شحنة المتسعة الأولى", "v": [48, 4.8e-05], "u": "μC"}, {"l": "شحنة المتسعة الثانية", "v": [96, 9.6e-05], "u": "μC"}, {"l": "شحنة المتسعة الثالثة", "v": [144, 0.000144], "u": "μC"}, {"l": "شحنة المتسعة الرابعة", "v": [72, 7.2e-05], "u": "μC"}, {"l": "الشحنة الكلية", "v": [360, 0.00036], "u": "μC"}], "id": "c1p70"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "2/2020", "q": "متسعتان (C₁ = 4μF , C₂ = 8μF) مربوطتان مع بعضهما على التوازي ، فاذا شحنت مجموعتهما بشحنة كلية (600 μC) بواسطة مصدر للفولطية المستمرة ، ثم فصلت عنه. (1) احسب مقدار الشحنة المختزنة في أي من صفيحتي كل متسعة والطاقة المختزنة في المجال الكهربائي بين صفيحتيها. (2) ادخل لوح من مادة عازلة كهربائياً ثابت عزلها (K) بين صفيحتي المتسعة الثانية فاصبح فرق جهد المجموعة (30 V) فما مقدار ثابت العزل وشحنة كل متسعة بعد إدخال العازل.", "a": "<b>المعطيات:</b> C₁ = 4 μF، C₂ = 8 μF على التوازي، الشحنة الكلية 600 μC، ثم تفصل. بعد العازل K في الثانية يصبح ΔV = 30 V.<br>\n<b>(1) قبل العازل:</b><br>\nC<sub>T</sub> = 12 μF ⇒ ΔV = 600/12 = 50 V<br>\n<span class=\"m\">Q₁ = 4 × 50 = 200 μC</span> ، <span class=\"m\">Q₂ = 8 × 50 = 400 μC</span><br>\n<span class=\"m\">PE₁ = ½ × 200×10⁻⁶ × 50 = 5 mJ</span> ، <span class=\"m\">PE₂ = ½ × 400×10⁻⁶ × 50 = 10 mJ</span><br>\n<span class=\"res\">Q₁ = 200 μC ، Q₂ = 400 μC ، PE₁ = 5 mJ ، PE₂ = 10 mJ</span><br>\n<b>(2) ثابت العزل K:</b><br>\nC₂k = 8K، والسعة الكلية = 4 + 8K، والشحنة الكلية 600 μC<br>\n<span class=\"m\">600/(4 + 8K) = 30</span> ⇒ 4 + 8K = 20 ⇒ 8K = 16<br>\n<span class=\"res\">K = 2</span><br>\n<b>شحنة كل متسعة بعد العازل:</b><br>\n<span class=\"m\">Q₁ = 4 × 30 = 120 μC</span> ، <span class=\"m\">Q₂ = 16 × 30 = 480 μC</span><br>\n<span class=\"res\">Q₁ = 120 μC ، Q₂ = 480 μC</span> (مجموعهما 600 μC ✓)", "parts": [{"l": "شحنة المتسعة الأولى قبل العازل", "v": [200, 0.0002], "u": "μC"}, {"l": "شحنة المتسعة الثانية قبل العازل", "v": [400, 0.0004], "u": "μC"}, {"l": "طاقة المتسعة الأولى", "v": [0.005, 5000], "u": "J"}, {"l": "طاقة المتسعة الثانية", "v": [0.01, 10000], "u": "J"}, {"l": "ثابت العزل K", "v": [2], "u": ""}, {"l": "شحنة المتسعة الأولى بعد العازل", "v": [120, 0.00012], "u": "μC"}, {"l": "شحنة المتسعة الثانية بعد العازل", "v": [480, 0.00048], "u": "μC"}], "id": "c1p71"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "1/2020 تطبيقي", "q": "متسعتان من ذوات الصفيحتين المتوازيتين (C₁ = 16 μF , C₂ = 24 μF) مربوطتان مع بعضهما على التوازي ومجموعهما ربطت بين قطبي بطارية فرق الجهد بين قطبيها (48 V) اذا ادخل لوح من مادة عازلة ثابت عزلها (K) بين صفيحتي المتسعة الأولى ومازالت المجموعة متصلة بالبطارية فكانت الشحنة الكلية للمجموعة (3456 μC) ما مقدار: (1) ثابت العزل (K). (2) الشحنة المختزنة في اي من صفيحتي كل متسعة قبل وبعد ادخال المادة العازلة.", "a": "<b>المعطيات:</b> C₁ = 16 μF، C₂ = 24 μF على التوازي، ΔV = 48 V (متصلة بالبطارية)، والشحنة الكلية بعد العازل 3456 μC.<br>\n<b>(1) ثابت العزل K:</b><br>\nΔV ثابت، والسعة الكلية بعد العازل = 3456/48 = 72 μF<br>\n<span class=\"m\">16K + 24 = 72</span> ⇒ 16K = 48<br>\n<span class=\"res\">K = 3</span><br>\n<b>(2) الشحنة قبل وبعد العازل:</b><br>\nقبل: <span class=\"m\">Q₁ = 16 × 48 = 768 μC</span> ، <span class=\"m\">Q₂ = 24 × 48 = 1152 μC</span><br>\nبعد: <span class=\"m\">Q₁ = 48 × 48 = 2304 μC</span> ، <span class=\"m\">Q₂ = 1152 μC (لا تتغير)</span><br>\n<span class=\"res\">قبل: Q₁ = 768 μC ، Q₂ = 1152 μC<br>بعد: Q₁ = 2304 μC ، Q₂ = 1152 μC</span>", "parts": [{"l": "ثابت العزل K", "v": [3], "u": ""}, {"l": "شحنة المتسعة الأولى قبل العازل", "v": [768, 0.000768], "u": "μC"}, {"l": "شحنة المتسعة الثانية قبل العازل", "v": [1152, 0.001152], "u": "μC"}, {"l": "شحنة المتسعة الأولى بعد العازل", "v": [2304, 0.002304], "u": "μC"}, {"l": "شحنة المتسعة الثانية بعد العازل", "v": [1152, 0.001152], "u": "μC"}], "id": "c1p72"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "2/2023 احيائي", "q": "متسعتان من ذوات الصفيحتين المتوازيتين (C₁ = 2 μF , C₂ = 4 μF) موصولتان على التوازي ، ومجموعهما ربطت بين قطبي بطارية فرق الجهد بين قطبيها 20V. (1) احسب مقدار الشحنة المختزنة في كل متسعة. (2) اذا فصلت المتسعتان عن المصدر وأدخل عازل بين لوحي المتسعة الثانية ، فأصبحت شحنة المتسعة (96 μC) ، أحسب مقدار ثابت العزل.", "a": "<b>المعطيات:</b> C₁ = 2 μF، C₂ = 4 μF على التوازي، ΔV = 20 V.<br>\n<b>(1) الشحنة في كل متسعة:</b><br>\n<span class=\"m\">Q₁ = 2 × 20 = 40 μC</span> ، <span class=\"m\">Q₂ = 4 × 20 = 80 μC</span><br>\n<span class=\"res\">Q₁ = 40 μC ، Q₂ = 80 μC</span><br>\n<b>(2) ثابت العزل (بعد الفصل وإدخال العازل في الثانية، وشحنة الثانية أصبحت 96 μC):</b><br>\nالشحنة الكلية = 40 + 80 = 120 μC (ثابتة)<br>\nQ₂ = 4K·V = 96 ، و Q₁ = 2V ، و Q₁ + Q₂ = 120<br>\n<span class=\"m\">(2 + 4K)·V = 120</span> و <span class=\"m\">4K·V = 96</span><br>\nبقسمة المعادلتين: <span class=\"m\">(2 + 4K)/(4K) = 120/96 = 5/4</span> ⇒ 8 + 16K = 20K ⇒ 4K = 8<br>\n<span class=\"res\">K = 2</span><br>\nتحقق: V = 96/8 = 12 V ، Q₁ = 2 × 12 = 24 μC ، Q₁ + Q₂ = 24 + 96 = 120 μC ✓", "parts": [{"l": "شحنة المتسعة الأولى", "v": [40, 4e-05], "u": "μC"}, {"l": "شحنة المتسعة الثانية", "v": [80, 8e-05], "u": "μC"}, {"l": "ثابت العزل K", "v": [2], "u": ""}], "id": "c1p73"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "1/2023 احيائي", "q": "متسعتان (C₁ = 8μF , C₂ = 12μF) مربوطتان مع بعضهما على التوازي شحنت مجموعتهما بشحنة كلية مقدارها (640 μC) بواسطة مصدر للفولطية المستمرة ، ثم فصلت عنه فاذا ادخل لوح من مادة عازلة كهربائياً ثابت عزلها (K) بين صفيحتي المتسعة الثانية انخفض فرق جهد المجموعة إلى (20V) احسب: (1) ثابت العزل الكهربائي (K) (2) مقدار الشحنة المختزنة في اي من صفيحتي كل متسعة والطاقة المختزنة في المجال الكهربائي بين صفيحتي كل متسعة بعد ادخال العازل.", "a": "<b>المعطيات:</b> C₁ = 8 μF، C₂ = 12 μF على التوازي، الشحنة الكلية 640 μC، ثم تفصل. بعد العازل في الثانية يصبح ΔV = 20 V.<br>\n<b>(1) ثابت العزل K:</b><br>\nC₂k = 12K، والسعة الكلية = 8 + 12K = 640/20 = 32<br>\n<span class=\"m\">12K = 24</span> ⇒ <span class=\"res\">K = 2</span><br>\n<b>(2) الشحنة والطاقة بعد العازل:</b><br>\nC₂k = 24 μF<br>\n<span class=\"m\">Q₁ = 8 × 20 = 160 μC</span> ، <span class=\"m\">Q₂ = 24 × 20 = 480 μC</span><br>\n<span class=\"m\">PE₁ = ½ × 160×10⁻⁶ × 20 = 1.6 mJ</span><br>\n<span class=\"m\">PE₂ = ½ × 480×10⁻⁶ × 20 = 4.8 mJ</span><br>\n<span class=\"res\">Q₁ = 160 μC ، Q₂ = 480 μC ، PE₁ = 1.6 mJ ، PE₂ = 4.8 mJ</span>", "parts": [{"l": "ثابت العزل K", "v": [2], "u": ""}, {"l": "شحنة المتسعة الأولى", "v": [160, 0.00016], "u": "μC"}, {"l": "شحنة المتسعة الثانية", "v": [480, 0.00048], "u": "μC"}, {"l": "طاقة المتسعة الأولى", "v": [0.0016, 1600], "u": "J"}, {"l": "طاقة المتسعة الثانية", "v": [0.0048, 4800], "u": "J"}], "id": "c1p74"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "3/2023 احيائي", "q": "متسعتان من ذوات الصفيحتين المتوازيتين (C₁ = 5μF , C₂ = 15μF) مربوطتان مع بعضهما على التوازي ومجموعهما ربطت بين قطبي فرق الجهد بين قطبيها (60v) ,اذا ادخل لوح من مادة عازلة ثابت عزلها k بين صفيحتي المتسعة الاولى (C₁) وما زالت المجموعة متصلة بالبطارية فكانت الشحنة الكلية للمجموعة (3000μC) ما مقدار: (1) ثابت العزل (k)؟ (2) الشحنة المختزنة في أي من صفيحتي كل متسعة قبل وبعد ادخال المادة العازلة؟", "a": "<b>المعطيات:</b> C₁ = 5 μF، C₂ = 15 μF على التوازي، ΔV = 60 V (متصلة بالبطارية)، الشحنة الكلية بعد العازل 3000 μC.<br>\n<b>(1) ثابت العزل k:</b><br>\nC<sub>T</sub> = 3000/60 = 50 μF<br>\n<span class=\"m\">5k + 15 = 50</span> ⇒ 5k = 35<br>\n<span class=\"res\">k = 7</span><br>\n<b>(2) الشحنة قبل وبعد العازل:</b><br>\nقبل: <span class=\"m\">Q₁ = 5 × 60 = 300 μC</span> ، <span class=\"m\">Q₂ = 15 × 60 = 900 μC</span><br>\nبعد: <span class=\"m\">Q₁ = 35 × 60 = 2100 μC</span> ، <span class=\"m\">Q₂ = 900 μC (لا تتغير)</span><br>\n<span class=\"res\">قبل: Q₁ = 300 μC ، Q₂ = 900 μC<br>بعد: Q₁ = 2100 μC ، Q₂ = 900 μC</span>", "parts": [{"l": "ثابت العزل K", "v": [9], "u": ""}, {"l": "شحنة المتسعة الأولى قبل العازل", "v": [300, 0.0003], "u": "μC"}, {"l": "شحنة المتسعة الثانية قبل العازل", "v": [900, 0.0009], "u": "μC"}, {"l": "شحنة المتسعة الأولى بعد العازل", "v": [2700, 0.0027], "u": "μC"}, {"l": "شحنة المتسعة الثانية بعد العازل", "v": [900, 0.0009], "u": "μC"}], "id": "c1p75"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "2/2023 تطبيقي", "q": "متسعتان من ذوات الصفيحتين المتوازيتين (C₁ = 12 μF , C₂ = 28 μF) مربوطتان مع بعضهما على التوازي ومجموعهما ربطت بين قطبي بطارية فرق الجهد بين قطبيها (30 V) (1) احسب شحنة كل متسعة. (2) اذا ادخل لوح عازل كهربائي ثابت عزلها (k) بين صفيحتي المتسعة الاولى C₁ , وما زالت المجموعة متصلة بالبطارية ، فصارت الشحنة الكلية للمجموعة 3000 μC , احسب ثابت العزل (k)", "a": "<b>المعطيات:</b> C₁ = 12 μF، C₂ = 28 μF على التوازي، ΔV = 30 V (متصلة بالبطارية)، الشحنة الكلية بعد العازل 3000 μC.<br>\n<b>(1) شحنة كل متسعة قبل العازل:</b><br>\n<span class=\"m\">Q₁ = 12 × 30 = 360 μC</span> ، <span class=\"m\">Q₂ = 28 × 30 = 840 μC</span><br>\n<span class=\"res\">Q₁ = 360 μC ، Q₂ = 840 μC</span><br>\n<b>(2) ثابت العزل k:</b><br>\nC<sub>T</sub> = 3000/30 = 100 μF<br>\n<span class=\"m\">12k + 28 = 100</span> ⇒ 12k = 72<br>\n<span class=\"res\">k = 6</span><br>\nتحقق: Q₁ بعد العازل = 72 × 30 = 2160 μC، و Q₁ + Q₂ = 2160 + 840 = 3000 μC ✓", "parts": [{"l": "شحنة المتسعة الأولى", "v": [360, 0.00036], "u": "μC"}, {"l": "شحنة المتسعة الثانية", "v": [840, 0.00084], "u": "μC"}, {"l": "ثابت العزل K", "v": [6], "u": ""}], "id": "c1p76"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "3/2023 تكميلي", "q": "متسعتان من ذوات الصفيحتين المتوازيتين (C₁ = 12μF , C₂ = 6μF) مربوطتان مع بعضهما على التوازي، فاذا شحنت مجموعتهما بشحنة كلية (180μC) بواسطة مصدر للفولطية المستمرة ثم فصلت عنه: (1) احسب لكل متسعة مقدار الشحنة المختزنة في أي من صفيحتيها والطاقة المختزنة في المجال الكهربائي بين صفيحتيها. (2) ادخل لوح من مادة عازلة كهربائية ثابت عزلها (4) بين صفيحتي المتسعة الثانية، فما مقدار الشحنة المختزنة في أي من صفيحتي كل متسعة وفرق الجهد بعد ادخال العازل؟", "a": "<b>المعطيات:</b> C₁ = 12 μF، C₂ = 6 μF على التوازي، الشحنة الكلية Q<sub>T</sub> = 180 μC، المجموعة مفصولة عن المصدر.<br>\n<b>(a) قبل العازل:</b><br>\nالسعة الكلية: C<sub>T</sub> = 12 + 6 = 18 μF<br>\n<span class=\"m\">ΔV = Q<sub>T</sub>/C<sub>T</sub> = 180/18 = 10 V</span><br>\n<span class=\"res\">ΔV = 10 V</span><br>\n<span class=\"m\">Q₁ = 12 × 10 = 120 μC</span> ، <span class=\"m\">Q₂ = 6 × 10 = 60 μC</span><br>\n<span class=\"m\">PE₁ = ½Q₁ΔV = ½ × 120×10⁻⁶ × 10 = 600 μJ</span><br>\n<span class=\"m\">PE₂ = ½Q₂ΔV = ½ × 60×10⁻⁶ × 10 = 300 μJ</span><br>\n<span class=\"res\">Q₁ = 120 μC ، Q₂ = 60 μC ، PE₁ = 600 μJ ، PE₂ = 300 μJ</span><br>\n<b>(b) بعد إدخال العازل K = 4 في المتسعة الثانية (مفصولة فالشحنة الكلية 180 μC):</b><br>\nC₂k = 4 × 6 = 24 μF، والسعة الكلية = 12 + 24 = 36 μF<br>\n<span class=\"m\">ΔV = 180/36 = 5 V</span><br>\n<span class=\"m\">Q₁ = 12 × 5 = 60 μC</span> ، <span class=\"m\">Q₂ = 24 × 5 = 120 μC</span><br>\n<span class=\"m\">PE₁ = ½ × 60×10⁻⁶ × 5 = 150 μJ</span><br>\n<span class=\"m\">PE₂ = ½ × 120×10⁻⁶ × 5 = 300 μJ</span><br>\n<span class=\"res\">Q₁ = 60 μC ، Q₂ = 120 μC ، ΔV = 5 V ، PE₁ = 150 μJ ، PE₂ = 300 μJ</span>", "parts": [{"l": "الشحنة Q₁ قبل العازل", "v": [120, 0.00012], "u": "μC"}, {"l": "الشحنة Q₂ قبل العازل", "v": [60, 6e-05], "u": "μC"}, {"l": "الشحنة Q₁ بعد العازل", "v": [60, 6e-05], "u": "μC"}, {"l": "الشحنة Q₂ بعد العازل", "v": [120, 0.00012], "u": "μC"}, {"l": "فرق الجهد بعد العازل", "v": [5], "u": "V"}], "id": "c1p77"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوازي", "yrs": "2025 تمهيدي", "q": "ثلاث متسعات سعاتها حسب الترتيب (4μF , 6μF , 8μF) مربوطة مع بعضها على التوازي ربطت المجموعة بين قطبي بطارية بفرق الجهد بين قطبيها (24 V) احسب مقدار: (1) السعة المكافئة للمجموعة (2) الشحنة المختزنة في أي من صفيحتي كل متسعة (3) الشحنة الكلية المختزنة في المجموعة", "a": "<b>المعطيات:</b> C₁ = 4 μF، C₂ = 6 μF، C₃ = 8 μF على التوازي، ΔV = 24 V.<br>\n<b>(1) السعة المكافئة:</b><br>\n<span class=\"res\">C<sub>eq</sub> = 4 + 6 + 8 = 18 μF</span><br>\n<b>(2) الشحنة في كل متسعة:</b><br>\n<span class=\"m\">Q₁ = 4 × 24 = 96 μC</span> ، <span class=\"m\">Q₂ = 6 × 24 = 144 μC</span> ، <span class=\"m\">Q₃ = 8 × 24 = 192 μC</span><br>\n<span class=\"res\">Q₁ = 96 μC ، Q₂ = 144 μC ، Q₃ = 192 μC</span><br>\n<b>(3) الشحنة الكلية:</b><br>\n<span class=\"res\">Q<sub>T</sub> = 96 + 144 + 192 = 432 μC</span> (وتساوي 18 × 24)", "parts": [{"l": "السعة المكافئة", "v": [18, 1.8e-05], "u": "μF"}, {"l": "Q₁", "v": [96, 9.6e-05], "u": "μC"}, {"l": "Q₂", "v": [144, 0.000144], "u": "μC"}, {"l": "Q₃", "v": [192, 0.000192], "u": "μC"}, {"l": "الشحنة الكلية", "v": [432, 0.000432], "u": "μC"}], "id": "c1p78"}, {"ch": 1, "k": "k", "topic": "ربط المتسعات على التوالي", "yrs": "2019 تمهيدي · 1/2019 اسئلة خارج القطر · 2/2020", "q": "ما الغرض (الفائدة العلمية) من ربط مجموعة من المتسعات على التوالي؟", "a": "للحصول على فرق جهد كهربائي بمقدار اكبر على طرفي المجموعة قد لا تتحمله أي متسعة في المجموعة لو ربطت منفردة، وكذلك لتقليل السعة المكافئة.<br>أو: لتقليل السعة المكافئة ليكون بأمكاننا وضع فرق جهد كهربائي بمقدار اكبر على طرفي المجموعة قد لا تتحمله أي متسعة في المجموعة لو ربطت منفردة.", "kw": [["فرق الجهد", "فولطيه", "جهد"], ["اكبر", "اعلي", "اكثر"], ["لا تتحمل", "لاتتحمل", "تتلف", "تحمل"], ["تقليل", "نقصان", "تقل"], ["السعه المكافئه", "السعه"]], "id": "c1k79"}, {"ch": 1, "k": "k", "topic": "ربط المتسعات على التوالي", "yrs": "اسئلة الفصل · 2014 تمهيدي · 2/2016 · 1/2018 · 1/2021 تطبيقي · 2/2021 تطبيقي · 2024 تمهيدي", "q": "علل: نقصان السعة المكافئة لمجموعة من المتسعات المربوطة على التوالي.", "a": "بسبب ازدياد البعد بين الصفيحتين للمتسعة المكافئة للتوالي، لان c ∝ 1/d وفق العلاقة <span class=\"m\">C = ε₀A/d</span>.", "kw": [["ازدياد", "زياده", "يزداد", "يزيد"], ["البعد", "المسافه"], ["الصفيحتين", "الصفائح", "اللوحين"], ["C", "السعه"], ["عكسيا", "1/d", "d"]], "id": "c1k80"}, {"ch": 1, "k": "k", "topic": "ربط المتسعات على التوالي", "yrs": "1/2015 اسئلة خارج القطر", "q": "ماذا يحصل؟ ولماذا؟ لمقدار فرق الجهد بين صفيحتي متسعة C₁ ربطت بين قطبي بطارية والشحنة المختزنة فيها لو ربطت متسعة اخرى C₂ غير مشحونة مع المتسعة C₁ (مع بقاء البطارية مربوطة في الدائرة) وكانت طريقة الربط على التوالي.", "a": "يقل فرق الجهد بين صفيحتي المتسعة C₁ (ΔV₁)، السبب: لان الربط توالي<br><span class=\"m\">ΔV<sub>battery</sub> = ΔV₁ + ΔV₂ → ΔV₁ = ΔV<sub>battery</sub> − ΔV₂</span><br>∴ ΔV₁ &lt; ΔV<sub>battery</sub> فرق الجهد يقل.<br>اما الشحنة تقل، بسبب نقصان فرق جهدها على وفق العلاقة <span class=\"m\">Q = CΔV</span> وبثبوت السعة Q ∝ ΔV.", "kw": [["فرق الجهد", "جهد"], ["يقل", "ينقص", "نقصان"], ["توالي", "التوالي"], ["الشحنه"], ["Q=CΔV", "Q=C", "تتناسب", "ثبوت السعه", "ثبوت"]], "id": "c1k81"}, {"ch": 1, "k": "k", "topic": "ربط المتسعات على التوالي", "yrs": "3/2020 تطبيقي", "q": "اختر الاجابة الصحيحة من بين الاقواس: متسعتان (C₁ , C₂) ربطتا مع بعضهما على التوالي، ومجموعتهما ربطت بين قطبي بطارية، وكان مقدار سعة الأولى اكبر من مقدار سعة الثانية، فعند مقارنة فرق الجهد بين صفيحتي المتسعة الأولى ΔV₁ مع فرق الجهد بين صفيحتي المتسعة الثانية ΔV₂ نجد ان:", "opts": ["ΔV₁ اكبر من ΔV₂", "ΔV₁ يساوي ΔV₂", "ΔV₁ اصغر من ΔV₂"], "c": 2, "a": "ΔV₁ اصغر من ΔV₂ (في الربط التوالي الشحنة متساوية Q₁ = Q₂ وΔV = Q/C، فالمتسعة ذات السعة الاكبر يكون فرق الجهد بين صفيحتيها اصغر).", "id": "c1k82"}, {"ch": 1, "k": "k", "topic": "ربط المتسعات على التوالي", "yrs": "1/2021 تطبيقي", "q": "ما الفرق بين الغرض من ربط المتسعات على التوازي، والغرض من ربط المتسعات على التوالي؟", "a": "الغرض من ربط المتسعات على التوازي هو زيادة السعة المكافئة للمجموعة.<br>الغرض من ربط المتسعات على التوالي لتقليل السعة المكافئة ليكون بأمكاننا وضع فرق جهد كهربائي بمقدار اكبر على طرفي المجموعة قد لا تتحمله أي متسعة في المجموعة لو ربطت منفردة.", "kw": [["التوازي", "توازي"], ["زياده", "زيادة", "تزداد", "تكبير"], ["السعه المكافئه", "السعه"], ["التوالي", "توالي"], ["تقليل", "نقصان", "تقل"], ["فرق الجهد", "جهد"], ["لا تتحمل", "لاتتحمل", "تتلف"]], "id": "c1k83"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوالي", "yrs": "2014 تمهيدي", "q": "متسعتان من ذوات الصفيحتين المتوازيتين (C₁ = 12μF , C₂ = 6μF) مربوطتان مع بعضهما على التوالي، ربطت مجموعتهما بين قطبي بطارية فرق الجهد بين قطبيها (24V). ادخل بين صفيحتي كل منها لوح عازل من مادة ثابت عزلها (2) يملأ الحيز بينهما (وما زالت المجموعة متصلة بالبطارية) فما مقدار فرق الجهد بين صفيحتي كل متسعة بعد ادخال العازل؟", "a": "<b>المعطيات:</b> C₁ = 12 μF، C₂ = 6 μF على التوالي، ΔV = 24 V (متصلة بالبطارية)، وبعد إدخال عازل K = 2 في كل متسعة.<br>\n<b>قبل العازل:</b> C<sub>eq</sub> = 12×6/(12+6) = 4 μF، Q = 4 × 24 = 96 μC<br>\n<span class=\"m\">V₁ = 96/12 = 8 V</span> ، <span class=\"m\">V₂ = 96/6 = 16 V</span><br>\n<b>بعد العازل:</b> C₁k = 24 μF، C₂k = 12 μF<br>\nC<sub>eq</sub> = 24×12/(24+12) = 8 μF، Q = 8 × 24 = 192 μC<br>\n<span class=\"m\">V₁ = 192/24 = 8 V</span> ، <span class=\"m\">V₂ = 192/12 = 16 V</span><br>\n<span class=\"res\">فرق الجهد بين صفيحتي كل متسعة بعد العازل: 8 V للأولى و 16 V للثانية (لم يتغير)</span><br>\nملاحظة: لأن العازل وُضع في المتسعتين بالنسبة نفسها (K = 2)، تبقى نسبة توزيع الجهد كما هي.", "parts": [{"l": "فرق الجهد بين صفيحتي المتسعة الاولى", "v": [8], "u": "V"}, {"l": "فرق الجهد بين صفيحتي المتسعة الثانية", "v": [16], "u": "V"}], "id": "c1p84"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوالي", "yrs": "1/2014 اسئلة النازحين", "q": "متسعتان (C₁ = 3μF , C₂ = 6μF) من ذوات الصفائح المتوازية ربطتا مع بعضهما على التوالي، ربطت مجموعتهما مع نضيدة فرق الجهد الكهربائي بين قطبيها (V = 6V). (1) ما مقدار السعة المكافئة؟ (2) احسب فرق الجهد بين صفيحتي كل متسعة.", "a": "<b>المعطيات:</b> C₁ = 3 μF، C₂ = 6 μF على التوالي، V = 6 V.<br>\n<b>(1) السعة المكافئة:</b><br>\n<span class=\"m\">C<sub>eq</sub> = 3×6/(3+6) = 18/9 = 2 μF</span><br>\n<span class=\"res\">C<sub>eq</sub> = 2 μF</span><br>\n<b>(2) فرق الجهد لكل متسعة:</b><br>\nالشحنة في التوالي: <span class=\"m\">Q = 2 × 6 = 12 μC</span><br>\n<span class=\"m\">V₁ = 12/3 = 4 V</span> ، <span class=\"m\">V₂ = 12/6 = 2 V</span><br>\n<span class=\"res\">V₁ = 4 V ، V₂ = 2 V</span> (مجموعهما 6 V ✓)", "parts": [{"l": "السعة المكافئة", "v": [2, 2e-06], "u": "μF"}, {"l": "ΔV₁", "v": [4], "u": "V"}, {"l": "ΔV₂", "v": [2], "u": "V"}], "id": "c1p85"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوالي", "yrs": "2015 تمهيدي اسئلة الانبار", "q": "في الشكل المجاور متسعتان (C₁ = 6μF , C₂ = 12μF) من ذوات الصفائح المتوازية ربطتا مع بعضهما على التوالي وربطت المجموعة مع نضيدة فرق الجهد الكهربائي بين قطبيها (24V). [الشكل: دائرة فيها C₁ وC₂ على التوالي ومصدر 24V]. احسب مقدار فرق الجهد بين صفيحتي كل متسعة والطاقة المختزنة فيها.", "a": "<b>المعطيات:</b> C₁ = 6 μF، C₂ = 12 μF على التوالي، V = 24 V.<br>\n<b>السعة المكافئة والشحنة:</b><br>\n<span class=\"m\">C<sub>eq</sub> = 6×12/18 = 4 μF</span><br>\n<span class=\"m\">Q = 4 × 24 = 96 μC</span> (الشحنة متساوية في التوالي)<br>\n<b>فرق الجهد لكل متسعة:</b><br>\n<span class=\"m\">V₁ = 96/6 = 16 V</span> ، <span class=\"m\">V₂ = 96/12 = 8 V</span><br>\n<b>الطاقة المختزنة:</b><br>\n<span class=\"m\">PE₁ = ½ × 96×10⁻⁶ × 16 = 768 μJ = 7.68×10⁻⁴ J</span><br>\n<span class=\"m\">PE₂ = ½ × 96×10⁻⁶ × 8 = 384 μJ = 3.84×10⁻⁴ J</span><br>\n<span class=\"res\">V₁ = 16 V ، V₂ = 8 V ، PE₁ = 7.68×10⁻⁴ J ، PE₂ = 3.84×10⁻⁴ J</span>", "parts": [{"l": "ΔV₁", "v": [16], "u": "V"}, {"l": "ΔV₂", "v": [8], "u": "V"}, {"l": "PE₁", "v": [0.000768, 768], "u": "J (أو μJ)"}, {"l": "PE₂", "v": [0.000384, 384], "u": "J (أو μJ)"}], "id": "c1p86"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوالي", "yrs": "2/2015", "q": "متسعتان من ذوات الصفيحتين المتوازيتين (C₂ = 12μF , C₁ = 6μF) مربوطتان مع بعضهما على التوالي ربطت مجموعتهما بين قطبي بطارية فرق الجهد بين قطبيها (12V) وكان الهواء عازلاً بين صفيحتي كل منهما، ادخل بين صفيحتي كل منهما لوح من مادة عازلة ثابت عزلها (3) يملأ الحيز بينهما (وما زالت المجموعة متصلة بالبطارية)، جد مقدار: (1) فرق الجهد بين صفيحتي كل متسعة بعد ادخال العازل (2) الشحنة المختزنة في اي من صفيحتي كل منهما بعد ادخال العازل.", "a": "<b>المعطيات:</b> C₁ = 6 μF، C₂ = 12 μF على التوالي، V = 12 V (متصلة)، وبعد إدخال عازل K = 3 في كل متسعة.<br>\n<b>قبل العازل:</b> C<sub>eq</sub> = 6×12/18 = 4 μF، Q = 48 μC، V₁ = 8 V، V₂ = 4 V<br>\n<b>بعد العازل:</b> C₁k = 18 μF، C₂k = 36 μF<br>\nC<sub>eq</sub> = 18×36/54 = 12 μF، Q = 12 × 12 = 144 μC<br>\n<span class=\"m\">V₁ = 144/18 = 8 V</span> ، <span class=\"m\">V₂ = 144/36 = 4 V</span><br>\n<span class=\"res\">(1) فرق الجهد بعد العازل: V₁ = 8 V ، V₂ = 4 V (لم يتغير)</span><br>\n<span class=\"res\">(2) الشحنة على أي صفيحة بعد العازل: Q = 144 μC</span>", "parts": [{"l": "ΔV₁ بعد العازل", "v": [8], "u": "V"}, {"l": "ΔV₂ بعد العازل", "v": [4], "u": "V"}, {"l": "الشحنة في كل متسعة", "v": [144, 0.000144], "u": "μC"}], "id": "c1p87"}, {"ch": 1, "k": "p", "topic": "ربط المتسعات على التوالي", "yrs": "3/2015", "q": "متس
